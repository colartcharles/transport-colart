<meta name="theme-color" content="#b3161c">
<style>
:root{
  --bg:#f5f6f8; --surface:#ffffff; --surface-2:#f0f2f5; --surface-3:#e8eaee;
  --border:#dfe2e8; --border-2:#cdd2da;
  --text:#181b20; --text-2:#565f6d; --text-3:#88909c;
  --accent:#b3161c; --accent-ink:#ffffff; --accent-soft:#fbe9e9;
  --gold:#a8790a;
  --blue:#2563a8; --blue-soft:#e7f0fa;
  --green:#1a8754; --green-soft:#e5f5ec;
  --amber:#b4750a; --amber-soft:#fbf0dd;
  --gray:#6b7280; --gray-soft:#eceef1;
  --danger:#b3161c; --danger-soft:#fbe9e9;
  --purple:#7c3aed; --purple-soft:#f1e9fc;
  --teal:#0f766e; --teal-soft:#e1f5f2;
  --magenta:#c2255c; --magenta-soft:#fbe6ee;
  --rust:#9a3412; --rust-soft:#fdf0e6;
  --olive:#4d7c0f; --olive-soft:#f0f7e0;
  --shadow:0 1px 2px rgba(20,22,26,.06),0 4px 16px rgba(20,22,26,.06);
  --radius:12px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#14161a; --surface:#1c1f24; --surface-2:#22262c; --surface-3:#2a2f36;
    --border:#33383f; --border-2:#3d434b;
    --text:#eceef1; --text-2:#aab0bb; --text-3:#7a8290;
    --accent:#e4545a; --accent-ink:#1a0b0b; --accent-soft:#3a1f20;
    --gold:#d9a83e;
    --blue:#6ea4dd; --blue-soft:#1c2a3a;
    --green:#5cc98d; --green-soft:#173625;
    --amber:#e0a53f; --amber-soft:#3a2c12;
    --gray:#9aa1ac; --gray-soft:#2a2f36;
    --danger:#e4545a; --danger-soft:#3a1f20;
    --purple:#b794f6; --purple-soft:#332249;
    --teal:#5ec9be; --teal-soft:#16302d;
    --magenta:#f472b6; --magenta-soft:#3d1a2c;
    --rust:#fb923c; --rust-soft:#3a2415;
    --olive:#a3d977; --olive-soft:#28320f;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#14161a; --surface:#1c1f24; --surface-2:#22262c; --surface-3:#2a2f36;
  --border:#33383f; --border-2:#3d434b;
  --text:#eceef1; --text-2:#aab0bb; --text-3:#7a8290;
  --accent:#e4545a; --accent-ink:#1a0b0b; --accent-soft:#3a1f20;
  --gold:#d9a83e;
  --blue:#6ea4dd; --blue-soft:#1c2a3a;
  --green:#5cc98d; --green-soft:#173625;
  --amber:#e0a53f; --amber-soft:#3a2c12;
  --gray:#9aa1ac; --gray-soft:#2a2f36;
  --danger:#e4545a; --danger-soft:#3a1f20;
  --purple:#b794f6; --purple-soft:#332249;
  --teal:#5ec9be; --teal-soft:#16302d;
  --magenta:#f472b6; --magenta-soft:#3d1a2c;
  --rust:#fb923c; --rust-soft:#3a2415;
  --olive:#a3d977; --olive-soft:#28320f;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-size:14px;line-height:1.45}
button,input,select,textarea{font-family:inherit;font-size:14px;color:inherit}
h1,h2,h3,h4{margin:0;font-weight:700}
p{margin:0}
a{color:var(--blue)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:6px}

.hidden{display:none!important}
.app{min-height:100vh;display:flex;flex-direction:column}

/* ---------- Landing ---------- */
.landing{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.landing-card{max-width:520px;width:100%;text-align:center}
.landing-logo{width:64px;height:64px;border-radius:16px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 18px;overflow:hidden}
.landing-logo img{width:100%;height:100%;object-fit:cover;display:block}
.landing h1{font-size:24px;margin-bottom:6px}
.landing p.sub{color:var(--text-2);margin-bottom:28px}
.landing-choices{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:520px){.landing-choices{grid-template-columns:1fr}}
.choice-btn{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px 16px;cursor:pointer;box-shadow:var(--shadow);text-align:center;transition:transform .12s ease,border-color .12s ease}
.choice-btn:hover{border-color:var(--accent);transform:translateY(-1px)}
.choice-btn .ic{font-size:28px;margin-bottom:8px}
.choice-btn .lbl{font-weight:700;font-size:15px}
.choice-btn .sub{color:var(--text-3);font-size:12.5px;margin-top:4px}
.db-banner{margin-top:18px;font-size:12px;color:var(--amber);background:var(--amber-soft);border-radius:8px;padding:8px 12px}

/* ---------- Top bar ---------- */
.topbar{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
.topbar .brand{display:flex;align-items:center;gap:8px;font-weight:700}
.topbar .brand .ic{width:28px;height:28px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-size:15px;overflow:hidden}
.topbar .brand .ic img{width:100%;height:100%;object-fit:cover;display:block}
.topbar .spacer{flex:1}
.topbar .who{color:var(--text-2);font-size:12.5px}
.btn{border:1px solid var(--border-2);background:var(--surface);padding:7px 13px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--text)}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.5;cursor:not-allowed}

.main{flex:1;padding:16px;max-width:1400px;width:100%;margin:0 auto}
@media (max-width:720px){.main{padding:12px}}

/* ---------- Dashboard ---------- */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:20px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px}
.kpi .n{font-size:26px;font-weight:800;line-height:1}
.kpi .l{color:var(--text-2);font-size:12px;margin-top:6px}
.kpi.accent{border-color:var(--accent);background:var(--accent-soft)}
.kpi.accent .n{color:var(--accent)}
.section-title{font-size:14px;font-weight:700;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
.section-title .cnt{color:var(--text-3);font-weight:600;font-size:12px}

.mission-list{display:flex;flex-direction:column;gap:8px}
.m-row{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px;display:flex;gap:12px;align-items:center;cursor:pointer}
.m-row.unassigned{background:var(--amber-soft);border-color:var(--amber)}
.m-row:hover{border-color:var(--border-2)}
.m-row .time{font-weight:700;min-width:48px;font-variant-numeric:tabular-nums}
.m-row .mid{flex:1;min-width:0}
.m-row .client{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-row .meta{color:var(--text-2);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
.badge.gray{background:var(--gray-soft);color:var(--gray)}
.badge.blue{background:var(--blue-soft);color:var(--blue)}
.badge.amber{background:var(--amber-soft);color:var(--amber)}
.badge.green{background:var(--green-soft);color:var(--green)}
.badge.danger{background:var(--danger-soft);color:var(--danger)}
.badge.purple{background:var(--purple-soft);color:var(--purple)}
.rdv-badge{cursor:pointer}
.badge.teal{background:var(--teal-soft);color:var(--teal)}
.badge.magenta{background:var(--magenta-soft);color:var(--magenta)}
.badge.rust{background:var(--rust-soft);color:var(--rust)}
.badge.olive{background:var(--olive-soft);color:var(--olive)}
.empty{color:var(--text-3);font-size:13px;padding:18px;text-align:center;border:1px dashed var(--border-2);border-radius:10px}
.alert-banner{background:var(--danger-soft);border:1px solid var(--danger);color:var(--danger);border-radius:10px;padding:10px 12px;font-size:12.5px;margin-bottom:10px;display:flex;gap:8px;align-items:flex-start}
.alert-banner b{display:block;color:var(--text);font-weight:700;margin-bottom:2px}
.horod-list{display:flex;flex-direction:column;gap:2px;margin:4px 0 14px;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.horod-row{display:flex;justify-content:space-between;padding:7px 12px;font-size:12.5px;background:var(--surface-2)}
.horod-row:nth-child(odd){background:var(--surface)}
.horod-row .lbl{color:var(--text-2)}
.horod-row .ts{font-weight:700;font-variant-numeric:tabular-nums}
.horod-row.pending .ts{color:var(--text-3);font-weight:400}
.horod-row.horod-edit-row{align-items:center;gap:8px}
.horod-input{padding:4px 8px;border:1px solid var(--border-2);border-radius:6px;background:var(--surface);color:var(--text);font-size:12px;font-variant-numeric:tabular-nums;max-width:190px}

/* ---------- Dispatch / En cours (remplace la liste "Missions du jour" — 13/09/2026) ---------- */
.disp-wrap{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow-x:auto;margin-bottom:8px}
.disp-wrap table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:760px}
.disp-wrap thead th{background:var(--surface-2);text-align:left;font-size:10.5px;font-weight:700;color:var(--text-2);text-transform:uppercase;letter-spacing:.03em;padding:8px 9px;border-bottom:1px solid var(--border);white-space:nowrap}
.disp-wrap tbody td{padding:8px 9px;border-bottom:1px solid var(--border);vertical-align:middle}
.disp-wrap tbody tr:last-child td{border-bottom:none}
.disp-wrap tbody tr.clickable{cursor:pointer}
.disp-wrap tbody tr.clickable:hover{background:var(--surface-2)}
.disp-chk{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;font-weight:700;font-size:11px}
.disp-chk.yes{background:var(--green-soft);color:var(--green)}
.disp-chk.no{background:var(--surface-3);color:var(--text-3)}
.disp-addr{max-width:190px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.disp-client{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px}
.disp-empty{padding:16px;text-align:center;color:var(--text-3)}
.disp-select{width:100%;padding:5px 7px;font-size:12px;border-radius:7px;border:1px solid var(--border-2);background:var(--surface);color:var(--text)}
.disp-immat{color:var(--text-3);font-style:italic}

/* ---------- Menu déroulant (topbar) — remplace les onglets en ligne — 13/09/2026 ---------- */
.tabs{position:relative;display:inline-block}
.tab-dropdown-btn{display:flex;align-items:center;gap:7px;border:1px solid var(--border-2);background:var(--surface);padding:7px 14px;border-radius:8px;cursor:pointer;color:var(--text);font-weight:600;font-size:13px}
.tab-dropdown-btn:hover{background:var(--surface-2)}
.tab-dropdown-btn .car{font-size:10px;color:var(--text-2);transition:transform .15s}
.tab-dropdown-btn.open .car{transform:rotate(180deg)}
.tab-dropdown-menu{position:absolute;top:calc(100% + 6px);left:0;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.18);min-width:210px;padding:6px;z-index:50;display:flex;flex-direction:column;gap:2px}
.tab-dropdown-menu.hidden{display:none}
.tab-dropdown-menu .item{border:none;background:transparent;text-align:left;padding:9px 12px;border-radius:7px;cursor:pointer;color:var(--text-2);font-weight:600;font-size:13.5px}
.tab-dropdown-menu .item.active{background:var(--accent-soft);color:var(--accent)}
.tab-dropdown-menu .item:hover:not(.active){background:var(--surface-2)}

/* ---------- Planning ---------- */
.view-toggle{display:inline-flex;gap:4px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:4px;margin-bottom:14px}
.view-toggle button{border:none;background:transparent;padding:7px 14px;border-radius:7px;font-size:13px;font-weight:600;color:var(--text-2);cursor:pointer}
.view-toggle button.active{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.map-board{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.map-pulse{animation:mapPulse 2s ease-out infinite;transform-origin:center}
@keyframes mapPulse{0%{transform:scale(1);opacity:.55}70%{transform:scale(2.4);opacity:0}100%{opacity:0}}
.map-popup{position:absolute;background:var(--surface);border:1px solid var(--border-2);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:14px;width:230px;font-size:13px;z-index:5}
.map-popup h4{margin:0 0 6px;font-size:13.5px}
.map-popup .row{margin:3px 0;color:var(--text-2)}
.map-popup select{width:100%;margin-top:8px;padding:6px 8px;border-radius:7px;border:1px solid var(--border-2);background:var(--surface);color:var(--text);font-size:12.5px}
.map-popup-close{position:absolute;top:8px;right:10px;cursor:pointer;color:var(--text-2);font-size:13px;background:none;border:none}
.week-nav{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.week-nav .lbl{font-weight:700;font-size:15px}
.week-nav .day-search{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--text-2)}
.week-nav .day-search input{padding:4px 8px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:var(--surface);color:inherit}
.planning-grid{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)}
.pg-table{border-collapse:collapse;width:100%;min-width:920px}
.pg-table th{position:sticky;top:53px;background:var(--surface);text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);font-size:12px;color:var(--text-2);z-index:5}
.pg-table th.driver-col,.pg-table td.driver-col{position:sticky;left:0;background:var(--surface);z-index:6;min-width:130px;border-right:1px solid var(--border)}
.pg-table td{vertical-align:top;padding:6px;border-bottom:1px solid var(--border);border-right:1px solid var(--surface-3);min-width:150px}
.pg-table .today-col{background:var(--accent-soft)}
.day-head{display:flex;flex-direction:column}
.day-head .dow{font-weight:700;color:var(--text)}
.day-head .dnum{font-size:11px;color:var(--text-3)}
.driver-name{font-weight:700}
.driver-name .status-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px}
.mcard{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:6px 8px;margin-bottom:5px;cursor:pointer;font-size:12px}
.mcard:hover{border-color:var(--accent)}
.mcard .t{font-weight:700}
.mcard .c{color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mcard.st--1{border-left:3px solid var(--gray)}
.mcard.st-0{border-left:3px solid var(--blue)}
.mcard.st-1,.mcard.st-2,.mcard.st-3{border-left:3px solid var(--amber)}
.mcard.st-4{border-left:3px solid var(--green);opacity:.7}
.mcard.st-refusee{border-left:3px solid var(--danger)}
/* Teinte de fond par catégorie de véhicule (ajouté 09/09/2026) — indépendante de la barre de
   gauche ci-dessus, qui reste dédiée au statut de la mission. */
.mcard.type-grue-7m{background:var(--purple-soft)}
.mcard.type-grue-12m{background:var(--magenta-soft)}
.mcard.type-porte-engins{background:var(--teal-soft)}
.mcard.type-plateau-12m{background:var(--rust-soft)}
.mcard.type-plateau-7m{background:var(--olive-soft)}
.mcard.type-tracteur-solo{background:var(--blue-soft)}
.mcard.type-camion-remorque{background:var(--green-soft)}
.mcard.type-porte-engin-chariot{background:var(--gray-soft)}
.add-cell-btn{width:100%;background:transparent;border:1px dashed var(--border-2);border-radius:8px;padding:4px;color:var(--text-3);cursor:pointer;font-size:16px;line-height:1}
.add-cell-btn:hover{color:var(--accent);border-color:var(--accent)}
.unassigned-strip{margin-top:14px}
/* Grille véhicules — glisser-déposer (11/09/2026, remplace la grille par chauffeur) */
.veh-type-tag{display:block;font-weight:400;font-size:11px;color:var(--text-3)}
.mcard[draggable="true"]{cursor:grab}
.mcard.dragging{opacity:.35}
.mcard .drv{font-size:10.5px;color:var(--text-3);margin-top:2px}
.vg-cell.drag-over{background:var(--accent-soft);outline:2px dashed var(--accent);outline-offset:-2px}
.vg-pool{display:flex;flex-wrap:wrap;gap:8px;padding:4px;border-radius:var(--radius)}
.vg-pool.drag-over{background:var(--accent-soft);outline:2px dashed var(--accent)}
.vg-pool .mcard{min-width:150px;margin-bottom:0}
.vg-pool-date{font-size:10.5px;font-weight:700;color:var(--text-2)}
/* Grille véhicules — vue JOUR (11/09/2026, colonnes = camions-grue/tracteurs, ligne "Autres" pour
   le reste), PIVOTÉE le 11/09/2026 (2e refonte, demande de Colart : véhicules en LIGNES à gauche
   façon planning papier, créneaux horaires de la journée en COLONNES à droite). */
.pg-wrap{overflow-x:auto;padding:4px 0 10px}
.pg-grid{display:grid;gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--radius);min-width:520px}
.pg-corner,.pg-slothd,.pg-rowhd,.pg-cell{background:var(--surface)}
.pg-corner,.pg-slothd{padding:10px 12px;font-weight:700;font-size:12.5px;color:var(--text-2);position:sticky;top:0}
.pg-slothd{text-align:center}
.pg-rowhd{padding:10px 12px;font-size:13px;display:flex;flex-direction:column;justify-content:center}
.pg-rowhd .immat{font-weight:700}
.pg-rowhd-autres{color:var(--text-2)}
.pg-rowhd-autres .immat{font-style:italic;font-weight:600}
.pg-cell{padding:6px;min-height:66px;display:flex;flex-direction:column;gap:4px}
.pg-cell-readonly .mcard{opacity:.85}
.pg-cell-readonly:empty:after,.pg-cell-readonly .empty{content:""}

/* ---------- Lists (vehicules/chauffeurs) ---------- */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.item-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px}
/* Code couleur des dossiers — onglet Facturation (demande de Colart, 21/09/2026). Blanc = pas de
   classe ajoutée (couleur .item-card par défaut). */
.item-card.dossier-attente-bc{background:var(--amber-soft);border-color:var(--amber)}
.item-card.dossier-facture{background:var(--green-soft);border-color:var(--green)}
.item-card h4{font-size:14.5px;margin-bottom:2px}
.item-card .sub{color:var(--text-2);font-size:12.5px;margin-bottom:8px}
.item-card .row{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.toggle{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:12.5px;color:var(--text-2)}
.switch{width:34px;height:19px;border-radius:999px;background:var(--surface-3);position:relative;transition:background .15s}
.switch.on{background:var(--green)}
.switch .knob{position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff;transition:left .15s}
.switch.on .knob{left:17px}

/* ---------- Chauffeur view ---------- */
.driver-picker{max-width:420px;margin:40px auto;text-align:center}
.driver-picker h2{margin-bottom:4px}
.driver-picker p{color:var(--text-2);margin-bottom:18px}
select.big{width:100%;padding:12px;border-radius:10px;border:1px solid var(--border-2);background:var(--surface);margin-bottom:12px}
.dm-list{display:flex;flex-direction:column;gap:12px;max-width:640px;margin:0 auto}
.dm-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
.dm-card .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px}
.dm-card .client{font-size:16px;font-weight:800}
.dm-card .addr{color:var(--text-2);font-size:13px;margin-top:2px}
.dm-card .addr b{color:var(--text)}
.dm-steps{display:flex;flex-wrap:wrap;gap:4px;margin:10px 0}
.step-pill{font-size:10.5px;padding:3px 7px;border-radius:999px;background:var(--surface-3);color:var(--text-3)}
.step-pill.done{background:var(--green-soft);color:var(--green)}
.step-pill.next{background:var(--blue-soft);color:var(--blue);font-weight:700}
.dm-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.dm-extra{margin-top:8px;font-size:12.5px;color:var(--text-2)}
.dm-extra div{margin-top:3px}
.cmr-gate{display:flex;flex-direction:column;gap:8px;width:100%}
.cmr-gate .hint{margin:0}
.cmr-gate label.btn{text-align:center;cursor:pointer}
.bc-file-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg-2,rgba(127,127,127,.08))}
.bc-file-info{flex:1;min-width:160px;font-size:13.5px}
.bc-file-info .sub{color:var(--text-2)}
.dm-photo-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.dm-photo-thumb{position:relative;width:64px;height:64px;border-radius:8px;overflow:hidden;border:1px solid var(--border);cursor:pointer;background:var(--surface-3)}
.dm-photo-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.dm-photo-rm{position:absolute;top:2px;right:2px;width:18px;height:18px;line-height:18px;padding:0;border:none;border-radius:50%;background:rgba(10,12,15,.7);color:#fff;font-size:11px;cursor:pointer}
.tel-link{display:inline-block;color:var(--blue);font-weight:700;text-decoration:none;white-space:nowrap}
.addr-actions{display:inline-flex;gap:6px;margin-left:8px;vertical-align:middle}
.addr-link{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--blue-soft);color:var(--blue);text-decoration:none;white-space:nowrap}

/* ---------- Modal ---------- */
.modal-backdrop{position:fixed;inset:0;background:rgba(10,12,15,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:100}
.modal{background:var(--surface);border-radius:16px;max-width:640px;width:100%;max-height:88vh;overflow:auto;box-shadow:var(--shadow)}
.modal-hd{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);z-index:2}
.modal-hd h3{font-size:16px}
.modal-bd{padding:16px 18px}
.modal-ft{padding:14px 18px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;position:sticky;bottom:0;background:var(--surface)}
.close-x{background:transparent;border:none;font-size:18px;cursor:pointer;color:var(--text-2);padding:4px 8px;border-radius:6px}
.close-x:hover{background:var(--surface-2)}
.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--text-2);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:9px 10px;border:1px solid var(--border-2);border-radius:8px;background:var(--surface);color:var(--text)}
.field textarea{resize:vertical;min-height:60px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:480px){.field-row{grid-template-columns:1fr}}
/* Repères "Chargement"/"Livraison" dans le formulaire mission (ajouté 12/09/2026) */
.form-section{font-size:11px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.03em;margin:18px 0 8px;padding-top:14px;border-top:1px dashed var(--border)}
.form-section:first-of-type{margin-top:0;padding-top:0;border-top:none}
.addr-supp-row{display:flex;gap:6px;margin-top:6px}
.addr-supp-row input{flex:1;padding:9px 10px;border:1px solid var(--border-2);border-radius:8px;background:var(--surface);color:var(--text)}
.addr-supp-row button{flex:0 0 auto}
.client-ac-list{display:none;position:absolute;left:0;right:0;top:100%;margin-top:2px;background:var(--surface);border:1px solid var(--border-2);border-radius:8px;box-shadow:var(--shadow);max-height:220px;overflow:auto;z-index:60}
.client-ac-item{padding:7px 10px;cursor:pointer;font-size:12.5px;border-bottom:1px solid var(--border)}
.client-ac-item:last-child{border-bottom:none}
.client-ac-item:hover{background:var(--surface-2)}
.client-ac-item .nm{font-weight:600}
.client-ac-item .sub2{color:var(--text-3);font-size:11px}
.hint{font-size:11.5px;color:var(--text-3);margin-top:3px}
.err{color:var(--danger);font-size:12.5px;margin-top:8px}
.devis-line-row{display:grid;grid-template-columns:1fr 60px 76px 90px 90px 30px;gap:6px;margin-bottom:6px;align-items:center}
.devis-line-row input{padding:7px 8px;border:1px solid var(--border-2);border-radius:8px;background:var(--surface);color:var(--text);width:100%;font-size:12.5px}
.devis-line-row input.dl-montant{background:var(--bg-2,rgba(127,127,127,.08));color:var(--text-2);font-weight:700}
@media (max-width:480px){.devis-line-row{grid-template-columns:1fr 1fr;row-gap:4px}.devis-line-row .dl-libelle{grid-column:1 / -1}}
.cl-email-row{display:grid;grid-template-columns:1fr 1fr 1.4fr auto;gap:10px;align-items:end;margin-bottom:6px}
.cl-email-row .field{margin-bottom:0}
@media (max-width:620px){.cl-email-row{grid-template-columns:1fr 1fr;padding-bottom:8px;border-bottom:1px dashed var(--border)}.cl-email-row .field:nth-child(3){grid-column:1 / -1}}
.facture-line-row{display:grid;grid-template-columns:1.2fr 1fr 120px 55px 80px 85px 28px 28px;gap:6px;margin-bottom:6px;align-items:center}
.facture-line-row input{padding:7px 8px;border:1px solid var(--border-2);border-radius:8px;background:var(--surface);color:var(--text);width:100%;font-size:12.5px}
.facture-line-row input.fl-montant{background:var(--bg-2,rgba(127,127,127,.08));color:var(--text-2);font-weight:700}
@media (max-width:480px){.facture-line-row{grid-template-columns:1fr 1fr;row-gap:4px}.facture-line-row .fl-designation,.facture-line-row .fl-cmd{grid-column:1 / -1}}
.facture-review-list{display:flex;flex-direction:column;gap:4px;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.facture-review-row{display:flex;align-items:center;gap:10px;padding:8px 10px;font-size:12.5px;background:var(--surface-2)}
.facture-review-row:nth-child(odd){background:var(--surface)}
.facture-review-row .fr-date{min-width:70px;color:var(--text-2);font-variant-numeric:tabular-nums}
.facture-review-row .fr-ref{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.facture-review-row .fr-montant{font-weight:700;min-width:80px;text-align:right}
.devis-kv-row{display:grid;grid-template-columns:170px 1fr 30px;gap:6px;margin-bottom:6px;align-items:center}
.devis-kv-row input{padding:7px 8px;border:1px solid var(--border-2);border-radius:8px;background:var(--surface);color:var(--text);width:100%;font-size:12.5px}
@media (max-width:480px){.devis-kv-row{grid-template-columns:1fr 30px}.devis-kv-row .dk-label{grid-column:1 / -1}}
.devis-presetbar{display:flex;gap:8px;margin-bottom:8px}
.devis-presetbar select{flex:1;padding:8px 9px;border:1px solid var(--border-2);border-radius:8px;background:var(--surface);color:var(--text);font-size:12.5px}
.devis-total-box{margin:8px 0 16px;padding:10px 12px;border:1px solid var(--border-2);border-radius:10px;background:var(--bg-2,rgba(127,127,127,.06))}
.devis-total-box .dt-row{display:flex;justify-content:space-between;font-size:13px;padding:2px 0;color:var(--text-2)}
.devis-total-box .dt-row.dt-ttc{font-weight:800;font-size:16px;color:var(--text);border-top:1px solid var(--border-2);margin-top:4px;padding-top:6px}

.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:12.5px;z-index:200;box-shadow:var(--shadow)}

/* ================= Devis — aperçu imprimable ================= */
.print-overlay{position:fixed;inset:0;background:#f2f2f2;z-index:500;overflow:auto;padding:22px;display:block}
.print-actions{display:flex;gap:10px;justify-content:flex-end;max-width:800px;margin:0 auto 16px}
.devis-doc{max-width:800px;margin:0 auto;background:#fff;color:#111;font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:1.5;padding:28px;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.devis-doc strong{color:#111}
.devis-doc table{width:100%;border-collapse:collapse;margin:10px 0}
.devis-doc th,.devis-doc td{border:1px solid #999;padding:6px 8px;text-align:left;vertical-align:top;font-size:12.5px}
.devis-doc .hd-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.devis-doc .box{border:1px solid #999;padding:10px}
.devis-doc .right{text-align:right}
.devis-doc .total-tbl{max-width:340px;margin-left:auto}
.devis-doc .total-row td{font-weight:700}
.devis-doc .cg-list{margin:8px 0;padding-left:18px}
.devis-doc .sign-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:24px}
.devis-doc .sign-box{border:1px solid #999;padding:30px 10px 10px;min-height:90px}
.devis-doc .footer{margin-top:20px;font-size:11px;color:#555;text-align:center;border-top:1px solid #ccc;padding-top:8px}
@media print{
  body *{visibility:hidden}
  .print-overlay, .print-overlay *{visibility:visible}
  .print-overlay{position:absolute;top:0;left:0;width:100%;padding:0;background:#fff}
  .print-actions{display:none}
  .devis-doc{box-shadow:none}
}
</style>

function normVilleKey(s){
  return String(s||"").toUpperCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[-']/g," ").replace(/\s+/g," ").trim();
}
// Repère "CODE POSTAL VILLE" dans une adresse libre (format standard des adresses françaises) pour
// en extraire le nom de ville, sans dépendre d'un champ dédié séparé sur la mission.
function extractVilleFromAdresse(adresse){
  if(!adresse) return "";
  var m = /\b\d{5}\s+([A-ZÀ-Üa-zà-ü' \-]{2,})/.exec(adresse);
  if(!m) return "";
  return m[1].replace(/,.*$/,"").replace(/\bFRANCE\b/i,"").trim();
}

  return found || null;

function fmtRelTime(iso){

  if(min<1) return "à l'instant";

// Projection équirectangulaire (avec correction cos(latitude)) ajustée à l'emprise des points
// fournis — conserve les distances/directions relatives, sans déformation. Retourne une fonction
// project(lat,lon) -> {x,y} dans le repère SVG [0,vw]x[0,vh].
function buildMapProjection(points, vw, vh, pad){
  var latMin=Math.min.apply(null, points.map(function(p){return p.lat})),
      latMax=Math.max.apply(null, points.map(function(p){return p.lat})),
      lonMin=Math.min.apply(null, points.map(function(p){return p.lon})),
      lonMax=Math.max.apply(null, points.map(function(p){return p.lon}));
  if(latMax-latMin<0.02){ latMin-=0.05; latMax+=0.05; }
  if(lonMax-lonMin<0.02){ lonMin-=0.05; lonMax+=0.05; }
  var latMid=(latMin+latMax)/2;
  var cosLat=Math.cos(latMid*Math.PI/180);
  var effW=(lonMax-lonMin)*cosLat, effH=(latMax-latMin);
  var usableW=vw-pad*2, usableH=vh-pad*2;
  var scale=Math.min(usableW/effW, usableH/effH);
  var offX=pad+(usableW-effW*scale)/2, offY=pad+(usableH-effH*scale)/2;
  return function(lat,lon){
    return { x: offX+(lon-lonMin)*cosLat*scale, y: offY+(latMax-lat)*scale };
  };
}
// Courbe lissée passant par les points de côte projetés, refermée pour former un polygone "terre"
// (même technique que dans la maquette validée par Colart : segments quadratiques via les points
// milieux). `bounds` sert à refermer proprement le polygone hors-cadre.
function coastPathD(pts, vw, vh){
  var d = "M "+pts[0].x.toFixed(1)+","+pts[0].y.toFixed(1)+" ";
  for(var i=0;i<pts.length-1;i++){
    var p0=pts[i], p1=pts[i+1];
    var mx=(p0.x+p1.x)/2, my=(p0.y+p1.y)/2;
    d += "Q "+p0.x.toFixed(1)+","+p0.y.toFixed(1)+" "+mx.toFixed(1)+","+my.toFixed(1)+" ";
  }
  var last=pts[pts.length-1];
  d += "L "+last.x.toFixed(1)+","+last.y.toFixed(1)+" L "+(vw+40)+","+(vh+40)+" L "+(-40)+","+(vh+40)+" Z";
  return d;
}
// Décale les pastilles qui partagent la même ville pour éviter qu'elles se superposent exactement.
function pinOffset(i){
  var angle = i*47*(Math.PI/180);
  var radius = 16 + Math.floor(i/6)*16;
  return { dx: Math.cos(angle)*radius, dy: Math.sin(angle)*radius };
}

// (contacts), et ouverture Google Maps / Waze sur une adresse (demande de Colart, 11/09/2026).
function linkifyPhones(text){
  if(!text) return "";
  var re = /(\+33[\s.\-\/]?[1-9](?:[\s.\-\/]?\d{2}){4})|(0[1-9](?:[\s.\-\/]?\d{2}){4})/g;
  var out = "", last = 0, match;
  while((match = re.exec(text))){
    out += escapeHtml(text.slice(last, match.index));
    var raw = match[0];
    var digits = raw.replace(/[^\d+]/g,"");
    out += '<a href="tel:'+digits+'" class="tel-link">📞 '+escapeHtml(raw)+'</a>';
    last = match.index + raw.length;
  }
  out += escapeHtml(text.slice(last));
  return out;
}

function computeCountdown(m){
  // Mirrors the "temps restant" column from Colart's dépannage dispatch tool:
  // shows time until scheduled start, or how late a mission is running.
  if(!m.dateMission || !m.heureDebut) return null;
  var si = statutIndex(m);
  if(m.statutIndex==="refusee" || si>=STEP_LAST) return null;
  var scheduled = new Date(m.dateMission+"T"+m.heureDebut+":00");
  if(isNaN(scheduled.getTime())) return null;
  var diffMin = Math.round((scheduled.getTime()-Date.now())/60000);
  if(si>=1){
    // already en route / on site — countdown against schedule is no longer meaningful
    return null;
  }
  if(diffMin < 0){
    return {cls:"danger", label:"Retard "+(-diffMin)+" min"};
  }
  if(diffMin <= 30){
    return {cls:"amber", label:"Dans "+diffMin+" min"};
  }
  if(diffMin <= 1440){
    var h = Math.floor(diffMin/60), mm = diffMin%60;
    return {cls:"blue", label:"Dans "+h+"h"+pad2(mm)};
  }
  return null;
}

// chargement (déjà passée ou en cours) mais l'heure de livraison prévue. Sans heure de livraison

function computeCountdownLivraison(m){

  var scheduled = new Date(d+"T"+h+":00");

  var diffMin = Math.round((scheduled.getTime()-Date.now())/60000);
  if(diffMin < 0) return {cls:"danger", label:"Retard "+(-diffMin)+" min"};
  if(diffMin <= 30) return {cls:"amber", label:"Dans "+diffMin+" min"};

function initDb(){
  if(!firebaseConfig || firebaseConfig.apiKey==="REMPLACER_API_KEY"){
    state.dbReady = false; renderRoot(); return;
  }
  try{
    firebase.initializeApp(firebaseConfig);
  } catch(e){ state.dbReady=false; renderRoot(); return; }
  firebase.auth().signInAnonymously().then(function(){
    state.db = firebase.firestore();
    state.dbReady = true;
    subscribeCore();
    renderRoot();
  }).catch(function(){ state.dbReady=false; renderRoot(); });
}
// Lecture seule des congés déclarés dans Pointage Pro (demande de Colart, 01/10/2026). Deuxième
// application Firebase, nommée pour ne pas entrer en conflit avec l'app principale (firebase.app()
// par défaut reste celle du projet Transport) — voir pointageProFirebaseConfig ci-dessus. Pointage
// Pro lui-même n'utilise aucune authentification pour lire sa collection "conges" (confirmé dans son
// propre code), donc pas besoin de connexion ici non plus. Échec silencieux si Pointage Pro est
// injoignable ou si sa config change un jour : l'app Transport continue de fonctionner normalement,
// simplement sans les alertes congés (voir chauffeurEnCongeLe / joursCongeDansPeriode).
function initPointageProCongesSync(){
  if(!pointageProFirebaseConfig || !pointageProFirebaseConfig.apiKey) return;
  try{
    var ppApp;
    try{ ppApp = firebase.app("pointagepro"); }catch(e0){ ppApp = firebase.initializeApp(pointageProFirebaseConfig, "pointagepro"); }
    _subsRole.push(ppApp.firestore().collection("conges").onSnapshot(function(snap){
      state.congesPointagePro = snap.docs.map(function(d){ return d.data(); });
      render();
    }, function(){ /* Pointage Pro injoignable — on n'affiche simplement aucune alerte congé */ }));
  } catch(e){ /* config invalide — sans conséquence pour le reste de l'appli */ }
}

/* ================= IA (import de commande) — via Cloud Function Firebase ================= */
// L'import de commande par IA utilisait la capacité "sample" de Claude Artifact, propre à ce mode
// d'hébergement — elle n'existe pas ici. On la remplace par un petit service (Cloud Function)
// hébergé sur le même projet Firebase, qui appelle l'API Anthropic côté serveur (la clé API n'est
// jamais exposée au navigateur). Voir openImportCommandeModal / analyserCommandeIA ci-dessous.
var ANALYSE_COMMANDE_URL = "https://analyser-commande-601649056599.europe-west1.run.app";
function initSample(){ state.sample = true; }
function analyserCommandeIA(payload){
  return firebase.auth().currentUser.getIdToken().then(function(idToken){
    return fetch(ANALYSE_COMMANDE_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + idToken
      },
      body: JSON.stringify(payload)
    });
  }).then(function(res){
    if(!res.ok){
      return res.json().catch(function(){ return {error:"upstream_error"}; }).then(function(errBody){
        var err = new Error("analyse_failed");
        err.code = errBody && errBody.error;
        throw err;
      });
    }
    return res.json();
  });
}

// Abonnements Firestore en 2 temps (demande de Colart, 30/10/2026 — ouverture trop lente) :
//  1) au démarrage : seulement ce qu'il faut pour l'écran d'accueil / choix du nom (chauffeurs,
//     véhicules, config) — les noms s'affichent tout de suite ;
//  2) selon l'espace choisi : le gestionnaire charge tout (missions, devis, factures, clients…),
//     le chauffeur ne charge que SES missions (aucun devis/facture/client n'est téléchargé).
var _subsCore = [], _subsRole = [], _roleSubKey = null;
function subscribeCore(){
  var db = state.db, _subs = _subsCore;
  _subs.push(db.collection("chauffeurs").onSnapshot(function(snap){
    state.chauffeurs = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); })
      .sort(function(a,b){ return (a.nom||"").localeCompare(b.nom||""); });
    render();
  }, function(){}));
  _subs.push(db.collection("vehicules").onSnapshot(function(snap){
    state.vehicules = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); })
      .sort(function(a,b){ return (a.immatriculation||"").localeCompare(b.immatriculation||""); });
    render();
  }, function(){}));
  _subs.push(db.doc("config/app").onSnapshot(function(snap){
    if(snap.exists){ state.config = Object.assign({}, CONFIG_DEFAULTS, snap.data()); }
    render();
  }, function(){}));
}
function unsubscribeRole(){
  _subsRole.forEach(function(u){ try{ u(); }catch(e){} });
  _subsRole = []; _roleSubKey = null;
  state.missions = []; state.missionsCorbeille = []; state.devis = []; state.factures = [];
  state.clients = []; state.impayes = []; state.rdvBigBoss = []; state.congesPointagePro = [];
}
// Idempotent : n'ouvre les écoutes que si l'espace (gestionnaire / chauffeur X) a changé.
function ensureRoleSubscriptions(){
  if(!state.db) return;
  var key = null;
  if(state.role==="gestionnaire" && state.gestOk) key = "gest";
  else if(state.role==="chauffeur" && state.driverId) key = "drv:"+state.driverId;
  if(key===_roleSubKey) return;
  if(_roleSubKey!==null) unsubscribeRole();
  if(key===null) return;
  _roleSubKey = key;
  var isManager = key==="gest";
  var db = state.db, _subs = _subsRole;
  var query = isManager? db.collection("missions") : db.collection("missions").where("chauffeurId","==",state.driverId);
  _subs.push(query.onSnapshot(function(snap){
    var all = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
    // Corbeille (demande de Colart, 17/09/2026) : une mission supprimée n'est plus effacée
    // directement — elle passe supprimee:true et disparaît de toutes les vues normales, mais reste
    // récupérable depuis le Tableau de bord. Purge automatique après 2 mois (60 jours) dans la
    // corbeille, en douceur à chaque rafraîchissement plutôt que via une tâche planifiée.
    state.missions = all.filter(function(m){ return !m.supprimee; });
    state.missionsCorbeille = all.filter(function(m){ return m.supprimee; }).sort(function(a,b){
      return (b.supprimeeAt||"").localeCompare(a.supprimeeAt||"");
    });
    var purgeAvant = Date.now() - 60*24*60*60*1000;
    if(!isManager) state.missionsCorbeille = [];
    if(isManager) state.missionsCorbeille.forEach(function(m){
      if(m.supprimeeAt && new Date(m.supprimeeAt).getTime() < purgeAvant){
        state.db.doc("missions/"+m.id).delete().catch(function(){});
      }
    });
    render();
  }, function(){}));
  if(isManager){
  // Impayés (demande de Colart, 17/09/2026) — voir importImpayesFile.
  _subs.push(db.collection("impayes").onSnapshot(function(snap){
    state.impayes = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
    render();
  }, function(){}));
  _subs.push(db.collection("devis").onSnapshot(function(snap){
    state.devis = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
    render();
  }, function(){}));
  _subs.push(db.collection("factures").onSnapshot(function(snap){
    state.factures = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
    // Réparation ponctuelle (demande de Colart, 25/09/2026) : les factures/avoirs créés avant
    // l'ajout des préfixes F/A (23-24/09/2026) ont gardé leur ancien numéro au format MM/AA/NNNN
    // sans lettre devant. On les corrige automatiquement au fil de l'eau, un par un — dès que le
    // préfixe est ajouté, le numéro ne correspond plus au motif ci-dessous et le document n'est
    // plus jamais retouché. Seul le libellé "numero" est modifié, jamais les compteurs de
    // séquence, donc aucun risque de collision de numérotation.
    state.factures.forEach(function(f){
      if(f.numero && /^\d{2}\/\d{2}\/\d{4}$/.test(f.numero)){
        var estAvoir = (f.type||"facture")==="avoir";
        db.doc("factures/"+f.id).update({numero: (estAvoir?"A":"F")+f.numero}).catch(function(){});
      }
    });
    render();
  }, function(){}));
  _subs.push(db.collection("clients").onSnapshot(function(snap){
    state.clients = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); })
      .sort(function(a,b){ return (a.nom||"").localeCompare(b.nom||""); });
    render();
  }, function(){}));
  // Rendez-vous personnels de Colart (demande de Colart, 01/10/2026) — voir openRdvBigBossModal /
  // rdvBigBossDuJour. Affichés sur le Planning au même endroit que les alertes congé chauffeur.
  _subs.push(db.collection("rdvBigBoss").onSnapshot(function(snap){
    state.rdvBigBoss = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); })
      .sort(function(a,b){ return (a.heure||"").localeCompare(b.heure||""); });
    render();
  }, function(){}));
    initPointageProCongesSync();
  }
}

function devisFor(missionId){ return state.devis.find(function(d){ return d.id===missionId; }); }
function devisTotal(d){
  // Total HT ne porte que sur les lignes chiffrées (qté + prix unitaire renseignés) — les lignes
  // "au réel" (heures supplémentaires, etc.) restent hors base, comme sur les devis papier.
  if(!d || !d.lignes) return 0;
  return d.lignes.reduce(function(sum, l){
    if(l.quantite==null || l.quantite==="" || l.prixUnitaire==null || l.prixUnitaire==="") return sum;
    return sum + (parseFloat(l.quantite)||0) * (parseFloat(l.prixUnitaire)||0);
  }, 0);
}
// Taux de TVA choisi par devis/facture (20 % par défaut) — certains clients sont facturés hors TVA
// (demande de Colart, 11/09/2026). Absent sur un ancien document = 20 % (comportement inchangé).
function devisTVA(d){ var t=(d && d.tauxTVA!=null)? d.tauxTVA : 20; return devisTotal(d)*(t/100); }
function devisTTC(d){ return devisTotal(d)+devisTVA(d); }
function devisLigneMontant(l){
  if(l.quantite==null || l.quantite==="" || l.prixUnitaire==null || l.prixUnitaire==="") return "au réel";
  return fmtEUR((parseFloat(l.quantite)||0)*(parseFloat(l.prixUnitaire)||0));
}
function fmtEUR(n){
  return (Math.round((n||0)*100)/100).toLocaleString("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:2})+" €";
}
function fmtDateFR(iso){
  if(!iso) return "";
  var p = String(iso).split("-");
  if(p.length!==3) return iso;
  return p[2]+"/"+p[1]+"/"+p[0];
}
function devisStatutInfo(key){
  return DEVIS_STATUTS.find(function(s){ return s.key===key; }) || DEVIS_STATUTS[0];
}
/* ================= Facturation ================= */
function factureStatutInfo(key){
  return FACTURE_STATUTS.find(function(s){ return s.key===key; }) || FACTURE_STATUTS[0];
}
function moisLabel(moisStr){
  // moisStr format "YYYY-MM"
  if(!moisStr) return "";
  var p = moisStr.split("-");
  if(p.length!==2) return moisStr;
  var idx = parseInt(p[1],10)-1;
  return (MOIS_LABELS[idx]||p[1])+" "+p[0];
}
function currentMoisStr(){ var d=new Date(); return d.getFullYear()+"-"+pad2(d.getMonth()+1); }
// Mois de facturation d'une mission : celui choisi à la main (champ moisFacturation, demande de
// Colart 05/10/2026 — ex. un transport fait fin septembre mais à facturer en octobre), sinon le mois
// de la date de chargement. Sert au classement/filtre de l'onglet Facturation, au regroupement de la
// liste « Missions à facturer » et au mois proposé par défaut sur la facture.
function missionMoisStr(m){
  if(m.moisFacturation && /^\d{4}-\d{2}$/.test(m.moisFacturation)) return m.moisFacturation;
  if(!m.dateMission) return currentMoisStr();
  return m.dateMission.slice(0,7);
}
// Une mission est prête à facturer une fois le chauffeur arrivé en "Fin de mission" ET un devis
// enregistré (c'est le devis qui porte le prix définitif — modifiable à tout moment avant la
// facture). Elle est déjà facturée si son devis porte un factureId.
function missionFactureEtat(m){
  var d = devisFor(m.id);
  // Demande de Colart (25/09/2026) : une mission cochée "contrôlée" manuellement passe en
  // facturation même si elle n'a pas atteint STEP_LAST (heures incomplètes, photo CMR absente côté
  // chauffeur) — voir la case à cocher dans openMissionModal, désormais disponible même hors
  // mission terminée.
  if(statutIndex(m) !== STEP_LAST && !m.controlee) return "non_terminee";
  if(!d) return "sans_devis";
  if(d.factureId) return "facturee";
  return "a_facturer";
}
// Code couleur des dossiers dans l'onglet Facturation (demande de Colart, 21/09/2026, précisée le
// 21/09/2026) : blanc = dossier pas traité (rien coché) ; orange = case "En attente de bon de
// commande" cochée sur la mission ; vert = case "Bon de commande reçu" cochée OU dossier déjà
// facturé. Entièrement manuel — deux cases à cocher directement sur la fiche mission (m.bonCommandeEnAttente,
// m.bonCommandeRecu), plus de détection automatique via les champs du devis. "recu" est distingué
// de "facture" (même couleur verte, textes différents) pour que Colart voie lequel des deux c'est.
// Un dossier non contrôlé n'a pas d'état couleur ici — voir dossiersGroupesParClient (point 3).
function missionDossierEtat(m){
  var d = devisFor(m.id);
  if(!d) return null;
  if(d.factureId) return "facture";
  if(m.bonCommandeRecu) return "recu";
  if(m.bonCommandeEnAttente) return "attente_bc";
  return "pas_traite";
}
// Filet de sécurité demandé par Colart (09/09/2026) : une mission terminée doit être "contrôlée"
// (vérifiée) avant de partir en facturation, mais rien ne devait empêcher d'en oublier une —
// notamment celles SANS devis, qui étaient jusqu'ici invisibles dans l'onglet Facturation
// (missionFactureEtat==="sans_devis" n'apparaissait dans aucune liste). Toute mission terminée,
// pas encore facturée et pas encore marquée "contrôlée" reste ici tant qu'on ne l'a pas traitée,
// qu'elle ait un devis ou non. Une fois incluse dans une facture, elle est automatiquement
// marquée contrôlée (voir openFactureModal) et sort donc de cette liste (déjà exclue via
// missionFactureEtat==="facturee").
function missionAControler(m){
  return statutIndex(m)===STEP_LAST && missionFactureEtat(m)!=="facturee" && !m.controlee;
}
function missionsAControler(){
  return state.missions.filter(missionAControler).sort(byDateHeure);
}
// Filet de sécurité "à réaffecter" (demande de Colart, 11/09/2026) : une mission dont le jour prévu
// est déjà passé mais qui n'a pas été menée à son terme (jamais acceptée, refusée par le chauffeur,
// ou restée bloquée en cours de route) ne doit pas disparaître silencieusement du planning — elle
// doit être reprogrammée à une prochaine journée. Exclusion ajoutée le 25/09/2026 (demande de
// Colart) : dès que la mission est cochée "contrôlée" (facturable malgré mission non terminée —
// voir openMissionModal), elle part directement en facturation et ne doit plus apparaître ici non
// plus, même si les étapes/heures/CMR restent incomplètes.
function missionAReaffecter(m){
  return !!m.dateMission && m.dateMission < todayISO() && statutIndex(m) < STEP_LAST && !m.controlee;
}
function missionsAReaffecter(){
  return state.missions.filter(missionAReaffecter).sort(byDateHeure);
}
// filtreMois: "01".."12" ou "" (tous) ; filtreAnnee: "2026" etc. ou "" (toutes) — indépendants,
// combinables (un mois seul sur toutes les années, une année seule tous mois, ou les deux).
function missionMatchFiltre(m, filtreMois, filtreAnnee){
  var ms = missionMoisStr(m); // "YYYY-MM"
  var annee = ms.slice(0,4), mois = ms.slice(5,7);
  if(filtreAnnee && annee!==filtreAnnee) return false;
  if(filtreMois && mois!==filtreMois) return false;
  return true;
}
// Dossiers "Missions à facturer" de l'onglet Facturation, groupés par client. Inclut désormais
// aussi les dossiers déjà facturés (demande de Colart, 21/09/2026 : "je veux un code couleur pour
// l'état d'évolution des dossiers" — le vert "facturé" doit rester visible ici, pas disparaître) —
// respecte toujours le filtre mois/année du haut de page, donc se limite naturellement si filtré.
// Un dossier "à facturer" mais pas encore "contrôlé" est exclu (point 3 de la même demande : ces
// missions restent uniquement dans le filet de sécurité "Missions terminées à contrôler" tant
// qu'elles n'ont pas été vérifiées).
// Ne regroupe plus que les missions encore À FACTURER (demande de Colart, 23/09/2026 : "les
// missions qui sont déjà facturées, peux-tu les enlever de la liste et les classer dans la partie
// factures" — un dossier entièrement facturé n'a plus rien à faire ici, il reste consultable dans
// la liste "Factures" juste en dessous). Une mission déjà facturée n'apparaît donc plus du tout
// dans cette grille, y compris pour un client qui a par ailleurs encore des missions en attente.
function dossiersGroupesParClient(filtreMois, filtreAnnee){
  var groups = {};
  state.missions.forEach(function(m){
    var etat = missionFactureEtat(m);
    if(etat!=="a_facturer") return;
    if(!m.controlee) return;
    if(!missionMatchFiltre(m, filtreMois, filtreAnnee)) return;
    var client = m.client || "Client non renseigné";
    if(!groups[client]) groups[client] = [];
    groups[client].push(m);
  });
  return groups;
}
// Années présentes dans les missions/factures, pour peupler le sélecteur d'année (+ année en
// cours toujours incluse, même sans données).
function anneesDisponibles(){
  var set = {};
  set[String(new Date().getFullYear())] = true;
  state.missions.forEach(function(m){ if(m.dateMission) set[m.dateMission.slice(0,4)]=true; });
  state.factures.forEach(function(f){ if(f.mois) set[f.mois.slice(0,4)]=true; });
  return Object.keys(set).sort();
}
function factureLigneMontant(l){
  var q = (l.quantite==null||l.quantite==="")? 1 : parseFloat(l.quantite);
  var p = (l.prixUnitaire==null||l.prixUnitaire==="")? 0 : parseFloat(l.prixUnitaire);
  return fmtEUR(q*p);
}
function factureTotal(f){
  if(!f || !f.lignes) return 0;
  return f.lignes.reduce(function(sum, l){
    var q = (l.quantite==null||l.quantite==="")? 1 : (parseFloat(l.quantite)||0);
    var p = (l.prixUnitaire==null||l.prixUnitaire==="")? 0 : (parseFloat(l.prixUnitaire)||0);
    return sum + q*p;
  }, 0);
}
function factureTVA(f){ var t=(f && f.tauxTVA!=null)? f.tauxTVA : 20; return factureTotal(f)*(t/100); }
function factureTTC(f){ return factureTotal(f)+factureTVA(f); }
// Comptes de vente disponibles pour une facture (demande de Colart, 22/09/2026) : le compte par
// défaut + les comptes alternatifs paramétrés dans Paramètres (CUD, barges, Galloo...).
function comptesVenteOptions(){
  var list = [{code: state.config.compteVenteDefaut||CONFIG_DEFAULTS.compteVenteDefaut, libelle: state.config.libelleVenteDefaut||CONFIG_DEFAULTS.libelleVenteDefaut, note:""}];
  (state.config.comptesVenteAlternatifs||[]).forEach(function(c){ if(c && c.code) list.push(c); });
  return list;
}
function compteVenteLibelle(code){
  var opt = comptesVenteOptions().find(function(c){ return c.code===code; });
  return opt? opt.libelle : (code||"");
}
// Numéro de facture propre à l'application (demande de la comptable de Colart, 22/09/2026, format
// précisé par Colart le 22/09/2026 : MM/AA/NNNN, ex "09/26/0001") : mois/année en cours + séquence
// sur 4 chiffres, qui repart automatiquement à 1 à chaque nouveau mois — pour repérer d'un coup
// d'œil les factures créées ici, distinctes de ses journaux Alpha/RD4/Powerpanne. Le compteur
// n'avance (et la période ne change) qu'au moment de l'enregistrement effectif d'une nouvelle
// facture (voir openFactureModal) — jamais à la simple ouverture du formulaire, pour ne pas laisser
// de trou dans la numérotation si Colart annule.
function currentFacturePeriode(){
  var d = new Date();
  return pad2(d.getMonth()+1)+"/"+String(d.getFullYear()).slice(-2);
}
// Convertit le "Mois de facturation" choisi dans le formulaire (valeur d'un <input type="month">,
// format "AAAA-MM") vers le même format de période "MM/AA" que currentFacturePeriode() — ajouté
// 01/10/2026, demande de Colart : la numérotation doit suivre ce mois-là, pas la date du jour (ex:
// une facture de septembre créée le 1er octobre doit continuer la série F09/26/..., pas F10/26/...).
function facturePeriodeFromMoisStr(moisStr){
  if(!moisStr || moisStr.indexOf("-")===-1) return currentFacturePeriode();
  var parts = moisStr.split("-");
  return parts[1]+"/"+parts[0].slice(-2);
}
// Numéro de séquence à utiliser pour une période "MM/AA" donnée (la période du MOIS DE FACTURATION,
// pas forcément le mois en cours — voir facturePeriodeFromMoisStr). Chaque période garde sa propre
// suite dans numeroFactureSeqParPeriode, pour pouvoir facturer un mois passé après avoir déjà
// commencé le suivant sans dupliquer ni "sauter" de numéro. Repli sur l'ancien compteur mono-période
// (numeroFacturePeriode/numeroFactureProchain) pour les données enregistrées avant ce changement.
function prochainSequenceFacturePourPeriode(periode){
  var map = state.config.numeroFactureSeqParPeriode || {};
  if(map[periode]!=null) return map[periode];
  if((state.config.numeroFacturePeriode||"")===periode){
    return state.config.numeroFactureProchain || CONFIG_DEFAULTS.numeroFactureProchain;
  }
  return 1;
}
// Repli pratique pour les écrans qui n'ont pas de "mois de facturation" précis (aperçu dans
// Paramètres) : séquence pour le mois civil en cours.
function prochainSequenceFacture(){
  return prochainSequenceFacturePourPeriode(currentFacturePeriode());
}
// "F" devant chaque facture (demande de Colart, 24/09/2026) — pour repérer d'un coup d'œil, dans
// la liste et dans l'export comptable, les factures générées par l'application (par opposition aux
// avoirs, préfixés "A" — voir formatAvoirNumero — et aux factures Alpha/RD4/Powerpanne qui n'ont
// pas ce préfixe).
function formatFactureNumero(periode, n){
  return "F"+periode+"/"+String(n).padStart(4,"0");
}
function prochainNumeroFacturePreview(){
  return formatFactureNumero(currentFacturePeriode(), prochainSequenceFacture());
}
// Fait avancer d'un cran le compteur de factures de la période donnée — à fusionner dans
// state.config lors de l'enregistrement effectif d'une facture (jamais à l'ouverture du formulaire,
// pour ne pas laisser de trou dans la numérotation si Colart annule). Met aussi à jour les anciens
// champs mono-période, par simple cohérence d'affichage (ex: "Mois/année en cours" dans Paramètres).
function withNextFactureSeq(periode, seqUtilisee){

// Numérotation des avoirs (demande de Colart, 24/09/2026) : même principe que les factures
// (MM/AA/NNNN, remise à 1 chaque mois) mais compteur séparé et préfixe "A" au lieu de "F", pour
// distinguer un avoir d'une facture d'un coup d'œil (ex: A09/26/0001).
function prochainSequenceAvoirPourPeriode(periode){
  var map = state.config.numeroAvoirSeqParPeriode || {};
  if(map[periode]!=null) return map[periode];
  if((state.config.numeroAvoirPeriode||"")===periode){
    return state.config.numeroAvoirProchain || CONFIG_DEFAULTS.numeroAvoirProchain;
  }
  return 1;
}
function prochainSequenceAvoir(){
  return prochainSequenceAvoirPourPeriode(currentFacturePeriode());
}
function withNextAvoirSeq(periode, seqUtilisee){
  var map = Object.assign({}, state.config.numeroAvoirSeqParPeriode||{});
  map[periode] = seqUtilisee+1;
  return { numeroAvoirSeqParPeriode: map, numeroAvoirPeriode: periode, numeroAvoirProchain: seqUtilisee+1 };
}
function formatAvoirNumero(periode, n){

}
function prochainNumeroAvoirPreview(){
  return formatAvoirNumero(currentFacturePeriode(), prochainSequenceAvoir());
}
/* ================= Pièces jointes (fichier encodé dans le document db) =================
   Pas de capacité de stockage de fichiers dispo pour ce compte : le fichier est encodé en
   base64 et enregistré directement dans le document devis (limite de la base : 256 Ko par
   document, tous champs compris) — donc on vise un budget prudent d'environ 170 Ko pour le
   fichier encodé, et on compresse les photos automatiquement pour tenir dans ce budget. */
var MAX_ATTACHMENT_DATAURL_BYTES = 170*1024;
function fmtFileSize(bytes){
  if(!bytes && bytes!==0) return "";
  if(bytes < 1024) return bytes+" o";
  return (bytes/1024).toFixed(0)+" Ko";
}
function dataUrlByteLength(dataUrl){
  var i = dataUrl.indexOf(",");
  var b64 = i>=0? dataUrl.slice(i+1) : dataUrl;
  return Math.ceil(b64.length*3/4);
}
function fileToDataUrl(file){
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onload = function(){ resolve(reader.result); };
    reader.onerror = function(){ reject(reader.error || new Error("read_failed")); };
    reader.readAsDataURL(file);
  });
}
function compressImageFile(file, maxBytes){
  return new Promise(function(resolve, reject){
    var objUrl = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function(){
      URL.revokeObjectURL(objUrl);
      var w = img.naturalWidth||1, h = img.naturalHeight||1;
      var maxDim = 1600;
      function render(scale, quality){
        var cw = Math.max(1, Math.round(w*scale)), ch = Math.max(1, Math.round(h*scale));
        var canvas = document.createElement("canvas");
        canvas.width = cw; canvas.height = ch;
        var ctx = canvas.getContext("2d");
        ctx.fillStyle = "#fff"; ctx.fillRect(0,0,cw,ch);
        ctx.drawImage(img, 0, 0, cw, ch);
        return canvas.toDataURL("image/jpeg", quality);
      }
      var scale = Math.min(1, maxDim/Math.max(w,h));
      var quality = 0.75;
      var dataUrl = render(scale, quality);
      var tries = 0;
      while(dataUrlByteLength(dataUrl) > maxBytes && tries < 8){
        if(quality > 0.35){ quality -= 0.12; }
        else { scale *= 0.75; }
        dataUrl = render(scale, quality);
        tries++;
      }
      resolve({dataUrl: dataUrl, tooLarge: dataUrlByteLength(dataUrl) > maxBytes});
    };
    img.onerror = function(){ URL.revokeObjectURL(objUrl); reject(new Error("image_load_failed")); };
    img.src = objUrl;
  });
}
function dataUrlToBlob(dataUrl){
  var parts = dataUrl.split(",");
  var mimeMatch = /data:([^;]+)/.exec(parts[0]);
  var mime = mimeMatch? mimeMatch[1] : "application/octet-stream";
  var bin = atob(parts[1]||"");
  var arr = new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], {type: mime});
}
function openFileAttachment(fichier){
  if(!fichier || !fichier.dataUrl) return;
  try{
    var blob = dataUrlToBlob(fichier.dataUrl);
    var url = URL.createObjectURL(blob);
    window.open(url, "_blank");
    setTimeout(function(){ URL.revokeObjectURL(url); }, 60000);
  } catch(e){
    toast("Impossible d'ouvrir ce fichier");
  }
}
// Active le glisser-déposer de fichier(s) sur une zone (demande de Colart, 25/09/2026) : au lieu
// d'obliger à cliquer sur "Joindre le fichier" / "Ajouter une pièce jointe" puis à naviguer dans le
// sélecteur système, on peut aussi glisser un fichier directement sur la zone. onDrop(fileList) est
// appelé avec la liste des fichiers déposés (FileList natif). Léger surlignage visuel pendant le
// survol pour indiquer que la dépose est possible.
function wireDragDrop(zoneEl, onDrop){
  var depth = 0;
  function highlight(on){
    zoneEl.style.outline = on? "2px dashed var(--brand, #2563eb)" : "";
    zoneEl.style.outlineOffset = on? "3px" : "";
    zoneEl.style.borderRadius = on? "10px" : "";
  }
  zoneEl.addEventListener("dragenter", function(e){
    if(!e.dataTransfer || !Array.prototype.includes.call(e.dataTransfer.types||[], "Files")) return;
    e.preventDefault(); e.stopPropagation();
    depth++; highlight(true);
  });
  zoneEl.addEventListener("dragover", function(e){
    if(!e.dataTransfer || !Array.prototype.includes.call(e.dataTransfer.types||[], "Files")) return;
    e.preventDefault(); e.stopPropagation();
  });
  zoneEl.addEventListener("dragleave", function(e){
    e.preventDefault(); e.stopPropagation();
    depth = Math.max(0, depth-1);
    if(depth===0) highlight(false);
  });
  zoneEl.addEventListener("drop", function(e){
    e.preventDefault(); e.stopPropagation();
    depth = 0; highlight(false);
    var files = e.dataTransfer && e.dataTransfer.files;
    if(files && files.length) onDrop(files);
  });
}
/* Gère la zone d'upload/aperçu d'une pièce jointe. onChange(fichierOuNull) est appelé à
   chaque changement d'état (fichier choisi, remplacé ou retiré). Renvoie {getValue, setBusy}. */
function wireAttachmentZone(zoneEl, initialFichier, accept, onChange){
  var current = initialFichier || null;
  var busy = false;
  var fileInput = el('<input type="file" accept="'+accept+'" style="display:none"/>');
  zoneEl.appendChild(fileInput);
  function render(){
    Array.from(zoneEl.children).forEach(function(c){ if(c!==fileInput) c.remove(); });
    if(busy){
      zoneEl.appendChild(el('<div class="hint">Traitement du fichier…</div>'));
      return;
    }
    if(current){
      var row = el('<div class="bc-file-row"></div>');
      row.appendChild(el('<div class="bc-file-info">📎 '+escapeHtml(current.name||"Fichier")+' <span class="sub">('+fmtFileSize(current.size||0)+')</span></div>'));
      var viewBtn = el('<button type="button" class="btn sm">Consulter</button>');
      viewBtn.addEventListener("click", function(){ openFileAttachment(current); });
      var repBtn = el('<button type="button" class="btn sm">Remplacer</button>');
      repBtn.addEventListener("click", function(){ fileInput.click(); });
      var rmBtn = el('<button type="button" class="btn sm danger">Retirer</button>');
      rmBtn.addEventListener("click", function(){ current = null; onChange(null); render(); });
      row.appendChild(viewBtn); row.appendChild(repBtn); row.appendChild(rmBtn);
      zoneEl.appendChild(row);
    } else {
      var label = el('<label class="btn sm">📎 Joindre le fichier</label>');
      label.addEventListener("click", function(){ fileInput.click(); });
      zoneEl.appendChild(label);
      zoneEl.appendChild(el('<div class="hint">PDF ou photo. Les photos sont compressées automatiquement ; un PDF trop volumineux (au-delà d\'environ 120 Ko) est automatiquement converti en image (1re page) pour rester joint.</div>'));
    }
  }
  function handleFile(file){
    if(!file) return Promise.resolve();
    busy = true; render();
    var isImage = /^image\//.test(file.type);
    var isPdf = file.type==="application/pdf";
    var work;
    if(isImage){
      work = compressImageFile(file, MAX_ATTACHMENT_DATAURL_BYTES).then(function(res){
        if(res.tooLarge) throw {code:"too_large"};
        return {dataUrl: res.dataUrl, name: file.name, type: file.type||"image/jpeg"};
      });
    } else if(isPdf && file.size*1.37 > MAX_ATTACHMENT_DATAURL_BYTES){
      // PDF trop volumineux pour être joint tel quel : converti en image (1re page) plutôt que
      // rejeté, pour ne jamais laisser la pièce jointe vide (ajouté 10/09/2026, demande de Colart).
      work = pdfPageToCompressedDataUrl(file, 1, MAX_ATTACHMENT_DATAURL_BYTES).then(function(res){
        if(res.tooLarge) throw {code:"too_large"};
        var baseName = (file.name||"document").replace(/\.pdf$/i,"");
        return {dataUrl: res.dataUrl, name: baseName+" (page 1).jpg", type: "image/jpeg", converted: true};
      });
    } else if(file.size*1.37 > MAX_ATTACHMENT_DATAURL_BYTES){
      work = Promise.reject({code:"too_large"});
    } else {
      work = fileToDataUrl(file).then(function(du){ return {dataUrl: du, name: file.name, type: file.type||"application/octet-stream"}; });
    }
    return work.then(function(res){
      current = {name: res.name, type: res.type, size: dataUrlByteLength(res.dataUrl), dataUrl: res.dataUrl};
      onChange(current);
      busy = false; render();
      if(res.converted){
        toast("PDF trop volumineux — converti en image (1re page) et joint");
      }
    }).catch(function(err){
      busy = false; render();
      if(err && err.code==="too_large"){
        toast("Fichier trop volumineux même après compression — réduisez sa taille et réessayez");
      } else {
        toast("Impossible de lire ce fichier");
      }
    });
  }
  fileInput.addEventListener("change", function(){
    var file = fileInput.files && fileInput.files[0];
    fileInput.value = "";
    if(!file) return;
    handleFile(file);
  });
  // Glisser-déposer un fichier directement sur la zone (demande de Colart, 25/09/2026) : évite de
  // devoir passer par le sélecteur de fichiers du système à chaque fois.
  wireDragDrop(zoneEl, function(fileList){
    var file = fileList && fileList[0];
    if(file) handleFile(file);
  });
  render();
  return { getValue: function(){ return current; } };
}
// Zone d'upload pour PLUSIEURS pièces jointes sur une même mission (bons de livraison, plans
// d'accès, fiches techniques…), visibles à la fois par le gestionnaire (ce formulaire) et par le
// chauffeur affecté (depuis son téléphone, sur la fiche de la mission) — ajouté 18/09/2026, demande
// de Colart : « mettre plusieurs pièces dans les missions pour que le gestionnaire puisse le voir
// ainsi que les chauffeurs ». Même logique de compression/plafond de taille que wireAttachmentZone
// (une seule pièce), simplement répétée pour chaque fichier ; plafonné en nombre (MAX_MISSION_DOCUMENTS)
// pour rester sous la limite de taille d'un document Firestore (1 Mo, tous champs de la mission compris).
var MAX_MISSION_DOCUMENTS = 8;
function wireMultiAttachmentZone(zoneEl, initialFiles, accept, onChange){
  var files = (initialFiles||[]).slice();
  var busy = false;
  var fileInput = el('<input type="file" accept="'+accept+'" style="display:none"/>');
  zoneEl.appendChild(fileInput);
  function render(){
    Array.from(zoneEl.children).forEach(function(c){ if(c!==fileInput) c.remove(); });
    files.forEach(function(f, i){
      var row = el('<div class="bc-file-row"></div>');
      row.appendChild(el('<div class="bc-file-info">📎 '+escapeHtml(f.name||"Fichier")+' <span class="sub">('+fmtFileSize(f.size||0)+')</span></div>'));
      var viewBtn = el('<button type="button" class="btn sm">Consulter</button>');
      viewBtn.addEventListener("click", function(){ openFileAttachment(f); });
      var rmBtn = el('<button type="button" class="btn sm danger">Retirer</button>');
      rmBtn.addEventListener("click", function(){ files.splice(i,1); onChange(files); render(); });
      row.appendChild(viewBtn); row.appendChild(rmBtn);
      zoneEl.appendChild(row);
    });
    if(busy){
      zoneEl.appendChild(el('<div class="hint">Traitement du fichier…</div>'));
    } else if(files.length >= MAX_MISSION_DOCUMENTS){
      zoneEl.appendChild(el('<div class="hint">Nombre maximum de pièces jointes atteint ('+MAX_MISSION_DOCUMENTS+') — retirez-en une avant d\'en ajouter une nouvelle.</div>'));
    } else {
      var label = el('<label class="btn sm">📎 Ajouter une pièce jointe</label>');
      label.addEventListener("click", function(){ fileInput.click(); });
      zoneEl.appendChild(label);
      zoneEl.appendChild(el('<div class="hint">PDF ou photo, plusieurs possibles. Les photos sont compressées automatiquement ; un PDF trop volumineux est automatiquement converti en image (1re page) pour rester joint.</div>'));
    }
  }
  function handleFile(file){
    if(!file) return Promise.resolve();
    if(files.length >= MAX_MISSION_DOCUMENTS){ toast("Nombre maximum de pièces jointes atteint ("+MAX_MISSION_DOCUMENTS+")"); return Promise.resolve(); }
    busy = true; render();
    var isImage = /^image\//.test(file.type);
    var isPdf = file.type==="application/pdf";
    var work;
    if(isImage){
      work = compressImageFile(file, MAX_ATTACHMENT_DATAURL_BYTES).then(function(res){
        if(res.tooLarge) throw {code:"too_large"};
        return {dataUrl: res.dataUrl, name: file.name, type: file.type||"image/jpeg"};
      });
    } else if(isPdf && file.size*1.37 > MAX_ATTACHMENT_DATAURL_BYTES){
      work = pdfPageToCompressedDataUrl(file, 1, MAX_ATTACHMENT_DATAURL_BYTES).then(function(res){
        if(res.tooLarge) throw {code:"too_large"};
        var baseName = (file.name||"document").replace(/\.pdf$/i,"");
        return {dataUrl: res.dataUrl, name: baseName+" (page 1).jpg", type: "image/jpeg", converted: true};
      });
    } else if(file.size*1.37 > MAX_ATTACHMENT_DATAURL_BYTES){
      work = Promise.reject({code:"too_large"});
    } else {
      work = fileToDataUrl(file).then(function(du){ return {dataUrl: du, name: file.name, type: file.type||"application/octet-stream"}; });
    }
    return work.then(function(res){
      files.push({name: res.name, type: res.type, size: dataUrlByteLength(res.dataUrl), dataUrl: res.dataUrl, addedAt: new Date().toISOString()});
      onChange(files);
      busy = false; render();
      if(res.converted){
        toast("PDF trop volumineux — converti en image (1re page) et joint");
      }
    }).catch(function(err){
      busy = false; render();
      if(err && err.code==="too_large"){
        toast("Fichier trop volumineux même après compression — réduisez sa taille et réessayez");
      } else {
        toast("Impossible de lire ce fichier");
      }
    });
  }
  fileInput.addEventListener("change", function(){
    var file = fileInput.files && fileInput.files[0];
    fileInput.value = "";
    if(!file) return;
    handleFile(file);
  });
  // Glisser-déposer un ou plusieurs fichiers directement sur la zone (demande de Colart,
  // 25/09/2026). Les fichiers déposés sont traités l'un après l'autre (chaque compression est
  // asynchrone et busy/files sont partagés) plutôt qu'en parallèle.
  wireDragDrop(zoneEl, function(fileList){
    var arr = Array.prototype.slice.call(fileList);
    var chain = Promise.resolve();
    arr.forEach(function(file){ chain = chain.then(function(){ return handleFile(file); }); });
  });
  render();
  return { getValues: function(){ return files; } };
}
// Numéro de devis : DC-AAAA-MMJJ-XXXX (XXXX = 4 premières lettres du client, "CLI" si pas encore
// de client). Correctif 05/10/2026 (demande de Colart) : deux devis du même jour pour des clients
// aux mêmes initiales — ou créés avant de saisir le client — recevaient exactement le même numéro.
// Le numéro est maintenant garanti unique : s'il existe déjà, on ajoute -2, -3…
function devisNumeroSlug(clientNom){
  var slug = (clientNom||"").toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^A-Z0-9]/g,"").slice(0,4);
  return slug || "CLI";
}
function uniqueDevisNumero(base, excludeId){
  var used = {};
  (state.devis||[]).forEach(function(d){ if(d.id!==excludeId && d.numero) used[String(d.numero).toLowerCase()] = true; });
  var m = String(base||"").match(/^(DC-\d{4}-\d{4}-[A-Z0-9]+)-\d+$/);
  var root = m? m[1] : base;
  if(!used[String(base).toLowerCase()]) return base;
  var n = 2;
  while(used[(root+"-"+n).toLowerCase()]) n++;
  return root+"-"+n;
}
function nextDevisNumero(clientNom, excludeId){
  var d = new Date();
  var base = "DC-"+d.getFullYear()+"-"+pad2(d.getMonth()+1)+pad2(d.getDate())+"-"+devisNumeroSlug(clientNom);
  return uniqueDevisNumero(base, excludeId);
}

// Position du chauffeur pour la "Carte" du Planning — ajouté 10/09/2026 (demande de Colart : suivi
// GPS en continu). Démarré une seule fois par session (garde via geoWatchId), tant que l'espace
// chauffeur reste ouvert et au premier plan — limite propre au navigateur mobile, pas un choix de
// l'appli : dès que le téléphone se verrouille ou change d'appli, plus aucune mise à jour n'arrive
// tant que le chauffeur n'a pas rouvert l'appli. Écriture limitée à une fois par minute pour ne pas
// spammer la base.
var geoWatchId = null;
var geoErrorShown = false;
function startDriverGeoWatch(){
  if(geoWatchId!=null) return;
  if(!navigator.geolocation){ return; }
  var lastSent = 0;
  geoWatchId = navigator.geolocation.watchPosition(function(pos){
    var now = Date.now();
    if(now-lastSent < 60000) return;
    lastSent = now;
    if(!state.db || !state.driverId) return;
    dbWrite(state.db.doc("chauffeurs/"+state.driverId).update({
      position: {lat: pos.coords.latitude, lon: pos.coords.longitude, updatedAt: new Date().toISOString()}
    }));
  }, function(){
    if(!geoErrorShown){ geoErrorShown=true; toast("Position non partagée (accès refusé ou indisponible) — vos missions restent affichées normalement"); }
  }, {enableHighAccuracy:false, maximumAge:60000, timeout:20000});
}

// Notifications push chauffeur (ajouté 17/09/2026, demande de Colart : « donner une alerte sonore
// sur le téléphone du chauffeur quand je lui envoie sa mission du jour »). Repose sur Firebase Cloud
// Messaging : le chauffeur autorise les notifications une fois depuis son espace, son "jeton" FCM
// est alors écrit sur sa fiche (chauffeurs/{id}.fcmToken), et une Cloud Function côté serveur
// (notifierMission, déployée séparément — voir cloud-function-notifications/) envoie le push dès
// qu'une mission du jour lui est affectée, même téléphone verrouillé/appli fermée. Ce mécanisme
// dépend de deux éléments qui ne peuvent être remplis QUE par Colart (clé VAPID + fichier
// firebase-messaging-sw.js déployé à la racine du site) : tant qu'ils manquent, tout échoue
// proprement avec un message clair plutôt que de casser le reste de l'appli.
var fcmState = "idle"; // idle | unsupported | denied | granted | error
function fcmSupported(){
  return !!(window.isSecureContext && "serviceWorker" in navigator && "Notification" in window &&
    window.firebase && firebase.messaging && firebase.messaging.isSupported && firebase.messaging.isSupported());
}
function ensureFcmRegistered(showToast){
  if(!state.db || !state.driverId) return Promise.resolve();
  if(!FCM_VAPID_KEY || FCM_VAPID_KEY==="REMPLACER_VAPID_KEY"){
    fcmState = "error";
    if(showToast) toast("Notifications pas encore configurées par le gestionnaire — réessayez plus tard");
    renderRoot();
    return Promise.resolve();
  }
  if(!fcmSupported()){
    fcmState = "unsupported";
    if(showToast) toast("Notifications non disponibles sur cet appareil/navigateur");
    renderRoot();
    return Promise.resolve();
  }
  return navigator.serviceWorker.register("firebase-messaging-sw.js").then(function(reg){
    return Notification.requestPermission().then(function(perm){
      if(perm!=="granted"){
        fcmState = "denied";
        renderRoot();
        return;
      }
      var messaging = firebase.messaging();
      return messaging.getToken({vapidKey: FCM_VAPID_KEY, serviceWorkerRegistration: reg}).then(function(token){
        fcmState = "granted";
        wireFcmForegroundHandler();
        if(token){
          dbWrite(state.db.doc("chauffeurs/"+state.driverId).update({fcmToken: token, fcmTokenUpdatedAt: new Date().toISOString()}));
        }
        renderRoot();
      });
    });
  }).catch(function(e){
    console.error("Erreur activation notifications", e);
    fcmState = "error";
    if(showToast) toast("Impossible d'activer les notifications sur cet appareil");
    renderRoot();
  });
}
// Message reçu alors que l'appli est déjà ouverte au premier plan : Firebase n'affiche PAS de
// notification système dans ce cas (comportement standard des navigateurs, c'est le rôle du fichier
// firebase-messaging-sw.js quand l'appli est en arrière-plan/fermée) — on affiche donc nous-mêmes un
// toast + un petit son pour que le chauffeur s'en rende compte.
var fcmForegroundWired = false;
function wireFcmForegroundHandler(){
  if(fcmForegroundWired || !fcmSupported()) return;
  fcmForegroundWired = true;
  try{
    firebase.messaging().onMessage(function(payload){
      var titre = (payload.notification && payload.notification.title) || "Nouvelle mission";
      var corps = (payload.notification && payload.notification.body) || "";
      toast("🔔 "+titre+(corps? " — "+corps : ""));
      playNotificationSound();
    });
  } catch(e){}
}
function playNotificationSound(){
  try{
    var ctx = new (window.AudioContext||window.webkitAudioContext)();
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = 880; g.gain.value = 0.15;
    o.start();
    setTimeout(function(){ o.stop(); ctx.close(); }, 220);
  } catch(e){}
}
// Ligne de statut + bouton d'activation, affichée dans l'espace Chauffeur (voir renderDriverMissions).
function fcmStatusEl(){
  if(!fcmSupported()){
    return el('<div class="hint" style="margin-bottom:12px">🔕 Notifications de mission non disponibles sur cet appareil/navigateur.</div>');
  }
  var perm = (typeof Notification!=="undefined") ? Notification.permission : "denied";
  if(perm==="granted"){
    if(fcmState!=="granted"){ ensureFcmRegistered(false); } // rafraîchit le jeton silencieusement (déjà autorisé, pas de nouvelle demande)
    return el('<div class="hint" style="margin-bottom:12px">🔔 Notifications de mission activées.</div>');
  }
  if(perm==="denied"){
    return el('<div class="hint" style="margin-bottom:12px">🔕 Notifications refusées — activez-les dans les réglages de votre navigateur/téléphone pour être alerté(e) des nouvelles missions.</div>');
  }
  var row = el('<div style="margin-bottom:12px"><button type="button" class="btn sm primary" id="fcmActivateBtn">🔔 Activer les notifications de mission</button></div>');
  row.querySelector("#fcmActivateBtn").addEventListener("click", function(){ ensureFcmRegistered(true); });
  return row;
}

function byHeure(a,b){ return missionSortHeure(a).localeCompare(missionSortHeure(b)); }
