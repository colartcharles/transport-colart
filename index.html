              var baseName = (file.name||"demande").replace(/\.pdf$/i,"");
              return {name: baseName+" (page 1).jpg", type: "image/jpeg", size: dataUrlByteLength(res.dataUrl), dataUrl: res.dataUrl};
            }).catch(function(){ return null; });
          }
        } else {
          attachPromise = Promise.resolve(null);
        }
        return attachPromise.then(function(fichier){
          close();
          var extracted = data || {};
          extracted.__bcFichier = fichier;
          openDevisModal(null, null, null, extracted);
          if(fichier && pdfWasConverted){
            setTimeout(function(){ toast("PDF trop volumineux pour être joint tel quel — converti en image (1re page) et joint au devis"); }, 300);
          } else if(!fichier){
            setTimeout(function(){ toast("Le fichier de la demande n'a pas pu être joint automatiquement — joignez-le manuellement ci-dessous si besoin"); }, 300);
          }
        });
      }).catch(function(e){
        if(!e || e.handled) return;
        statusEl.textContent = "Erreur d'analyse : "+commandeErrorCopy(e.code)+(e.code? " ("+e.code+")":"");
        go.disabled = false;
      });
    });
    buttons.push(go);
    return buttons;
  });
}

// returnToMission (optionnel, demande de Colart 23/09/2026) : passer la mission d'origine quand ce
// devis est ouvert depuis sa fiche mission ("Ouvrir"/"Créer un devis" dans devisSummaryHtml), pour
// y revenir automatiquement en quittant ce devis (Enregistrer, Supprimer, croix ou clic en dehors)
// — au lieu de renvoyer Colart hors de sa mission. Laissé vide pour les autres points d'entrée
// (onglet Devis, planning...) qui doivent continuer à simplement fermer le devis.
// extracted (ajouté 01/10/2026, demande de Colart : import PDF/photo pour créer un devis, comme pour
// une mission) : données renvoyées par analyserCommandeIA() quand ce devis est ouvert depuis
// openImportDemandeDevisModal(), sans mission (ni existante, ni créée). Sert uniquement à pré-remplir
// le formulaire ci-dessous — à vérifier par Colart avant enregistrement, comme pour l'import mission.
function openDevisModal(mission, existingDevisId, returnToMission, extracted){
  var docId = existingDevisId || (mission? mission.id : uid());
  var existingDoc = state.devis.find(function(d){ return d.id===docId; }) || null;
  var hasExisting = !!existingDoc;
  var linkedMission = mission || (existingDoc && existingDoc.missionId? (state.missions.find(function(m){ return m.id===existingDoc.missionId; }) || null) : null);
  // Pré-remplissage adresse/email depuis la fiche client (correctif 17/09/2026) : quand un devis
  // est créé directement depuis une mission, clientNom est déjà connu (linkedMission.client) mais
  // jusqu'ici clientEmail/clientAdresse restaient vides tant que le gestionnaire ne re-sélectionnait
  // pas le client via l'auto-complétion (wireClientAutocomplete, seul endroit qui appelait
  // clientEmailFor). Résultat pour Colart : le champ Email du devis restait vide même si l'e-mail
  // était bien enregistré sur la fiche client. On retrouve ici la fiche client correspondante (même
  // logique que clientLabel utilisée ailleurs) pour pré-remplir dès la création du devis.
  var linkedClientObj = (linkedMission && linkedMission.client)?
    (state.clients.find(function(cc){ return clientLabel(cc)===linkedMission.client; }) || null) : null;
  // Pré-remplissage depuis une demande client importée (PDF/photo analysés par l'IA, voir
  // openImportDemandeDevisModal) : on construit un petit objet "façon mission" à partir des champs
  // extraits (adresses, date, marchandises...) uniquement pour réutiliser defaultDevisDetails — aucune
  // mission n'est créée ni requise ici. missionVehiculeSummary() gère sans problème l'absence de
  // vehiculeId/remorqueId (retourne simplement "—", ligne alors ignorée par defaultDevisDetails).
  var extractedDetailsShim = extracted? {
    adresseChargement: extracted.adresseChargement||"",
    chargementsSupp: Array.isArray(extracted.chargementsSupp)? extracted.chargementsSupp.filter(Boolean) : [],
    dateMission: extracted.dateMission||"",
    heureDebut: extracted.heureDebut||"",
    adresseLivraison: extracted.adresseLivraison||"",
    livraisonsSupp: Array.isArray(extracted.livraisonsSupp)? extracted.livraisonsSupp.filter(Boolean) : [],
    marchandises: extracted.marchandises||"",
    contacts: extracted.contacts||""
  } : null;
  var existing = existingDoc || (extracted? {
    statut: "brouillon",
    numero: nextDevisNumero(extracted.client||""),
    dateEmission: todayISO(),
    validiteJours: 30,
    clientNom: extracted.client||"",
    clientAdresse: extracted.clientAdresse||"",
    clientContact:"", clientTel: extracted.clientTel||"",
    clientEmail:"",
    objet: extracted.client? ("Transport pour "+extracted.client) : "",
    details: defaultDevisDetails(extractedDetailsShim),
    lignes: (Array.isArray(extracted.lignes)? extracted.lignes : []).map(function(l){
      return {
        designation: (l&&l.designation)||"",
        quantite: (l&&l.quantite!=null && l.quantite!=="")? l.quantite : null,
        unite: (l&&l.unite)||"",
        prixUnitaire: (l&&l.prixUnitaireHT!=null && l.prixUnitaireHT!=="")? l.prixUnitaireHT : null
      };
    }),
    noteForfait:"",
    conditionsGenerales: defaultConditionsGenerales(),
    numeroBonCommande: extracted.numeroCommande||"",
    dateBonCommande: extracted.dateCommande||"",
    montantBonCommande: (extracted.montantTTC!=null && extracted.montantTTC!=="")? extracted.montantTTC : "",
    notesBonCommande: "Demande client importée et analysée automatiquement"+(extracted.numeroCommande? (" (n°"+extracted.numeroCommande+")") : "")+" — vérifiez les lignes et montants avant envoi au client.",
    bonCommandeFichier: extracted.__bcFichier || null
  } : {
    statut:"brouillon",
    numero: nextDevisNumero(linkedMission? linkedMission.client : ""),
    dateEmission: todayISO(),
    validiteJours: 30,
    clientNom: linkedMission? linkedMission.client||"" : "",
    clientAdresse: linkedClientObj? clientAdresseComplete(linkedClientObj) : "",
    clientContact: linkedClientObj? clientContactFor(linkedClientObj, "devis") : "", clientTel:"",
    clientEmail: linkedClientObj? clientEmailFor(linkedClientObj, "devis") : "",
    objet: (linkedMission && linkedMission.client)? ("Transport pour "+linkedMission.client) : "",
    details: linkedMission? defaultDevisDetails(linkedMission) : [],
    lignes:[],
    noteForfait:"",
    conditionsGenerales: defaultConditionsGenerales(),
    numeroBonCommande:"", dateBonCommande:"", montantBonCommande:"", notesBonCommande:""
  });
  // Repli identique pour un devis DÉJÀ existant (correctif 17/09/2026) : si le document stocké a un
  // clientEmail/clientAdresse vide (devis créé avant ce correctif, ou créé sans passer par
  // l'auto-complétion), on affiche quand même l'e-mail/l'adresse de la fiche client au lieu d'un
  // champ vide — sans modifier le document tant que le gestionnaire n'enregistre pas le devis.
  var dvDisplayAdresse = existing.clientAdresse || (linkedClientObj? clientAdresseComplete(linkedClientObj) : "");
  var dvDisplayEmail = existing.clientEmail || (linkedClientObj? clientEmailFor(linkedClientObj, "devis") : "");
  var missionInfoHtml = linkedMission?
    ('<div class="hint" style="margin-bottom:10px">Lié à la mission « '+escapeHtml(linkedMission.client||"")+' »'+(linkedMission.dateMission? " du "+escapeHtml(fmtDateFR(linkedMission.dateMission)):"")+'.</div>') :
    (extracted?
      '<div class="hint" style="margin-bottom:10px">Devis pré-rempli automatiquement à partir de la demande importée — vérifiez toutes les informations avant d\'enregistrer.</div>' :
      '<div class="hint" style="margin-bottom:10px">Devis libre, créé depuis l\'onglet Devis — pas encore lié à une mission. Vous pourrez créer la mission correspondante une fois le devis accepté.</div>');
  var body =
    missionInfoHtml+
    '<div class="field"><label>Statut du devis</label><select id="dv_statut">'+
      DEVIS_STATUTS.map(function(s){ return '<option value="'+s.key+'" '+(existing.statut===s.key?"selected":"")+'>'+s.label+'</option>'; }).join("")+
    '</select></div>'+
    '<div class="field-row">'+
      '<div class="field"><label>N° de devis</label><input id="dv_numero" value="'+escapeHtml(existing.numero||"")+'"/></div>'+
      '<div class="field"><label>Date d\'émission</label><input type="date" id="dv_dateEmission" value="'+escapeHtml(existing.dateEmission||todayISO())+'"/></div>'+
    '</div>'+
    '<div class="field"><label>Validité de l\'offre (jours)</label><input type="number" id="dv_validite" value="'+(existing.validiteJours!=null?existing.validiteJours:30)+'" style="max-width:120px"/></div>'+
    '<div class="section-title" style="margin-top:4px">Client</div>'+
    '<div class="field"><label>Nom du client</label><input id="dv_clientNom" value="'+escapeHtml(existing.clientNom||(linkedMission&&linkedMission.client)||"")+'"/></div>'+
    '<div class="field"><label>Adresse</label><input id="dv_clientAdresse" value="'+escapeHtml(dvDisplayAdresse)+'"/></div>'+
    '<div class="field-row">'+
      '<div class="field"><label>Contact (nom, fonction)</label><input id="dv_clientContact" value="'+escapeHtml(existing.clientContact||"")+'" placeholder="Ex: Yoann Bobeuf, Responsable d\'exploitation"/></div>'+
      '<div class="field"><label>Téléphone</label><input id="dv_clientTel" value="'+escapeHtml(existing.clientTel||"")+'"/></div>'+
    '</div>'+
    '<div class="field"><label>Email</label><input id="dv_clientEmail" type="email" multiple value="'+escapeHtml(dvDisplayEmail)+'"/></div>'+
    '<div id="dv_emailPicker"></div>'+
    '<div class="field"><label>Objet</label><input id="dv_objet" value="'+escapeHtml(existing.objet||"")+'"/></div>'+
    '<div class="field"><label>Détails de la prestation (site, dates, marchandise, moyen affecté…)</label>'+
      '<div id="devisDetails"></div>'+
      '<button type="button" class="btn sm" id="btnAddDetail">+ Ajouter une ligne de détail</button>'+
    '</div>'+
    '<div class="field"><label>Détail de la prestation — lignes chiffrées</label>'+
      '<div class="devis-presetbar"><select id="dv_preset">'+
        devisPresetsOptions().map(function(p,i){ return '<option value="'+i+'">'+escapeHtml(p.label)+'</option>'; }).join("")+
      '</select><button type="button" class="btn sm" id="btnAddPreset">+ Insérer</button></div>'+
      '<div id="devisLines"></div>'+
      '<button type="button" class="btn sm" id="btnAddLine">+ Ligne libre</button>'+
    '</div>'+
    '<div class="field" style="max-width:260px"><label>Taux de TVA</label><select id="dv_tauxTva">'+
      '<option value="20" '+((existing.tauxTVA!=null?existing.tauxTVA:20)===20?"selected":"")+'>20 %</option>'+
      '<option value="0" '+((existing.tauxTVA!=null?existing.tauxTVA:20)===0?"selected":"")+'>0 % (client facturé hors TVA)</option>'+
    '</select><div class="hint">En 0 %, pensez à ajouter la mention légale d\'exonération dans les Conditions générales ci-dessous.</div></div>'+
    '<div class="devis-total-box" id="devisTotalDisplay"></div>'+
    '<div class="field"><label>Note explicative (facultatif — ex: conditions du forfait)</label><textarea id="dv_note" placeholder="Ex : Forfait de X € HT incluant 1/2h de chargement et 1/2h de déchargement. Au-delà, toute heure supplémentaire est facturée…">'+escapeHtml(existing.noteForfait||"")+'</textarea></div>'+
    '<div class="field"><label>Conditions générales (une ligne = une puce)</label><textarea id="dv_conditions" style="min-height:110px">'+escapeHtml(existing.conditionsGenerales||"")+'</textarea></div>'+
    '<div class="section-title">Bon de commande client</div>'+
    '<div class="field"><label>Fichier du bon de commande (PDF ou photo)</label><div id="bcFileZone"></div></div>'+
    '<div class="field-row">'+
      '<div class="field"><label>N° de bon de commande</label><input id="dv_numBc" value="'+escapeHtml(existing.numeroBonCommande||"")+'"/></div>'+
      '<div class="field"><label>Date du bon de commande</label><input type="date" id="dv_dateBc" value="'+escapeHtml(existing.dateBonCommande||"")+'"/></div>'+
    '</div>'+
    '<div class="field"><label>Montant du bon de commande (si différent du total devis)</label><input id="dv_montantBc" type="number" step="0.01" value="'+escapeHtml(existing.montantBonCommande||"")+'"/></div>'+
    '<div class="field"><label>Notes / classement du bon de commande</label><textarea id="dv_notes" placeholder="Où trouver le document (email, dossier partagé…)">'+escapeHtml(existing.notesBonCommande||"")+'</textarea></div>';

  var titleClient = existing.clientNom || (linkedMission&&linkedMission.client) || "";
  openModal(hasExisting? "Devis — "+titleClient : (titleClient? "Nouveau devis — "+titleClient : "Nouveau devis"), body, function(modal, close){
    var linesContainer = modal.querySelector("#devisLines");
    var detailsContainer = modal.querySelector("#devisDetails");
    var bcAttachment = wireAttachmentZone(modal.querySelector("#bcFileZone"), existing.bonCommandeFichier||null, "application/pdf,image/png,image/jpeg,image/webp,image/gif", function(){});
    // Numéro automatique : tant que le numéro n'a pas été modifié à la main, il suit le nom du
    // client saisi (sinon il restait sur "CLI" — voir nextDevisNumero).
    var lastAutoNumero = hasExisting? null : modal.querySelector("#dv_numero").value;
    function refreshAutoNumero(){
      if(hasExisting || lastAutoNumero===null) return;
      var numEl = modal.querySelector("#dv_numero");
      if(numEl.value !== lastAutoNumero) return; // modifié à la main : on n'y touche plus
      var fresh = nextDevisNumero(modal.querySelector("#dv_clientNom").value, docId);
      numEl.value = fresh; lastAutoNumero = fresh;
    }
    // Plusieurs e-mails pour ce client : cases à cocher pour choisir le(s) destinataire(s) du devis.
    function refreshEmailPicker(clientObj){
      wireClientEmailPicker(modal.querySelector("#dv_emailPicker"), modal.querySelector("#dv_clientEmail"), clientObj, "devis", modal.querySelector("#dv_clientContact"));
    }
    refreshEmailPicker(linkedClientObj || (state.clients.find(function(cc){ return clientLabel(cc)===(existing.clientNom||""); }) || null));
    modal.querySelector("#dv_clientNom").addEventListener("input", refreshAutoNumero);
    wireClientAutocomplete(modal.querySelector("#dv_clientNom"), function(c){
      setTimeout(refreshAutoNumero, 0);
      var adrEl = modal.querySelector("#dv_clientAdresse");
      if(adrEl && !adrEl.value) adrEl.value = clientAdresseComplete(c);
      var mailEl = modal.querySelector("#dv_clientEmail");
      if(mailEl && !mailEl.value){ var suggEmail = clientEmailFor(c, "devis"); if(suggEmail) mailEl.value = suggEmail; }
      var ctEl = modal.querySelector("#dv_clientContact");
      if(ctEl && !ctEl.value){ var suggContact = clientContactFor(c, "devis"); if(suggContact) ctEl.value = suggContact; }
      refreshEmailPicker(c);
    });

    function wireLineRemove(){
      linesContainer.querySelectorAll(".dl-remove").forEach(function(btn){
        btn.onclick = function(){ btn.closest(".devis-line-row").remove(); recalc(); };
      });
    }
    function wireDetailRemove(){
      detailsContainer.querySelectorAll(".dk-remove").forEach(function(btn){
        btn.onclick = function(){ btn.closest(".devis-kv-row").remove(); };
      });
    }
    function recalc(){
      var ht = 0;
      linesContainer.querySelectorAll(".devis-line-row").forEach(function(row){
        var qStr = row.querySelector(".dl-qte").value;
        var pStr = row.querySelector(".dl-prix").value;
        var montantEl = row.querySelector(".dl-montant");
        if(qStr==="" || pStr===""){
          montantEl.value = "au réel";
        } else {
          var m = (parseFloat(qStr)||0)*(parseFloat(pStr)||0);
          montantEl.value = fmtEUR(m);
          ht += m;
        }
      });
      var taux = parseFloat(modal.querySelector("#dv_tauxTva").value)||0;
      var tva = ht*(taux/100), ttc = ht+tva;
      modal.querySelector("#devisTotalDisplay").innerHTML =
        '<div class="dt-row"><span>Total HT</span><span>'+fmtEUR(ht)+'</span></div>'+
        '<div class="dt-row"><span>TVA ('+taux+' %)</span><span>'+fmtEUR(tva)+'</span></div>'+
        '<div class="dt-row dt-ttc"><span>Total TTC</span><span>'+fmtEUR(ttc)+'</span></div>';
    }
    var initialLines = (existing.lignes && existing.lignes.length)? existing.lignes : [];
    initialLines.forEach(function(l){ linesContainer.appendChild(el(devisLineRowHtml(l))); });
    wireLineRemove(); recalc();
    modal.querySelector("#dv_tauxTva").addEventListener("change", recalc);
    linesContainer.addEventListener("input", recalc);
    modal.querySelector("#btnAddLine").addEventListener("click", function(){
      linesContainer.appendChild(el(devisLineRowHtml({})));
      wireLineRemove(); recalc();
    });
    modal.querySelector("#btnAddPreset").addEventListener("click", function(){
      var idx = parseInt(modal.querySelector("#dv_preset").value, 10);
      var p = devisPresetsOptions()[idx];
      if(!p) return;
      linesContainer.appendChild(el(devisLineRowHtml({designation:p.designation, unite:p.unite, quantite:p.quantite, prixUnitaire:p.prix})));
      wireLineRemove(); recalc();
    });

    var initialDetails = (existing.details && existing.details.length)? existing.details : [];
    initialDetails.forEach(function(r){ detailsContainer.appendChild(el(devisDetailRowHtml(r))); });
    wireDetailRemove();
    modal.querySelector("#btnAddDetail").addEventListener("click", function(){
      detailsContainer.appendChild(el(devisDetailRowHtml({})));
      wireDetailRemove();
    });

    function collectData(){
      var lignes = [];
      linesContainer.querySelectorAll(".devis-line-row").forEach(function(row){
        var designation = row.querySelector(".dl-libelle").value.trim();
        var qte = row.querySelector(".dl-qte").value;
        var unite = row.querySelector(".dl-unite").value.trim();
        var prix = row.querySelector(".dl-prix").value;
        if(!designation && qte==="" && prix==="" && !unite) return;
        lignes.push({designation: designation, quantite: qte===""?null:parseFloat(qte), unite: unite, prixUnitaire: prix===""?null:parseFloat(prix)});
      });
      var details = [];
      detailsContainer.querySelectorAll(".devis-kv-row").forEach(function(row){
        var label = row.querySelector(".dk-label").value.trim();
        var value = row.querySelector(".dk-value").value.trim();
        if(!label && !value) return;
        details.push({label: label, value: value});
      });
      return {
        missionId: linkedMission? linkedMission.id : ((existingDoc && existingDoc.missionId) || null),
        statut: modal.querySelector("#dv_statut").value,
        numero: modal.querySelector("#dv_numero").value.trim(),
        dateEmission: modal.querySelector("#dv_dateEmission").value,
        validiteJours: parseInt(modal.querySelector("#dv_validite").value, 10) || 30,
        clientNom: modal.querySelector("#dv_clientNom").value.trim(),
        clientAdresse: modal.querySelector("#dv_clientAdresse").value.trim(),
        clientContact: modal.querySelector("#dv_clientContact").value.trim(),
        clientTel: modal.querySelector("#dv_clientTel").value.trim(),
        clientEmail: modal.querySelector("#dv_clientEmail").value.trim(),
        objet: modal.querySelector("#dv_objet").value.trim(),
        tauxTVA: parseFloat(modal.querySelector("#dv_tauxTva").value)||0,
        details: details,
        lignes: lignes,
        noteForfait: modal.querySelector("#dv_note").value.trim(),
        conditionsGenerales: modal.querySelector("#dv_conditions").value,
        numeroBonCommande: modal.querySelector("#dv_numBc").value.trim(),
        dateBonCommande: modal.querySelector("#dv_dateBc").value,
        montantBonCommande: modal.querySelector("#dv_montantBc").value.trim(),
        notesBonCommande: modal.querySelector("#dv_notes").value.trim(),
        bonCommandeFichier: bcAttachment.getValue(),
        createdAt: hasExisting? (existingDoc.createdAt || new Date().toISOString()) : new Date().toISOString(),
        updatedAt: new Date().toISOString()
      };
    }

    var buttons = [];
    if(hasExisting){
      var del = el('<button class="btn danger">Supprimer le devis</button>');
      del.addEventListener("click", function(){
        if(!state.db) return;
        confirmAction("Supprimer ce devis ?", function(){
          // On attend que la suppression soit bien passée avant de fermer (et donc de rouvrir la
          // mission via onClose) pour que celle-ci ne réaffiche pas un devis déjà supprimé.
          var p = state.db.doc("devis/"+docId).delete();
          dbWrite(p, "Devis supprimé");
          p.then(close, close);
        });
      });
      buttons.push(del);
    }
    // Bouton "Créer la mission" (demande de Colart, 23/09/2026) : uniquement pour un devis pas
    // encore lié à une mission — une fois la mission créée, ce devis lui est automatiquement
    // rattaché (voir la branche fromDevis dans openMissionModal) et ce bouton disparaît de lui-même
    // puisque linkedMission ne sera alors plus vide.
    if(!linkedMission && hasExisting){
      var creerMission = el('<button type="button" class="btn">🚀 Créer la mission</button>');
      creerMission.addEventListener("click", function(){
        close();
        openMissionModal(null, null, null, null, null, null, null, existingDoc);
      });
      buttons.push(creerMission);
    }
    // Enregistrement commun (correctif 05/10/2026) : « Aperçu / Imprimer » et « Envoyer par e-mail »
    // enregistrent d'abord le devis — avant, un PDF pouvait être généré/envoyé sans que le devis
    // n'existe dans l'appli (donc introuvable ensuite dans la liste). Renvoie les données
    // enregistrées, ou null si l'enregistrement est impossible. L'écriture est lancée sans attendre
    // sa réponse, pour ne pas bloquer l'ouverture de l'aperçu (fenêtre popup).
    var savedOnce = false;
    function saveDevisNow(silent){
      var data = collectData();
      if(!state.db){ toast("Base de données indisponible"); return null; }
      if(JSON.stringify(data).length > 250*1024){
        toast("Devis trop volumineux à enregistrer (pièce jointe trop lourde) — retirez le fichier ou joignez une version plus légère");
        return null;
      }
      // Numéro unique : si un autre devis porte déjà ce numéro, on en prend un libre.
      if(data.numero){
        var uniq = uniqueDevisNumero(data.numero, docId);
        if(uniq !== data.numero){
          toast("Le numéro "+data.numero+" existe déjà — ce devis devient "+uniq);
          data.numero = uniq;
          modal.querySelector("#dv_numero").value = uniq;
        }
      }
      var p = state.db.doc("devis/"+docId).set(data);
      dbWrite(p, silent? null : (hasExisting||savedOnce? "Devis mis à jour" : "Devis créé"));
      savedOnce = true;
      return { data: data, promise: p };
    }
    var preview = el('<button type="button" class="btn">Aperçu / Imprimer</button>');
    preview.addEventListener("click", function(){
      var r = saveDevisNow(true);
      if(!r) return;
      openDevisPrintView(linkedMission, r.data);
    });
    buttons.push(preview);
    // Envoi par e-mail (ajouté 09/09/2026, envoi automatique + pièce jointe PDF ajoutés 17/09/2026
    // à la demande de Colart) : génère le PDF du devis et l'envoie réellement via
    // sendDevisEmailAuto() (extension Firebase "Trigger Email" — voir le commentaire au-dessus de
    // sa définition). Si l'envoi automatique échoue ou n'est pas encore configuré côté Firebase,
    // bascule seule vers le filet de sécurité copier-coller (openMailInfoModal).
    var sendMail = el('<button type="button" class="btn">✉️ Envoyer par e-mail</button>');
    sendMail.addEventListener("click", function(){
      var mailCheck = (modal.querySelector("#dv_clientEmail").value||"").trim();
      if(!mailCheck){ toast("Renseignez d'abord l'e-mail du client (champ E-mail ci-dessus, ou dans sa fiche client)"); return; }
      var r = saveDevisNow(true);
      if(!r) return;
      var data = r.data;

/* ================= Envoi automatique des devis par e-mail (ajouté 17/09/2026) =================
   Demande de Colart : que "Envoyer par e-mail" envoie réellement le message (devis en pièce
   jointe), au lieu d'ouvrir sa messagerie / lui faire copier-coller le texte à la main.

   Comme l'application est un simple fichier HTML statique (hébergé sur GitHub Pages), elle ne peut
   pas envoyer d'e-mail elle-même : il faut un service côté serveur. On utilise l'extension
   officielle Firebase "Trigger Email from Firestore" : elle surveille une collection Firestore
   (ici "mail") et envoie automatiquement un e-mail (avec pièces jointes en base64, format
   Nodemailer) dès qu'un document y est ajouté, via les identifiants SMTP configurés à
   l'installation de l'extension (voir guide fourni à Colart — compte gratuit Brevo conseillé).
   Tant que cette extension n'est pas installée/configurée dans la Console Firebase, ces documents
   restent simplement en attente : le filet de secours "copier-coller" (openMailInfoModal) prend
   alors le relais automatiquement après un court délai, donc rien n'est bloqué en attendant.

   1) buildDevisPdfBase64(mission, d) : génère le PDF du devis (même rendu que "Aperçu / Imprimer",
      capturé via html2canvas puis assemblé en PDF via jsPDF, découpé en plusieurs pages si le
      devis est long) et le renvoie encodé en base64 (Promise).
   2) sendDevisEmailAuto(mail, subject, body, items) : items = [{mission, devis}, ...] (un seul élément
      pour un devis seul, plusieurs pour l'envoi groupé) — génère un PDF par devis, écrit le
      document "mail" attendu par l'extension, puis suit son statut de livraison (delivery.state)
      pour informer Colart (succès / échec / bascule automatique vers le copier-coller).
      Si le total des PDF dépasse la limite de taille d'un document Firestore (~1 Mo), les devis
      sont automatiquement répartis en plusieurs e-mails séparés (chacun sous la limite) plutôt que
      d'abandonner l'envoi automatique — ajouté le 17/09/2026 suite à un envoi groupé de 3 devis
      (SOTEM) tombé en secours copier-coller car les PDF cumulés dépassaient le seuil de sécurité. */
function chunkAttachedItemsBySize(attachedItems, maxBytes){
  var chunks = [], current = [], currentBytes = 0;
  attachedItems.forEach(function(ai){
    var sz = (ai.attachment && ai.attachment.content)? ai.attachment.content.length : 0;
    if(current.length && (currentBytes + sz) > maxBytes){
      chunks.push(current);
      current = [];
      currentBytes = 0;
    }
    current.push(ai);
    currentBytes += sz;
  });
  if(current.length) chunks.push(current);
  return chunks;
}
function sendMailChunk(mail, subject, body, attachedItems, chunkIndex, totalChunks, nounSing, nounPlur){
  nounSing = nounSing || "le devis"; nounPlur = nounPlur || "les devis";
  var attachments = attachedItems.map(function(ai){ return ai.attachment; });
  var chunkLabel = totalChunks>1? " ("+chunkIndex+"/"+totalChunks+")" : "";
  var mailDoc = { to: splitEmails(mail), message: { subject: subject, text: body, attachments: attachments }, createdAt: new Date().toISOString() };
  state.db.collection("mail").add(mailDoc).then(function(ref){
    toast("E-mail"+chunkLabel+" en cours d'envoi à "+mail+"…");
    var settled = false;
    var unsub = ref.onSnapshot(function(snap){
      if(settled || !snap.exists) return;
      var data = snap.data() || {};
      var delivery = data.delivery;
      if(!delivery || !delivery.state) return;
      if(delivery.state === "SUCCESS"){
        settled = true;
        toast("E-mail"+chunkLabel+" envoyé avec "+(attachments.length>1? nounPlur+" en pièces jointes" : nounSing+" en pièce jointe")+" à "+mail);
        if(unsub) unsub();
      } else if(delivery.state === "ERROR"){
        settled = true;
        toast("Échec de l'envoi automatique"+chunkLabel+" ("+(delivery.error||"erreur inconnue")+") — voici les infos à copier à la place");
        openMailInfoModal(mail, subject, body);
        if(unsub) unsub();
      }
    });
    setTimeout(function(){
      if(settled) return;
      settled = true;
      if(unsub) unsub();
      toast("Envoi"+chunkLabel+" en cours (peut prendre un instant) — si rien ne se passe, vérifiez que l'envoi automatique est bien configuré dans Firebase. Voici les infos à copier en attendant :");
      openMailInfoModal(mail, subject, body);
    }, 20000);
  }).catch(function(err){
    toast("Impossible d'enregistrer l'e-mail"+chunkLabel+" à envoyer ("+(err&&err.message?err.message:"erreur")+")");
    openMailInfoModal(mail, subject, body);
  });
}

// Génère un PDF A4 (base64) à partir d'un fragment HTML de document (devis, facture…).
var _pdfLibsPromise = null;
function loadScriptOnce(src){
  return new Promise(function(resolve, reject){
    var sc = document.createElement("script");
    sc.src = src; sc.async = true;
    sc.onload = function(){ resolve(); };
    sc.onerror = function(){ reject(new Error("load_failed")); };
    document.head.appendChild(sc);
  });
}
// Charge html2canvas + jsPDF à la première utilisation (et en tâche de fond côté gestionnaire) plutôt
// qu'à chaque ouverture de l'appli — demande de Colart, 30/10/2026 (ouverture trop lente).
function loadPdfLibs(){
  if(typeof html2canvas !== "undefined" && window.jspdf && window.jspdf.jsPDF) return Promise.resolve();
  if(!_pdfLibsPromise){
    _pdfLibsPromise = Promise.all([
      loadScriptOnce("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"),
      loadScriptOnce("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js")
    ]).catch(function(e){ _pdfLibsPromise = null; throw e; });
  }
  return _pdfLibsPromise;
}
function buildHtmlPdfBase64(html){
  return loadPdfLibs().catch(function(){
    throw new Error("Bibliothèque de génération PDF non disponible (vérifiez la connexion internet)");
  }).then(function(){ return buildHtmlPdfBase64Now(html); });
}
function buildHtmlPdfBase64Now(html){
  return new Promise(function(resolve, reject){
    if(typeof html2canvas === "undefined" || !window.jspdf || !window.jspdf.jsPDF){
      reject(new Error("Bibliothèque de génération PDF non disponible (vérifiez la connexion internet)"));
      return;
    }
    var offscreen = document.createElement("div");
    offscreen.style.position = "fixed";
    offscreen.style.left = "-99999px";
    offscreen.style.top = "0";
    offscreen.style.width = "800px";
    offscreen.style.background = "#fff";
    offscreen.innerHTML = html;
    document.body.appendChild(offscreen);
    html2canvas(offscreen, { scale: 2, useCORS: true, backgroundColor: "#ffffff" }).then(function(canvas){
      try{ document.body.removeChild(offscreen); }catch(e){}
      try{
        var jsPDFCtor = window.jspdf.jsPDF;
        var pdf = new jsPDFCtor({ unit: "mm", format: "a4" });
        var pageWidthMm = pdf.internal.pageSize.getWidth();
        var pageHeightMm = pdf.internal.pageSize.getHeight();
        var pxPerMm = canvas.width / pageWidthMm;
        var pageHeightPx = Math.max(1, Math.floor(pageHeightMm * pxPerMm));
        var renderedPx = 0, pageIndex = 0;
        while(renderedPx < canvas.height){
          var sliceHeightPx = Math.min(pageHeightPx, canvas.height - renderedPx);
          var pageCanvas = document.createElement("canvas");
          pageCanvas.width = canvas.width;
          pageCanvas.height = sliceHeightPx;
          pageCanvas.getContext("2d").drawImage(canvas, 0, renderedPx, canvas.width, sliceHeightPx, 0, 0, canvas.width, sliceHeightPx);
          var sliceHeightMm = sliceHeightPx / pxPerMm;
          if(pageIndex > 0) pdf.addPage();
          pdf.addImage(pageCanvas.toDataURL("image/jpeg", 0.92), "JPEG", 0, 0, pageWidthMm, sliceHeightMm);
          renderedPx += sliceHeightPx;
          pageIndex++;
        }
        resolve(pdf.output("datauristring").split(",")[1]);
      } catch(e){ reject(e); }
    }).catch(function(e){
      try{ document.body.removeChild(offscreen); }catch(e2){}
      reject(e);
    });
  });
}

function sendFactureEmailAuto(mail, subject, body, f){
  var estAvoir = (f.type||"facture")==="avoir";
  toast("Génération du PDF "+(estAvoir? "de l'avoir" : "de la facture")+"…");
  var filename = (estAvoir? "Avoir" : "Facture")+(f.numero? ("-"+String(f.numero).replace(/[^A-Za-z0-9_-]/g,"_")) : "")+".pdf";
  buildHtmlPdfBase64(renderFactureDocHtml(f)).then(function(base64){
    if(!state.db){ toast("Base de données indisponible"); openMailInfoModal(mail, subject, body); return; }
    var attached = [{ item: f, attachment: { filename: filename, content: base64, encoding: "base64" } }];
    if(!estAvoir) attached.push({ item: null, attachment: { filename: RIB_PDF_FILENAME, content: RIB_PDF_BASE64, encoding: "base64" } });
    sendMailChunk(mail, subject, body, attached, 1, 1,
      estAvoir? "l'avoir" : "la facture et le RIB", estAvoir? "les avoirs" : "la facture et le RIB");
  }).catch(function(err){
    toast("Impossible de générer le PDF ("+(err&&err.message?err.message:"erreur")+") — voici les infos à copier, pensez à joindre le PDF manuellement");
    openMailInfoModal(mail, subject, body);
  });
}
function sendDevisEmailAuto(mail, subject, body, items){
  toast(items.length>1? "Génération des PDF des devis…" : "Génération du PDF du devis…");
  Promise.all(items.map(function(item){
    var filename = "Devis"+(item.devis.numero? ("-"+String(item.devis.numero).replace(/[^A-Za-z0-9_-]/g,"_")) : "")+".pdf";
    return buildDevisPdfBase64(item.mission, item.devis).then(function(base64){
      return { item: item, attachment: { filename: filename, content: base64, encoding: "base64" } };
    });
  })).then(function(attachedItems){
    if(!state.db){ toast("Base de données indisponible"); openMailInfoModal(mail, subject, body); return; }
    var MAX_BYTES = 700000;
    var chunks = chunkAttachedItemsBySize(attachedItems, MAX_BYTES);
    if(chunks.length <= 1){
      sendMailChunk(mail, subject, body, attachedItems, 1, 1);
      return;
    }
    // Les PDF cumulés dépassent la limite de taille d'un document Firestore : on répartit
    // automatiquement les devis en plusieurs e-mails séparés (chacun sous le seuil), sans action
    // requise de la part de Colart — voir note du 17/09/2026 ci-dessus.
    toast("Les devis sont volumineux : envoi automatique réparti en "+chunks.length+" e-mails séparés…");
    chunks.forEach(function(chunk, idx){
      var chunkSubject = subject+" ("+(idx+1)+"/"+chunks.length+")";
      var chunkNumeros = chunk.map(function(ai){ return ai.item.devis.numero || "?"; }).join(", ");
      var chunkBody = "(Envoi "+(idx+1)+" sur "+chunks.length+" — cet e-mail contient les devis suivants en pièce(s) jointe(s) : "+chunkNumeros+")\n\n"+body;
      sendMailChunk(mail, chunkSubject, chunkBody, chunk, idx+1, chunks.length);
    });
  }).catch(function(err){
    toast("Impossible de générer le PDF ("+(err&&err.message?err.message:"erreur")+") — voici les infos à copier, pensez à joindre le PDF manuellement");
    openMailInfoModal(mail, subject, body);
  });
}

/* ================= Generic modal ================= */
// onClose (optionnel, demande de Colart 23/09/2026) : appelé une fois le modal effectivement fermé,
// quelle que soit la façon dont il l'a été (bouton Enregistrer/Supprimer, croix, clic hors modal).
// Sert par exemple à rouvrir automatiquement la mission d'origine quand on a ouvert son devis
// depuis la fiche mission (voir openDevisModal) — sans ça, enregistrer le devis renvoyait Colart
// tout à fait en dehors de sa mission au lieu de l'y ramener.
function openModal(title, bodyHtml, buttonsBuilder, onClose){
  var root = document.getElementById("modalRoot");
  root.innerHTML = "";
  var backdrop = el('<div class="modal-backdrop"></div>');
  var modal = el(
    '<div class="modal">'+
      '<div class="modal-hd"><h3>'+escapeHtml(title)+'</h3><button class="close-x">✕</button></div>'+
      '<div class="modal-bd">'+bodyHtml+'</div>'+
      '<div class="modal-ft"></div>'+
    '</div>'
  );
  backdrop.appendChild(modal);
  root.appendChild(backdrop);
  var closed = false;
  function close(){ if(closed) return; closed = true; root.innerHTML = ""; if(onClose) onClose(); }
  modal.querySelector(".close-x").addEventListener("click", close);
  backdrop.addEventListener("click", function(e){ if(e.target===backdrop) close(); });
  var ft = modal.querySelector(".modal-ft");
  var btns = buttonsBuilder ? buttonsBuilder(modal, close) : [];
  btns.forEach(function(b){ ft.appendChild(b); });
  return {modal:modal, close:close};
}

// Remplace window.confirm() : les pages publiées en Artifact tournent dans un iframe sandboxé qui
// bloque (ou ignore silencieusement) les boîtes de dialogue natives confirm()/alert()/prompt() —
// c'était la cause du bug "je ne peux pas supprimer les missions" (et véhicules/chauffeurs/devis/
// factures/refus de mission) signalé par Colart le 09/09/2026 : le clic ne provoquait jamais la
// suppression car confirm() ne rendait jamais `true`. Cette boîte de dialogue maison, superposée
// à document.body (donc au-dessus d'un modal déjà ouvert sans le fermer), la remplace partout.
function confirmAction(message, onConfirm){
  var overlay = el(
    '<div class="modal-backdrop" style="z-index:300">'+
      '<div class="modal" style="max-width:420px">'+
        '<div class="modal-hd"><h3>Confirmation</h3><button class="close-x">✕</button></div>'+
        '<div class="modal-bd"><div style="font-size:14px">'+escapeHtml(message)+'</div></div>'+
        '<div class="modal-ft"></div>'+
      '</div>'+
    '</div>'
  );
  document.body.appendChild(overlay);
  function close(){ overlay.remove(); }
  overlay.querySelector(".close-x").addEventListener("click", close);
  overlay.addEventListener("click", function(e){ if(e.target===overlay) close(); });
  var ft2 = overlay.querySelector(".modal-ft");
  var cancelBtn = el('<button type="button" class="btn">Annuler</button>');
  cancelBtn.addEventListener("click", close);
  var okBtn = el('<button type="button" class="btn danger">Confirmer</button>');
  okBtn.addEventListener("click", function(){ close(); onConfirm(); });
  ft2.appendChild(cancelBtn); ft2.appendChild(okBtn);
}

// Filet de sécurité pour l'envoi de devis par e-mail (ajouté 17/09/2026, bug signalé par Colart :
// le lien mailto: ne fait rien de visible sur son poste — pas de messagerie par défaut configurée
// dans le navigateur/l'OS, ce qui est un réglage propre à chaque ordinateur et pas quelque chose
// que l'appli peut détecter ni corriger). En plus de tenter mailto: comme avant, on affiche
// systématiquement ces infos prêtes à copier-coller dans un nouveau message, pour que l'envoi
// fonctionne même quand mailto: ne déclenche rien. Superposée à document.body comme confirmAction()
// ci-dessus (pas openModal(), qui fermerait le devis déjà ouvert en partageant le même #modalRoot).
function openMailInfoModal(mail, subject, body){
  var fullText = "À : "+mail+"\nObjet : "+subject+"\n\n"+body;
  var overlay = el(
    '<div class="modal-backdrop" style="z-index:300">'+
      '<div class="modal" style="max-width:520px">'+
        '<div class="modal-hd"><h3>Infos du mail à copier</h3><button class="close-x">✕</button></div>'+
        '<div class="modal-bd">'+
          '<div class="hint" style="margin-bottom:10px">Si votre messagerie ne s\'est pas ouverte automatiquement : copiez ce texte (bouton ci-dessous, ou sélectionnez puis Ctrl+C) et collez-le dans un nouveau message de votre boîte mail habituelle.</div>'+
          '<textarea id="mailInfoText" readonly style="width:100%;min-height:180px;font-family:inherit;font-size:13px;padding:8px;border:1px solid #ccc;border-radius:6px;box-sizing:border-box;">'+escapeHtml(fullText)+'</textarea>'+
        '</div>'+
        '<div class="modal-ft"></div>'+
      '</div>'+
    '</div>'
  );
  document.body.appendChild(overlay);
  function close(){ overlay.remove(); }
  overlay.querySelector(".close-x").addEventListener("click", close);
  overlay.addEventListener("click", function(e){ if(e.target===overlay) close(); });
  var ta = overlay.querySelector("#mailInfoText");
  setTimeout(function(){ ta.focus(); ta.select(); }, 50);
  var ft3 = overlay.querySelector(".modal-ft");
  var copyBtn = el('<button type="button" class="btn primary">📋 Copier</button>');
  copyBtn.addEventListener("click", function(){
    ta.focus(); ta.select();
    function fallbackCopy(){
      try{ document.execCommand("copy"); toast("Copié — collez-le (Ctrl+V) dans un nouveau message"); }
      catch(e){ toast("Sélectionnez le texte ci-dessus puis Ctrl+C"); }
    }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(fullText).then(function(){ toast("Copié — collez-le (Ctrl+V) dans un nouveau message"); }).catch(fallbackCopy);
    } else { fallbackCopy(); }
  });
  var closeBtn = el('<button type="button" class="btn">Fermer</button>');
  closeBtn.addEventListener("click", close);
  ft3.appendChild(copyBtn); ft3.appendChild(closeBtn);
}

function renderDriverPicker(){
  var wrap = el(
    '<div class="driver-picker">'+
      '<h2>Bonjour 👋</h2>'+
      '<p>Sélectionnez votre nom pour voir vos missions</p>'+
      '<select class="big" id="driverSelect"><option value="">— Choisir —</option>'+
        state.chauffeurs.filter(function(c){return c.actif;}).map(function(c){ return '<option value="'+c.id+'">'+escapeHtml(c.nom)+'</option>'; }).join("")+
      '</select>'+
      '<button class="btn primary" id="driverGo" style="width:100%">Continuer</button>'+
    '</div>'
  );
  if(!state.chauffeurs.filter(function(c){return c.actif;}).length){
    wrap.appendChild(el('<div class="empty" style="margin-top:14px">Aucun chauffeur n\'a encore été ajouté par le gestionnaire.</div>'));
  }
  wrap.querySelector("#driverGo").addEventListener("click", function(){
    var v = wrap.querySelector("#driverSelect").value;
    if(!v){ toast("Choisissez votre nom"); return; }
    state.driverId = v; startDriverGeoWatch(); renderRoot();
  });
  return wrap;
}

function renderDriverMissions(){
  startDriverGeoWatch();
  var wrap = document.createElement("div");
  var mine = state.missions.filter(function(m){ return m.chauffeurId===state.driverId && m.statutIndex!=="refusee"; })
    .sort(byDateHeure);
  // Une mission encore active (non terminée) reste actionnable même si sa date prévue est
  // dépassée (retard) — seul le statut décide, jamais la date, sinon les boutons d'étape
  // disparaissent pour une mission en retard (elle bascule à tort dans l'historique lecture seule).
  var upcoming = mine.filter(function(m){ return statutIndex(m)<STEP_LAST; });
  var past = mine.filter(function(m){ return statutIndex(m)>=STEP_LAST; }).slice(-10).reverse();

  wrap.appendChild(el('<h3 style="margin-bottom:4px">Mes missions</h3>'));
  wrap.appendChild(el('<div class="hint" style="margin-bottom:4px">📍 Position partagée avec le gestionnaire tant que cette page reste ouverte (carte du Planning)</div>'));
  wrap.appendChild(fcmStatusEl());

  if(!upcoming.length){
    wrap.appendChild(el('<div class="empty">Aucune mission à venir. 🎉</div>'));
  } else {
    var list = el('<div class="dm-list"></div>');
    upcoming.forEach(function(m){ list.appendChild(driverMissionCard(m)); });
    wrap.appendChild(list);
  }

  if(past.length){
    wrap.appendChild(el('<div class="section-title">Historique récent</div>'));
    var list2 = el('<div class="dm-list"></div>');
    past.forEach(function(m){ list2.appendChild(driverMissionCard(m, true)); });
    wrap.appendChild(list2);
  }
  return wrap;
}

      });
    });
    photoGrid.querySelectorAll(".dm-photo-rm").forEach(function(btn){
      btn.addEventListener("click", function(e){
        e.stopPropagation();
        var i = parseInt(btn.getAttribute("data-i"), 10);
        removeMissionPhoto(m, i);
      });
    });
  }
  var addPhotoInput = card.querySelector("#dmAddPhotoInput");
  if(addPhotoInput){
    addPhotoInput.addEventListener("change", function(){
      var file = addPhotoInput.files && addPhotoInput.files[0];
      addPhotoInput.value = "";
      if(file) addMissionPhoto(m, file);
    });
  }

  var steps = el('<div class="dm-steps"></div>');
  STEPS.forEach(function(s,i){
    var cls = i<=si ? "done" : (i===si+1 ? "next" : "");
    steps.appendChild(el('<span class="step-pill '+cls+'">'+s.label+'</span>'));
  });
  card.appendChild(steps);

  if(!readonly && si<STEP_LAST){
    var actions = el('<div class="dm-actions"></div>');
    var nextIdx = si+1;
    if(nextIdx===STEP_LAST){
      // Dernière étape : photo(s) de la lettre de voiture (CMR) obligatoire(s) avant de clore la
      // mission. Enregistrées comme les autres pièces jointes (base64 compressé dans le document).
      // Plusieurs photos possibles depuis le 17/09/2026 (demande de Colart) — la précédente version
      // ne permettait d'en prendre qu'une seule.
      var cmrPhotosData = [];
      var cmrBusy = false;
      var cmrWrap = el('<div class="cmr-gate"></div>');
      cmrWrap.appendChild(el('<div class="hint">📷 Photo de la lettre de voiture (CMR) obligatoire avant de terminer la mission — plusieurs photos possibles. Elles sont enregistrées avec la mission et consultables ensuite depuis sa fiche.</div>'));
      var cmrThumbsWrap = el('<div class="dm-photo-grid" style="margin-bottom:4px"></div>');
      function renderCmrThumbs(){
        cmrThumbsWrap.innerHTML = "";
        cmrPhotosData.forEach(function(p, i){
          var thumb = el('<div class="dm-photo-thumb"><img src="'+p.dataUrl+'" alt="Photo CMR"/><button type="button" class="dm-photo-rm">✕</button></div>');
          thumb.querySelector(".dm-photo-rm").addEventListener("click", function(){
            cmrPhotosData.splice(i,1);
            renderCmrThumbs();
            finishBtn.disabled = !cmrPhotosData.length;
          });
          cmrThumbsWrap.appendChild(thumb);
        });
      }
      var camLabel = el('<label class="btn sm primary">📷 Prendre une photo CMR<input type="file" accept="image/*" capture="environment" style="display:none"/></label>');
      var camInput = camLabel.querySelector("input");
      var finishBtn = el('<button class="btn primary sm" disabled>Étape suivante : Fin de mission</button>');
      camInput.addEventListener("change", function(){
        var file = camInput.files && camInput.files[0];
        camInput.value = "";
        if(!file) return;
        cmrBusy = true; finishBtn.disabled = true;
        camLabel.innerHTML = "Traitement de la photo…";
        camLabel.className = "btn sm";
        compressImageFile(file, MAX_ATTACHMENT_DATAURL_BYTES).then(function(res){
          cmrBusy = false;
          camLabel.innerHTML = "📷 Prendre une photo CMR";
          camLabel.className = "btn sm primary";
          if(res.tooLarge){ toast("Photo trop volumineuse même après compression — réessayez"); finishBtn.disabled = !cmrPhotosData.length; return; }
          cmrPhotosData.push({name: "CMR "+(m.client||"")+" "+(cmrPhotosData.length+1)+".jpg", type: "image/jpeg", size: dataUrlByteLength(res.dataUrl), dataUrl: res.dataUrl});
          renderCmrThumbs();
          finishBtn.disabled = false;
        }).catch(function(){
          cmrBusy = false;
          camLabel.innerHTML = "📷 Prendre une photo CMR";
          camLabel.className = "btn sm primary";
          toast("Impossible de traiter cette photo — réessayez");
          finishBtn.disabled = !cmrPhotosData.length;
        });
      });
      finishBtn.addEventListener("click", function(){
        if(cmrBusy){ return; }
        if(!cmrPhotosData.length){ toast("Prenez d'abord au moins une photo de la CMR"); return; }
        advanceMission(m, {cmrPhotoConfirmed:true, cmrPhotos: cmrPhotosData});
      });
      cmrWrap.appendChild(cmrThumbsWrap);
      cmrWrap.appendChild(camLabel);
      cmrWrap.appendChild(finishBtn);
      actions.appendChild(cmrWrap);
    } else {
      var nextBtn = el('<button class="btn primary sm">'+(si<0?"Accepter la mission":"Étape suivante : "+STEPS[nextIdx].label)+'</button>');
      nextBtn.addEventListener("click", function(){ advanceMission(m); });
      actions.appendChild(nextBtn);
    }
    if(si<0){
      var refuseBtn = el('<button class="btn sm danger">Refuser la mission</button>');
      refuseBtn.addEventListener("click", function(){ refuseMission(m); });
      actions.appendChild(refuseBtn);
    }
    card.appendChild(actions);
  }
  return card;
}

function advanceMission(m, extra){
  if(!state.db){ toast("Base de données indisponible"); return; }
  var si = statutIndex(m);
  var nextIdx = si+1;
  if(nextIdx>STEP_LAST) return;
  var stepTimes = Object.assign({}, m.stepTimes||{});
  stepTimes[STEPS[nextIdx].key] = new Date().toISOString();
  var data = {statutIndex: nextIdx, stepTimes: stepTimes, updatedAt: new Date().toISOString()};
  if(extra && extra.cmrPhotoConfirmed){
    data.cmrPhotoConfirmed = true;
    data.cmrPhotoConfirmedAt = new Date().toISOString();
    if(extra.cmrPhotos && extra.cmrPhotos.length){
      // Fusionne avec d'éventuelles photos déjà ajoutées côté gestionnaire avant la fin de mission.
      data.cmrPhotos = cmrPhotosOf(m).concat(extra.cmrPhotos);
      data.cmrPhotoFichier = null;
    }
  }
  dbWrite(state.db.doc("missions/"+m.id).update(data), STEPS[nextIdx].label);
}

function refuseMission(m){
  if(!state.db){ toast("Base de données indisponible"); return; }
  confirmAction("Confirmer le refus de cette mission ?", function(){
    dbWrite(state.db.doc("missions/"+m.id).update({statutIndex:"refusee", updatedAt:new Date().toISOString()}), "Mission refusée");
  });
}

// Photos du matériel transporté, ajoutées par le chauffeur directement depuis son téléphone —
// stockées comme les autres pièces jointes (base64 dans le document, compressées) sous
// m.chauffeurPhotos[] (demande de Colart, 11/09/2026). Plafond de nombre de photos pour rester
// sous la limite de taille d'un document Firestore (1 Mo, tous champs compris).
var MAX_MISSION_PHOTOS = 6;
function addMissionPhoto(m, file, field){
  field = field || "chauffeurPhotos";
  if(!state.db){ toast("Base de données indisponible"); return; }
  var current = field==="cmrPhotos"? cmrPhotosOf(m) : (m[field]||[]);
  if(current.length >= MAX_MISSION_PHOTOS){
    toast("Nombre maximum de photos atteint ("+MAX_MISSION_PHOTOS+") — retirez-en une avant d'en ajouter une nouvelle");
    return;
  }
  if(!/^image\//.test(file.type)){ toast("Choisissez une photo"); return; }
  compressImageFile(file, MAX_ATTACHMENT_DATAURL_BYTES).then(function(res){
    if(res.tooLarge){ toast("Photo trop volumineuse même après compression"); return; }
    var photo = {
      name: file.name||"photo.jpg", type: "image/jpeg",
      size: dataUrlByteLength(res.dataUrl), dataUrl: res.dataUrl,
      addedAt: new Date().toISOString()
    };
    var photos = current.concat([photo]);
    var patch = {updatedAt: new Date().toISOString()};
    patch[field] = photos;
    if(field==="cmrPhotos") patch.cmrPhotoFichier = null; // migration définitive vers le tableau
    dbWrite(state.db.doc("missions/"+m.id).update(patch), "Photo ajoutée");
  }).catch(function(){ toast("Impossible de traiter cette photo"); });
}
function removeMissionPhoto(m, index, field){
  field = field || "chauffeurPhotos";
  if(!state.db){ toast("Base de données indisponible"); return; }
  var photos = (field==="cmrPhotos"? cmrPhotosOf(m) : (m[field]||[])).slice();
  photos.splice(index, 1);
  var patch = {updatedAt: new Date().toISOString()};
  patch[field] = photos;
  if(field==="cmrPhotos") patch.cmrPhotoFichier = null;
  dbWrite(state.db.doc("missions/"+m.id).update(patch), "Photo retirée");
}
function missionPhotosGridHtml(photos, removable){
  return '<div class="dm-photo-grid">'+photos.map(function(p,i){
    return '<div class="dm-photo-thumb" data-i="'+i+'"><img src="'+p.dataUrl+'" alt="Photo"/>'+
      (removable? '<button type="button" class="dm-photo-rm" data-i="'+i+'">✕</button>' : '')+
    '</div>';
  }).join("")+'</div>';
}

/* ================= boot ================= */
function initApp(){ initDb(); initSample(); }
document.addEventListener("DOMContentLoaded", initApp);
if(document.readyState!=="loading") initApp();

})();
