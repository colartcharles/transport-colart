  var list = missionsAReaffecter();
  var body;
  if(!list.length){
    body = '<div class="empty">Aucune mission en attente de replanification. 👍</div>';
  } else {
    body = '<div class="hint" style="margin-bottom:10px">Missions dont le jour prévu est déjà passé sans avoir été menées à leur terme (jamais acceptées, refusées, ou restées bloquées en cours de route). Choisissez une nouvelle date puis cliquez sur « Replanifier » — la mission repart de zéro (à accepter par le chauffeur) sur cette nouvelle date.</div>';
    body += '<div class="facture-review-list">';
    list.forEach(function(m){
      body +=
        '<div class="facture-review-row" data-row-mission-id="'+m.id+'" style="flex-wrap:wrap">'+
          '<span class="fr-date" style="color:var(--red,#c0392b)">'+escapeHtml(fmtDateFR(m.dateMission)||"—")+'</span>'+
          '<span class="fr-ref">'+escapeHtml(m.client||"Client non renseigné")+' — '+escapeHtml(statutBadge(m).label)+(m.chauffeurId? ' · '+escapeHtml(chauffeurName(m.chauffeurId)):'')+'</span>'+
          '<input type="date" class="rf-date" data-mission-id="'+m.id+'" value="'+escapeHtml(todayISO())+'" style="max-width:150px;padding:5px 8px;font-size:12.5px;border-radius:8px;border:1px solid var(--border-2);background:var(--surface);color:var(--text)"/>'+
          '<button type="button" class="btn sm primary rf-go" data-mission-id="'+m.id+'">Replanifier</button>'+
          '<button type="button" class="btn sm rf-view" data-mission-id="'+m.id+'">Voir</button>'+
        '</div>';
    });
    body += '</div>';
  }
  openModal("Missions à réaffecter ("+list.length+")", body, function(modal, close){
    modal.querySelectorAll(".rf-view").forEach(function(btn){
      btn.addEventListener("click", function(){
        var mid = btn.getAttribute("data-mission-id");
        var m = state.missions.find(function(x){ return x.id===mid; });
        close();
        if(m) openMissionModal(m);
      });
    });
    modal.querySelectorAll(".rf-go").forEach(function(btn){
      btn.addEventListener("click", function(){
        var mid = btn.getAttribute("data-mission-id");
        if(!state.db) return;
        var row = modal.querySelector('.facture-review-row[data-row-mission-id="'+mid+'"]');
        var dateInput = row? row.querySelector(".rf-date") : null;
        var newDate = dateInput? dateInput.value : "";
        if(!newDate){ toast("Choisissez une date"); return; }
        dbWrite(state.db.doc("missions/"+mid).update({
          dateMission: newDate, statutIndex: -1, stepTimes: {},
          cmrPhotoConfirmed: false, cmrPhotoConfirmedAt: null,
          updatedAt: new Date().toISOString()
        }), "Mission replanifiée au "+fmtDateFR(newDate));
        if(row) row.remove();
      });
    });
    return [];
  });
}

// Corbeille des missions (demande de Colart, 17/09/2026) : missions supprimées mais récupérables
// pendant 2 mois (purge automatique — voir subscribeAll). Accessible depuis le KPI "Corbeille" du
// Tableau de bord.
function openCorbeilleModal(){
  var list = state.missionsCorbeille || [];
  var body;
  if(!list.length){
    body = '<div class="empty">La corbeille est vide.</div>';
  } else {
    body = '<div class="hint" style="margin-bottom:10px">Missions supprimées, conservées 2 mois avant suppression définitive automatique. Cliquez sur « Restaurer » pour les récupérer telles quelles (chauffeur, véhicule et statut compris).</div>';
    body += '<div class="facture-review-list">';
    list.forEach(function(m){
      var joursRestants = m.supprimeeAt? Math.max(0, 60 - Math.floor((Date.now()-new Date(m.supprimeeAt).getTime())/(24*60*60*1000))) : null;
      body +=
        '<div class="facture-review-row" data-row-mission-id="'+m.id+'" style="flex-wrap:wrap">'+
          '<span class="fr-date">'+escapeHtml(fmtDateFR(m.dateMission)||"—")+'</span>'+
          '<span class="fr-ref">'+escapeHtml(m.client||"Client non renseigné")+(m.adresseChargement? ' — '+escapeHtml(m.adresseChargement) : '')+'<div class="hint" style="margin-top:2px">Supprimée le '+escapeHtml(fmtTs(m.supprimeeAt)||"—")+(joursRestants!=null? ' · suppression définitive dans '+joursRestants+' j' : '')+'</div></span>'+
          '<button type="button" class="btn sm primary cb-restore" data-mission-id="'+m.id+'">↩️ Restaurer</button>'+
          '<button type="button" class="btn sm danger cb-purge" data-mission-id="'+m.id+'">Supprimer définitivement</button>'+
        '</div>';
    });
    body += '</div>';
  }
  openModal("Corbeille ("+list.length+")", body, function(modal, close){
    modal.querySelectorAll(".cb-restore").forEach(function(btn){
      btn.addEventListener("click", function(){
        var mid = btn.getAttribute("data-mission-id");
        if(!state.db) return;
        dbWrite(state.db.doc("missions/"+mid).update({supprimee:false, supprimeeAt:null}), "Mission restaurée");
        var row = modal.querySelector('.facture-review-row[data-row-mission-id="'+mid+'"]');
        if(row) row.remove();
      });
    });
    modal.querySelectorAll(".cb-purge").forEach(function(btn){
      btn.addEventListener("click", function(){
        var mid = btn.getAttribute("data-mission-id");
        if(!state.db) return;
        confirmAction("Supprimer définitivement cette mission ? Cette action est irréversible.", function(){
          dbWrite(state.db.doc("missions/"+mid).delete(), "Mission supprimée définitivement");
          var row = modal.querySelector('.facture-review-row[data-row-mission-id="'+mid+'"]');
          if(row) row.remove();
        });
      });
    });
    return [];
  });
}

// draft (optionnel) : état du formulaire à restaurer tel quel — utilisé quand on est parti voir une
// mission depuis une ligne (📎) et qu'on revient à la facture en cours, enregistrée ou non.
function openFactureModal(client, missionIds, existingFactureId, draft){
  var existingDoc = existingFactureId? (state.factures.find(function(f){ return f.id===existingFactureId; }) || null) : null;
  var hasExisting = !!existingDoc;
  var docId = existingFactureId || uid();
  var base = draft || existingDoc; // valeurs de départ des champs (brouillon restauré, sinon facture enregistrée)

  var initialLignes, initialMois, initialNotes;
  if(hasExisting){
    initialLignes = existingDoc.lignes || [];
    initialMois = existingDoc.mois || currentMoisStr();
    initialNotes = existingDoc.notes || "";
  } else {
    var missions = (missionIds||[]).map(function(id){ return state.missions.find(function(m){ return m.id===id; }); }).filter(Boolean);
    // Le mois de facturation par défaut est celui de la majorité des missions sélectionnées.
    var moisCounts = {};
    missions.forEach(function(m){ var ms=missionMoisStr(m); moisCounts[ms]=(moisCounts[ms]||0)+1; });
    var bestMois = currentMoisStr(), bestCount = -1;
    Object.keys(moisCounts).forEach(function(ms){ if(moisCounts[ms]>bestCount){ bestCount=moisCounts[ms]; bestMois=ms; } });
    initialMois = bestMois;
    initialLignes = missions.sort(byDateHeure).map(function(m){
      var d = devisFor(m.id);
      // Reproduit le style des factures papier de Colart : "JJ.MM COMMANDE ####" sur une ligne.
      var datePrefix = m.dateMission? (m.dateMission.slice(8,10)+"."+m.dateMission.slice(5,7)+" ") : "";
      // Le n° de commande du client n'est plus écrit dans la référence : il a son propre champ
      // « N° commande » sur la ligne (modifiable), imprimé à côté de la référence (06/10/2026).
      var ref = datePrefix + ((d && d.numero)? ("Devis "+d.numero) : (m.client||""));
      return {
        missionId: m.id,
        devisId: d? d.id : null,
        reference: ref.trim(),
        designation: "",
        quantite: 1,
        prixUnitaire: d? Math.round(devisTotal(d)*100)/100 : 0
      };
    });
    initialNotes = "TRANSPORTS "+(MOIS_LABELS[parseInt(initialMois.split("-")[1],10)-1]||"").toUpperCase()+" "+initialMois.split("-")[0];
  }
  if(draft){
    initialLignes = draft.lignes || [];
    initialMois = draft.mois || initialMois;
    initialNotes = draft.notes!=null? draft.notes : initialNotes;
  }
  // Capturés une fois à l'ouverture du formulaire (voir formatFactureNumero/facturePeriodeFromMoisStr) :
  // le compteur n'avance (et la période ne change) réellement qu'à l'enregistrement (voir plus bas),
  // pas à la simple ouverture — sinon annuler laisserait un trou dans la numérotation. La période
  // suit le MOIS DE FACTURATION (initialMois) et non la date du jour (demande de Colart, 01/10/2026)
  // — remis à jour en direct si Colart change ce mois avant d'enregistrer, voir plus bas.
  var numeroFacturePeriodeAuto = hasExisting? null : facturePeriodeFromMoisStr(initialMois);
  var numeroFactureAuto = hasExisting? null : prochainSequenceFacturePourPeriode(numeroFacturePeriodeAuto);

  var clientFiche = state.clients.find(function(c){ return clientLabel(c)===(base&&base.client!=null? base.client : client); }) || null;
  var emailInit = (base && base.clientEmail) || (clientFiche? clientEmailFor(clientFiche, "facturation") : "");
  var body =
    '<div class="field-row">'+
      '<div class="field"><label>Client</label><input id="fa_client" value="'+escapeHtml(base&&base.client!=null?(base.client||""):(client||""))+'" '+(hasExisting?"":"readonly")+'/></div>'+
      '<div class="field"><label>Mois de facturation</label><input type="month" id="fa_mois" value="'+escapeHtml(initialMois)+'"/></div>'+
    '</div>'+
    '<div class="field-row">'+
      // Numérotation propre à l'application (demande de la comptable de Colart, 22/09/2026) :
      // générée automatiquement pour une nouvelle facture (compteur dans Paramètres), pour la
      // distinguer d'un coup d'œil des factures Alpha/RD4/Powerpanne. Reste modifiable sur une
      // facture déjà enregistrée, au cas où une correction serait nécessaire.
      '<div class="field"><label>N° de facture'+(hasExisting?'':' (généré automatiquement)')+'</label><input id="fa_numero" value="'+escapeHtml(hasExisting?((base.numero)||""):formatFactureNumero(numeroFacturePeriodeAuto, numeroFactureAuto))+'" '+(hasExisting?'':'readonly')+'/></div>'+
      '<div class="field"><label>Statut</label><select id="fa_statut">'+
        FACTURE_STATUTS.map(function(s){ return '<option value="'+s.key+'" '+((base?base.statut:"brouillon")===s.key?"selected":"")+'>'+s.label+'</option>'; }).join("")+
      '</select></div>'+
    '</div>'+
    '<div class="field-row">'+
      '<div class="field"><label>Date d\'émission</label><input type="date" id="fa_dateEmission" value="'+escapeHtml(base?(base.dateEmission||""):todayISO())+'"/></div>'+
      '<div class="field"><label>Échéance</label><input type="date" id="fa_echeance" value="'+escapeHtml(base?(base.echeance||""):"")+'"/></div>'+
    '</div>'+
    // E-mail d'envoi de la facture (demande de Colart, 05/10/2026) : proposé depuis la fiche client
    // (adresse « facturation » en priorité, voir clientEmailFor), modifiable avant chaque envoi.
    '<div class="field"><label>E-mail du client (pour l\'envoi de la facture)</label><input type="email" multiple id="fa_email" placeholder="adresse@client.fr" value="'+escapeHtml(emailInit)+'"/></div>'+
    '<div id="fa_emailPicker"></div>'+
    '<div class="field"><label>Observations (facultatif, imprimées sur la facture)</label><input id="fa_notes" value="'+escapeHtml(initialNotes)+'"/></div>'+
    '<div class="field"><label>Lignes (une par mission/commande — modifiables)</label>'+
      '<div id="factureLines"></div>'+
      '<button type="button" class="btn sm" id="btnAddFactureLine">+ Ligne libre</button>'+
    '</div>'+
    '<div class="field-row">'+
      '<div class="field" style="max-width:260px"><label>Taux de TVA</label><select id="fa_tauxTva">'+
        '<option value="20" '+((base? (base.tauxTVA!=null?base.tauxTVA:20) : 20)===20?"selected":"")+'>20 %</option>'+
        '<option value="0" '+((base? (base.tauxTVA!=null?base.tauxTVA:20) : 20)===0?"selected":"")+'>0 % (client facturé hors TVA)</option>'+
      '</select><div class="hint">En 0 %, pensez à ajouter la mention légale d\'exonération dans les Observations ci-dessus.</div></div>'+
      // Compte de vente utilisé pour l'export comptable (demande de Colart, 22/09/2026) : le compte
      // par défaut sauf cas particulier (CUD, barges, Galloo...) — comptes paramétrables dans
      // Paramètres. N'affecte pas la facture elle-même, seulement l'écriture générée à l'export.
      '<div class="field"><label>Compte de vente (export comptable)</label><select id="fa_compteVente">'+
        comptesVenteOptions().map(function(c){ return '<option value="'+escapeHtml(c.code)+'" '+((base? (base.compteVente||state.config.compteVenteDefaut) : state.config.compteVenteDefaut)===c.code?"selected":"")+'>'+escapeHtml(c.code)+' — '+escapeHtml(c.libelle)+(c.note?(' ('+escapeHtml(c.note)+')'):'')+'</option>'; }).join("")+
      '</select></div>'+
    '</div>'+
    '<div class="devis-total-box" id="factureTotalDisplay"></div>';

  var estAvoir = hasExisting && (existingDoc.type||"facture")==="avoir";
  openModal(hasExisting? ((estAvoir?"Avoir — ":"Facture — ")+(existingDoc.client||"")) : ("Nouvelle facture — "+(client||"")), body, function(modal, close){
    // Fenêtre plus large : chaque ligne porte maintenant son champ « N° commande » (modifiable).
    modal.style.maxWidth = "880px";
    // Plusieurs e-mails pour ce client : cases à cocher pour choisir le(s) destinataire(s).
    wireClientEmailPicker(modal.querySelector("#fa_emailPicker"), modal.querySelector("#fa_email"), clientFiche, "facturation", null);
    var linesContainer = modal.querySelector("#factureLines");
    function wireRemove(){
      linesContainer.querySelectorAll(".fl-remove").forEach(function(btn){
        btn.onclick = function(){ btn.closest(".facture-line-row").remove(); recalc(); };
      });
    }
    function recalc(){
      var ht = 0;
      linesContainer.querySelectorAll(".facture-line-row").forEach(function(row){
        var qStr = row.querySelector(".fl-qte").value;
        var pStr = row.querySelector(".fl-prix").value;
        var q = qStr===""? 1 : (parseFloat(qStr)||0);
        var p = pStr===""? 0 : (parseFloat(pStr)||0);
        row.querySelector(".fl-montant").value = fmtEUR(q*p);
        ht += q*p;
      });
      var taux = parseFloat(modal.querySelector("#fa_tauxTva").value)||0;
      var tva = ht*(taux/100), ttc = ht+tva;
      modal.querySelector("#factureTotalDisplay").innerHTML =
        '<div class="dt-row"><span>Total HT</span><span>'+fmtEUR(ht)+'</span></div>'+
        '<div class="dt-row"><span>TVA ('+taux+' %)</span><span>'+fmtEUR(tva)+'</span></div>'+
        '<div class="dt-row dt-ttc"><span>Total TTC</span><span>'+fmtEUR(ttc)+'</span></div>';
    }
    // Clic sur 📎 : ouvre la mission liée à la ligne (à défaut, son devis). Un seul modal pouvant
    // être affiché à la fois (#modalRoot), la facture en cours est mémorisée telle quelle (même non
    // enregistrée) puis rouverte automatiquement dès que la mission est refermée — rien n'est perdu.
    linesContainer.addEventListener("click", function(e){
      var btn = e.target.closest && e.target.closest(".fl-voir-bc");
      if(!btn) return;
      var row = btn.closest(".facture-line-row");
      var mid = row.getAttribute("data-mission-id"), did = row.getAttribute("data-devis-id");
      var m = mid? (state.missions.find(function(x){ return x.id===mid; }) || null) : null;
      var dv = did? (state.devis.find(function(x){ return x.id===did; }) || null) : null;
      if(!m && !dv){ toast("La mission de cette ligne n'existe plus"); return; }
      var draft = collectData();
      var root = document.getElementById("modalRoot");
      if(m) openMissionModal(m);
      else openDevisModal(dv.missionId? (state.missions.find(function(x){ return x.id===dv.missionId; }) || null) : null, dv.id);
      var mo = new MutationObserver(function(){
        if(root.childNodes.length) return; // un autre modal s'est ouvert depuis la mission : on attend
        mo.disconnect();
        openFactureModal(client, missionIds, existingFactureId, draft);
      });
      mo.observe(root, {childList:true});
    });
    initialLignes.forEach(function(l){ linesContainer.appendChild(el(factureLineRowHtml(l))); });
    wireRemove(); recalc();
    linesContainer.addEventListener("input", recalc);
    modal.querySelector("#fa_tauxTva").addEventListener("change", recalc);
    modal.querySelector("#btnAddFactureLine").addEventListener("click", function(){
      linesContainer.appendChild(el(factureLineRowHtml({})));
      wireRemove(); recalc();
    });
    // Le N° de facture (nouvelle facture) suit le Mois de facturation, pas la date du jour (demande
    // de Colart, 01/10/2026) — si Colart change ce mois avant d'enregistrer, l'aperçu du numéro se
    // met à jour pour rester cohérent avec la période qui sera réellement écrite (voir le bouton
    // Enregistrer plus bas, qui recalcule de toute façon à partir de la valeur en direct du champ).
    if(!hasExisting){
      modal.querySelector("#fa_mois").addEventListener("change", function(){
        var periode = facturePeriodeFromMoisStr(modal.querySelector("#fa_mois").value);
        var seq = prochainSequenceFacturePourPeriode(periode);
        modal.querySelector("#fa_numero").value = formatFactureNumero(periode, seq);
      });
    }

    function collectData(){
      var lignes = [];
      var rows = linesContainer.querySelectorAll(".facture-line-row");
      rows.forEach(function(row){
        var reference = row.querySelector(".fl-ref").value.trim();
        var designation = row.querySelector(".fl-designation").value.trim();
        var qte = row.querySelector(".fl-qte").value;
        var prix = row.querySelector(".fl-prix").value;
        if(!reference && !designation && qte==="" && prix==="") return;
        // Le lien mission/devis voyage avec la ligne elle-même (attributs data-*), jamais par
        // position dans le tableau — une suppression/ajout de ligne ne doit pas mélanger les liens.
        lignes.push({
          missionId: row.getAttribute("data-mission-id") || null,
          devisId: row.getAttribute("data-devis-id") || null,
          reference: reference,
          designation: designation,
          numeroCommande: row.querySelector(".fl-cmd").value.trim(),
          quantite: qte===""?1:parseFloat(qte),
          prixUnitaire: prix===""?0:parseFloat(prix)
        });
      });
      return {
        client: modal.querySelector("#fa_client").value.trim(),
        mois: modal.querySelector("#fa_mois").value || currentMoisStr(),
        numero: modal.querySelector("#fa_numero").value.trim(),
        statut: modal.querySelector("#fa_statut").value,
        dateEmission: modal.querySelector("#fa_dateEmission").value,
        echeance: modal.querySelector("#fa_echeance").value,
        notes: modal.querySelector("#fa_notes").value.trim(),
        clientEmail: modal.querySelector("#fa_email").value.trim(),
        tauxTVA: parseFloat(modal.querySelector("#fa_tauxTva").value)||0,
        compteVente: modal.querySelector("#fa_compteVente").value,
        lignes: lignes,
        // Préserve l'identité "avoir" (et son lien vers la facture d'origine) au fil des
        // enregistrements — collectData() ne reconstruit que les champs représentés par un champ du
        // formulaire ci-dessus, donc sans ceci un avoir réenregistré perdrait son type et redeviendrait
        // une facture normale (demande de Colart, 24/09/2026 : bouton "Créer un avoir").
        type: hasExisting? (existingDoc.type||"facture") : "facture",
        avoirDeFactureId: hasExisting? (existingDoc.avoirDeFactureId||null) : null,
        refacturationDeFactureId: hasExisting? (existingDoc.refacturationDeFactureId||null) : null,
        createdAt: hasExisting? (existingDoc.createdAt||new Date().toISOString()) : new Date().toISOString(),
        updatedAt: new Date().toISOString()
      };
    }

    var buttons = [];
    if(hasExisting){
      var del = el('<button class="btn danger">Supprimer la facture</button>');
      del.addEventListener("click", function(){
        if(!state.db) return;
        confirmAction("Supprimer cette facture ? Les missions qu'elle contenait redeviendront \"à facturer\".", function(){
          var devisIds = (existingDoc.lignes||[]).map(function(l){return l.devisId;}).filter(Boolean);
          var unbill = devisIds.map(function(did){ return state.db.doc("devis/"+did).update({factureId: null}).catch(function(){}); });
          dbWrite(Promise.all(unbill).then(function(){ return state.db.doc("factures/"+docId).delete(); }), "Facture supprimée");
          close();
        });
      });
      buttons.push(del);
    }
    // Bouton "Créer un avoir" (demande de Colart, 24/09/2026, sur le modèle de son autre logiciel de
    // facturation — voir openCreerAvoirModal) : uniquement sur une facture existante qui n'est pas
    // elle-même déjà un avoir.
    if(hasExisting && !estAvoir){
      var avoirBtn = el('<button type="button" class="btn danger">🔴 Créer un avoir</button>');
      avoirBtn.addEventListener("click", function(){ close(); openCreerAvoirModal(existingDoc); });
      buttons.push(avoirBtn);
    }
    var preview = el('<button type="button" class="btn">Aperçu / Imprimer</button>');
    preview.addEventListener("click", function(){ openFacturePrintView(collectData()); });
    buttons.push(preview);
    // Enregistrement commun à « Enregistrer la facture » et « Envoyer par e-mail » : renvoie les
    // données enregistrées (numéro définitif compris), ou null si le formulaire est incomplet.
    function doSave(){
      var data = collectData();
      if(!data.client){ toast("Le nom du client est requis"); return null; }
      if(!data.lignes.length){ toast("Ajoutez au moins une ligne"); return null; }
      if(!state.db){ toast("Base de données indisponible"); return null; }
      var newDevisIds = data.lignes.map(function(l){return l.devisId;}).filter(Boolean);
      var oldDevisIds = hasExisting? (existingDoc.lignes||[]).map(function(l){return l.devisId;}).filter(Boolean) : [];
      var toBill = newDevisIds.filter(function(id){ return oldDevisIds.indexOf(id)===-1; });
      var toUnbill = oldDevisIds.filter(function(id){ return newDevisIds.indexOf(id)===-1; });
      var billWrites = toBill.map(function(did){ return state.db.doc("devis/"+did).update({factureId: docId}).catch(function(){}); });
      var unbillWrites = toUnbill.map(function(did){ return state.db.doc("devis/"+did).update({factureId: null}).catch(function(){}); });
      // Une mission incluse dans une facture est par définition passée par le contrôle — on la
      // marque "contrôlée" automatiquement pour qu'elle ne réapparaisse plus dans le filet de
      // sécurité "Missions terminées à contrôler" (voir missionAControler).
      var missionIdsToMark = data.lignes.map(function(l){ return l.missionId; }).filter(Boolean);
      var controlWrites = missionIdsToMark.map(function(mid){ return state.db.doc("missions/"+mid).update({controlee:true, controleeAt:new Date().toISOString()}).catch(function(){}); });
      // Le compteur de numérotation (et la période MM/AA associée) n'avance qu'ici, au moment où la
      // facture est réellement enregistrée — pas à l'ouverture du formulaire — pour ne jamais
      // laisser de trou dans la numérotation si Colart annule sans enregistrer. On recalcule la
      // période et le numéro à partir de la valeur EN DIRECT du champ Mois de facturation (et non
      // des valeurs figées à l'ouverture du formulaire) — au cas où Colart l'aurait changé entre
      // l'ouverture et l'enregistrement — pour que le numéro réellement écrit et le compteur avancé
      // correspondent toujours exactement au même mois (demande de Colart, 01/10/2026).
      var configWrites = [];
      if(!hasExisting){
        var periodeFinale = facturePeriodeFromMoisStr(data.mois);
        var seqFinale = prochainSequenceFacturePourPeriode(periodeFinale);
        data.numero = formatFactureNumero(periodeFinale, seqFinale);
        configWrites.push(state.db.doc("config/app").set(Object.assign({}, state.config,
          withNextFactureSeq(periodeFinale, seqFinale)
        )).catch(function(){}));
      }
      dbWrite(
        Promise.all(billWrites.concat(unbillWrites).concat(controlWrites).concat(configWrites)).then(function(){
          return state.db.doc("factures/"+docId).set(data);
        }),
        hasExisting? "Facture mise à jour" : "Facture créée"
      );
      return data;
    }
    // Envoi de la facture au client par e-mail, PDF en pièce jointe (demande de Colart, 05/10/2026) :
    // même mécanisme que les devis (extension Firebase « Trigger Email », avec repli copier-coller
    // si l'envoi automatique échoue). La facture est enregistrée d'abord — le PDF envoyé est donc
    // toujours identique à ce qui est en base.
    var sendMail = el('<button type="button" class="btn">✉️ Envoyer par e-mail</button>');
    sendMail.addEventListener("click", function(){
      var mail = (modal.querySelector("#fa_email").value||"").trim();
      if(!mail){ toast("Renseignez d'abord l'e-mail du client (champ « E-mail du client » ci-dessus, ou dans sa fiche client)"); return; }
      var data = doSave();
      if(!data) return;
      close();
      var estAvoirEnvoi = (data.type||"facture")==="avoir";
      var docNom = estAvoirEnvoi? "avoir" : "facture";
      var subject = (estAvoirEnvoi? "Avoir" : "Facture")+(data.numero?(" "+data.numero):"")+" — SARL DEBRUYNE COLART";
      var bodyMail = "Bonjour,\n\nVeuillez trouver ci-joint "+(estAvoirEnvoi? "notre avoir" : "notre facture")+(data.numero?(" n° "+data.numero):"")+(data.notes && !estAvoirEnvoi? (" ("+data.notes+")") : "")+".\n\nN'hésitez pas à nous contacter pour toute question.\n\nCordialement,\nSARL DEBRUYNE COLART\nTel 03/28/68/61/44";
      sendFactureEmailAuto(mail, subject, bodyMail, data);
    });
    buttons.push(sendMail);
    var save = el('<button class="btn primary">Enregistrer la facture</button>');
    save.addEventListener("click", function(){
      if(doSave()) close();
    });
    buttons.push(save);
    return buttons;
  });
}

// "Créer un avoir" (demande de Colart, 24/09/2026, sur le modèle de la boîte de dialogue
// "Duplication de facture en avoir" de son autre logiciel de facturation) : génère un avoir qui
// annule la facture d'origine (mêmes lignes, montants passés en négatif), numéroté séparément des
// factures (préfixe "A", voir formatAvoirNumero), et propose en option de "refacturer" dans la
// foulée — c'est-à-dire créer aussitôt une nouvelle facture (brouillon, à corriger avant envoi)
// reprenant les mêmes lignes que l'originale pour la remplacer. Les avoirs sont inclus dans l'export
// comptable (voir openExportComptableModal/exportComptableXlsx) : leurs lignes étant en négatif,
// l'écriture générée compense mécaniquement celle de la facture d'origine.
function openCreerAvoirModal(f){
  var body =
    '<div class="hint" style="margin-bottom:10px">Génère un avoir annulant la facture '+escapeHtml(f.numero||"")+' ('+escapeHtml(f.client||"")+'), avec les mêmes lignes mais en négatif — numéroté séparément des factures (préfixe A, ex: '+escapeHtml(prochainNumeroAvoirPreview())+').</div>'+
    '<label style="display:flex;align-items:flex-start;gap:8px;cursor:pointer;margin-bottom:10px">'+
      '<input type="checkbox" id="av_refacturer" checked style="width:auto;margin-top:2px"/>'+
      '<span><span style="font-weight:700">Avoir + Refacturation</span><br/><span class="hint">Crée aussitôt un avoir ET une nouvelle facture (brouillon), reprenant les mêmes lignes que l\'originale, pour la remplacer.</span></span>'+
    '</label>'+
    '<label style="display:flex;align-items:flex-start;gap:8px;cursor:pointer">'+
      '<input type="checkbox" id="av_ouvrir" checked style="width:auto;margin-top:2px"/>'+
      '<span><span style="font-weight:700">Création d\'un avoir</span><br/><span class="hint">Vous amène directement sur l\'avoir pour le vérifier/l\'imprimer.</span></span>'+
    '</label>';
  openModal("Créer un avoir — "+(f.client||""), body, function(modal, close){
    var valider = el('<button class="btn primary">Valider</button>');
    valider.addEventListener("click", function(){
      if(!state.db){ toast("Base de données indisponible"); return; }
      var refacturer = modal.querySelector("#av_refacturer").checked;
      var ouvrir = modal.querySelector("#av_ouvrir").checked;
      var periodeAvoir = currentFacturePeriode();
      var seqAvoir = prochainSequenceAvoir();
      var avoirId = uid();
      var avoirData = {
        client: f.client||"",
        mois: currentMoisStr(),
        numero: formatAvoirNumero(periodeAvoir, seqAvoir),
        statut: "brouillon",
        dateEmission: todayISO(),
        echeance: "",
        notes: "Avoir sur la facture "+(f.numero||"")+(f.notes? (" — "+f.notes) : ""),
        tauxTVA: (f.tauxTVA!=null? f.tauxTVA : 20),
        compteVente: f.compteVente||state.config.compteVenteDefaut,
        lignes: (f.lignes||[]).map(function(l){
          return {
            missionId: null, devisId: null,
            reference: l.reference||"", designation: l.designation||"",
            quantite: (l.quantite==null||l.quantite==="")?1:l.quantite,
            prixUnitaire: -((l.prixUnitaire==null||l.prixUnitaire==="")?0:l.prixUnitaire)
          };
        }),
        type: "avoir",
        avoirDeFactureId: f.id,
        refacturationDeFactureId: null,
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString()
      };
      // Tient aussi à jour numeroAvoirSeqParPeriode/numeroFactureSeqParPeriode (voir
      // withNextAvoirSeq/withNextFactureSeq) — mêmes compteurs par période que openFactureModal, pour
      // qu'un avoir ou une refacturation créés ici n'entrent jamais en collision avec un numéro déjà
      // attribué via la facturation normale, ni l'inverse.
      var configPatch = withNextAvoirSeq(periodeAvoir, seqAvoir);
      var writes = [ state.db.doc("factures/"+avoirId).set(avoirData) ];
      if(refacturer){
        var newFactureId = uid();
        var periodeFacture = currentFacturePeriode();
        var seqFacture = prochainSequenceFacture();
        configPatch = Object.assign({}, configPatch, withNextFactureSeq(periodeFacture, seqFacture));
        var newFactureData = {
          client: f.client||"",
          mois: currentMoisStr(),
          numero: formatFactureNumero(periodeFacture, seqFacture),
          statut: "brouillon",
          dateEmission: todayISO(),
          echeance: "",
          notes: f.notes||"",
          tauxTVA: (f.tauxTVA!=null? f.tauxTVA : 20),
          compteVente: f.compteVente||state.config.compteVenteDefaut,
          lignes: (f.lignes||[]).map(function(l){
            return {
              missionId: null, devisId: null,
              reference: l.reference||"", designation: l.designation||"",
              quantite: (l.quantite==null||l.quantite==="")?1:l.quantite,
              prixUnitaire: (l.prixUnitaire==null||l.prixUnitaire==="")?0:l.prixUnitaire
            };
          }),
          type: "facture",
          avoirDeFactureId: null,
          refacturationDeFactureId: f.id,
          createdAt: new Date().toISOString(),
          updatedAt: new Date().toISOString()
        };
        writes.push(state.db.doc("factures/"+newFactureId).set(newFactureData));
      }
      writes.push(state.db.doc("config/app").set(Object.assign({}, state.config, configPatch)));
      var p = Promise.all(writes);
      dbWrite(p, refacturer? "Avoir créé + nouvelle facture préparée" : "Avoir créé");
      p.then(function(){
        close();
        if(ouvrir){ openFactureModal(null, null, avoirId); }
      });
    });
    var annuler = el('<button type="button" class="btn">Annuler</button>');
    annuler.addEventListener("click", close);
    return [annuler, valider];
  });
}

// Facture « détaillée » (demande de Colart, 05/10/2026) : quand une facture ne porte qu'UNE mission/un
// devis, le client reçoit la même présentation que le devis (adresse du client, objet, sites de
// chargement/livraison, marchandise, contacts, détail de la prestation) mais intitulée FACTURE.
// Une facture groupant plusieurs missions garde la présentation en liste (renderFactureDocHtml).
// N° de commande du client (bon de commande saisi sur le devis lié à la ligne) — demande de Colart,
// 06/10/2026 : à afficher à côté de la référence sur la facture envoyée, pour les clients qui
// travaillent avec un numéro de commande. Vide si le devis n'en porte pas, ou si la référence de la
// ligne le contient déjà (cas des lignes créées avec « COMMANDE ####»).
function devisNumeroCommandePourLigne(l){
  var d = l.devisId? (state.devis.find(function(x){ return x.id===l.devisId; }) || null) : null;
  if(!d && l.missionId) d = devisFor(l.missionId) || null;
  return d && d.numeroBonCommande? String(d.numeroBonCommande).trim() : "";
}
// Le n° saisi/corrigé sur la ligne de la facture (champ « N° commande », l.numeroCommande) a toujours
// priorité sur celui du devis — y compris vide, pour ne rien afficher. Pour une ligne enregistrée
// avant l'existence de ce champ, on retombe sur le n° du devis.
function factureLigneNumeroCommande(l, refTxt){
  var n = (l.numeroCommande!=null)? String(l.numeroCommande).trim() : devisNumeroCommandePourLigne(l);
  if(!n) return "";
  if(String(refTxt||"").toLowerCase().indexOf(n.toLowerCase())!==-1) return "";
  return n;
}
function factureDetailleeSource(f){
  if((f.type||"facture")==="avoir") return null;
  var ls = f.lignes||[];
  if(ls.length!==1) return null;
  var l = ls[0];
  if(!l.missionId && !l.devisId) return null;
  var d = l.devisId? (state.devis.find(function(x){ return x.id===l.devisId; }) || null) : null;
  if(!d && l.missionId) d = devisFor(l.missionId) || null;
  if(!d) return null;
  var m = l.missionId? (state.missions.find(function(x){ return x.id===l.missionId; }) || null) : null;
  return { mission: m, devis: d, ligne: l };
}

/* ================= Onglet Clients =================
   Répertoire clients (ajouté 09/09/2026, demande de Colart : intégrer son fichier client réel).
   Alimente aussi l'auto-complétion du champ "Client" dans les missions et devis
   (wireClientAutocomplete). Import direct depuis un export Excel (.xlsx) du logiciel de
   comptabilité de Colart — voir parseClientsWorkbook pour le format attendu (export paginé avec
   en-têtes répétées toutes les ~36 lignes, filtrées à l'import). */
function clientLabel(c){ return (c.nom||"") + (c.prenom? " "+c.prenom : ""); }
// Emails multiples par client (demande de Colart, 17/09/2026) : une fiche client peut avoir
// plusieurs adresses e-mail étiquetées librement (facturation, devis/commandes, chargé
// d'affaires…). c.emails est la liste actuelle ; l'ancien champ unique c.email (avant cette
// évolution) reste lu en repli pour ne rien perdre sur les fiches non encore ré-enregistrées.
function clientEmails(c){
  if(c && Array.isArray(c.emails) && c.emails.length) return c.emails;
  if(c && c.email) return [{label:"Principal", email:c.email}];
  return [];
}
// Présélection intelligente (17/09/2026) : propose l'e-mail dont l'étiquette correspond à l'usage
// (devis/commande vs facturation), sinon le premier e-mail enregistré. Reste modifiable à chaque
// envoi — c'est juste une valeur par défaut dans le champ.
function clientEmailEntryFor(c, kind){
  var list = clientEmails(c);
  if(!list.length) return null;
  var keywords = kind==="facturation"? ["factur"] : ["devis","commande"];
  var match = list.find(function(e){
    var l = (e.label||"").toLowerCase();
    return keywords.some(function(k){ return l.indexOf(k)!==-1; });
  });
  return match || list[0];
}
function clientEmailFor(c, kind){
  var e = clientEmailEntryFor(c, kind);
  return e? (e.email||"") : "";
}

// Choix du ou des destinataires quand un client a plusieurs e-mails (demande de Colart, 06/10/2026) :
// affiche une case à cocher par adresse (étiquette, contact, e-mail) sous le champ e-mail d'envoi ;
// cocher/décocher met à jour le champ (adresses séparées par des virgules — l'e-mail part à toutes les
// adresses cochées). Rien n'est affiché si le client a moins de 2 adresses : le champ seul suffit.
// contactEl (facultatif) : champ « Contact » à mettre à jour quand une seule adresse est cochée.
// Renvoie { getSelected() } (adresses cochées) pour les envois qui n'ont pas de champ de saisie.
function wireClientEmailPicker(container, inputEl, clientObj, kind, contactEl){
  if(!container) return { getSelected: function(){ return []; } };
  container.innerHTML = "";
  var list = clientObj? clientEmails(clientObj).filter(function(e){ return e && e.email; }) : [];
  var boxes = [];
  function getSelected(){
    return boxes.filter(function(b){ return b.cb.checked; }).map(function(b){ return b.entry; });
  }
  if(list.length<2) return { getSelected: function(){ return inputEl? splitEmails(inputEl.value).map(function(a){ return {email:a}; }) : []; } };
  var pre = clientEmailEntryFor(clientObj, kind);
  var current = inputEl? splitEmails(inputEl.value).map(function(a){ return a.toLowerCase(); }) : [];
  var wrap = el('<div class="email-picker" style="margin:-4px 0 12px;padding:8px 10px;border:1px solid var(--border-2);border-radius:10px;background:var(--surface-2)"><div class="hint" style="margin-bottom:6px">Ce client a plusieurs adresses — cochez le ou les destinataires :</div></div>');
  list.forEach(function(e){
    var label = el('<label style="display:flex;align-items:flex-start;gap:8px;cursor:pointer;font-size:13px;margin-bottom:4px"><input type="checkbox" style="width:auto;margin-top:3px"/><span></span></label>');
    var cb = label.querySelector("input");
    label.querySelector("span").innerHTML =
      (e.label? '<strong>'+escapeHtml(e.label)+'</strong> — ' : '')+
      (e.contact? escapeHtml(e.contact)+' — ' : '')+
      escapeHtml(e.email);
    cb.checked = current.length? current.indexOf(String(e.email).toLowerCase())!==-1 : (!!pre && pre.email===e.email);
    cb.addEventListener("change", function(){
      var sel = getSelected();
      if(inputEl){
        inputEl.value = sel.map(function(x){ return x.email; }).join(", ");
        inputEl.dispatchEvent(new Event("input", {bubbles:true}));
      }
      if(contactEl && sel.length===1 && sel[0].contact) contactEl.value = sel[0].contact;

var xlsxLoadPromise = null;
function ensureXlsxJs(){
  if(window.XLSX) return Promise.resolve(window.XLSX);
  if(xlsxLoadPromise) return xlsxLoadPromise;
  xlsxLoadPromise = new Promise(function(resolve, reject){
    var s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js";
    s.onload = function(){ resolve(window.XLSX); };
    s.onerror = function(){ reject(new Error("xlsx_load_failed")); };
    document.head.appendChild(s);
  });
  return xlsxLoadPromise;
}
// Format observé dans l'export de Colart : colonnes Numéro/Civilité/Nom/(fusionnée)/Prénom/
// Adresse 1/Adresse 2/CP/Ville/(fusionnée)/Type Client/(fusionnée), avec l'en-tête et une ligne de
// titre "Recherche approximative…" répétées toutes les ~36 lignes (export paginé). On ne garde que
// les lignes où la colonne A est un numéro (les en-têtes/titres/lignes vides sont ainsi ignorés).
function parseClientsWorkbook(file){
  return ensureXlsxJs().then(function(XLSX){
    return file.arrayBuffer().then(function(buf){
      var wb = XLSX.read(buf, {type:"array"});
      var ws = wb.Sheets[wb.SheetNames[0]];
      var rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:null});
      // Le fichier de Colart n'a actuellement pas de colonne e-mail — détection dynamique au cas
      // où une version future de l'export en ajouterait une (recherche d'un en-tête "email"/
      // "e-mail"/"courriel" sur n'importe quelle ligne du fichier, casse insensible).
      var emailColIdx = -1;
      rows.forEach(function(row){
        (row||[]).forEach(function(cell, idx){
          if(emailColIdx===-1 && typeof cell==="string" && /^(e-?mail|courriel)$/i.test(cell.trim())) emailColIdx = idx;
        });
      });
      var clients = [];
      rows.forEach(function(row){
        var numero = row[0];
        if(typeof numero !== "number") return;
        var nom = row[2];
        if(!nom) return;
        clients.push({
          numero: numero,
          civilite: (row[1]||"").toString().trim(),
          nom: (nom||"").toString().trim(),
          prenom: (row[4]||"").toString().trim(),
          adresse1: (row[5]||"").toString().trim(),
          adresse2: (row[6]||"").toString().trim(),
          cp: row[7]!=null? String(row[7]).trim() : "",
          ville: (row[8]||"").toString().trim(),
          typeClient: (row[10]||"").toString().trim(),
          email: (emailColIdx!==-1 && row[emailColIdx]!=null)? String(row[emailColIdx]).trim() : ""
        });
      });
      return clients;
    });
  });
}
function importClientsFile(file){
  if(!state.db){ toast("Base de données indisponible"); return; }
  toast("Lecture du fichier…");
  parseClientsWorkbook(file).then(function(clients){
    if(!clients.length){ toast("Aucune ligne client reconnue dans ce fichier"); return; }
    // Upsert par lots de 25 (évite de saturer la connexion) — clé stable = numéro client quand
    // il existe, donc réimporter le même fichier met à jour les fiches existantes sans dupliquer.
    var existingById = {};
    state.clients.forEach(function(c){ existingById[c.id] = c; });
    var BATCH = 25, i = 0, total = clients.length;
    function next(){
      if(i>=total){ toast(total+" client(s) importé(s)"); return; }
      var chunk = clients.slice(i, i+BATCH);
      var writes = chunk.map(function(c){
        var docId = c.numero!=null? ("n"+c.numero) : uid();
        // Le fichier comptable de Colart ne contient pas d'e-mail : si la fiche existante en a un
        // (ajouté manuellement dans l'appli) et que l'import n'en apporte pas, on le conserve —
        // sinon un réimport effacerait les e-mails saisis à la main.
        var existing = existingById[docId];
        if(existing && !c.email && existing.email) c.email = existing.email;
        // Idem pour les e-mails multiples (17/09/2026) : le fichier comptable n'en apporte pas,
        // on garde ceux déjà saisis à la main pour ne pas les effacer au réimport.
        if(existing && existing.emails && existing.emails.length) c.emails = existing.emails;
        return state.db.doc("clients/"+docId).set(Object.assign({}, c, {updatedAt: new Date().toISOString()})).catch(function(){});
      });
      Promise.all(writes).then(function(){
        i += BATCH;
        toast("Import en cours… "+Math.min(i,total)+" / "+total);
        next();
      });
    }
    next();
  }).catch(function(e){
    toast("Impossible de lire ce fichier Excel ("+(e&&e.message||"erreur")+")");
  });
}
// Impayés (demande de Colart, 17/09/2026) : fichier xlsx fourni chaque mois par sa comptable,
// groupé par compte client — une ligne "Compte n°  Cxxxxxxx" + nom, suivie des factures impayées
// (échéance, n° facture, libellé, montant HT — les avoirs apparaissent en négatif), jusqu'à une
// ligne vide qui sépare le client suivant. Le numéro de compte (Cxxxxxxx) correspond exactement au
// "Numéro client" déjà utilisé pour l'import du fichier clients (voir parseClientsWorkbook), donc
// le rapprochement se fait automatiquement par ce numéro.
function parseImpayesWorkbook(file){
  return ensureXlsxJs().then(function(XLSX){
    return file.arrayBuffer().then(function(buf){
      var wb = XLSX.read(buf, {type:"array"});
      var ws = wb.Sheets[wb.SheetNames[0]];
      var rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:null});
      var clients = [];
      var current = null;
      rows.forEach(function(row){
        var a = row[0];
        if(typeof a === "string" && /^Compte\s*n/i.test(a.trim())){
          var numMatch = a.match(/(\d+)/);
          current = {
            numero: numMatch? parseInt(numMatch[1],10) : null,
            nom: (row[1]||"").toString().trim(),
            factures: []
          };
          clients.push(current);
          return;
        }
        if(!current) return;
        // Ligne de facture : colonne A = date d'échéance (objet Date via cellDates non activé ici,
        // donc XLSX renvoie un nombre de série ou une Date selon la cellule — on gère les deux).
        if(a==null) return; // ligne vide = séparateur entre clients
        var montant = row[3];
        if(typeof montant !== "number") return;
        current.factures.push({
          echeance: a instanceof Date? a.toISOString().slice(0,10) : (typeof a==="number"? XLSX.SSF.format("yyyy-mm-dd", a) : String(a)),
          numero: row[1]!=null? row[1] : "",
          libelle: (row[2]||"").toString().trim(),
          montant: montant
        });
      });
      return clients.filter(function(c){ return c.numero!=null; });
    });
  });
}
function importImpayesFile(file){
  if(!state.db){ toast("Base de données indisponible"); return; }
  toast("Lecture du fichier…");
  parseImpayesWorkbook(file).then(function(clients){
    if(!clients.length){ toast("Aucun compte reconnu dans ce fichier"); return; }
    // Remplacement complet à chaque import (instantané comptable du mois) : les clients qui
    // n'apparaissent plus dans le nouveau fichier (soldés) voient leur fiche impayés supprimée.
    var newIds = {};
    var writes = clients.map(function(c){
      var docId = "n"+c.numero;
      newIds[docId] = true;
      var totalDu = c.factures.reduce(function(s,f){ return s+f.montant; }, 0);
      return state.db.doc("impayes/"+docId).set({
        clientNumero: c.numero, clientNom: c.nom, factures: c.factures, totalDu: totalDu,
        importedAt: new Date().toISOString()
      }).catch(function(){});
    });
    (state.impayes||[]).forEach(function(old){
      if(!newIds[old.id]) writes.push(state.db.doc("impayes/"+old.id).delete().catch(function(){}));
    });
    Promise.all(writes).then(function(){
      toast(clients.length+" compte(s) importé(s)");
    });
  }).catch(function(e){
    toast("Impossible de lire ce fichier Excel ("+(e&&e.message||"erreur")+")");
  });
}
function impayesForClient(c){
  if(!c || c.numero==null) return null;
  var imp = (state.impayes||[]).find(function(x){ return x.id === ("n"+c.numero); });
  return (imp && imp.totalDu > 0.01) ? imp : null;
}

      return;
    }
    var totalPages = Math.max(1, Math.ceil(matches.length / CLIENTS_PAGE_SIZE));

/* ================= Import de commande client (IA, capacité "sample") =================
   Lit un PDF ou une photo de commande d'achat client, en extrait les informations avec
   Claude (capacité sample de l'artifact — utilise l'usage Claude du gestionnaire, avec
   son accord), puis pré-remplit une nouvelle mission + son bon de commande à vérifier
   avant enregistrement. */
var PDFJS_VERSION = "3.11.174";
var pdfJsLoadPromise = null;
function ensurePdfJs(){
  if(window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if(pdfJsLoadPromise) return pdfJsLoadPromise;
  pdfJsLoadPromise = new Promise(function(resolve, reject){
    var s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/"+PDFJS_VERSION+"/pdf.min.js";
    s.onload = function(){
      try{
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/"+PDFJS_VERSION+"/pdf.worker.min.js";
        resolve(window.pdfjsLib);
      } catch(e){ reject(e); }
    };
    s.onerror = function(){ reject(new Error("pdfjs_load_failed")); };
    document.head.appendChild(s);
  });
  return pdfJsLoadPromise;
}
function pdfFileToImageBlobs(file, maxPages){
  maxPages = maxPages || 2;
  return ensurePdfJs().then(function(pdfjsLib){
    return file.arrayBuffer().then(function(buf){
      return pdfjsLib.getDocument({data: buf}).promise;
    });
  }).then(function(pdf){
    var n = Math.min(pdf.numPages, maxPages);
    var pagePromises = [];
    var _loop = function(pageNum){
      pagePromises.push(pdf.getPage(pageNum).then(function(page){
        var baseViewport = page.getViewport({scale: 1});
        var scale = Math.min(2, 1400 / baseViewport.width);
        var viewport = page.getViewport({scale: scale});
        var canvas = document.createElement("canvas");
        canvas.width = Math.ceil(viewport.width);
        canvas.height = Math.ceil(viewport.height);
        var ctx = canvas.getContext("2d");
        return page.render({canvasContext: ctx, viewport: viewport}).promise.then(function(){
          return new Promise(function(resolve){ canvas.toBlob(function(blob){ resolve(blob); }, "image/png"); });
        });
      }));
    };
    for(var i=1;i<=n;i++) _loop(i);
    return Promise.all(pagePromises);
  });
}
// Convertit une page de PDF en image compressée (JPEG, budget maxBytes) — utilisé comme repli
// quand un PDF trop volumineux ne peut pas être joint tel quel (ajouté 10/09/2026, demande de
// Colart : garder systématiquement la commande du client en pièce jointe plutôt que de ne rien
// joindre du tout). Même logique de réduction progressive (résolution puis qualité) que
// compressImageFile, adaptée au rendu asynchrone de pdf.js.
function pdfPageToCompressedDataUrl(file, pageNum, maxBytes){
  return ensurePdfJs().then(function(pdfjsLib){
    return file.arrayBuffer().then(function(buf){
      return pdfjsLib.getDocument({data: buf}).promise;
    });
  }).then(function(pdf){
    return pdf.getPage(pageNum);
  }).then(function(page){
    var baseViewport = page.getViewport({scale: 1});
    var maxDim = 1600;
    var scale = Math.min(2, maxDim/Math.max(baseViewport.width, baseViewport.height, 1));
    var quality = 0.75;
    function renderAt(sc, q){
      var viewport = page.getViewport({scale: sc});
      var canvas = document.createElement("canvas");
      canvas.width = Math.max(1, Math.ceil(viewport.width));
      canvas.height = Math.max(1, Math.ceil(viewport.height));
      var ctx = canvas.getContext("2d");
      ctx.fillStyle = "#fff"; ctx.fillRect(0,0,canvas.width,canvas.height);
      return page.render({canvasContext: ctx, viewport: viewport}).promise.then(function(){
        return canvas.toDataURL("image/jpeg", q);
      });
    }
    function attempt(tries){
      return renderAt(scale, quality).then(function(dataUrl){
        var tooLarge = dataUrlByteLength(dataUrl) > maxBytes;
        if(!tooLarge || tries>=8) return {dataUrl: dataUrl, tooLarge: tooLarge};
        if(quality > 0.35){ quality -= 0.12; } else { scale *= 0.75; }
        return attempt(tries+1);
      });
    }
    return attempt(0);
  });
}
function pdfFileToText(file, maxPages){
  maxPages = maxPages || 5;
  return ensurePdfJs().then(function(pdfjsLib){
    return file.arrayBuffer().then(function(buf){
      return pdfjsLib.getDocument({data: buf}).promise;
    });
  }).then(function(pdf){
    var n = Math.min(pdf.numPages, maxPages);
    var pagePromises = [];
    var _loop = function(pageNum){
      pagePromises.push(pdf.getPage(pageNum).then(function(page){
        return page.getTextContent().then(function(tc){
          return tc.items.map(function(it){ return it.str; }).join(" ");
        });
      }));
    };
    for(var i=1;i<=n;i++) _loop(i);
    return Promise.all(pagePromises).then(function(pages){ return pages.join("\n\n--- page suivante ---\n\n"); });
  });
}

function commandeErrorCopy(code){

function openImportCommandeModal(){
  var body =
    '<div class="hint" style="margin-bottom:10px">Déposez le PDF ou la photo de la commande reçue du client. L\'analyse (IA) lit le document et pré-remplit une nouvelle mission — à vérifier avant d\'enregistrer.</div>'+
    '<div class="field"><label>Fichier (PDF ou photo)</label><input type="file" id="cmd_file" accept="application/pdf,image/png,image/jpeg,image/webp,image/gif"/></div>'+
    '<div id="cmd_status" class="sub" style="margin-top:8px"></div>';
  openModal("Importer une commande client", body, function(modal, close){
    var buttons = [];
    var fileInput = modal.querySelector("#cmd_file");
    var statusEl = modal.querySelector("#cmd_status");
    var go = el('<button class="btn primary">Analyser</button>');
    go.addEventListener("click", function(){
      var file = fileInput.files && fileInput.files[0];
      if(!file){ toast("Choisissez un fichier"); return; }
      go.disabled = true;
      statusEl.textContent = "Préparation du document…";

      function blobToBase64(blob){
        return fileToDataUrl(blob).then(function(dataUrl){
          var i = dataUrl.indexOf(",");
          return i>=0? dataUrl.slice(i+1) : dataUrl;
        });
      }
      function runAnalyse(text, blobsWithType){
        statusEl.textContent = "Analyse en cours…";
        if(text){
          return analyserCommandeIA({text: text});
        }
        return Promise.all(blobsWithType.map(function(b){
          return blobToBase64(b.blob).then(function(data){ return {mimeType: b.mimeType, data: data}; });
        })).then(function(images){
          return analyserCommandeIA({images: images});
        });
      }
      function fail(msg){
        statusEl.textContent = msg;
        go.disabled = false;
        var marker = new Error("import_failed"); marker.handled = true;
        throw marker;
      }

      var pipeline;
      if(file.type==="application/pdf"){
        // On privilégie l'extraction du texte du PDF (fiable et gratuite, faite dans le
        // navigateur) ; on ne convertit le PDF en image (envoyée à l'IA) que s'il n'a pas
        // de texte exploitable (cas d'un PDF scanné).
        pipeline = pdfFileToText(file, 5).catch(function(e){
          fail("Impossible de lire ce PDF automatiquement. Essayez plutôt une photo ou une capture d'écran de la commande.");
        }).then(function(text){
          var trimmed = (text||"").trim();
          if(trimmed.length >= 30){
            return runAnalyse(trimmed, null);
          }
          return pdfFileToImageBlobs(file, 2).then(function(blobs){
            return runAnalyse(null, blobs.map(function(b){ return {blob:b, mimeType:"image/png"}; }));
          });
        });
      } else {
        pipeline = runAnalyse(null, [{blob:file, mimeType:file.type||"image/jpeg"}]);
      }

      pipeline.then(function(data){
        // On tente aussi de joindre le fichier original de la commande au devis qui
        // sera créé, s'il tient dans le budget de taille du document (voir
        // wireAttachmentZone / MAX_ATTACHMENT_DATAURL_BYTES). Un PDF trop volumineux pour être
        // joint tel quel (cas fréquent pour un vrai bon de commande scanné) est converti en
        // image compressée (1re page) plutôt que de repartir sans aucune pièce jointe — demande
        // explicite de Colart (10/09/2026) : toujours garder la commande du client dans le
        // dossier de la mission.
        var pdfWasConverted = false;
        var attachPromise;
        if(/^image\//.test(file.type)){
          attachPromise = compressImageFile(file, MAX_ATTACHMENT_DATAURL_BYTES).then(function(res){
            return res.tooLarge? null : {name: file.name, type: file.type, size: dataUrlByteLength(res.dataUrl), dataUrl: res.dataUrl};
          }).catch(function(){ return null; });
        } else if(file.type==="application/pdf"){
          if(file.size*1.37 <= MAX_ATTACHMENT_DATAURL_BYTES){
            attachPromise = fileToDataUrl(file).then(function(du){
              return {name: file.name, type: file.type||"application/pdf", size: dataUrlByteLength(du), dataUrl: du};
            }).catch(function(){ return null; });
          } else {
            attachPromise = pdfPageToCompressedDataUrl(file, 1, MAX_ATTACHMENT_DATAURL_BYTES).then(function(res){
              pdfWasConverted = true;
              var baseName = (file.name||"commande").replace(/\.pdf$/i,"");
              return {name: baseName+" (page 1).jpg", type: "image/jpeg", size: dataUrlByteLength(res.dataUrl), dataUrl: res.dataUrl};
            }).catch(function(){ return null; });
          }
        } else {
          attachPromise = Promise.resolve(null);
        }
        return attachPromise.then(function(fichier){
          close();
          var extracted = data || {};
          extracted.__bcFichier = fichier;
          openMissionModal(null, null, null, extracted);
          if(fichier && pdfWasConverted){
            setTimeout(function(){ toast("PDF trop volumineux pour être joint tel quel — converti en image (1re page) et joint à la mission"); }, 300);
          } else if(!fichier){
            setTimeout(function(){ toast("Le fichier de la commande n'a pas pu être joint automatiquement — joignez-le manuellement ci-dessous si besoin"); }, 300);
          }
        });
      }).catch(function(e){
        if(!e || e.handled) return;
        statusEl.textContent = "Erreur d'analyse : "+commandeErrorCopy(e.code)+(e.code? " ("+e.code+")":"");
        go.disabled = false;
      });
    });
    buttons.push(go);
    return buttons;
  });
}
