// Vue "Dispatch / En cours" du Tableau de bord (remplace la liste "Missions du jour" — 13/09/2026,
// demande de Colart, inspirée des onglets Dispatch/En cours de son appli dépannage) :
//  - Dispatch : missions du jour sans chauffeur affecté (chauffeurId vide), hors refusées —
//    "pas encore données" au sens littéral, avec un sélecteur "missionner" en ligne.
//  - En cours : missions du jour déjà affectées à un chauffeur, hors refusées, pas encore
//    terminées — clic sur la ligne ouvre la mission (comme partout ailleurs dans l'appli).
// Colonnes communes : Acceptée / Sur place / Fin sur place / Temps restant / Lieu de départ /
// Destination / Chauffeur / Immat / Client — avec les correspondances suivantes :
//  - Acceptée = statutIndex >= 0 ; Sur place = arrivé au CHARGEMENT (statutIndex >= 2) ;
//    Fin sur place = arrivé à la LIVRAISON, càd chargement terminé et parti (statutIndex >= 3).
//  - Lieu de départ / Destination / Chauffeur / Immat viennent du côté CHARGEMENT de la mission
//    (adresseChargement/adresseLivraison/chauffeurId/vehiculeId), pas du côté livraison séparée.
//  - Temps restant : côté Dispatch, échéance = heure de chargement prévue (computeCountdown,
//    déjà utilisé ailleurs) ; côté En cours, échéance = heure de livraison prévue
//    (computeCountdownLivraison), plus pertinente une fois la mission partie.
function renderDispatchEnCoursEl(missionsToday){
  var wrap = document.createElement("div");
  var dispatch = missionsToday.filter(function(m){ return !m.chauffeurId && m.statutIndex!=="refusee"; }).sort(byHeure);
  var enCours = missionsToday.filter(function(m){ return m.chauffeurId && m.statutIndex!=="refusee" && statutIndex(m)<STEP_LAST; }).sort(byHeure);

  var dispTitle = el('<div class="section-title" style="margin-top:0">🅳 Dispatch — pas encore affectées<span class="cnt">'+dispatch.length+'</span></div>');
  wrap.appendChild(dispTitle);
  wrap.appendChild(dispatchTableEl(dispatch, true));

  var ecTitle = el('<div class="section-title">🅾 En cours<span class="cnt">'+enCours.length+'</span></div>');
  wrap.appendChild(ecTitle);
  wrap.appendChild(dispatchTableEl(enCours, false));

  return wrap;
}
function dispatchTableEl(list, isDispatch){
  if(!list.length) return el('<div class="disp-wrap"><div class="disp-empty">Aucune mission</div></div>');
  var rows = list.map(function(m){
    var si = statutIndex(m);
    var accepted = m.statutIndex!=="refusee" && si>=0;
    var surPlace = m.statutIndex!=="refusee" && si>=2;
    var finSurPlace = m.statutIndex!=="refusee" && si>=3;
    var cd = isDispatch? computeCountdown(m) : computeCountdownLivraison(m);
    var immat = vehiculeImmat(m.vehiculeId);
    return {m:m, accepted:accepted, surPlace:surPlace, finSurPlace:finSurPlace, cd:cd, immat:immat};
  });
  var table = el(
    '<div class="disp-wrap"><table>'+
      '<thead><tr><th>Acceptée</th><th>Sur place</th><th>Fin sur place</th><th>Temps restant</th><th>Lieu de départ</th><th>Destination</th><th>Chauffeur</th><th>Immat</th><th>Client</th></tr></thead>'+
      '<tbody>'+
      rows.map(function(r){
        var m = r.m;
        return '<tr class="clickable" data-id="'+escapeHtml(m.id)+'">'+
          chk(r.accepted)+chk(r.surPlace)+chk(r.finSurPlace)+
          '<td>'+(r.cd? '<span class="badge '+r.cd.cls+'">'+r.cd.label+'</span>' : '—')+'</td>'+
          '<td class="disp-addr" title="'+escapeHtml(m.adresseChargement||"")+'">'+escapeHtml(m.adresseChargement||"—")+'</td>'+
          '<td class="disp-addr" title="'+escapeHtml(m.adresseLivraison||"")+'">'+escapeHtml(m.adresseLivraison||"—")+'</td>'+
          '<td class="chauffeur-cell"></td>'+
          '<td>'+(r.immat? escapeHtml(r.immat) : '<span class="disp-immat">— Non affecté —</span>')+'</td>'+
          '<td class="disp-client" title="'+escapeHtml(m.client||"")+'">'+escapeHtml(m.client||"Client non renseigné")+'</td>'+
        '</tr>';
      }).join("")+
      '</tbody></table></div>'
  );
  // Chaque ligne : clic ouvre la mission (comme partout ailleurs), sauf sur la cellule chauffeur
  // en Dispatch où un sélecteur permet d'affecter directement, sans ouvrir la fiche.
  var trs = table.querySelectorAll("tbody tr");
  trs.forEach(function(tr, i){
    var m = rows[i].m;
    tr.addEventListener("click", function(){ openMissionModal(m); });
    var cell = tr.querySelector(".chauffeur-cell");
    if(isDispatch){
      var sel = el(
        '<select class="disp-select">'+
          '<option value="">— Missionner —</option>'+
          chauffeurOptionsFor(m).map(function(c){ return '<option value="'+c.id+'">'+escapeHtml(c.nom)+(c.actif?"":" (inactif)")+'</option>'; }).join("")+
        '</select>'
      );
      sel.addEventListener("click", function(e){ e.stopPropagation(); });
      sel.addEventListener("change", function(e){
        e.stopPropagation();
        if(!state.db){ toast("Base de données indisponible"); return; }
        dbWrite(state.db.doc("missions/"+m.id).update({chauffeurId: sel.value, updatedAt: new Date().toISOString()}), sel.value? "Chauffeur affecté" : "Chauffeur retiré");
      });
      cell.appendChild(sel);
    } else {
      cell.textContent = chauffeurName(m.chauffeurId);
    }
  });
  return table;

  function chk(yes){
    return '<td><span class="disp-chk '+(yes?"yes":"no")+'">'+(yes?"✓":"✕")+'</span></td>';
  }
}

// Regroupe une liste de missions par jour de la semaine (lundi → dimanche) à partir de `ws`
// (lundi de la semaine, cf. startOfWeek) — utilisé pour la vue "semaine" du Tableau de bord et
// pour "Missions non affectées cette semaine" du Planning (ajouté 09/09/2026, demande de Colart).
// Affiche toujours les 7 jours (même sans mission) pour repérer d'un coup d'œil les jours creux.
function missionsParJourEl(list, ws){
  var wrap = el('<div class="week-by-day"></div>');
  var days = [0,1,2,3,4,5,6].map(function(i){ return addDays(ws,i); });
  var todayIso = todayISO();
  days.forEach(function(d){
    var iso = toISODate(d);
    var dayMissions = list.filter(function(m){ return m.dateMission===iso; }).sort(byHeure);
    var isToday = iso===todayIso;
    var head = el(
      '<div class="section-title" style="margin:14px 0 8px">'+
        '<span'+(isToday?' style="color:var(--accent)"':'')+'>'+escapeHtml(fmtDayLabel(d))+' '+escapeHtml(fmtDateShort(d))+'</span>'+
        (isToday? ' <span class="badge blue">Aujourd\'hui</span>' : '')+
        ' <span class="cnt">('+dayMissions.length+')</span>'+
      '</div>'
    );
    wrap.appendChild(head);
    wrap.appendChild(missionListEl(dayMissions));
  });
  return wrap;
}

// Une mission occupe-t-elle un véhicule/chauffeur ce jour-là (demande de Colart, 23/09/2026) ?
// Avant ce correctif, la grille du Planning ne se basait que sur dateMission (jour de chargement) :
// une mission chargée le 24 et livrée le 28 (transport de plusieurs jours) n'apparaissait donc que
// le 24, jamais entre les deux ni le 28. On considère maintenant la mission comme occupant toute la
// période du chargement à la livraison prévue, jour par jour. Si aucune date de livraison n'est
// renseignée (cas normal des missions d'une journée), le comportement est inchangé : un seul jour.
function missionActiveOnDate(m, iso){
  if(!m.dateMission || !iso) return false;
  var fin = (m.dateLivraisonPrevue && m.dateLivraisonPrevue>=m.dateMission) ? m.dateLivraisonPrevue : m.dateMission;
  return iso>=m.dateMission && iso<=fin;
}
// Heure à afficher/utiliser pour une mission sur UN jour précis de sa période (demande de Colart,
// 01/10/2026) : une mission multi-jours (chargement le 05/10 à 17h, livraison le 06/10 à 8h, par
// exemple) affichait à tort l'heure de chargement sur la grille du jour de livraison aussi — la
// case du 06/10 montrait "17:00" au lieu de "08:00". Le jour de chargement (dateMission) garde
// l'heure de chargement (heureDebut) ; tout jour suivant de la période (notamment le jour de
// livraison) utilise l'heure de livraison prévue si elle est renseignée. Si elle ne l'est pas, on
// retombe sur l'heure de chargement comme avant (comportement inchangé pour les missions sans
// heure de livraison précisée).
function heureEffectivePourJour(m, dateIso){
  if(dateIso && m.dateMission && dateIso!==m.dateMission && m.heureLivraisonPrevue) return m.heureLivraisonPrevue;
  return m.heureDebut;
}
function missionSortHeurePourJour(m, dateIso){
  var h = heureEffectivePourJour(m, dateIso);
  if(h) return h;
  var info = CRENEAU_INFO[m.creneau];
  return info? info.approxHeure : "99:99";
}
function byHeurePourJour(dateIso){
  return function(a,b){ return missionSortHeurePourJour(a,dateIso).localeCompare(missionSortHeurePourJour(b,dateIso)); };
}

/* ================= Planning ================= */
function renderPlanning(){
  var wrap = document.createElement("div");
  var today = todayISO();

  // Barre d'actions (le sélecteur de semaine a été retiré le 11/09/2026 : la grille et la carte
  // ont chacune leur propre navigation par JOUR désormais, la semaine n'est plus pertinente ici —
  // elle reste utilisée sur le Tableau de bord, "Missions de la semaine").

    '<div class="week-nav">'+
      '<button class="btn sm" id="newImportPlanning">+ Importer une commande</button>'+

      '<button class="btn primary sm" id="newMissionPlanning">+ Nouvelle mission</button>'+
      '<button class="btn sm" id="newRdvPlanning">+ RDV Big Boss</button>'+
    '</div>'
  );
  nav.querySelector("#newImportPlanning").addEventListener("click", function(){ openImportCommandeModal(); });
  nav.querySelector("#newMissionPlanning").addEventListener("click", function(){ openMissionModal(null, today); });
  nav.querySelector("#newDevisPlanning").addEventListener("click", function(){ openDevisModal(null); });
  nav.querySelector("#newRdvPlanning").addEventListener("click", function(){ openRdvBigBossModal(null, state.planningGridDate||today); });
  wrap.appendChild(nav);

  // Bascule Grille / Carte — ajoutée 10/09/2026 (demande de Colart : voir l'emplacement des
  // chauffeurs et les missions restant à placer sur une carte du jour, en plus de la grille
  // hebdomadaire existante — celle-ci reste disponible, rien n'a été retiré).
  var viewToggle = el(
    '<div class="view-toggle">'+
      '<button class="'+(state.planningView==="grille"?"active":"")+'" data-view="grille">📋 Grille jour</button>'+
      '<button class="'+(state.planningView==="carte"?"active":"")+'" data-view="carte">🗺️ Carte du jour</button>'+
    '</div>'
  );
  viewToggle.querySelectorAll("button").forEach(function(btn){
    btn.addEventListener("click", function(){ state.planningView=btn.getAttribute("data-view"); render(); });
  });
  wrap.appendChild(viewToggle);

  if(state.planningView==="carte"){
    wrap.appendChild(renderPlanningCarte());
    return wrap;
  }

  wrap.appendChild(el('<div class="hint" style="margin-bottom:10px">Couleur des missions selon le type choisi à la création : '+
    TYPE_MISSION_OPTIONS.map(function(t){ return '<span class="badge '+t.badgeCls+'" style="margin:0 4px">'+t.icon+' '+escapeHtml(t.label)+'</span>'; }).join(" ")+
  '</div>'));

  // Grille véhicules — vue JOUR. Un seul jour à la fois, navigable.
  var gridDate = state.planningGridDate || today;
  var gd = new Date(gridDate+"T00:00:00");
  var isTodayGrid = gridDate===today;

  var dayNav = el(
    '<div class="week-nav">'+
      '<button class="btn sm" id="gridPrevDay">←</button>'+
      '<div class="lbl">'+escapeHtml(fmtDayLabel(gd))+' '+escapeHtml(fmtDateShort(gd))+(isTodayGrid?' <span class="badge blue">Aujourd\'hui</span>':'')+congeDayBadgesHtml(gridDate)+rdvBigBossBadgesHtml(gridDate)+'</div>'+
      '<button class="btn sm" id="gridNextDay">→</button>'+
      '<button class="btn sm" id="gridToday">Aujourd\'hui</button>'+
      '<label class="day-search" title="Aller à un jour précis">🔍 <input type="date" id="gridDaySearch" value="'+gridDate+'"></label>'+
    '</div>'
  );
  dayNav.querySelector("#gridPrevDay").addEventListener("click", function(){ state.planningGridDate=toISODate(addDays(gd,-1)); render(); });
  dayNav.querySelector("#gridNextDay").addEventListener("click", function(){ state.planningGridDate=toISODate(addDays(gd,1)); render(); });
  dayNav.querySelector("#gridToday").addEventListener("click", function(){ state.planningGridDate=today; render(); });
  dayNav.querySelector("#gridDaySearch").addEventListener("change", function(){ if(this.value){ state.planningGridDate=this.value; render(); } });
  dayNav.querySelectorAll(".rdv-badge").forEach(function(b){
    b.addEventListener("click", function(){
      var r = state.rdvBigBoss.find(function(x){ return x.id===b.getAttribute("data-rdv"); });
      if(r) openRdvBigBossModal(r);
    });
  });
  wrap.appendChild(dayNav);

  function missionCardHtml(m){
    var stClass = m.statutIndex==="refusee" ? "st-refusee" : "st-"+statutIndex(m);
    // Teinte de fond par type de mission (10/09/2026, demande de Colart) — en plus de la barre
    // de gauche qui reste dédiée au statut de la mission (st-*).
    var tInfo = typeMissionInfo(m.typeMission);
    var typeClass = tInfo? " type-"+m.typeMission.replace(/_/g,"-") : "";
    var heureTxt = heureEffectivePourJour(m, gridDate) || creneauBadgeHtml(m) || "—";
    var drvTxt = m.chauffeurId? escapeHtml(chauffeurName(m.chauffeurId)) : '<span style="color:var(--amber)">⚠️ Sans chauffeur</span>';
    return '<div class="mcard '+stClass+typeClass+'" draggable="true" data-mid="'+m.id+'">'+
      '<div class="t">'+escapeHtml(heureTxt)+'</div><div class="c">'+escapeHtml(m.client||"—")+'</div>'+
      '<div class="drv">'+drvTxt+'</div>'+
    '</div>';
  }

  // Seuls les camions-grue et tracteurs (jamais une remorque/plateau/porte-engins, ni un véhicule
  // de type "Autre") ont leur propre ligne — voir TRAILER_TYPES.
  var colVehicules = state.vehicules.filter(function(v){
    return TRAILER_TYPES.indexOf(v.type)===-1 && v.type!=="Autre";
  }).sort(function(a,b){ return (a.immatriculation||"").localeCompare(b.immatriculation||""); });
  var colVehiculeIds = {};
  colVehicules.forEach(function(v){ colVehiculeIds[v.id]=true; });

  // Créneaux horaires de la journée (2e refonte du Planning, 11/09/2026, demande de Colart :
  // véhicules en lignes à gauche façon planning papier, créneaux en colonnes à droite — "un
  // tableau avec les mêmes véhicules sur une colonne à gauche [...] le reste des colonnes vers la
  // droite mettre les heures de la journée exemple 8h-12h et 14h-18h", maquette validée avant
  // intégration ("très bien")). Une mission sans heure prévue est rangée par défaut sur le
  // créneau du matin ; le pivot horaire est fixé à 13h (une mission commençant à 12h/12h30, en
  // léger débordement du matin, reste affichée sur le créneau du matin plutôt que de basculer).
  var SLOT_DEFS = [
    {key:"matin", label:"08h00 – 12h00", start:"08:00"},
    {key:"aprem", label:"14h00 – 18h00", start:"14:00"}
  ];
  function slotKeyFor(heureDebut){
    if(!heureDebut) return SLOT_DEFS[0].key;
    var h = parseInt(String(heureDebut).split(":")[0],10);
    if(isNaN(h)) return SLOT_DEFS[0].key;
    return h<13 ? SLOT_DEFS[0].key : SLOT_DEFS[1].key;
  }

  var table = document.createElement("div");
  table.className = "planning-grid";
  var slotHeadHtml = SLOT_DEFS.map(function(s){ return '<div class="pg-slothd">'+escapeHtml(s.label)+'</div>'; }).join("");
  var rowsHtml = "";
  colVehicules.forEach(function(veh){
    var missions = state.missions.filter(function(m){ return m.vehiculeId===veh.id && missionActiveOnDate(m, gridDate); });
    rowsHtml += '<div class="pg-rowhd"><span class="immat">'+escapeHtml(veh.immatriculation||"—")+'</span><span class="veh-type-tag">'+escapeHtml(veh.type||"")+'</span></div>';
    SLOT_DEFS.forEach(function(s){
      var slotMissions = missions.filter(function(m){ return slotKeyFor(heureEffectivePourJour(m, gridDate))===s.key; }).sort(byHeurePourJour(gridDate));
      rowsHtml += '<div class="pg-cell vg-cell" data-vehicule="'+veh.id+'" data-date="'+gridDate+'" data-slot="'+s.key+'" data-heure="'+s.start+'">'+
        slotMissions.map(missionCardHtml).join("")+
        '<button class="add-cell-btn" data-vehicule="'+veh.id+'" data-date="'+gridDate+'" data-heure="'+s.start+'">+</button>'+
      '</div>';
    });
  });

  var autresMissions = state.missions.filter(function(m){
    return m.vehiculeId && !colVehiculeIds[m.vehiculeId] && missionActiveOnDate(m, gridDate);
  });
  rowsHtml += '<div class="pg-rowhd pg-rowhd-autres"><span class="immat">Autres</span><span class="veh-type-tag">Remorques, plateaux, porte-engins…</span></div>';
  SLOT_DEFS.forEach(function(s){
    var slotMissions = autresMissions.filter(function(m){ return slotKeyFor(heureEffectivePourJour(m, gridDate))===s.key; }).sort(byHeurePourJour(gridDate));
    rowsHtml += '<div class="pg-cell pg-cell-readonly">'+(slotMissions.map(missionCardHtml).join("") || '<div class="empty" style="padding:6px;font-size:11.5px">—</div>')+'</div>';
  });

  table.innerHTML = colVehicules.length
    ? '<div class="pg-wrap"><div class="pg-grid" style="grid-template-columns:180px repeat('+SLOT_DEFS.length+',1fr)">'+
        '<div class="pg-corner">Véhicule</div>'+slotHeadHtml+rowsHtml+
      '</div></div>'
    : '<div class="empty" style="padding:20px">Aucun camion-grue/tracteur — ajoutez-en dans l\'onglet Flotte.</div>';
  wrap.appendChild(table);

  // Missions de ce jour-là pas encore posées sur un véhicule — à glisser sur la grille.
  var unassigned = state.missions.filter(function(m){ return !m.vehiculeId && missionActiveOnDate(m, gridDate); }).sort(byHeurePourJour(gridDate));
  var poolWrap = null;
  if(unassigned.length){
    var us = el('<div class="unassigned-strip"><div class="section-title">Missions à placer sur un véhicule <span class="cnt">('+unassigned.length+')</span></div><div class="vg-pool" id="vgPool"></div></div>');
    poolWrap = us.querySelector("#vgPool");
    unassigned.forEach(function(m){
      poolWrap.appendChild(el(missionCardHtml(m)));
    });
    wrap.appendChild(us);
  }

  // Glisser-déposer : une carte mission (grille ou bande "à placer") peut être lâchée sur
  // n'importe quelle colonne véhicule, ou revenir dans la bande pour être détachée d'un véhicule.
  // La colonne "Autres" n'est volontairement pas une cible de dépose (elle ne correspond pas à un
  // véhicule précis) : ses missions se réaffectent depuis la fiche mission.
  var dragMid = null;
  function wireCard(node){
    node.addEventListener("dragstart", function(e){
      dragMid = node.getAttribute("data-mid");
      node.classList.add("dragging");
      if(e.dataTransfer){ e.dataTransfer.effectAllowed = "move"; try{ e.dataTransfer.setData("text/plain", dragMid); }catch(err){} }
    });
    node.addEventListener("dragend", function(){ node.classList.remove("dragging"); dragMid=null; });
    node.addEventListener("click", function(){
      var m = state.missions.find(function(x){ return x.id===node.getAttribute("data-mid"); });
      if(m) openMissionModal(m);
    });
  }
  wrap.querySelectorAll(".mcard").forEach(wireCard);

  table.querySelectorAll(".vg-cell").forEach(function(td){
    td.addEventListener("dragover", function(e){ e.preventDefault(); td.classList.add("drag-over"); });
    td.addEventListener("dragleave", function(){ td.classList.remove("drag-over"); });
    td.addEventListener("drop", function(e){
      e.preventDefault();
      td.classList.remove("drag-over");
      var mid = (e.dataTransfer && e.dataTransfer.getData("text/plain")) || dragMid;
      if(!mid) return;
      var m = state.missions.find(function(x){ return x.id===mid; });
      if(!m) return;
      var vehiculeId = td.getAttribute("data-vehicule");
      var dateIso = td.getAttribute("data-date");
      var slotKey = td.getAttribute("data-slot");
      var patch = { vehiculeId: vehiculeId, updatedAt: new Date().toISOString() };
      // Une mission de plusieurs jours (chargement/livraison différents) est désormais visible sur
      // toute sa période (demande de Colart, 23/09/2026) — donc aussi sur des jours où on ne veut
      // PAS déplacer sa date de chargement, juste lui affecter un véhicule. On ne touche donc à la
      // date/l'heure que si on dépose sur la grille du jour de chargement réel de la mission (ou si
      // c'est une mission d'un seul jour, comportement inchangé).
      var isChargementDay = !m.dateLivraisonPrevue || m.dateLivraisonPrevue===m.dateMission || m.dateMission===dateIso;
      if(isChargementDay){
        patch.dateMission = dateIso;
        // Si la mission déposée ne tombe pas déjà dans ce créneau (heure vide, ou dans l'autre
        // créneau), on cale son heure prévue sur le début du créneau visé — sinon elle resterait
        // affichée dans son ancien créneau malgré le déplacement visuel.
        if(slotKey && slotKeyFor(m.heureDebut)!==slotKey){ patch.heureDebut = td.getAttribute("data-heure"); }
        if(m.vehiculeId===vehiculeId && m.dateMission===dateIso && !patch.heureDebut) return;
      } else {
        if(m.vehiculeId===vehiculeId) return;
      }
      dbWrite(state.db.doc("missions/"+mid).update(patch), "Mission affectée à "+vehiculeLabel(vehiculeId)+(isChargementDay? (" le "+fmtDateFR(dateIso)) : ""));
    });
  });
  table.querySelectorAll(".add-cell-btn").forEach(function(node){
    node.addEventListener("click", function(){
      openMissionModal(null, node.getAttribute("data-date"), null, null, null, node.getAttribute("data-vehicule"), node.getAttribute("data-heure"));
    });
  });

  if(poolWrap){
    poolWrap.addEventListener("dragover", function(e){ e.preventDefault(); poolWrap.classList.add("drag-over"); });
    poolWrap.addEventListener("dragleave", function(){ poolWrap.classList.remove("drag-over"); });
    poolWrap.addEventListener("drop", function(e){
      e.preventDefault();
      poolWrap.classList.remove("drag-over");
      var mid = (e.dataTransfer && e.dataTransfer.getData("text/plain")) || dragMid;
      if(!mid) return;
      var m = state.missions.find(function(x){ return x.id===mid; });
      if(!m || !m.vehiculeId) return;
      dbWrite(state.db.doc("missions/"+mid).update({
        vehiculeId: null, updatedAt: new Date().toISOString()
      }), "Mission détachée du véhicule");
    });
  }

  return wrap;
}

// Vue "Carte du jour" du Planning — ajoutée 10/09/2026 (demande de Colart, maquette validée avant
// intégration). Carte schématique (pas de fond de carte réel, bloqué au niveau réseau — voir
// Décisions d'architecture dans overview.md) construite à partir des vraies coordonnées des villes
// connues (TOWN_COORDS). Affiche : la position des chauffeurs actifs (verte si mise à jour depuis
// moins de 5 min, grise sinon avec l'heure de dernière position), et les missions du jour pas
// encore affectées, positionnées sur leur ville de chargement (extraite de l'adresse) quand elle
// est reconnue — sinon la mission reste listée sous la carte plutôt que d'être mal placée.
function renderPlanningCarte(){
  var wrap = document.createElement("div");
  var dateIso = state.planningMapDate || todayISO();
  var d = new Date(dateIso+"T00:00:00");
  var todayIso = todayISO();

  var dayNav = el(
    '<div class="week-nav">'+
      '<button class="btn sm" id="mapPrevDay">←</button>'+
      '<div class="lbl">'+escapeHtml(fmtDayLabel(d))+' '+escapeHtml(fmtDateShort(d))+(dateIso===todayIso?' <span class="badge blue">Aujourd\'hui</span>':'')+congeDayBadgesHtml(dateIso)+rdvBigBossBadgesHtml(dateIso)+'</div>'+
      '<button class="btn sm" id="mapNextDay">→</button>'+
      '<button class="btn sm" id="mapToday">Aujourd\'hui</button>'+
      '<label class="day-search" title="Aller à un jour précis">🔍 <input type="date" id="mapDaySearch" value="'+dateIso+'"></label>'+
    '</div>'
  );
  dayNav.querySelector("#mapPrevDay").addEventListener("click", function(){ state.planningMapDate=toISODate(addDays(d,-1)); render(); });
  dayNav.querySelector("#mapNextDay").addEventListener("click", function(){ state.planningMapDate=toISODate(addDays(d,1)); render(); });
  dayNav.querySelector("#mapToday").addEventListener("click", function(){ state.planningMapDate=todayIso; render(); });
  dayNav.querySelector("#mapDaySearch").addEventListener("change", function(){ if(this.value){ state.planningMapDate=this.value; render(); } });
  dayNav.querySelectorAll(".rdv-badge").forEach(function(b){
    b.addEventListener("click", function(){
      var r = state.rdvBigBoss.find(function(x){ return x.id===b.getAttribute("data-rdv"); });
      if(r) openRdvBigBossModal(r);
    });
  });
  wrap.appendChild(dayNav);

  wrap.appendChild(el('<div class="hint" style="margin-bottom:10px">'+
    TYPE_MISSION_OPTIONS.map(function(t){ return '<span class="badge '+t.badgeCls+'" style="margin:0 4px 4px 0">'+t.icon+' '+escapeHtml(t.label)+'</span>'; }).join(" ")+
    ' &nbsp; 🟢 chauffeur en ligne · ⚪ dernière position connue &nbsp; · &nbsp; Carte schématique (positions approximatives par ville, pas un fond de carte réel)'+
  '</div>'));

  var activeDrivers = state.chauffeurs.filter(function(c){ return c.actif; });
  var driversWithPos = activeDrivers.filter(function(c){ return c.position && typeof c.position.lat==="number"; });
  var driversNoPos = activeDrivers.filter(function(c){ return !(c.position && typeof c.position.lat==="number"); });

  var dayMissions = state.missions.filter(function(m){ return m.dateMission===dateIso && !m.chauffeurId && m.statutIndex!=="refusee"; });
  var placeable = [], unplaceable = [];
  dayMissions.forEach(function(m){
    var key = resolveTownKey(missionVilleChargement(m));
    if(key) placeable.push({m:m, geo:TOWN_COORDS[key], ville:key}); else unplaceable.push(m);
  });

  var VW=900, VH=460, PAD=56;
  // Emprise fixe : villes-repères + côte + chauffeurs positionnés, pour que le cadrage ne "saute"
  // pas d'un jour à l'autre selon les missions du moment.
  var extentPts = ANCHOR_TOWNS.map(function(k){ return TOWN_COORDS[k]; }).concat(COAST);
  driversWithPos.forEach(function(c){ extentPts.push(c.position); });
  placeable.forEach(function(p){ extentPts.push(p.geo); });
  var project = buildMapProjection(extentPts, VW, VH, PAD);

  var svg = ['<svg id="planningMapSvg" viewBox="0 0 '+VW+' '+VH+'" xmlns="http://www.w3.org/2000/svg" style="display:block;width:100%;height:auto">'];
  svg.push('<rect x="0" y="0" width="'+VW+'" height="'+VH+'" fill="var(--surface-2)"></rect>');
  var cp = COAST.map(function(p){ return project(p.lat,p.lon); });
  svg.push('<path d="'+coastPathD(cp,VW,VH)+'" fill="var(--surface)" stroke="var(--border-2)" stroke-width="2"></path>');

  // Villes affichées : repères fixes + toute ville concernée par une mission du jour à placer.
  var labelSet = {};
  ANCHOR_TOWNS.forEach(function(k){ labelSet[k]=true; });
  placeable.forEach(function(p){ labelSet[p.ville]=true; });
  Object.keys(labelSet).forEach(function(key){
    var coords = TOWN_COORDS[key];
    if(!coords) return;
    var p = project(coords.lat, coords.lon);
    svg.push('<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="2.4" fill="var(--text-3)"></circle>');
    var label = key.toLowerCase().replace(/(^|\s)\S/g, function(c){ return c.toUpperCase(); });
    svg.push('<text x="'+(p.x+6).toFixed(1)+'" y="'+(p.y+4).toFixed(1)+'" font-size="11" fill="var(--text-3)">'+escapeHtml(label)+'</text>');
  });

  // Chauffeurs
  driversWithPos.forEach(function(c){
    var p = project(c.position.lat, c.position.lon);
    var recent = (Date.now()-new Date(c.position.updatedAt).getTime()) < 5*60000;
    var color = recent? "var(--green)" : "var(--text-3)";
    var cx=p.x+13, cy=p.y-20;
    svg.push(
      (recent? '<circle cx="'+cx+'" cy="'+cy+'" r="9" fill="none" stroke="'+color+'" stroke-width="2" opacity="0.55" class="map-pulse"></circle>' : '')+
      '<circle cx="'+cx+'" cy="'+cy+'" r="7" fill="'+color+'" stroke="var(--surface)" stroke-width="2"></circle>'+
      '<text x="'+(cx+10)+'" y="'+(cy+3)+'" font-size="11" font-weight="700" fill="var(--text)">'+escapeHtml(c.nom)+'</text>'+
      '<text x="'+(cx+10)+'" y="'+(cy+14)+'" font-size="9.5" fill="var(--text-3)">'+escapeHtml(fmtRelTime(c.position.updatedAt))+'</text>'
    );
  });

  // Missions à placer, groupées par ville pour répartir les pastilles qui se chevauchent.
  var byVille = {};
  placeable.forEach(function(p){ (byVille[p.ville]=byVille[p.ville]||[]).push(p); });
  var missionPins = [];
  Object.keys(byVille).forEach(function(ville){
    byVille[ville].forEach(function(p, i){
      var base = project(p.geo.lat, p.geo.lon);
      var off = pinOffset(i);
      var cx = base.x-18+off.dx*0.4, cy = base.y+18+off.dy*0.4;
      var tInfo = typeMissionInfo(p.m.typeMission);
      var color = tInfo? "var(--"+tInfo.badgeCls+")" : "var(--text-3)";
      svg.push('<g class="map-mission-pin" data-mid="'+p.m.id+'" data-cx="'+cx.toFixed(1)+'" data-cy="'+cy.toFixed(1)+'" style="cursor:pointer">'+
        '<rect x="'+(cx-9)+'" y="'+(cy-9)+'" width="18" height="18" rx="5" fill="'+color+'" stroke="var(--surface)" stroke-width="1.6"></rect>'+
        '<text x="'+cx+'" y="'+(cy+4.5)+'" text-anchor="middle" font-size="11" fill="#fff">📦</text>'+
      '</g>');
    });
  });

  svg.push('</svg>');

  var mapWrap = el('<div class="map-board"></div>');
  mapWrap.innerHTML = svg.join("");
  wrap.appendChild(mapWrap);

  mapWrap.querySelectorAll(".map-mission-pin").forEach(function(pinEl){
    pinEl.addEventListener("click", function(){
      var m = state.missions.find(function(x){ return x.id===pinEl.getAttribute("data-mid"); });
      if(m) openMapPopup(mapWrap, pinEl, m);
    });
  });

  if(driversNoPos.length){
    wrap.appendChild(el('<div class="hint" style="margin-top:8px">Sans position connue : '+escapeHtml(driversNoPos.map(function(c){return c.nom;}).join(", "))+'</div>'));
  }

  if(unplaceable.length){
    wrap.appendChild(el('<div class="section-title">Missions non localisées sur la carte <span class="cnt">('+unplaceable.length+')</span></div>'));
    wrap.appendChild(el('<div class="hint" style="margin-bottom:8px">Ville non reconnue dans l\'adresse de chargement — affectez directement ci-dessous.</div>'));
    wrap.appendChild(missionListEl(unplaceable));
  }

  return wrap;
}

function openMapPopup(mapWrap, pinEl, m){
  closeMapPopup(mapWrap);
  var pinBox = pinEl.getBoundingClientRect();
  var wrapBox = mapWrap.getBoundingClientRect();
  var tInfo = typeMissionInfo(m.typeMission);
  var popup = el(
    '<div class="map-popup">'+
      '<button type="button" class="map-popup-close">✕</button>'+
      '<h4>'+escapeHtml(m.client||"Client non renseigné")+'</h4>'+
      '<div class="row">'+escapeHtml(m.dateMission||"")+(m.heureDebut? " à "+escapeHtml(m.heureDebut):"")+(m.creneau? ' · '+creneauBadgeHtml(m):"")+'</div>'+
      (m.marchandises? '<div class="row">📦 '+escapeHtml(m.marchandises)+'</div>' : '')+
      (tInfo? '<div class="row"><span class="badge '+tInfo.badgeCls+'">'+tInfo.icon+' '+escapeHtml(tInfo.label)+'</span></div>' : '')+
      '<select class="map-popup-assign"><option value="">— Affecter un chauffeur —</option>'+
        chauffeurOptionsFor(m).map(function(c){ return '<option value="'+c.id+'">'+escapeHtml(c.nom)+'</option>'; }).join("")+
      '</select>'+
      '<button type="button" class="btn sm" style="width:100%;margin-top:8px" data-open>Ouvrir la fiche complète</button>'+
    '</div>'
  );
  popup.style.left = Math.max(8, Math.min(pinBox.left-wrapBox.left+16, wrapBox.width-246))+"px";
  popup.style.top = Math.max(8, pinBox.top-wrapBox.top-10)+"px";
  popup.querySelector(".map-popup-close").addEventListener("click", function(){ popup.remove(); });
  popup.querySelector("[data-open]").addEventListener("click", function(){ openMissionModal(m); });
  popup.querySelector(".map-popup-assign").addEventListener("change", function(e){
    if(!state.db){ toast("Base de données indisponible"); return; }
    dbWrite(state.db.doc("missions/"+m.id).update({chauffeurId: e.target.value, updatedAt: new Date().toISOString()}), "Chauffeur affecté");
    popup.remove();
  });
  mapWrap.appendChild(popup);
}
function closeMapPopup(mapWrap){
  var existing = mapWrap.querySelector(".map-popup");
  if(existing) existing.remove();
}

  presetsBox.querySelector("#dp_add").addEventListener("click", function(){ addPresetRow(null); });
  var presetsSave = el('<button class="btn primary sm" style="margin-top:12px">Enregistrer les tarifs</button>');

      var qteStr = row.querySelector(".dp-quantite").value;

function fmtTs(iso){
  if(!iso) return null;
  var d = new Date(iso);
  if(isNaN(d.getTime())) return null;
  return pad2(d.getDate())+"/"+pad2(d.getMonth()+1)+" à "+pad2(d.getHours())+":"+pad2(d.getMinutes());
}
// Pour l'input <input type="datetime-local"> : format local "AAAA-MM-JJTHH:MM", sans fuseau —
// new Date(cette_valeur) est ensuite réinterprété par le navigateur en heure locale, donc
// toDatetimeLocalValue/depuis-l'input sont l'aller-retour exact l'un de l'autre.
function toDatetimeLocalValue(iso){
  if(!iso) return "";
  var d = new Date(iso);
  if(isNaN(d.getTime())) return "";
  return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate())+"T"+pad2(d.getHours())+":"+pad2(d.getMinutes());
}

        // pour qu'un champ vidé redevienne bien "en attente", on écrit explicitement `null`.
        var newStepTimes = {};
        modal.querySelectorAll(".horod-input").forEach(function(inp){
          var key = inp.getAttribute("data-step-key");
          var val = inp.value;
          newStepTimes[key] = val? new Date(val).toISOString() : null;
        });
        data.stepTimes = newStepTimes;
      }
      if(isEdit){
        var controleeInput = modal.querySelector("#f_controlee");
        if(controleeInput){
          var controleeChecked = controleeInput.checked;
          data.controlee = controleeChecked;
          data.controleeAt = controleeChecked? (v.controleeAt || new Date().toISOString()) : null;
        }
      }
      if(existingDevis && !existingDevis.factureId){
        var bcAttenteChecked = modal.querySelector("#f_bcAttente");
        var bcRecuChecked = modal.querySelector("#f_bcRecu");
        if(bcAttenteChecked && bcRecuChecked){
          data.bonCommandeEnAttente = bcAttenteChecked.checked;
          data.bonCommandeRecu = bcRecuChecked.checked;
        }
      }
      if(JSON.stringify(data).length > 250*1024){ toast("Pièce jointe trop volumineuse pour être enregistrée — réduisez sa taille et réessayez"); return; }
      if(!state.db){ toast("Base de données indisponible"); return; }
      if(isEdit){
        dbWrite(state.db.doc("missions/"+m.id).update(data), "Mission mise à jour");
      } else {
        data.statutIndex = -1;
        data.stepTimes = {};
        data.createdAt = new Date().toISOString();
        if(fromDevis){
          // Bouton "Créer la mission" depuis un devis libre (demande de Colart, 23/09/2026) : le
          // devis vit jusqu'ici sous son propre id (créé depuis l'onglet Devis, sans mission). On le
          // réenregistre sous l'id de la nouvelle mission — même convention qu'un devis créé depuis
          // une mission (voir devisFor(), qui cherche le devis par d.id===missionId) — puis on
          // supprime l'ancien document pour ne pas laisser de doublon orphelin dans l'onglet Devis.
          dbWrite(
            state.db.collection("missions").add(data).then(function(ref){
              var relinked = Object.assign({}, fromDevis, {missionId: ref.id, updatedAt: new Date().toISOString()});
              delete relinked.id;
              return state.db.doc("devis/"+ref.id).set(relinked).then(function(){
                if(fromDevis.id && fromDevis.id!==ref.id){
                  return state.db.doc("devis/"+fromDevis.id).delete();
                }
              });
            }),
            "Mission créée à partir du devis"
          );
        } else if(extracted){
          var missionForDetails = Object.assign({}, data);
          var devisData = {
            missionId: null,
            statut: "accepte",
            numero: nextDevisNumero(client),
            dateEmission: todayISO(),
            validiteJours: 30,
            clientNom: client,
            clientAdresse: extracted.clientAdresse||"",
            clientContact: "",
            clientTel: extracted.clientTel||"",
            clientEmail: "",
            objet: "Transport pour "+client,
            details: defaultDevisDetails(missionForDetails),
            lignes: (Array.isArray(extracted.lignes)? extracted.lignes : []).map(function(l){
              return {
                designation: (l&&l.designation)||"",
                quantite: (l&&l.quantite!=null && l.quantite!=="")? l.quantite : null,
                unite: (l&&l.unite)||"",
                prixUnitaire: (l&&l.prixUnitaireHT!=null && l.prixUnitaireHT!=="")? l.prixUnitaireHT : null
              };
            }),
            noteForfait: "",
            conditionsGenerales: defaultConditionsGenerales(),
            numeroBonCommande: extracted.numeroCommande||"",
            dateBonCommande: extracted.dateCommande||"",
            montantBonCommande: (extracted.montantTTC!=null && extracted.montantTTC!=="")? extracted.montantTTC : "",
            notesBonCommande: "Commande d'achat client importée et analysée automatiquement"+(extracted.numeroCommande? (" (n°"+extracted.numeroCommande+")") : "")+" — vérifiez les lignes et montants avant envoi au client.",
            bonCommandeFichier: extracted.__bcFichier || null,
            createdAt: new Date().toISOString(),
            updatedAt: new Date().toISOString()
          };
          dbWrite(
            state.db.collection("missions").add(data).then(function(ref){
              devisData.missionId = ref.id;
              return state.db.doc("devis/"+ref.id).set(devisData);
            }),
            "Mission créée + bon de commande enregistré (à vérifier dans Devis)"
          );
        } else {
          // Case "Créer un devis" (ajoutée 12/09/2026, demande de Colart : "je gagne du temps") —
          // absente en mode édition et sur le flux d'import (qui crée déjà systématiquement un
          // devis, voir la branche extracted ci-dessus). Devis brouillon, même id que la mission
          // (comme pour le flux d'import). Si un montant a été saisi dans le champ "Montant du
          // transport" (demande de Colart, 01/10/2026), le devis part directement avec une ligne
          // "Transport" à ce prix au lieu d'une liste de lignes vide — plus besoin de repasser par
          // l'onglet Devis juste pour saisir le prix ; sinon, comportement inchangé (à compléter
          // plus tard dans l'onglet Devis).
          var creerDevisEl = modal.querySelector("#f_creerDevis");
          if(creerDevisEl && creerDevisEl.checked){
            var montantDevisEl = modal.querySelector("#f_montantDevis");
            var montantDevisVal = montantDevisEl? parseFloat(montantDevisEl.value) : NaN;
            var lignesInitiales = (!isNaN(montantDevisVal) && montantDevisEl.value.trim()!=="")?
              [{designation: "Transport", quantite: 1, prixUnitaire: montantDevisVal}] : [];
            var missionForDetails2 = Object.assign({}, data);
            var devisData2 = {
              missionId: null,
              statut: "brouillon",
              numero: nextDevisNumero(client),
              dateEmission: todayISO(),
              validiteJours: 30,
              clientNom: client,
              clientAdresse: "",
              clientContact: "",
              clientTel: "",
              clientEmail: "",
              objet: "Transport pour "+client,
              details: defaultDevisDetails(missionForDetails2),
              lignes: lignesInitiales,
              noteForfait: "",
              conditionsGenerales: defaultConditionsGenerales(),
              numeroBonCommande: "",
              dateBonCommande: "",
              montantBonCommande: "",
              notesBonCommande: "",
              bonCommandeFichier: null,
              createdAt: new Date().toISOString(),
              updatedAt: new Date().toISOString()
            };
            dbWrite(
              state.db.collection("missions").add(data).then(function(ref){
                devisData2.missionId = ref.id;
                return state.db.doc("devis/"+ref.id).set(devisData2);
              }),
              "Mission créée + devis brouillon préparé"
            );
          } else {
            dbWrite(state.db.collection("missions").add(data), "Mission créée");
          }
        }
      }
      close();
      if(!isEdit && addAnother){
        openMissionModal(null, null, null, null, siblingSeedFromData(data));
      }
    }
    var save = el('<button class="btn primary">Enregistrer</button>');
    save.addEventListener("click", function(){ doSave(false); });
    buttons.push(save);
    if(!isEdit){
      var saveAndAdd = el('<button class="btn">Enregistrer + ajouter un transport</button>');
      saveAndAdd.addEventListener("click", function(){ doSave(true); });
      buttons.push(saveAndAdd);
    }
    return buttons;
  });
}

/* ================= Onglet Devis (création libre + liste) ================= */
function renderDevisTab(){
  var wrap = document.createElement("div");
  var hd = el('<div style="display:flex;justify-content:space-between;align-items:center;"><h3>Devis</h3></div>');
  var importBtn = el('<button class="btn">+ Importer une demande</button>');
  importBtn.addEventListener("click", function(){ openImportDemandeDevisModal(); });
  var newBtn = el('<button class="btn primary">+ Création de devis</button>');
  newBtn.addEventListener("click", function(){ openDevisModal(null); });
  var btnGroup = el('<div style="display:flex;gap:8px"></div>');
  btnGroup.appendChild(importBtn);
  btnGroup.appendChild(newBtn);
  hd.appendChild(btnGroup);
  wrap.appendChild(hd);
  wrap.appendChild(el('<div class="hint" style="margin:4px 0 16px">Un devis peut être créé directement ici, sans mission (ex: pour répondre vite à une demande client), ou depuis la fiche d\'une mission. Une fois accepté, créez la mission correspondante depuis l\'onglet Planning.</div>'));

  // Recherche libre par numéro de devis OU par nom de client (demande de Colart, 01/10/2026, même
  // principe que la recherche de l'onglet Facturation) — pratique dès qu'il y a beaucoup de devis.
  var searchRow = el('<div class="field" style="max-width:280px;margin-bottom:14px"><input placeholder="🔎 Rechercher (n° ou client)…" id="devisSearchInput"/></div>');
  wrap.appendChild(searchRow);
  var searchInput = searchRow.querySelector("#devisSearchInput");
  searchInput.value = state.devisSearch||"";
  searchInput.addEventListener("input", function(){
    state.devisSearch = searchInput.value;
    render();
    // render() reconstruit tout l'onglet (dont ce champ) à chaque frappe — sans ça, le curseur
    // perdrait le focus après chaque caractère tapé. On le replace donc en fin de texte juste après.
    var freshInput = document.getElementById("devisSearchInput");
    if(freshInput){ freshInput.focus(); var v = freshInput.value; freshInput.setSelectionRange(v.length, v.length); }
  });

  var list = state.devis.filter(function(d){
    if(!state.devisSearch) return true;
    var q = state.devisSearch.toLowerCase();
    var matchNumero = (d.numero||"").toLowerCase().indexOf(q)!==-1;
    var matchClient = (d.clientNom||"").toLowerCase().indexOf(q)!==-1;
    return matchNumero || matchClient;
  }).sort(function(a,b){ return (b.updatedAt||b.createdAt||"").localeCompare(a.updatedAt||a.createdAt||""); });
  if(!list.length){
    wrap.appendChild(el('<div class="empty">'+(state.devisSearch? "Aucun devis ne correspond à cette recherche." : "Aucun devis pour le moment.")+'</div>'));
    return wrap;
  }
  var grid = el('<div class="card-grid"></div>');
  list.forEach(function(d){
    var info = devisStatutInfo(d.statut);
    var mission = d.missionId? (state.missions.find(function(m){ return m.id===d.missionId; }) || null) : null;
    var card = el('<div class="item-card"></div>');
    card.innerHTML =
      '<div class="row" style="margin-top:0;align-items:flex-start">'+
        '<div><h4 style="margin-bottom:2px">'+escapeHtml(d.numero||"(sans numéro)")+'</h4>'+
        '<div class="sub">'+escapeHtml(d.clientNom||"Client non renseigné")+'</div></div>'+
        '<span class="badge '+info.cls+'">'+info.label+'</span>'+
      '</div>'+
      '<div class="sub" style="margin-top:6px">'+fmtEUR(devisTotal(d))+' HT'+(d.dateEmission? " · "+fmtDateFR(d.dateEmission):"")+'</div>'+
      '<div class="sub">'+(mission? "Lié à la mission « "+escapeHtml(mission.client||"")+" »" : "Devis libre — aucune mission liée")+'</div>'+
      (d.bonCommandeFichier? '<div class="sub">📎 Bon de commande joint</div>' : '')+
      (d.factureId? '<div class="sub">🧾 Déjà inclus dans une facture</div>' : '');
    var btnRow = el('<div style="display:flex;gap:6px;margin-top:10px"></div>');
    if(d.bonCommandeFichier){
      var bcBtn = el('<button type="button" class="btn sm">Consulter le BC</button>');
      bcBtn.addEventListener("click", function(){ openFileAttachment(d.bonCommandeFichier); });
      btnRow.appendChild(bcBtn);
    }
    var openBtn = el('<button type="button" class="btn sm">Ouvrir</button>');
    openBtn.addEventListener("click", function(){ openDevisModal(mission, d.id); });
    btnRow.appendChild(openBtn);
    card.appendChild(btnRow);
    grid.appendChild(card);
  });
  wrap.appendChild(grid);
  return wrap;
}

/* ================= Onglet Facturation =================
   Une mission devient facturable une fois arrivée à "Fin de mission" ET dotée d'un devis (c'est
   le devis qui porte le prix définitif, modifiable à tout moment avant la facture — voir
   missionFactureEtat). Une facture regroupe une ou plusieurs missions d'un même client, en
   général sur un même mois, comme sur les factures papier de Colart (une ligne par commande).
   Le numéro de facture officiel reste un champ libre à recopier depuis le logiciel de
   comptabilité — l'appli ne génère pas de numérotation légale, seulement la préparation
   (regroupement, calcul, aperçu imprimable). */
function renderFacturation(){
  var wrap = document.createElement("div");
  wrap.appendChild(el('<h3 style="margin-bottom:4px">Facturation</h3>'));
  wrap.appendChild(el('<div class="hint" style="margin:0 0 16px">Le numéro de facture est généré automatiquement par l\'application (réglable dans Paramètres) — cette page prépare le regroupement par client, calcule les montants, génère un aperçu imprimable et un export comptable (XLSX) prêt à importer dans votre logiciel de comptabilité.</div>'));

  // Filet de sécurité "à contrôler" (09/09/2026) : les missions terminées sans devis
  // n'apparaissent jamais dans "Missions terminées à facturer" ci-dessous (pas de devis = pas de
  // ligne à facturer) — sans ce bandeau, elles resteraient invisibles et pourraient être oubliées.
  var aControlerFactu = missionsAControler();
  if(aControlerFactu.length){
    var controleBanner = el(
      '<div class="alert-banner" style="cursor:pointer;margin-bottom:16px">'+
        '<span>⚠️</span>'+
        '<div><b>'+aControlerFactu.length+' mission'+(aControlerFactu.length>1?"s":"")+' terminée'+(aControlerFactu.length>1?"s":"")+' à contrôler</b>Y compris celles sans devis, invisibles dans la liste ci-dessous tant qu\'aucun devis n\'est créé. Cliquez pour les vérifier.</div>'+
      '</div>'
    );
    controleBanner.addEventListener("click", function(){ openControleGlobalModal(); });
    wrap.appendChild(controleBanner);
  }

  // Filtre mois/année : indépendants et combinables, s'appliquent aux deux sections ci-dessous
  // (missions à facturer groupées par client, et liste des factures déjà créées).
  var filterRow = el('<div class="row" style="gap:10px;margin-bottom:16px;flex-wrap:wrap"></div>');
  var moisSelect = el('<select style="max-width:180px"></select>');
  moisSelect.appendChild(el('<option value="">Tous les mois</option>'));
  MOIS_LABELS.forEach(function(label, idx){
    var val = String(idx+1).padStart(2,"0");
    var opt = el('<option value="'+val+'">'+label.charAt(0).toUpperCase()+label.slice(1)+'</option>');
    if(state.factuFilterMois===val) opt.setAttribute("selected","selected");
    moisSelect.appendChild(opt);
  });
  moisSelect.addEventListener("change", function(){ state.factuFilterMois = moisSelect.value; render(); });
  var anneeSelect = el('<select style="max-width:140px"></select>');
  anneeSelect.appendChild(el('<option value="">Toutes les années</option>'));
  anneesDisponibles().forEach(function(annee){
    var opt = el('<option value="'+annee+'">'+annee+'</option>');
    if(state.factuFilterAnnee===annee) opt.setAttribute("selected","selected");
    anneeSelect.appendChild(opt);
  });
  anneeSelect.addEventListener("change", function(){ state.factuFilterAnnee = anneeSelect.value; render(); });
  filterRow.appendChild(moisSelect);
  filterRow.appendChild(anneeSelect);
  if(state.factuFilterMois || state.factuFilterAnnee){
    var resetBtn = el('<button type="button" class="btn sm">Réinitialiser</button>');
    resetBtn.addEventListener("click", function(){ state.factuFilterMois=""; state.factuFilterAnnee=""; render(); });
    filterRow.appendChild(resetBtn);
  }
  wrap.appendChild(filterRow);

  // Cette grille ne montre plus que les dossiers ayant encore quelque chose à traiter avant
  // facturation (demande de Colart, 23/09/2026) — un dossier entièrement facturé disparaît d'ici et
  // reste consultable dans la liste "Factures" ci-dessous (voir dossiersGroupesParClient).
  var groups = dossiersGroupesParClient(state.factuFilterMois, state.factuFilterAnnee);
  var clients = Object.keys(groups).sort();
  // Montant total HT restant à facturer (toutes les cartes ci-dessous, filtre mois/année respecté)
  // — demande de Colart, 30/10/2026.
  var totalAFacturerHT = 0, nbAFacturer = 0;
  clients.forEach(function(c){ groups[c].forEach(function(m){ totalAFacturerHT += devisTotal(devisFor(m.id)); nbAFacturer++; }); });
  wrap.appendChild(el('<div class="row" style="align-items:center;flex-wrap:wrap;gap:8px 16px;margin-bottom:6px">'+
    '<div class="section-title" style="margin:0">Missions terminées à facturer</div>'+
    '<div style="font-weight:700;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:4px 12px">Chiffre d\'affaires à facturer : '+fmtEUR(totalAFacturerHT)+' HT'+
      ' <span style="font-weight:400;color:var(--text-2);font-size:.85em">('+nbAFacturer+' mission'+(nbAFacturer>1?'s':'')+')</span></div>'+
  '</div>'));
  wrap.appendChild(el('<div class="hint" style="margin:-6px 0 10px">Code couleur : ⚪ pas traité · 🟠 en attente de bon de commande · 🟢 bon de commande reçu (cases à cocher sur chaque mission). Un dossier entièrement facturé disparaît d\'ici et reste consultable dans « Factures » ci-dessous.</div>'));
  if(!clients.length){
    wrap.appendChild(el('<div class="empty">Aucune mission terminée en attente de facturation.</div>'));
  } else {
    var grid = el('<div class="card-grid"></div>');
    clients.forEach(function(client){
      var pending = groups[client];
      var pasTraite = pending.filter(function(m){ return missionDossierEtat(m)==="pas_traite"; });
      var attenteBc = pending.filter(function(m){ return missionDossierEtat(m)==="attente_bc"; });
      var recu = pending.filter(function(m){ return missionDossierEtat(m)==="recu"; });
      // Priorité d'affichage de la carte : orange (bloqué, action requise) > blanc (rien traité) >
      // vert (reçu, prêt à facturer).
      var cardCls = attenteBc.length? "dossier-attente-bc" : (pasTraite.length? "" : "dossier-facture");
      var subLines = [];
      if(pasTraite.length){
        var totalPasTraiteHT = pasTraite.reduce(function(sum,m){ return sum + devisTotal(devisFor(m.id)); }, 0);
        subLines.push(pasTraite.length+' mission'+(pasTraite.length>1?"s":"")+' à facturer · '+fmtEUR(totalPasTraiteHT)+' HT');
      }
      if(attenteBc.length){
        var totalAttenteHT = attenteBc.reduce(function(sum,m){ return sum + devisTotal(devisFor(m.id)); }, 0);
        subLines.push('⚠️ '+attenteBc.length+' mission'+(attenteBc.length>1?"s":"")+' en attente de bon de commande · '+fmtEUR(totalAttenteHT)+' HT');
      }
      if(recu.length){
        var totalRecuHT = recu.reduce(function(sum,m){ return sum + devisTotal(devisFor(m.id)); }, 0);
        subLines.push(recu.length+' mission'+(recu.length>1?"s":"")+' — bon de commande reçu · '+fmtEUR(totalRecuHT)+' HT');
      }
      var card = el('<div class="item-card'+(cardCls?" "+cardCls:"")+'" style="cursor:pointer"></div>');
      card.innerHTML =
        '<h4>'+escapeHtml(client)+'</h4>'+
        subLines.map(function(s){ return '<div class="sub">'+s+'</div>'; }).join("");
      function openThisDossier(){ openClientAFacturerModal(client, pending); }
      var btn = el('<button type="button" class="btn primary sm" style="margin-top:10px">Consulter</button>');
      btn.addEventListener("click", function(e){ e.stopPropagation(); openThisDossier(); });
      card.appendChild(btn);
      card.addEventListener("click", openThisDossier);
      grid.appendChild(card);
    });
    wrap.appendChild(grid);
  }

  var facturesTitleRow = el('<div class="row" style="align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px"></div>');
  facturesTitleRow.appendChild(el('<div class="section-title" style="margin:0">Factures</div>'));
  // Export comptable (journal des ventes transport) — demande de Colart, 22/09/2026, validée par sa
  // comptable : génère le fichier Excel au format observé dans son export EDITIONSCOMPTABLES
  // (3 lignes par facture : client débité du TTC, vente créditée du HT, TVA créditée), uniquement
  // pour les factures de transport créées depuis l'application.
  var exportComptaBtn = el('<button type="button" class="btn sm">📊 Export comptable (XLSX)</button>');
  exportComptaBtn.addEventListener("click", function(){ openExportComptableModal(); });
  facturesTitleRow.appendChild(exportComptaBtn);
  wrap.appendChild(facturesTitleRow);
  // Recherche libre par numéro de facture OU par nom de client (demande de Colart, 21/09/2026 puis
  // étendue au client le 24/09/2026), combinable avec les filtres mois/année ci-dessus.
  var searchRow = el('<div class="field" style="max-width:280px;margin-bottom:10px"><input placeholder="🔎 Rechercher (n° ou client)…" id="factuSearchInput"/></div>');
  wrap.appendChild(searchRow);
  var searchInput = searchRow.querySelector("#factuSearchInput");
  searchInput.value = state.factuSearchNumero||"";
  searchInput.addEventListener("input", function(){
    state.factuSearchNumero = searchInput.value;
    render();
    // render() reconstruit tout le contenu de l'onglet (dont ce champ) à chaque frappe — sans ça,
    // le curseur perdrait le focus après chaque caractère tapé. On le replace donc en fin de texte
    // juste après la reconstruction.
    var freshInput = document.getElementById("factuSearchInput");
    if(freshInput){ freshInput.focus(); var v = freshInput.value; freshInput.setSelectionRange(v.length, v.length); }
  });

  var list = state.factures.filter(function(f){
    var moisStr = f.mois||"";
    var annee = moisStr.slice(0,4), mois = moisStr.slice(5,7);
    if(state.factuFilterAnnee && annee!==state.factuFilterAnnee) return false;
    if(state.factuFilterMois && mois!==state.factuFilterMois) return false;
    if(state.factuSearchNumero){
      var q = state.factuSearchNumero.toLowerCase();
      var matchNumero = (f.numero||"").toLowerCase().indexOf(q)!==-1;
      var matchClient = (f.client||"").toLowerCase().indexOf(q)!==-1;
      if(!matchNumero && !matchClient) return false;
    }
    return true;
  }).sort(function(a,b){ return (b.updatedAt||b.createdAt||"").localeCompare(a.updatedAt||a.createdAt||""); });
  if(!list.length){
    wrap.appendChild(el('<div class="empty">'+((state.factuFilterMois||state.factuFilterAnnee)?"Aucune facture pour cette période.":"Aucune facture pour le moment.")+'</div>'));
    wrap.appendChild(factuTotalCaHtml(list));
    return wrap;
  }
  var fgrid = el('<div class="card-grid"></div>');
  list.forEach(function(f){
    var info = factureStatutInfo(f.statut);
    var estAvoir = (f.type||"facture")==="avoir";
    var factureOrigine = estAvoir? state.factures.find(function(x){ return x.id===f.avoirDeFactureId; }) : null;
    var card = el('<div class="item-card"></div>');
    card.innerHTML =
      '<div class="row" style="margin-top:0;align-items:flex-start">'+
        '<div><h4 style="margin-bottom:2px">'+escapeHtml(f.numero||"(numéro à saisir)")+(estAvoir? ' <span class="badge danger">AVOIR</span>' : '')+'</h4>'+
        '<div class="sub">'+escapeHtml(f.client||"Client non renseigné")+'</div></div>'+
        '<span class="badge '+info.cls+'">'+info.label+'</span>'+
      '</div>'+
      (estAvoir? '<div class="sub">↩ Avoir sur facture '+escapeHtml(factureOrigine? (factureOrigine.numero||"") : "(supprimée)")+'</div>' : '')+
      '<div class="sub" style="margin-top:6px">'+fmtEUR(factureTotal(f))+' HT · '+escapeHtml(moisLabel(f.mois))+'</div>'+
      '<div class="sub">'+(f.lignes?f.lignes.length:0)+' ligne'+((f.lignes&&f.lignes.length>1)?"s":"")+'</div>';
    var openBtn = el('<button type="button" class="btn sm" style="margin-top:10px">Ouvrir</button>');
    openBtn.addEventListener("click", function(){ openFactureModal(f.client, null, f.id); });
    card.appendChild(openBtn);
    fgrid.appendChild(card);
  });
  wrap.appendChild(fgrid);
  wrap.appendChild(factuTotalCaHtml(list));
  return wrap;
}
// Ligne "Total chiffre d'affaires" en bas de l'onglet Facturation — somme des factures actuellement
// listées ci-dessus (respecte le filtre mois/année en cours, comme la liste elle-même) (demande de
// Colart, 18/09/2026).
function factuTotalCaHtml(list){
  var total = list.reduce(function(sum,f){ return sum + factureTotal(f); }, 0);
  var periodeLabel = (state.factuFilterMois||state.factuFilterAnnee)? " (période filtrée)" : "";
  return el(
    '<div class="item-card" style="margin-top:16px;background:var(--surface-2);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">'+
      '<span style="font-weight:700">Total chiffre d\'affaires'+periodeLabel+'</span>'+
      '<span style="font-weight:700;font-size:1.15em">'+fmtEUR(total)+' HT</span>'+
    '</div>'
  );
}

// Export comptable (journal des ventes transport) — demande de Colart, 22/09/2026, validée par sa
// comptable. Format observé dans son fichier EDITIONSCOMPTABLES (pas d'en-tête, colonnes Date /
// N° pièce / N° compte / Libellé / Débit / Crédit) : pour chaque facture, une ligne client (débit
// TTC), une ligne compte de vente (crédit HT), et une ligne TVA (crédit TVA, omise si TVA à 0 %).
// Ne couvre que les factures créées depuis l'application (transport) — Alpha/RD4/Powerpanne, avoirs
// et factures Magasin/Atelier continuent d'être gérés comme avant, en dehors de l'application.
function factureCompteClient(f){
  var c = state.clients.find(function(x){ return clientLabel(x)===(f&&f.client); });
  return (c && c.numero!=null)? String(c.numero) : "";
}
function openExportComptableModal(){
  var mois = state.factuFilterMois || pad2(new Date().getMonth()+1);
  var annee = state.factuFilterAnnee || String(new Date().getFullYear());
  var body =
    '<div class="hint" style="margin-bottom:10px">Génère le fichier des écritures comptables (journal des ventes) pour les factures du mois choisi, au format attendu par votre logiciel de comptabilité. Décochez celles à exclure.</div>'+
    '<div class="field-row">'+
      '<div class="field"><label>Mois</label><select id="ec_mois">'+
        MOIS_LABELS.map(function(label, idx){ var val=pad2(idx+1); return '<option value="'+val+'" '+(val===mois?"selected":"")+'>'+label.charAt(0).toUpperCase()+label.slice(1)+'</option>'; }).join("")+
      '</select></div>'+
      '<div class="field"><label>Année</label><select id="ec_annee">'+
        anneesDisponibles().map(function(a){ return '<option value="'+a+'" '+(a===annee?"selected":"")+'>'+a+'</option>'; }).join("")+
      '</select></div>'+
    '</div>'+
    '<div id="ec_list"></div>';
  openModal("Export comptable — journal des ventes", body, function(modal, close){
    var listEl = modal.querySelector("#ec_list");
    function refreshList(){
      var m = modal.querySelector("#ec_mois").value, a = modal.querySelector("#ec_annee").value;
      var moisStr = a+"-"+m;
      // Les avoirs sont inclus dans cet export (demande de Colart, 24/09/2026) : leurs lignes sont
      // en négatif (voir openCreerAvoirModal), donc l'écriture générée compense mécaniquement
      // celle de la facture d'origine — compte client crédité au lieu de débité, ventes/TVA
      // débitées au lieu de créditées.
      var factures = state.factures.filter(function(f){ return f.mois===moisStr && f.statut!=="brouillon"; })
        .sort(function(x,y){ return (x.numero||"").localeCompare(y.numero||""); });
      if(!factures.length){
        listEl.innerHTML = '<div class="empty">Aucune facture émise/payée pour '+moisLabel(moisStr)+'.</div>';
        return;
      }
      listEl.innerHTML = '<div class="facture-review-list"></div>';
      var inner = listEl.querySelector(".facture-review-list");
      factures.forEach(function(f){
        var compte = factureCompteClient(f);
        var estAvoir = (f.type||"facture")==="avoir";
        // "C" + numéro, comme affiché dans le fichier comptable de Colart — montré ici tel qu'il
        // sortira dans l'export, pour vérification avant de générer le fichier.
        var compteAffiche = compte? (' <span style="color:var(--text-2)">— compte C'+escapeHtml(compte)+'</span>') : "";
        var warn = compte? "" : ' <span style="color:var(--amber);font-weight:700">⚠️ compte client introuvable — vérifiez que le nom du client correspond exactement à sa fiche</span>';
        var avoirTag = estAvoir? ' <span class="badge danger">AVOIR</span>' : "";
        inner.appendChild(el(
          '<div class="facture-review-row">'+
            '<input type="checkbox" class="ec-check" data-facture-id="'+f.id+'" '+(compte?"checked":"")+'/>'+
            '<span class="fr-date">'+escapeHtml(f.numero||"—")+avoirTag+'</span>'+
            '<span class="fr-ref">'+escapeHtml(f.client||"")+compteAffiche+warn+'</span>'+
            '<span class="fr-montant">'+fmtEUR(factureTTC(f))+' TTC</span>'+
          '</div>'
        ));
      });
    }
    modal.querySelector("#ec_mois").addEventListener("change", refreshList);
    modal.querySelector("#ec_annee").addEventListener("change", refreshList);
    refreshList();
    var goBtn = el('<button class="btn primary">Générer le fichier Excel</button>');
    goBtn.addEventListener("click", function(){
      var checked = Array.prototype.slice.call(modal.querySelectorAll(".ec-check:checked")).map(function(cb){ return cb.getAttribute("data-facture-id"); });
      if(!checked.length){ toast("Sélectionnez au moins une facture"); return; }
      var factures = checked.map(function(id){ return state.factures.find(function(f){ return f.id===id; }); }).filter(Boolean);
      var m = modal.querySelector("#ec_mois").value, a = modal.querySelector("#ec_annee").value;
      exportComptableXlsx(factures, a+"-"+m);
      close();
    });
    return [goBtn];
  });
}
function exportComptableXlsx(factures, moisStr){
  ensureXlsxJs().then(function(XLSX){
    var rows = [];
    factures.forEach(function(f){
      // Dans le fichier de Colart, le compte client (1ère ligne de chaque facture) s'affiche
      // "C1001272" — vérifié dans le fichier même : la valeur stockée est le nombre 1001272, avec
      // un format d'affichage Excel personnalisé "C"# qui ajoute le "C". Les comptes de vente/TVA,
      // eux, sont du texte brut sans préfixe ("70631700", "44571000"). On écrit donc directement la
      // valeur texte "C"+numéro pour le compte client, afin que le "C" soit bien présent quel que
      // soit la façon dont le logiciel de comptabilité relit le fichier (valeur brute ou affichée).
      var compteClientRaw = factureCompteClient(f);
      var compte = compteClientRaw? ("C"+compteClientRaw) : "?????";
      var ht = Math.round(factureTotal(f)*100)/100;
      var tva = Math.round(factureTVA(f)*100)/100;
      var ttc = Math.round(factureTTC(f)*100)/100;
      // Un avoir a des lignes en négatif (voir openCreerAvoirModal) : l'écriture générée ci-dessous
      // compense donc mécaniquement celle de la facture d'origine (compte client crédité au lieu de
      // débité, ventes/TVA débitées au lieu de créditées) — le libellé le distingue clairement.
      var estAvoir = (f.type||"facture")==="avoir";
      var libelle = (estAvoir? "Avoir-Transport/" : "Fact.-Transport/")+(f.client||"");
      var dateEmission = f.dateEmission? new Date(f.dateEmission) : new Date();
      var compteVente = f.compteVente || state.config.compteVenteDefaut || CONFIG_DEFAULTS.compteVenteDefaut;
      rows.push([dateEmission, f.numero||"", compte, libelle, ttc, null]);
      rows.push([dateEmission, f.numero||"", compteVente, libelle, null, ht]);
      if(tva){
        rows.push([dateEmission, f.numero||"", state.config.compteTVA||CONFIG_DEFAULTS.compteTVA, libelle, null, tva]);
      }
    });
    var ws = XLSX.utils.aoa_to_sheet(rows);
    ws["!cols"] = [{wch:12},{wch:12},{wch:12},{wch:38},{wch:12},{wch:12}];
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Journal ventes");
    XLSX.writeFile(wb, "Journal-ventes-transport-"+moisStr+".xlsx");
    toast("Export généré");
  }).catch(function(){ toast("Impossible de générer le fichier Excel"); });
}

// Pièce jointe "commande client" d'une ligne de facture (demande de Colart, 05/10/2026 : pouvoir
// consulter la commande depuis chaque ligne — en copiant le n° de commande pour le chercher dans les
// devis, il ne la retrouvait plus). On cherche d'abord le bon de commande joint au devis lié, puis, à
// défaut, la commande client jointe à la mission liée.
function factureLigneCommandeFichier(missionId, devisId){
  var d = devisId? state.devis.find(function(x){ return x.id===devisId; }) : null;
  if(d && d.bonCommandeFichier && d.bonCommandeFichier.dataUrl) return d.bonCommandeFichier;
  var m = missionId? state.missions.find(function(x){ return x.id===missionId; }) : null;
  if(m && m.commandeClientFichier && m.commandeClientFichier.dataUrl) return m.commandeClientFichier;
  return null;
}
function factureLineRowHtml(line){
  line = line || {};
  // Le 📎 ouvre la MISSION liée à la ligne (demande de Colart, 05/10/2026 — avant, il ouvrait
  // directement le fichier de la commande). Une ligne libre n'est liée à rien : pas de bouton.
  var lie = !!(line.missionId || line.devisId);
  var voirBtn = !lie? '<span></span>' :
    '<button type="button" class="btn sm fl-voir-bc" title="Voir la mission">📎</button>';
  return '<div class="facture-line-row" data-mission-id="'+escapeHtml(line.missionId||"")+'" data-devis-id="'+escapeHtml(line.devisId||"")+'">'+
    '<input class="fl-ref" placeholder="Référence (ex: 03.08 COMMANDE 3011)" value="'+escapeHtml(line.reference||"")+'"/>'+
    '<input class="fl-designation" placeholder="Désignation (facultatif)" value="'+escapeHtml(line.designation||"")+'"/>'+
    '<input class="fl-cmd" placeholder="N° commande" title="N° de commande du client (imprimé à côté de la référence) — modifiable" value="'+escapeHtml(line.numeroCommande!=null? line.numeroCommande : devisNumeroCommandePourLigne(line))+'"/>'+
    '<input class="fl-qte" type="number" step="0.01" placeholder="Qté" value="'+(line.quantite!=null?line.quantite:1)+'"/>'+
    '<input class="fl-prix" type="number" step="0.01" placeholder="PU HT" value="'+(line.prixUnitaire!=null?line.prixUnitaire:"")+'"/>'+
    '<input class="fl-montant" placeholder="Montant" value="" readonly/>'+
    voirBtn+
    '<button type="button" class="btn sm danger fl-remove" title="Supprimer la ligne">✕</button>'+
  '</div>';
}

// Étape de consultation avant facturation : liste, mois par mois, les missions terminées non
// facturées d'un client (référence, montant HT, détail de la mission), avant de composer la
// facture. Permet de décocher des missions à exclure de cette facture (ex: les garder pour le
// mois suivant).
function openClientAFacturerModal(client, missions){
  var byMois = {};
  missions.slice().sort(byDateHeure).forEach(function(m){
    var ms = missionMoisStr(m);
    if(!byMois[ms]) byMois[ms] = [];
    byMois[ms].push(m);
  });
  var moisKeys = Object.keys(byMois).sort();
  var body = '<div class="hint" style="margin-bottom:10px">Missions terminées de <strong>'+escapeHtml(client)+'</strong> pas encore facturées. Décochez celles à exclure de cette facture, cliquez sur "Voir" pour vérifier le détail d\'une mission, puis créez la facture.</div>';
  moisKeys.forEach(function(ms){
    body += '<div class="section-title" style="margin-top:14px">'+escapeHtml(moisLabel(ms))+'</div>';
    body += '<div class="facture-review-list">';
    byMois[ms].forEach(function(m){
      var d = devisFor(m.id);
      var montant = d? devisTotal(d) : 0;
      var ref = (d&&d.numeroBonCommande)? ("Commande "+d.numeroBonCommande) : (m.marchandises||"—");
      // Statut du bon de commande client par mission (demande de Colart, 21/09/2026) : reprend les
      // mêmes cases à cocher que dans la fiche mission (missionDossierEtat) pour que ce soit visible
      // ici aussi, ligne par ligne, sans avoir à rouvrir chaque mission.
      var dossierEtat = missionDossierEtat(m);
      var bcBadge = "";
      if(dossierEtat==="attente_bc") bcBadge = '<span class="fr-bc-status" style="color:var(--amber);font-weight:700;font-size:12px;white-space:nowrap">🟠 En attente de bon de commande</span>';
      else if(dossierEtat==="recu") bcBadge = '<span class="fr-bc-status" style="color:var(--green);font-weight:700;font-size:12px;white-space:nowrap">🟢 Bon de commande reçu</span>';
      body +=
        '<div class="facture-review-row" style="flex-wrap:wrap">'+
          '<input type="checkbox" class="fr-check" data-mission-id="'+m.id+'" checked/>'+
          '<span class="fr-date">'+escapeHtml(fmtDateFR(m.dateMission)||"—")+'</span>'+
          '<span class="fr-ref" style="flex:1 1 140px">'+escapeHtml(ref)+'</span>'+
          bcBadge+
          '<span class="fr-montant">'+fmtEUR(montant)+' HT</span>'+
          // Mois de facturation propre à cette mission (demande de Colart, 05/10/2026) : modifiable
          // ici ligne par ligne ; la mission change de rubrique mois juste après.
          '<input type="month" class="fr-mois" data-mission-id="'+m.id+'" value="'+escapeHtml(ms)+'" title="Mois de facturation de cette mission" style="width:140px;padding:4px 6px;font-size:12px"/>'+
          '<button type="button" class="btn sm fr-view" data-mission-id="'+m.id+'">Voir</button>'+
        '</div>';
    });
    body += '</div>';
  });
  // Destinataire(s) de « Envoyer les devis par e-mail » quand le client a plusieurs adresses.
  body += '<div id="fr_emailPicker" style="margin-top:14px"></div>';

  openModal("Missions à facturer — "+client, body, function(modal, close){
    // Fenêtre plus large (demande de Colart, 05/10/2026) : avec le sélecteur de mois ajouté sur chaque
    // ligne, le bouton « Voir » était coupé à droite. Les lignes passent aussi à la ligne si l'écran
    // est étroit (téléphone), au lieu de déborder.
    modal.style.maxWidth = "900px";
    // Changement du mois de facturation d'une mission : enregistré aussitôt sur la mission, puis la
    // liste est reconstruite (la mission passe sous son nouveau mois) en gardant les cases décochées.
    modal.querySelectorAll(".fr-mois").forEach(function(inp){
      inp.addEventListener("change", function(){
        var mid = inp.getAttribute("data-mission-id");
        var m = missions.find(function(x){ return x.id===mid; });
        if(!m || !/^\d{4}-\d{2}$/.test(inp.value)) return;
        var decochees = Array.from(modal.querySelectorAll(".fr-check:not(:checked)")).map(function(cb){ return cb.getAttribute("data-mission-id"); });
        m.moisFacturation = inp.value;
        if(state.db) dbWrite(state.db.doc("missions/"+mid).update({moisFacturation: inp.value}), "Mois de facturation modifié : "+moisLabel(inp.value));
        close();
        openClientAFacturerModal(client, missions);
        setTimeout(function(){
          document.querySelectorAll("#modalRoot .fr-check").forEach(function(cb){
            if(decochees.indexOf(cb.getAttribute("data-mission-id"))!==-1) cb.checked = false;
          });
        }, 0);
      });
    });
    modal.querySelectorAll(".fr-view").forEach(function(btn){
      btn.addEventListener("click", function(){
        var mid = btn.getAttribute("data-mission-id");
        var m = state.missions.find(function(x){ return x.id===mid; });
        close();
        if(m) openMissionModal(m);
      });
    });
    // Envoi groupé des devis par e-mail (demande de Colart, 17/09/2026 ; envoi automatique + PDF en
    // pièces jointes ajoutés le même jour) : même principe que l'envoi d'un devis seul (voir
    // sendDevisEmailAuto()), mais un PDF par devis coché, tous joints au même message au client.
    var frClientObj = state.clients.find(function(c){ return clientLabel(c)===client; }) || null;
    var frPicker = wireClientEmailPicker(modal.querySelector("#fr_emailPicker"), null, frClientObj, "devis", null);
    var sendAllBtn = el('<button type="button" class="btn">✉️ Envoyer les devis par e-mail</button>');
    sendAllBtn.addEventListener("click", function(){
      var checked = Array.from(modal.querySelectorAll(".fr-check:checked")).map(function(cb){ return cb.getAttribute("data-mission-id"); });
      if(!checked.length){ toast("Sélectionnez au moins une mission"); return; }
      var items = checked.map(function(mid){
        var d = devisFor(mid);
        if(!d) return null;
        var m = state.missions.find(function(x){ return x.id===mid; });
        return { mission: m||null, devis: d };
      }).filter(Boolean);
      if(!items.length){ toast("Aucun devis trouvé pour les missions sélectionnées"); return; }
      var devisList = items.map(function(it){ return it.devis; });
      var clientObj = state.clients.find(function(c){ return clientLabel(c)===client; });
      var mail = (clientObj? clientEmailFor(clientObj, "devis") : "") || (devisList[0].clientEmail||"").trim();
      // Plusieurs adresses sur la fiche client : on envoie aux adresses cochées (au moins une).
      if(modal.querySelector("#fr_emailPicker .email-picker")){
        var chosen = frPicker.getSelected().map(function(x){ return x.email; });
        if(!chosen.length){ toast("Cochez au moins un destinataire"); return; }
        mail = chosen.join(", ");
      }
      if(!mail){ toast("Renseignez d'abord un e-mail pour ce client (fiche client, ou champ E-mail du devis)"); return; }
      var subject = "Devis — "+client+" — SARL DEBRUYNE COLART";
      var lignesTxt = devisList.map(function(d){ return "- Devis"+(d.numero?(" n° "+d.numero):"")+" : "+fmtEUR(devisTotal(d))+" HT"; }).join("\n");
      var body = "Bonjour,\n\nVeuillez trouver ci-joint nos devis concernant "+client+" :\n\n"+lignesTxt+"\n\nN'hésitez pas à nous contacter pour toute question.\n\nCordialement,\nSARL DEBRUYNE COLART\nTel 03/28/68/61/44";
      sendDevisEmailAuto(mail, subject, body, items);
    });
    var createBtn = el('<button class="btn primary">Créer la facture</button>');
    createBtn.addEventListener("click", function(){
      var checked = Array.from(modal.querySelectorAll(".fr-check:checked")).map(function(cb){ return cb.getAttribute("data-mission-id"); });
      if(!checked.length){ toast("Sélectionnez au moins une mission"); return; }
      close();
      openFactureModal(client, checked);
    });
    return [sendAllBtn, createBtn];
  });
}

// Filet de sécurité "à contrôler" (09/09/2026, demande de Colart : peur d'oublier de contrôler
// une mission avant facturation, notamment celles sans devis). Vue globale, tous clients
// confondus, contrairement à openClientAFacturerModal qui est par client et par facture.

    body += '<div class="facture-review-list">';

      body +=

          '<button type="button" class="btn sm cg-view" data-mission-id="'+m.id+'">Voir</button>'+
          '<button type="button" class="btn sm primary cg-ok" data-mission-id="'+m.id+'">✓ Contrôlée</button>'+
        '</div>';
    });
    body += '</div>';
  }
  openModal("Missions terminées à contrôler ("+list.length+")", body, function(modal, close){
    modal.querySelectorAll(".cg-view").forEach(function(btn){
      btn.addEventListener("click", function(){
        var mid = btn.getAttribute("data-mission-id");
        var m = state.missions.find(function(x){ return x.id===mid; });
        close();
        if(m) openMissionModal(m);
      });
    });
    modal.querySelectorAll(".cg-ok").forEach(function(btn){
      btn.addEventListener("click", function(){
        var mid = btn.getAttribute("data-mission-id");
        if(!state.db) return;
        dbWrite(state.db.doc("missions/"+mid).update({controlee:true, controleeAt:new Date().toISOString()}), "Mission marquée contrôlée");
        var row = modal.querySelector('.facture-review-row[data-row-mission-id="'+mid+'"]');
        if(row) row.remove();
      });
    });
    return [];
  });
}

// Missions non effectuées sur une journée déjà passée — à reprogrammer sur une prochaine journée
// (demande de Colart, 11/09/2026). Voir missionAReaffecter. Choix d'une nouvelle date directement
// dans la liste (évite de rouvrir chaque fiche mission une par une) ; en replanifiant, le statut
// repart de zéro (mission non encore acceptée) car les horodatages de l'ancienne journée n'ont plus
// de sens pour la nouvelle date.
