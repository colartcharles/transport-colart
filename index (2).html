/* ================= Onglet Devis (création libre + liste) ================= */
function renderDevisTab(){
  var wrap = document.createElement("div");
  var hd = el('<div style="display:flex;justify-content:space-between;align-items:center;"><h3>Devis</h3></div>');
  var newBtn = el('<button class="btn primary">+ Création de devis</button>');
  newBtn.addEventListener("click", function(){ openDevisModal(null); });
  hd.appendChild(newBtn);
  wrap.appendChild(hd);
  wrap.appendChild(el('<div class="hint" style="margin:4px 0 16px">Un devis peut être créé directement ici, sans mission (ex: pour répondre vite à une demande client), ou depuis la fiche d\'une mission. Une fois accepté, créez la mission correspondante depuis l\'onglet Planning.</div>'));

  var list = state.devis.slice().sort(function(a,b){ return (b.updatedAt||b.createdAt||"").localeCompare(a.updatedAt||a.createdAt||""); });
  if(!list.length){
    wrap.appendChild(el('<div class="empty">Aucun devis pour le moment.</div>'));
    return wrap;
  }
  var grid = el('<div class="card-grid"></div>');
  list.forEach(function(d){
    var info = devisStatutInfo(d.statut);
    var mission = d.missionId? (state.missions.find(function(m){ return m.id===d.missionId; }) || null) : null;
    var card = el('<div class="item-card"></div>');
    card.innerHTML =
      '<div class="row" style="margin-top:0;align-items:flex-start">'+
        '<div><h4 style="margin-bottom:2px">'+escapeHtml(d.numero||"(sans numéro)")+'</h4>'+
        '<div class="sub">'+escapeHtml(d.clientNom||"Client non renseigné")+'</div></div>'+
        '<span class="badge '+info.cls+'">'+info.label+'</span>'+
      '</div>'+
      '<div class="sub" style="margin-top:6px">'+fmtEUR(devisTotal(d))+' HT'+(d.dateEmission? " · "+fmtDateFR(d.dateEmission):"")+'</div>'+
      '<div class="sub">'+(mission? "Lié à la mission « "+escapeHtml(mission.client||"")+" »" : "Devis libre — aucune mission liée")+'</div>'+
      (d.bonCommandeFichier? '<div class="sub">📎 Bon de commande joint</div>' : '')+
      (d.factureId? '<div class="sub">🧾 Déjà inclus dans une facture</div>' : '');
    var btnRow = el('<div style="display:flex;gap:6px;margin-top:10px"></div>');
    if(d.bonCommandeFichier){
      var bcBtn = el('<button type="button" class="btn sm">Consulter le BC</button>');
      bcBtn.addEventListener("click", function(){ openFileAttachment(d.bonCommandeFichier); });
      btnRow.appendChild(bcBtn);
    }
    var openBtn = el('<button type="button" class="btn sm">Ouvrir</button>');
    openBtn.addEventListener("click", function(){ openDevisModal(mission, d.id); });
    btnRow.appendChild(openBtn);
    card.appendChild(btnRow);
    grid.appendChild(card);
  });
  wrap.appendChild(grid);
  return wrap;
}

/* ================= Onglet Facturation =================
   Une mission devient facturable une fois arrivée à "Fin de mission" ET dotée d'un devis (c'est
   le devis qui porte le prix définitif, modifiable à tout moment avant la facture — voir
   missionFactureEtat). Une facture regroupe une ou plusieurs missions d'un même client, en
   général sur un même mois, comme sur les factures papier de Colart (une ligne par commande).
   Le numéro de facture officiel reste un champ libre à recopier depuis le logiciel de
   comptabilité — l'appli ne génère pas de numérotation légale, seulement la préparation
   (regroupement, calcul, aperçu imprimable). */
function renderFacturation(){
  var wrap = document.createElement("div");
  wrap.appendChild(el('<h3 style="margin-bottom:4px">Facturation</h3>'));
  wrap.appendChild(el('<div class="hint" style="margin:0 0 16px">Le numéro de facture officiel reste à saisir vous-même (recopié depuis votre logiciel de comptabilité) — cette page prépare le regroupement par client, calcule les montants et génère un aperçu imprimable.</div>'));

  // Filet de sécurité "à contrôler" (09/09/2026) : les missions terminées sans devis
  // n'apparaissent jamais dans "Missions terminées à facturer" ci-dessous (pas de devis = pas de
  // ligne à facturer) — sans ce bandeau, elles resteraient invisibles et pourraient être oubliées.
  var aControlerFactu = missionsAControler();
  if(aControlerFactu.length){
    var controleBanner = el(
      '<div class="alert-banner" style="cursor:pointer;margin-bottom:16px">'+
        '<span>⚠️</span>'+
        '<div><b>'+aControlerFactu.length+' mission'+(aControlerFactu.length>1?"s":"")+' terminée'+(aControlerFactu.length>1?"s":"")+' à contrôler</b>Y compris celles sans devis, invisibles dans la liste ci-dessous tant qu\'aucun devis n\'est créé. Cliquez pour les vérifier.</div>'+
      '</div>'
    );
    controleBanner.addEventListener("click", function(){ openControleGlobalModal(); });
    wrap.appendChild(controleBanner);
  }

  // Filtre mois/année : indépendants et combinables, s'appliquent aux deux sections ci-dessous
  // (missions à facturer groupées par client, et liste des factures déjà créées).
  var filterRow = el('<div class="row" style="gap:10px;margin-bottom:16px;flex-wrap:wrap"></div>');
  var moisSelect = el('<select style="max-width:180px"></select>');
  moisSelect.appendChild(el('<option value="">Tous les mois</option>'));
  MOIS_LABELS.forEach(function(label, idx){
    var val = String(idx+1).padStart(2,"0");
    var opt = el('<option value="'+val+'">'+label.charAt(0).toUpperCase()+label.slice(1)+'</option>');
    if(state.factuFilterMois===val) opt.setAttribute("selected","selected");
    moisSelect.appendChild(opt);
  });
  moisSelect.addEventListener("change", function(){ state.factuFilterMois = moisSelect.value; render(); });
  var anneeSelect = el('<select style="max-width:140px"></select>');
  anneeSelect.appendChild(el('<option value="">Toutes les années</option>'));
  anneesDisponibles().forEach(function(annee){
    var opt = el('<option value="'+annee+'">'+annee+'</option>');
    if(state.factuFilterAnnee===annee) opt.setAttribute("selected","selected");
    anneeSelect.appendChild(opt);
  });
  anneeSelect.addEventListener("change", function(){ state.factuFilterAnnee = anneeSelect.value; render(); });
  filterRow.appendChild(moisSelect);
  filterRow.appendChild(anneeSelect);
  if(state.factuFilterMois || state.factuFilterAnnee){
    var resetBtn = el('<button type="button" class="btn sm">Réinitialiser</button>');
    resetBtn.addEventListener("click", function(){ state.factuFilterMois=""; state.factuFilterAnnee=""; render(); });
    filterRow.appendChild(resetBtn);
  }
  wrap.appendChild(filterRow);

  var groups = facturesGroupeesParClient(state.factuFilterMois, state.factuFilterAnnee);
  var clients = Object.keys(groups).sort();
  wrap.appendChild(el('<div class="section-title" style="margin-top:0">Missions terminées à facturer</div>'));
  if(!clients.length){
    wrap.appendChild(el('<div class="empty">Aucune mission terminée en attente de facturation.</div>'));
  } else {
    var grid = el('<div class="card-grid"></div>');
    clients.forEach(function(client){
      var missions = groups[client];
      var totalHT = missions.reduce(function(sum,m){ return sum + devisTotal(devisFor(m.id)); }, 0);
      var card = el('<div class="item-card" style="cursor:pointer"></div>');
      card.innerHTML =
        '<h4>'+escapeHtml(client)+'</h4>'+
        '<div class="sub">'+missions.length+' mission'+(missions.length>1?"s":"")+' à facturer · '+fmtEUR(totalHT)+' HT</div>';
      var btn = el('<button type="button" class="btn primary sm" style="margin-top:10px">Consulter</button>');
      btn.addEventListener("click", function(e){ e.stopPropagation(); openClientAFacturerModal(client, missions); });
      card.appendChild(btn);
      card.addEventListener("click", function(){ openClientAFacturerModal(client, missions); });
      grid.appendChild(card);
    });
    wrap.appendChild(grid);
  }

  wrap.appendChild(el('<div class="section-title">Factures</div>'));
  var list = state.factures.filter(function(f){
    var moisStr = f.mois||"";
    var annee = moisStr.slice(0,4), mois = moisStr.slice(5,7);
    if(state.factuFilterAnnee && annee!==state.factuFilterAnnee) return false;
    if(state.factuFilterMois && mois!==state.factuFilterMois) return false;
    return true;
  }).sort(function(a,b){ return (b.updatedAt||b.createdAt||"").localeCompare(a.updatedAt||a.createdAt||""); });
  if(!list.length){
    wrap.appendChild(el('<div class="empty">'+((state.factuFilterMois||state.factuFilterAnnee)?"Aucune facture pour cette période.":"Aucune facture pour le moment.")+'</div>'));
    return wrap;
  }
  var fgrid = el('<div class="card-grid"></div>');
  list.forEach(function(f){
    var info = factureStatutInfo(f.statut);
    var card = el('<div class="item-card"></div>');
    card.innerHTML =
      '<div class="row" style="margin-top:0;align-items:flex-start">'+
        '<div><h4 style="margin-bottom:2px">'+escapeHtml(f.numero||"(numéro à saisir)")+'</h4>'+
        '<div class="sub">'+escapeHtml(f.client||"Client non renseigné")+'</div></div>'+
        '<span class="badge '+info.cls+'">'+info.label+'</span>'+
      '</div>'+
      '<div class="sub" style="margin-top:6px">'+fmtEUR(factureTotal(f))+' HT · '+escapeHtml(moisLabel(f.mois))+'</div>'+
      '<div class="sub">'+(f.lignes?f.lignes.length:0)+' ligne'+((f.lignes&&f.lignes.length>1)?"s":"")+'</div>';
    var openBtn = el('<button type="button" class="btn sm" style="margin-top:10px">Ouvrir</button>');
    openBtn.addEventListener("click", function(){ openFactureModal(f.client, null, f.id); });
    card.appendChild(openBtn);
    fgrid.appendChild(card);
  });
  wrap.appendChild(fgrid);
  return wrap;
}

function factureLineRowHtml(line){
  line = line || {};
  return '<div class="facture-line-row" data-mission-id="'+escapeHtml(line.missionId||"")+'" data-devis-id="'+escapeHtml(line.devisId||"")+'">'+
    '<input class="fl-ref" placeholder="Référence (ex: 03.08 COMMANDE 3011)" value="'+escapeHtml(line.reference||"")+'"/>'+
    '<input class="fl-designation" placeholder="Désignation (facultatif)" value="'+escapeHtml(line.designation||"")+'"/>'+
    '<input class="fl-qte" type="number" step="0.01" placeholder="Qté" value="'+(line.quantite!=null?line.quantite:1)+'"/>'+
    '<input class="fl-prix" type="number" step="0.01" placeholder="PU HT" value="'+(line.prixUnitaire!=null?line.prixUnitaire:"")+'"/>'+
    '<input class="fl-montant" placeholder="Montant" value="" readonly/>'+
    '<button type="button" class="btn sm danger fl-remove" title="Supprimer la ligne">✕</button>'+
  '</div>';
}

// Étape de consultation avant facturation : liste, mois par mois, les missions terminées non
// facturées d'un client (référence, montant HT, détail de la mission), avant de composer la
// facture. Permet de décocher des missions à exclure de cette facture (ex: les garder pour le
// mois suivant).
function openClientAFacturerModal(client, missions){
  var byMois = {};
  missions.slice().sort(byDateHeure).forEach(function(m){
    var ms = missionMoisStr(m);
    if(!byMois[ms]) byMois[ms] = [];
    byMois[ms].push(m);
  });
  var moisKeys = Object.keys(byMois).sort();
  var body = '<div class="hint" style="margin-bottom:10px">Missions terminées de <strong>'+escapeHtml(client)+'</strong> pas encore facturées. Décochez celles à exclure de cette facture, cliquez sur "Voir" pour vérifier le détail d\'une mission, puis créez la facture.</div>';
  moisKeys.forEach(function(ms){
    body += '<div class="section-title" style="margin-top:14px">'+escapeHtml(moisLabel(ms))+'</div>';
    body += '<div class="facture-review-list">';
    byMois[ms].forEach(function(m){
      var d = devisFor(m.id);
      var montant = d? devisTotal(d) : 0;
      var ref = (d&&d.numeroBonCommande)? ("Commande "+d.numeroBonCommande) : (m.marchandises||"—");
      body +=
        '<div class="facture-review-row">'+
          '<input type="checkbox" class="fr-check" data-mission-id="'+m.id+'" checked/>'+
          '<span class="fr-date">'+escapeHtml(fmtDateFR(m.dateMission)||"—")+'</span>'+
          '<span class="fr-ref">'+escapeHtml(ref)+'</span>'+
          '<span class="fr-montant">'+fmtEUR(montant)+' HT</span>'+
          '<button type="button" class="btn sm fr-view" data-mission-id="'+m.id+'">Voir</button>'+
        '</div>';
    });
    body += '</div>';
  });

  openModal("Missions à facturer — "+client, body, function(modal, close){
    modal.querySelectorAll(".fr-view").forEach(function(btn){
      btn.addEventListener("click", function(){
        var mid = btn.getAttribute("data-mission-id");
        var m = state.missions.find(function(x){ return x.id===mid; });
        close();
        if(m) openMissionModal(m);
      });
    });
    var createBtn = el('<button class="btn primary">Créer la facture</button>');
    createBtn.addEventListener("click", function(){
      var checked = Array.from(modal.querySelectorAll(".fr-check:checked")).map(function(cb){ return cb.getAttribute("data-mission-id"); });
      if(!checked.length){ toast("Sélectionnez au moins une mission"); return; }
      close();
      openFactureModal(client, checked);
    });
    return [createBtn];
  });
}

// Filet de sécurité "à contrôler" (09/09/2026, demande de Colart : peur d'oublier de contrôler
// une mission avant facturation, notamment celles sans devis). Vue globale, tous clients
// confondus, contrairement à openClientAFacturerModal qui est par client et par facture.
function openControleGlobalModal(){
  var list = missionsAControler();
  var body;
  if(!list.length){
    body = '<div class="empty">Aucune mission en attente de contrôle. 👍</div>';
  } else {
    body = '<div class="hint" style="margin-bottom:10px">Missions terminées pas encore marquées « contrôlées » — y compris celles sans devis. Cliquez sur « Voir » pour vérifier le détail (et créer le devis si besoin), ou directement sur « ✓ Contrôlée » si tout est en ordre.</div>';
    body += '<div class="facture-review-list">';
    list.forEach(function(m){
      var etat = missionFactureEtat(m);
      body +=
        '<div class="facture-review-row" data-row-mission-id="'+m.id+'">'+
          '<span class="fr-date">'+escapeHtml(fmtDateFR(m.dateMission)||"—")+'</span>'+
          '<span class="fr-ref">'+escapeHtml(m.client||"Client non renseigné")+(etat==="sans_devis"? ' <span class="badge amber">Sans devis</span>' : '')+'</span>'+
          '<button type="button" class="btn sm cg-view" data-mission-id="'+m.id+'">Voir</button>'+
          '<button type="button" class="btn sm primary cg-ok" data-mission-id="'+m.id+'">✓ Contrôlée</button>'+
        '</div>';
    });
    body += '</div>';
  }
  openModal("Missions terminées à contrôler ("+list.length+")", body, function(modal, close){
    modal.querySelectorAll(".cg-view").forEach(function(btn){
      btn.addEventListener("click", function(){
        var mid = btn.getAttribute("data-mission-id");
        var m = state.missions.find(function(x){ return x.id===mid; });
        close();
        if(m) openMissionModal(m);
      });
    });
    modal.querySelectorAll(".cg-ok").forEach(function(btn){
      btn.addEventListener("click", function(){
        var mid = btn.getAttribute("data-mission-id");
        if(!state.db) return;
        dbWrite(state.db.doc("missions/"+mid).update({controlee:true, controleeAt:new Date().toISOString()}), "Mission marquée contrôlée");
        var row = modal.querySelector('.facture-review-row[data-row-mission-id="'+mid+'"]');
        if(row) row.remove();
      });
    });
    return [];
  });
}

function openFactureModal(client, missionIds, existingFactureId){
  var existingDoc = existingFactureId? (state.factures.find(function(f){ return f.id===existingFactureId; }) || null) : null;
  var hasExisting = !!existingDoc;
  var docId = existingFactureId || uid();

  var initialLignes, initialMois, initialNotes;
  if(hasExisting){
    initialLignes = existingDoc.lignes || [];
    initialMois = existingDoc.mois || currentMoisStr();
    initialNotes = existingDoc.notes || "";
  } else {
    var missions = (missionIds||[]).map(function(id){ return state.missions.find(function(m){ return m.id===id; }); }).filter(Boolean);
    // Le mois de facturation par défaut est celui de la majorité des missions sélectionnées.
    var moisCounts = {};
    missions.forEach(function(m){ var ms=missionMoisStr(m); moisCounts[ms]=(moisCounts[ms]||0)+1; });
    var bestMois = currentMoisStr(), bestCount = -1;
    Object.keys(moisCounts).forEach(function(ms){ if(moisCounts[ms]>bestCount){ bestCount=moisCounts[ms]; bestMois=ms; } });
    initialMois = bestMois;
    initialLignes = missions.sort(byDateHeure).map(function(m){
      var d = devisFor(m.id);
      // Reproduit le style des factures papier de Colart : "JJ.MM COMMANDE ####" sur une ligne.
      var datePrefix = m.dateMission? (m.dateMission.slice(8,10)+"."+m.dateMission.slice(5,7)+" ") : "";
      var ref = datePrefix + ((d && d.numeroBonCommande)? ("COMMANDE "+d.numeroBonCommande) : (d && d.numero? ("Devis "+d.numero) : (m.client||"")));
      return {
        missionId: m.id,
        devisId: d? d.id : null,
        reference: ref.trim(),
        designation: "",
        quantite: 1,
        prixUnitaire: d? Math.round(devisTotal(d)*100)/100 : 0
      };
    });
    initialNotes = "TRANSPORTS "+(MOIS_LABELS[parseInt(initialMois.split("-")[1],10)-1]||"").toUpperCase()+" "+initialMois.split("-")[0];
  }

  var body =
    '<div class="field-row">'+
      '<div class="field"><label>Client</label><input id="fa_client" value="'+escapeHtml(hasExisting?(existingDoc.client||""):(client||""))+'" '+(hasExisting?"":"readonly")+'/></div>'+
      '<div class="field"><label>Mois de facturation</label><input type="month" id="fa_mois" value="'+escapeHtml(initialMois)+'"/></div>'+
    '</div>'+
    '<div class="field-row">'+
      '<div class="field"><label>N° de facture (à recopier depuis votre comptabilité)</label><input id="fa_numero" value="'+escapeHtml(hasExisting?(existingDoc.numero||""):"")+'" placeholder="Ex: 1/26/100840/1"/></div>'+
      '<div class="field"><label>Statut</label><select id="fa_statut">'+
        FACTURE_STATUTS.map(function(s){ return '<option value="'+s.key+'" '+((hasExisting?existingDoc.statut:"brouillon")===s.key?"selected":"")+'>'+s.label+'</option>'; }).join("")+
      '</select></div>'+
    '</div>'+
    '<div class="field-row">'+
      '<div class="field"><label>Date d\'émission</label><input type="date" id="fa_dateEmission" value="'+escapeHtml(hasExisting?(existingDoc.dateEmission||""):todayISO())+'"/></div>'+
      '<div class="field"><label>Échéance</label><input type="date" id="fa_echeance" value="'+escapeHtml(hasExisting?(existingDoc.echeance||""):"")+'"/></div>'+
    '</div>'+
    '<div class="field"><label>Observations (facultatif, imprimées sur la facture)</label><input id="fa_notes" value="'+escapeHtml(initialNotes)+'"/></div>'+
    '<div class="field"><label>Lignes (une par mission/commande — modifiables)</label>'+
      '<div id="factureLines"></div>'+
      '<button type="button" class="btn sm" id="btnAddFactureLine">+ Ligne libre</button>'+
    '</div>'+
    '<div class="devis-total-box" id="factureTotalDisplay"></div>';

  openModal(hasExisting? "Facture — "+(existingDoc.client||"") : ("Nouvelle facture — "+(client||"")), body, function(modal, close){
    var linesContainer = modal.querySelector("#factureLines");
    function wireRemove(){
      linesContainer.querySelectorAll(".fl-remove").forEach(function(btn){
        btn.onclick = function(){ btn.closest(".facture-line-row").remove(); recalc(); };
      });
    }
    function recalc(){
      var ht = 0;
      linesContainer.querySelectorAll(".facture-line-row").forEach(function(row){
        var qStr = row.querySelector(".fl-qte").value;
        var pStr = row.querySelector(".fl-prix").value;
        var q = qStr===""? 1 : (parseFloat(qStr)||0);
        var p = pStr===""? 0 : (parseFloat(pStr)||0);
        row.querySelector(".fl-montant").value = fmtEUR(q*p);
        ht += q*p;
      });
      var tva = ht*0.20, ttc = ht*1.20;
      modal.querySelector("#factureTotalDisplay").innerHTML =
        '<div class="dt-row"><span>Total HT</span><span>'+fmtEUR(ht)+'</span></div>'+
        '<div class="dt-row"><span>TVA (20 %)</span><span>'+fmtEUR(tva)+'</span></div>'+
        '<div class="dt-row dt-ttc"><span>Total TTC</span><span>'+fmtEUR(ttc)+'</span></div>';
    }
    initialLignes.forEach(function(l){ linesContainer.appendChild(el(factureLineRowHtml(l))); });
    wireRemove(); recalc();
    linesContainer.addEventListener("input", recalc);
    modal.querySelector("#btnAddFactureLine").addEventListener("click", function(){
      linesContainer.appendChild(el(factureLineRowHtml({})));
      wireRemove(); recalc();
    });

    function collectData(){
      var lignes = [];
      var rows = linesContainer.querySelectorAll(".facture-line-row");
      rows.forEach(function(row){
        var reference = row.querySelector(".fl-ref").value.trim();
        var designation = row.querySelector(".fl-designation").value.trim();
        var qte = row.querySelector(".fl-qte").value;
        var prix = row.querySelector(".fl-prix").value;
        if(!reference && !designation && qte==="" && prix==="") return;
        // Le lien mission/devis voyage avec la ligne elle-même (attributs data-*), jamais par
        // position dans le tableau — une suppression/ajout de ligne ne doit pas mélanger les liens.
        lignes.push({
          missionId: row.getAttribute("data-mission-id") || null,
          devisId: row.getAttribute("data-devis-id") || null,
          reference: reference,
          designation: designation,
          quantite: qte===""?1:parseFloat(qte),
          prixUnitaire: prix===""?0:parseFloat(prix)
        });
      });
      return {
        client: modal.querySelector("#fa_client").value.trim(),
        mois: modal.querySelector("#fa_mois").value || currentMoisStr(),
        numero: modal.querySelector("#fa_numero").value.trim(),
        statut: modal.querySelector("#fa_statut").value,
        dateEmission: modal.querySelector("#fa_dateEmission").value,
        echeance: modal.querySelector("#fa_echeance").value,
        notes: modal.querySelector("#fa_notes").value.trim(),
        lignes: lignes,
        createdAt: hasExisting? (existingDoc.createdAt||new Date().toISOString()) : new Date().toISOString(),
        updatedAt: new Date().toISOString()
      };
    }

    var buttons = [];
    if(hasExisting){
      var del = el('<button class="btn danger">Supprimer la facture</button>');
      del.addEventListener("click", function(){
        if(!state.db) return;
        confirmAction("Supprimer cette facture ? Les missions qu'elle contenait redeviendront \"à facturer\".", function(){
          var devisIds = (existingDoc.lignes||[]).map(function(l){return l.devisId;}).filter(Boolean);
          var unbill = devisIds.map(function(did){ return state.db.doc("devis/"+did).update({factureId: null}).catch(function(){}); });
          dbWrite(Promise.all(unbill).then(function(){ return state.db.doc("factures/"+docId).delete(); }), "Facture supprimée");
          close();
        });
      });
      buttons.push(del);
    }
    var preview = el('<button type="button" class="btn">Aperçu / Imprimer</button>');
    preview.addEventListener("click", function(){ openFacturePrintView(collectData()); });
    buttons.push(preview);
    var save = el('<button class="btn primary">Enregistrer la facture</button>');
    save.addEventListener("click", function(){
      var data = collectData();
      if(!data.client){ toast("Le nom du client est requis"); return; }
      if(!data.lignes.length){ toast("Ajoutez au moins une ligne"); return; }
      if(!state.db){ toast("Base de données indisponible"); return; }
      var newDevisIds = data.lignes.map(function(l){return l.devisId;}).filter(Boolean);
      var oldDevisIds = hasExisting? (existingDoc.lignes||[]).map(function(l){return l.devisId;}).filter(Boolean) : [];
      var toBill = newDevisIds.filter(function(id){ return oldDevisIds.indexOf(id)===-1; });
      var toUnbill = oldDevisIds.filter(function(id){ return newDevisIds.indexOf(id)===-1; });
      var billWrites = toBill.map(function(did){ return state.db.doc("devis/"+did).update({factureId: docId}).catch(function(){}); });
      var unbillWrites = toUnbill.map(function(did){ return state.db.doc("devis/"+did).update({factureId: null}).catch(function(){}); });
      // Une mission incluse dans une facture est par définition passée par le contrôle — on la
      // marque "contrôlée" automatiquement pour qu'elle ne réapparaisse plus dans le filet de
      // sécurité "Missions terminées à contrôler" (voir missionAControler).
      var missionIdsToMark = data.lignes.map(function(l){ return l.missionId; }).filter(Boolean);
      var controlWrites = missionIdsToMark.map(function(mid){ return state.db.doc("missions/"+mid).update({controlee:true, controleeAt:new Date().toISOString()}).catch(function(){}); });
      dbWrite(
        Promise.all(billWrites.concat(unbillWrites).concat(controlWrites)).then(function(){
          return state.db.doc("factures/"+docId).set(data);
        }),
        hasExisting? "Facture mise à jour" : "Facture créée"
      );
      close();
    });
    buttons.push(save);
    return buttons;
  });
}

function soustraitanceStatutInfo(key){

}
function soustraitanceMarge(r){

/* ================= Onglet Clients =================
   Répertoire clients (ajouté 09/09/2026, demande de Colart : intégrer son fichier client réel).
   Alimente aussi l'auto-complétion du champ "Client" dans les missions, devis et sous-traitance
   (wireClientAutocomplete). Import direct depuis un export Excel (.xlsx) du logiciel de
   comptabilité de Colart — voir parseClientsWorkbook pour le format attendu (export paginé avec
   en-têtes répétées toutes les ~36 lignes, filtrées à l'import). */
function clientLabel(c){ return (c.nom||"") + (c.prenom? " "+c.prenom : ""); }
function clientAdresseComplete(c){
  var parts = [];
  if(c.adresse1) parts.push(c.adresse1);
  if(c.adresse2) parts.push(c.adresse2);
  var cpVille = [c.cp, c.ville].filter(Boolean).join(" ");
  if(cpVille) parts.push(cpVille);
  return parts.join(", ");
}
// Auto-complétion réutilisable : suggestions filtrées en direct (nom, prénom, ville, numéro
// client) sous le champ texte, jusqu'à 12 résultats. Utilisée sur le champ "Client" des missions,
// devis et transports sous-traités.
function wireClientAutocomplete(inputEl, onSelect){
  if(!inputEl) return;
  var field = inputEl.closest(".field") || inputEl.parentNode;
  field.style.position = "relative";
  var list = document.createElement("div");
  list.className = "client-ac-list";
  field.appendChild(list);
  function render(){
    var q = inputEl.value.trim().toLowerCase();
    if(!q || !state.clients.length){ list.style.display="none"; list.innerHTML=""; return; }
    var matches = state.clients.filter(function(c){
      var label = clientLabel(c).toLowerCase();
      return label.indexOf(q)!==-1 || (c.numero!=null && String(c.numero).indexOf(q)!==-1) || (c.ville||"").toLowerCase().indexOf(q)!==-1;
    }).slice(0,12);
    if(!matches.length){ list.style.display="none"; list.innerHTML=""; return; }
    list.innerHTML = matches.map(function(c,i){
      return '<div class="client-ac-item" data-idx="'+i+'">'+
        '<div class="nm">'+escapeHtml(clientLabel(c))+'</div>'+
        '<div class="sub2">'+escapeHtml((c.ville||"")+(c.cp?" ("+c.cp+")":""))+'</div>'+
      '</div>';
    }).join("");
    list.style.display="block";
    Array.from(list.children).forEach(function(itemEl,i){
      itemEl.addEventListener("mousedown", function(e){
        e.preventDefault(); // avant le blur, sinon la liste se cache avant le clic
        var c = matches[i];
        inputEl.value = clientLabel(c);
        list.style.display="none";
        if(onSelect) onSelect(c);
      });
    });
  }
  inputEl.addEventListener("input", render);
  inputEl.addEventListener("focus", render);
  inputEl.addEventListener("blur", function(){ setTimeout(function(){ list.style.display="none"; }, 150); });
}

var xlsxLoadPromise = null;
function ensureXlsxJs(){
  if(window.XLSX) return Promise.resolve(window.XLSX);
  if(xlsxLoadPromise) return xlsxLoadPromise;
  xlsxLoadPromise = new Promise(function(resolve, reject){
    var s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js";
    s.onload = function(){ resolve(window.XLSX); };
    s.onerror = function(){ reject(new Error("xlsx_load_failed")); };
    document.head.appendChild(s);
  });
  return xlsxLoadPromise;
}
// Format observé dans l'export de Colart : colonnes Numéro/Civilité/Nom/(fusionnée)/Prénom/
// Adresse 1/Adresse 2/CP/Ville/(fusionnée)/Type Client/(fusionnée), avec l'en-tête et une ligne de
// titre "Recherche approximative…" répétées toutes les ~36 lignes (export paginé). On ne garde que
// les lignes où la colonne A est un numéro (les en-têtes/titres/lignes vides sont ainsi ignorés).
function parseClientsWorkbook(file){
  return ensureXlsxJs().then(function(XLSX){
    return file.arrayBuffer().then(function(buf){
      var wb = XLSX.read(buf, {type:"array"});
      var ws = wb.Sheets[wb.SheetNames[0]];
      var rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:null});
      // Le fichier de Colart n'a actuellement pas de colonne e-mail — détection dynamique au cas
      // où une version future de l'export en ajouterait une (recherche d'un en-tête "email"/
      // "e-mail"/"courriel" sur n'importe quelle ligne du fichier, casse insensible).
      var emailColIdx = -1;
      rows.forEach(function(row){
        (row||[]).forEach(function(cell, idx){
          if(emailColIdx===-1 && typeof cell==="string" && /^(e-?mail|courriel)$/i.test(cell.trim())) emailColIdx = idx;
        });
      });
      var clients = [];
      rows.forEach(function(row){
        var numero = row[0];
        if(typeof numero !== "number") return;
        var nom = row[2];
        if(!nom) return;
        clients.push({
          numero: numero,
          civilite: (row[1]||"").toString().trim(),
          nom: (nom||"").toString().trim(),
          prenom: (row[4]||"").toString().trim(),
          adresse1: (row[5]||"").toString().trim(),
          adresse2: (row[6]||"").toString().trim(),
          cp: row[7]!=null? String(row[7]).trim() : "",
          ville: (row[8]||"").toString().trim(),
          typeClient: (row[10]||"").toString().trim(),
          email: (emailColIdx!==-1 && row[emailColIdx]!=null)? String(row[emailColIdx]).trim() : ""
        });
      });
      return clients;
    });
  });
}
function importClientsFile(file){
  if(!state.db){ toast("Base de données indisponible"); return; }
  toast("Lecture du fichier…");
  parseClientsWorkbook(file).then(function(clients){
    if(!clients.length){ toast("Aucune ligne client reconnue dans ce fichier"); return; }
    // Upsert par lots de 25 (évite de saturer la connexion) — clé stable = numéro client quand
    // il existe, donc réimporter le même fichier met à jour les fiches existantes sans dupliquer.
    var existingById = {};
    state.clients.forEach(function(c){ existingById[c.id] = c; });
    var BATCH = 25, i = 0, total = clients.length;
    function next(){
      if(i>=total){ toast(total+" client(s) importé(s)"); return; }
      var chunk = clients.slice(i, i+BATCH);
      var writes = chunk.map(function(c){
        var docId = c.numero!=null? ("n"+c.numero) : uid();
        // Le fichier comptable de Colart ne contient pas d'e-mail : si la fiche existante en a un
        // (ajouté manuellement dans l'appli) et que l'import n'en apporte pas, on le conserve —
        // sinon un réimport effacerait les e-mails saisis à la main.
        var existing = existingById[docId];
        if(existing && !c.email && existing.email) c.email = existing.email;
        return state.db.doc("clients/"+docId).set(Object.assign({}, c, {updatedAt: new Date().toISOString()})).catch(function(){});
      });
      Promise.all(writes).then(function(){
        i += BATCH;
        toast("Import en cours… "+Math.min(i,total)+" / "+total);
        next();
      });
    }
    next();
  }).catch(function(e){
    toast("Impossible de lire ce fichier Excel ("+(e&&e.message||"erreur")+")");
  });
}

/* ================= Import de commande client (IA, capacité "sample") =================
   Lit un PDF ou une photo de commande d'achat client, en extrait les informations avec
   Claude (capacité sample de l'artifact — utilise l'usage Claude du gestionnaire, avec
   son accord), puis pré-remplit une nouvelle mission + son bon de commande à vérifier
   avant enregistrement. */
var PDFJS_VERSION = "3.11.174";
var pdfJsLoadPromise = null;
function ensurePdfJs(){
  if(window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if(pdfJsLoadPromise) return pdfJsLoadPromise;
  pdfJsLoadPromise = new Promise(function(resolve, reject){
    var s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/"+PDFJS_VERSION+"/pdf.min.js";
    s.onload = function(){
      try{
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/"+PDFJS_VERSION+"/pdf.worker.min.js";
        resolve(window.pdfjsLib);
      } catch(e){ reject(e); }
    };
    s.onerror = function(){ reject(new Error("pdfjs_load_failed")); };
    document.head.appendChild(s);
  });
  return pdfJsLoadPromise;
}
function pdfFileToImageBlobs(file, maxPages){
  maxPages = maxPages || 2;
  return ensurePdfJs().then(function(pdfjsLib){
    return file.arrayBuffer().then(function(buf){
      return pdfjsLib.getDocument({data: buf}).promise;
    });
  }).then(function(pdf){
    var n = Math.min(pdf.numPages, maxPages);
    var pagePromises = [];
    var _loop = function(pageNum){
      pagePromises.push(pdf.getPage(pageNum).then(function(page){
        var baseViewport = page.getViewport({scale: 1});
        var scale = Math.min(2, 1400 / baseViewport.width);
        var viewport = page.getViewport({scale: scale});
        var canvas = document.createElement("canvas");
        canvas.width = Math.ceil(viewport.width);
        canvas.height = Math.ceil(viewport.height);
        var ctx = canvas.getContext("2d");
        return page.render({canvasContext: ctx, viewport: viewport}).promise.then(function(){
          return new Promise(function(resolve){ canvas.toBlob(function(blob){ resolve(blob); }, "image/png"); });
        });
      }));
    };
    for(var i=1;i<=n;i++) _loop(i);
    return Promise.all(pagePromises);
  });
}
// Convertit une page de PDF en image compressée (JPEG, budget maxBytes) — utilisé comme repli
// quand un PDF trop volumineux ne peut pas être joint tel quel (ajouté 10/09/2026, demande de
// Colart : garder systématiquement la commande du client en pièce jointe plutôt que de ne rien
// joindre du tout). Même logique de réduction progressive (résolution puis qualité) que
// compressImageFile, adaptée au rendu asynchrone de pdf.js.
function pdfPageToCompressedDataUrl(file, pageNum, maxBytes){
  return ensurePdfJs().then(function(pdfjsLib){
    return file.arrayBuffer().then(function(buf){
      return pdfjsLib.getDocument({data: buf}).promise;
    });
  }).then(function(pdf){
    return pdf.getPage(pageNum);
  }).then(function(page){
    var baseViewport = page.getViewport({scale: 1});
    var maxDim = 1600;
    var scale = Math.min(2, maxDim/Math.max(baseViewport.width, baseViewport.height, 1));
    var quality = 0.75;
    function renderAt(sc, q){
      var viewport = page.getViewport({scale: sc});
      var canvas = document.createElement("canvas");
      canvas.width = Math.max(1, Math.ceil(viewport.width));
      canvas.height = Math.max(1, Math.ceil(viewport.height));
      var ctx = canvas.getContext("2d");
      ctx.fillStyle = "#fff"; ctx.fillRect(0,0,canvas.width,canvas.height);
      return page.render({canvasContext: ctx, viewport: viewport}).promise.then(function(){
        return canvas.toDataURL("image/jpeg", q);
      });
    }
    function attempt(tries){
      return renderAt(scale, quality).then(function(dataUrl){
        var tooLarge = dataUrlByteLength(dataUrl) > maxBytes;
        if(!tooLarge || tries>=8) return {dataUrl: dataUrl, tooLarge: tooLarge};
        if(quality > 0.35){ quality -= 0.12; } else { scale *= 0.75; }
        return attempt(tries+1);
      });
    }
    return attempt(0);
  });
}
function pdfFileToText(file, maxPages){
  maxPages = maxPages || 5;
  return ensurePdfJs().then(function(pdfjsLib){
    return file.arrayBuffer().then(function(buf){
      return pdfjsLib.getDocument({data: buf}).promise;
    });
  }).then(function(pdf){
    var n = Math.min(pdf.numPages, maxPages);
    var pagePromises = [];
    var _loop = function(pageNum){
      pagePromises.push(pdf.getPage(pageNum).then(function(page){
        return page.getTextContent().then(function(tc){
          return tc.items.map(function(it){ return it.str; }).join(" ");
        });
      }));
    };
    for(var i=1;i<=n;i++) _loop(i);
    return Promise.all(pagePromises).then(function(pages){ return pages.join("\n\n--- page suivante ---\n\n"); });
  });
}

    '  "dateMission": "date d\'enlèvement ou de livraison souhaitée, format YYYY-MM-DD",\n'+

    '  "numeroCommande": "numéro de la commande d\'achat",\n'+
    '  "dateCommande": "date de la commande, format YYYY-MM-DD",\n'+
    '  "lignes": [{"designation": "libellé de la ligne facturée", "quantite": nombre ou null, "unite": "ex: forfait, heure, km", "prixUnitaireHT": nombre ou null}],\n'+
    '  "montantHT": nombre ou null,\n'+
    '  "montantTVA": nombre ou null,\n'+
    '  "montantTTC": nombre ou null\n'+
    "}"+
    (extractedText? ("\n\nTexte du document :\n"+extractedText.slice(0,20000)) : "");

  var map = {

    sampling_disabled: "L'analyse IA n'est pas disponible pour ce compte.",
    images_unavailable: "L'analyse d'image n'est pas disponible pour vous actuellement — essayez plutôt une saisie manuelle.",
    image_rejected: "Le fichier n'a pas pu être lu (format, taille ou nombre de pages non supporté).",
    rate_limited: "Trop de demandes pour le moment — réessayez dans un instant.",
    prompt_too_large: "Le document est trop volumineux à analyser en une fois.",
    refused: "L'analyse a été refusée pour ce document.",
    empty_completion: "L'analyse n'a rien renvoyé — réessayez.",
    invalid_json: "La réponse de l'analyse n'a pas pu être lue — réessayez, ou saisissez la mission manuellement.",
    upstream_error: "Un problème technique est survenu pendant l'analyse — réessayez."
  };
  return map[code] || "L'analyse a échoué — réessayez, ou saisissez la mission manuellement.";

function openImportCommandeModal(){
  var body =
    '<div class="hint" style="margin-bottom:10px">L\'analyse automatique par IA n\'est pas encore disponible sur cette version hébergée — créez la mission manuellement via « + Nouvelle mission ».</div>'+
    '<div class="field"><label>Fichier (PDF ou photo)</label><input type="file" id="cmd_file" accept="application/pdf,image/png,image/jpeg,image/webp,image/gif"/></div>'+
    '<div id="cmd_status" class="sub" style="margin-top:8px"></div>';
  openModal("Importer une commande client", body, function(modal, close){
    var buttons = [];
    if(!state.sample){
      modal.querySelector("#cmd_status").textContent = "Analyse IA indisponible dans cette session — vous pouvez créer la mission manuellement (bouton + Nouvelle mission).";
      return buttons;
    }
    var fileInput = modal.querySelector("#cmd_file");
    var statusEl = modal.querySelector("#cmd_status");
    var go = el('<button class="btn primary">Analyser</button>');
    go.addEventListener("click", function(){
      var file = fileInput.files && fileInput.files[0];
      if(!file){ toast("Choisissez un fichier"); return; }
      go.disabled = true;
      statusEl.textContent = "Préparation du document…";

      function runSample(promptText, imgs){
        statusEl.textContent = "Analyse en cours…";
        var opts = {modelTier: "default", cache: false};
        if(imgs) opts.images = imgs;
        return state.sample.json(promptText, opts);
      }
      function fail(msg){
        statusEl.textContent = msg;
        go.disabled = false;
        var marker = new Error("import_failed"); marker.handled = true;
        throw marker;
      }

      var pipeline;
      if(file.type==="application/pdf"){
        // On privilégie l'extraction du texte du PDF (fiable, ne dépend pas de la
        // capacité "images" qui n'est pas disponible sur tous les comptes) ; on ne
        // bascule sur une analyse d'image que si le PDF n'a pas de texte exploitable
        // (scan) ET que l'analyse d'image est disponible.
        pipeline = pdfFileToText(file, 5).catch(function(e){
          fail("Impossible de lire ce PDF automatiquement. Essayez plutôt une photo ou une capture d'écran de la commande.");
        }).then(function(text){
          var trimmed = (text||"").trim();
          if(trimmed.length >= 30){
            return runSample(commandeExtractionPrompt(trimmed), null);
          }
          return state.sample.limits().catch(function(){ return null; }).then(function(caps){
            if(caps && caps.images){
              return pdfFileToImageBlobs(file, 2).then(function(images){
                return runSample(commandeExtractionPrompt(null), images);
              });
            }
            fail("Ce PDF ne contient pas de texte lisible (probablement un scan) et l'analyse d'image n'est pas disponible pour votre compte actuellement. Essayez un autre PDF, ou saisissez la mission manuellement.");
          });
        });
      } else {
        pipeline = state.sample.limits().catch(function(){ return null; }).then(function(caps){
          if(!caps || !caps.images){
            fail("L'analyse de photo n'est pas disponible pour votre compte actuellement. Importez plutôt directement le PDF de la commande, s'il est disponible.");
            return;
          }
          return runSample(commandeExtractionPrompt(null), [file]);
        });
      }

      pipeline.then(function(data){
        // On tente aussi de joindre le fichier original de la commande au devis qui
        // sera créé, s'il tient dans le budget de taille du document (voir
        // wireAttachmentZone / MAX_ATTACHMENT_DATAURL_BYTES). Un PDF trop volumineux pour être
        // joint tel quel (cas fréquent pour un vrai bon de commande scanné) est converti en
        // image compressée (1re page) plutôt que de repartir sans aucune pièce jointe — demande
        // explicite de Colart (10/09/2026) : toujours garder la commande du client dans le
        // dossier de la mission.
        var pdfWasConverted = false;
        var attachPromise;
        if(/^image\//.test(file.type)){
          attachPromise = compressImageFile(file, MAX_ATTACHMENT_DATAURL_BYTES).then(function(res){
            return res.tooLarge? null : {name: file.name, type: file.type, size: dataUrlByteLength(res.dataUrl), dataUrl: res.dataUrl};
          }).catch(function(){ return null; });
        } else if(file.type==="application/pdf"){
          if(file.size*1.37 <= MAX_ATTACHMENT_DATAURL_BYTES){
            attachPromise = fileToDataUrl(file).then(function(du){
              return {name: file.name, type: file.type||"application/pdf", size: dataUrlByteLength(du), dataUrl: du};
            }).catch(function(){ return null; });
          } else {
            attachPromise = pdfPageToCompressedDataUrl(file, 1, MAX_ATTACHMENT_DATAURL_BYTES).then(function(res){
              pdfWasConverted = true;
              var baseName = (file.name||"commande").replace(/\.pdf$/i,"");
              return {name: baseName+" (page 1).jpg", type: "image/jpeg", size: dataUrlByteLength(res.dataUrl), dataUrl: res.dataUrl};
            }).catch(function(){ return null; });
          }
        } else {
          attachPromise = Promise.resolve(null);
        }
        return attachPromise.then(function(fichier){
          close();
          var extracted = data || {};
          extracted.__bcFichier = fichier;
          openMissionModal(null, null, null, extracted);
          if(fichier && pdfWasConverted){
            setTimeout(function(){ toast("PDF trop volumineux pour être joint tel quel — converti en image (1re page) et joint à la mission"); }, 300);
          } else if(!fichier){
            setTimeout(function(){ toast("Le fichier de la commande n'a pas pu être joint automatiquement — joignez-le manuellement ci-dessous si besoin"); }, 300);
          }
        });
      }).catch(function(e){
        if(!e || e.handled) return;
        statusEl.textContent = "Erreur d'analyse : "+commandeErrorCopy(e.code)+(e.code? " ("+e.code+")":"");
        go.disabled = false;
      });
    });
    buttons.push(go);
    return buttons;
  });
}

    '<div class="field"><label>Notes / classement du bon de commande</label><textarea id="dv_notes" placeholder="Où trouver le document (email, dossier partagé…)">'+escapeHtml(existing.notesBonCommande||"")+'</textarea></div>';

  var titleClient = existing.clientNom || (linkedMission&&linkedMission.client) || "";
  openModal(hasExisting? "Devis — "+titleClient : (titleClient? "Nouveau devis — "+titleClient : "Nouveau devis"), body, function(modal, close){
    var linesContainer = modal.querySelector("#devisLines");
    var detailsContainer = modal.querySelector("#devisDetails");
    var bcAttachment = wireAttachmentZone(modal.querySelector("#bcFileZone"), existing.bonCommandeFichier||null, "application/pdf,image/png,image/jpeg,image/webp,image/gif", function(){});
    wireClientAutocomplete(modal.querySelector("#dv_clientNom"), function(c){
      var adrEl = modal.querySelector("#dv_clientAdresse");
      if(adrEl && !adrEl.value) adrEl.value = clientAdresseComplete(c);
      var mailEl = modal.querySelector("#dv_clientEmail");
      if(mailEl && !mailEl.value && c.email) mailEl.value = c.email;
    });

    function wireLineRemove(){
      linesContainer.querySelectorAll(".dl-remove").forEach(function(btn){
        btn.onclick = function(){ btn.closest(".devis-line-row").remove(); recalc(); };
      });
    }
    function wireDetailRemove(){
      detailsContainer.querySelectorAll(".dk-remove").forEach(function(btn){
        btn.onclick = function(){ btn.closest(".devis-kv-row").remove(); };
      });
    }
    function recalc(){
      var ht = 0;
      linesContainer.querySelectorAll(".devis-line-row").forEach(function(row){
        var qStr = row.querySelector(".dl-qte").value;
        var pStr = row.querySelector(".dl-prix").value;
        var montantEl = row.querySelector(".dl-montant");
        if(qStr==="" || pStr===""){
          montantEl.value = "au réel";
        } else {
          var m = (parseFloat(qStr)||0)*(parseFloat(pStr)||0);
          montantEl.value = fmtEUR(m);
          ht += m;
        }
      });
      var tva = ht*0.20, ttc = ht*1.20;
      modal.querySelector("#devisTotalDisplay").innerHTML =
        '<div class="dt-row"><span>Total HT</span><span>'+fmtEUR(ht)+'</span></div>'+
        '<div class="dt-row"><span>TVA (20 %)</span><span>'+fmtEUR(tva)+'</span></div>'+
        '<div class="dt-row dt-ttc"><span>Total TTC</span><span>'+fmtEUR(ttc)+'</span></div>';
    }
    var initialLines = (existing.lignes && existing.lignes.length)? existing.lignes : [];
    initialLines.forEach(function(l){ linesContainer.appendChild(el(devisLineRowHtml(l))); });
    wireLineRemove(); recalc();
    linesContainer.addEventListener("input", recalc);
    modal.querySelector("#btnAddLine").addEventListener("click", function(){
      linesContainer.appendChild(el(devisLineRowHtml({})));
      wireLineRemove(); recalc();
    });
    modal.querySelector("#btnAddPreset").addEventListener("click", function(){
      var idx = parseInt(modal.querySelector("#dv_preset").value, 10);
      var p = DEVIS_PRESETS[idx];
      if(!p) return;
      linesContainer.appendChild(el(devisLineRowHtml({designation:p.designation, unite:p.unite, quantite:p.quantite, prixUnitaire:p.prix})));
      wireLineRemove(); recalc();
    });

    var initialDetails = (existing.details && existing.details.length)? existing.details : [];
    initialDetails.forEach(function(r){ detailsContainer.appendChild(el(devisDetailRowHtml(r))); });
    wireDetailRemove();
    modal.querySelector("#btnAddDetail").addEventListener("click", function(){
      detailsContainer.appendChild(el(devisDetailRowHtml({})));
      wireDetailRemove();
    });

    function collectData(){
      var lignes = [];
      linesContainer.querySelectorAll(".devis-line-row").forEach(function(row){
        var designation = row.querySelector(".dl-libelle").value.trim();
        var qte = row.querySelector(".dl-qte").value;
        var unite = row.querySelector(".dl-unite").value.trim();
        var prix = row.querySelector(".dl-prix").value;
        if(!designation && qte==="" && prix==="" && !unite) return;
        lignes.push({designation: designation, quantite: qte===""?null:parseFloat(qte), unite: unite, prixUnitaire: prix===""?null:parseFloat(prix)});
      });
      var details = [];
      detailsContainer.querySelectorAll(".devis-kv-row").forEach(function(row){
        var label = row.querySelector(".dk-label").value.trim();
        var value = row.querySelector(".dk-value").value.trim();
        if(!label && !value) return;
        details.push({label: label, value: value});
      });
      return {
        missionId: linkedMission? linkedMission.id : ((existingDoc && existingDoc.missionId) || null),
        statut: modal.querySelector("#dv_statut").value,
        numero: modal.querySelector("#dv_numero").value.trim(),
        dateEmission: modal.querySelector("#dv_dateEmission").value,
        validiteJours: parseInt(modal.querySelector("#dv_validite").value, 10) || 30,
        clientNom: modal.querySelector("#dv_clientNom").value.trim(),
        clientAdresse: modal.querySelector("#dv_clientAdresse").value.trim(),
        clientContact: modal.querySelector("#dv_clientContact").value.trim(),
        clientTel: modal.querySelector("#dv_clientTel").value.trim(),
        clientEmail: modal.querySelector("#dv_clientEmail").value.trim(),
        objet: modal.querySelector("#dv_objet").value.trim(),
        details: details,
        lignes: lignes,
        noteForfait: modal.querySelector("#dv_note").value.trim(),
        conditionsGenerales: modal.querySelector("#dv_conditions").value,
        numeroBonCommande: modal.querySelector("#dv_numBc").value.trim(),
        dateBonCommande: modal.querySelector("#dv_dateBc").value,
        montantBonCommande: modal.querySelector("#dv_montantBc").value.trim(),
        notesBonCommande: modal.querySelector("#dv_notes").value.trim(),
        bonCommandeFichier: bcAttachment.getValue(),
        createdAt: hasExisting? (existingDoc.createdAt || new Date().toISOString()) : new Date().toISOString(),
        updatedAt: new Date().toISOString()
      };
    }

    var buttons = [];
    if(hasExisting){
      var del = el('<button class="btn danger">Supprimer le devis</button>');
      del.addEventListener("click", function(){
        if(!state.db) return;
        confirmAction("Supprimer ce devis ?", function(){
          dbWrite(state.db.doc("devis/"+docId).delete(), "Devis supprimé");
          close();
        });
      });
      buttons.push(del);
    }
    var preview = el('<button type="button" class="btn">Aperçu / Imprimer</button>');
    preview.addEventListener("click", function(){ openDevisPrintView(linkedMission, collectData()); });
    buttons.push(preview);
    // Envoi par e-mail (ajouté 09/09/2026) : pas de capacité d'envoi d'e-mail côté Artifact — on
    // ouvre le client mail par défaut du gestionnaire (lien mailto:) avec destinataire/objet/corps
    // pré-remplis ; le PDF du devis (généré via "Aperçu / Imprimer" → Enregistrer en PDF) doit être
    // joint manuellement, un lien mailto ne pouvant pas joindre de fichier automatiquement.
    var sendMail = el('<button type="button" class="btn">✉️ Envoyer par e-mail</button>');
    sendMail.addEventListener("click", function(){
      var data = collectData();
      var mail = (data.clientEmail||"").trim();
      if(!mail){ toast("Renseignez d'abord l'e-mail du client (champ E-mail ci-dessus, ou dans sa fiche client)"); return; }
      var subject = "Devis"+(data.numero?(" "+data.numero):"")+" — SARL DEBRUYNE COLART";
      var body = "Bonjour,\n\nVeuillez trouver ci-joint notre devis"+(data.numero?(" n° "+data.numero):"")+(data.clientNom?(" concernant "+data.clientNom):"")+".\n\nN'hésitez pas à nous contacter pour toute question.\n\nCordialement,\nSARL DEBRUYNE COLART\nTel 03/28/68/61/44";
      var a = document.createElement("a");
      a.href = "mailto:"+encodeURIComponent(mail)+"?subject="+encodeURIComponent(subject)+"&body="+encodeURIComponent(body);
      document.body.appendChild(a);
      a.click();
      a.remove();
      toast("Client mail ouvert — pensez à joindre le PDF du devis (bouton \"Aperçu / Imprimer\" → Enregistrer en PDF)");
    });
    buttons.push(sendMail);
    var save = el('<button class="btn primary">Enregistrer le devis</button>');
    save.addEventListener("click", function(){
      var data = collectData();
      if(!state.db){ toast("Base de données indisponible"); return; }
      if(JSON.stringify(data).length > 250*1024){
        toast("Devis trop volumineux à enregistrer (pièce jointe trop lourde) — retirez le fichier ou joignez une version plus légère");
        return;
      }
      dbWrite(state.db.doc("devis/"+docId).set(data), hasExisting? "Devis mis à jour" : "Devis créé");
      close();
    });
    buttons.push(save);
    return buttons;
  });
}

/* ================= Generic modal ================= */
function openModal(title, bodyHtml, buttonsBuilder){
  var root = document.getElementById("modalRoot");
  root.innerHTML = "";
  var backdrop = el('<div class="modal-backdrop"></div>');
  var modal = el(
    '<div class="modal">'+
      '<div class="modal-hd"><h3>'+escapeHtml(title)+'</h3><button class="close-x">✕</button></div>'+
      '<div class="modal-bd">'+bodyHtml+'</div>'+
      '<div class="modal-ft"></div>'+
    '</div>'
  );
  backdrop.appendChild(modal);
  root.appendChild(backdrop);
  function close(){ root.innerHTML = ""; }
  modal.querySelector(".close-x").addEventListener("click", close);
  backdrop.addEventListener("click", function(e){ if(e.target===backdrop) close(); });
  var ft = modal.querySelector(".modal-ft");
  var btns = buttonsBuilder ? buttonsBuilder(modal, close) : [];
  btns.forEach(function(b){ ft.appendChild(b); });
  return {modal:modal, close:close};
}

// Remplace window.confirm() : les pages publiées en Artifact tournent dans un iframe sandboxé qui
// bloque (ou ignore silencieusement) les boîtes de dialogue natives confirm()/alert()/prompt() —
// c'était la cause du bug "je ne peux pas supprimer les missions" (et véhicules/chauffeurs/devis/
// factures/refus de mission) signalé par Colart le 09/09/2026 : le clic ne provoquait jamais la
// suppression car confirm() ne rendait jamais `true`. Cette boîte de dialogue maison, superposée
// à document.body (donc au-dessus d'un modal déjà ouvert sans le fermer), la remplace partout.
function confirmAction(message, onConfirm){
  var overlay = el(
    '<div class="modal-backdrop" style="z-index:300">'+
      '<div class="modal" style="max-width:420px">'+
        '<div class="modal-hd"><h3>Confirmation</h3><button class="close-x">✕</button></div>'+
        '<div class="modal-bd"><div style="font-size:14px">'+escapeHtml(message)+'</div></div>'+
        '<div class="modal-ft"></div>'+
      '</div>'+
    '</div>'
  );
  document.body.appendChild(overlay);
  function close(){ overlay.remove(); }
  overlay.querySelector(".close-x").addEventListener("click", close);
  overlay.addEventListener("click", function(e){ if(e.target===overlay) close(); });
  var ft2 = overlay.querySelector(".modal-ft");
  var cancelBtn = el('<button type="button" class="btn">Annuler</button>');
  cancelBtn.addEventListener("click", close);
  var okBtn = el('<button type="button" class="btn danger">Confirmer</button>');
  okBtn.addEventListener("click", function(){ close(); onConfirm(); });
  ft2.appendChild(cancelBtn); ft2.appendChild(okBtn);
}

function renderDriverMissions(){
  startDriverGeoWatch();
  var wrap = document.createElement("div");
  var mine = state.missions.filter(function(m){ return m.chauffeurId===state.driverId && m.statutIndex!=="refusee"; })
    .sort(byDateHeure);
  // Une mission encore active (non terminée) reste actionnable même si sa date prévue est
  // dépassée (retard) — seul le statut décide, jamais la date, sinon les boutons d'étape
  // disparaissent pour une mission en retard (elle bascule à tort dans l'historique lecture seule).
  var upcoming = mine.filter(function(m){ return statutIndex(m)<STEP_LAST; });
  var past = mine.filter(function(m){ return statutIndex(m)>=STEP_LAST; }).slice(-10).reverse();

  wrap.appendChild(el('<h3 style="margin-bottom:4px">Mes missions</h3>'));
  wrap.appendChild(el('<div class="hint" style="margin-bottom:12px">📍 Position partagée avec le gestionnaire tant que cette page reste ouverte (carte du Planning)</div>'));

  if(!upcoming.length){
    wrap.appendChild(el('<div class="empty">Aucune mission à venir. 🎉</div>'));
  } else {
    var list = el('<div class="dm-list"></div>');
    upcoming.forEach(function(m){ list.appendChild(driverMissionCard(m)); });
    wrap.appendChild(list);
  }

  if(past.length){
    wrap.appendChild(el('<div class="section-title">Historique récent</div>'));
    var list2 = el('<div class="dm-list"></div>');
    past.forEach(function(m){ list2.appendChild(driverMissionCard(m, true)); });
    wrap.appendChild(list2);
  }
  return wrap;
}

function driverMissionCard(m, readonly){
  var si = statutIndex(m);
  var card = el('<div class="dm-card"></div>');
  var badge = statutBadge(m);
  var cd = computeCountdown(m);
  card.innerHTML =
    '<div class="hd"><div><div class="client">'+escapeHtml(m.client||"Client")+'</div>'+
      '<div class="addr">'+escapeHtml(m.dateMission||"")+(m.heureDebut? " à "+escapeHtml(m.heureDebut):"")+'</div></div>'+
      '<div style="display:flex;flex-direction:column;gap:4px;align-items:flex-end">'+
        (cd? '<span class="badge '+cd.cls+'">'+cd.label+'</span>' : '')+
        '<span class="badge '+badge.cls+'">'+badge.label+'</span>'+
      '</div></div>'+
    (m.instructions? '<div class="alert-banner">⚠️<div><b>Instructions particulières</b>'+escapeHtml(m.instructions)+'</div></div>' : '')+
    '<div class="addr">📦 <b>Chargement:</b> '+escapeHtml(m.adresseChargement||"—")+'</div>'+
    ((m.chargementsSupp && m.chargementsSupp.length)? m.chargementsSupp.map(function(a){ return '<div class="addr" style="padding-left:22px">+ '+escapeHtml(a)+'</div>'; }).join("") : '')+
    '<div class="addr">🏁 <b>Livraison:</b> '+escapeHtml(m.adresseLivraison||"—")+'</div>'+
    ((m.livraisonsSupp && m.livraisonsSupp.length)? m.livraisonsSupp.map(function(a){ return '<div class="addr" style="padding-left:22px">+ '+escapeHtml(a)+'</div>'; }).join("") : '')+
    '<div class="addr">🚛 '+escapeHtml(missionVehiculeSummary(m))+'</div>'+
    (m.contacts? '<div class="dm-extra"><div>👤 '+escapeHtml(m.contacts)+'</div></div>' : '')+
    (m.marchandises? '<div class="dm-extra"><div>📋 '+escapeHtml(m.marchandises)+'</div></div>' : '')+
    (m.documents? '<div class="dm-extra"><div>📄 '+escapeHtml(m.documents)+'</div></div>' : '');

  var steps = el('<div class="dm-steps"></div>');
  STEPS.forEach(function(s,i){
    var cls = i<=si ? "done" : (i===si+1 ? "next" : "");
    steps.appendChild(el('<span class="step-pill '+cls+'">'+s.label+'</span>'));
  });
  card.appendChild(steps);

  if(!readonly && si<STEP_LAST){
    var actions = el('<div class="dm-actions"></div>');
    var nextIdx = si+1;
    if(nextIdx===STEP_LAST){
      // Dernière étape : photo de la lettre de voiture (CMR) obligatoire avant de clore la mission.
      // L'appli ne peut pas encore stocker/transmettre le fichier (limite technique connue) — la prise
      // de vue est donc juste confirmée et horodatée ; le chauffeur doit encore l'envoyer par ses
      // moyens habituels.
      var photoTaken = false;
      var cmrWrap = el('<div class="cmr-gate"></div>');
      cmrWrap.appendChild(el('<div class="hint">📷 Photo de la lettre de voiture (CMR) obligatoire avant de terminer la mission. Elle n\'est pas encore transmise automatiquement par l\'appli — envoyez-la ensuite comme d\'habitude.</div>'));
      var camLabel = el('<label class="btn sm primary">📷 Prendre la photo CMR<input type="file" accept="image/*" capture="environment" style="display:none"/></label>');
      var camInput = camLabel.querySelector("input");
      var finishBtn = el('<button class="btn primary sm" disabled>Étape suivante : Fin de mission</button>');
      camInput.addEventListener("change", function(){
        if(camInput.files && camInput.files[0]){
          photoTaken = true;
          finishBtn.disabled = false;
          camLabel.innerHTML = "✅ Photo CMR prête";
          camLabel.className = "btn sm";
        }
      });
      finishBtn.addEventListener("click", function(){
        if(!photoTaken){ toast("Prenez d'abord la photo de la CMR"); return; }
        advanceMission(m, {cmrPhotoConfirmed:true});
      });
      cmrWrap.appendChild(camLabel);
      cmrWrap.appendChild(finishBtn);
      actions.appendChild(cmrWrap);
    } else {
      var nextBtn = el('<button class="btn primary sm">'+(si<0?"Accepter la mission":"Étape suivante : "+STEPS[nextIdx].label)+'</button>');
      nextBtn.addEventListener("click", function(){ advanceMission(m); });
      actions.appendChild(nextBtn);
    }
    if(si<0){
      var refuseBtn = el('<button class="btn sm danger">Refuser la mission</button>');
      refuseBtn.addEventListener("click", function(){ refuseMission(m); });
      actions.appendChild(refuseBtn);
    }
    card.appendChild(actions);
  }
  return card;
}

function advanceMission(m, extra){
  if(!state.db){ toast("Base de données indisponible"); return; }
  var si = statutIndex(m);
  var nextIdx = si+1;
  if(nextIdx>STEP_LAST) return;
  var stepTimes = Object.assign({}, m.stepTimes||{});
  stepTimes[STEPS[nextIdx].key] = new Date().toISOString();
  var data = {statutIndex: nextIdx, stepTimes: stepTimes, updatedAt: new Date().toISOString()};
  if(extra && extra.cmrPhotoConfirmed){
    data.cmrPhotoConfirmed = true;
    data.cmrPhotoConfirmedAt = new Date().toISOString();
  }
  dbWrite(state.db.doc("missions/"+m.id).update(data), STEPS[nextIdx].label);
}

function refuseMission(m){
  if(!state.db){ toast("Base de données indisponible"); return; }
  confirmAction("Confirmer le refus de cette mission ?", function(){
    dbWrite(state.db.doc("missions/"+m.id).update({statutIndex:"refusee", updatedAt:new Date().toISOString()}), "Mission refusée");
  });
}
