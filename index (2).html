*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-size:14px;line-height:1.45}
button,input,select,textarea{font-family:inherit;font-size:14px;color:inherit}
h1,h2,h3,h4{margin:0;font-weight:700}
p{margin:0}
a{color:var(--blue)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:6px}

.hidden{display:none!important}
.app{min-height:100vh;display:flex;flex-direction:column}

/* ---------- Landing ---------- */
.landing{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.landing-card{max-width:520px;width:100%;text-align:center}
.landing-logo{width:64px;height:64px;border-radius:16px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 18px;overflow:hidden}
.landing-logo img{width:100%;height:100%;object-fit:cover;display:block}
.landing h1{font-size:24px;margin-bottom:6px}
.landing p.sub{color:var(--text-2);margin-bottom:28px}
.landing-choices{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:520px){.landing-choices{grid-template-columns:1fr}}
.choice-btn{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px 16px;cursor:pointer;box-shadow:var(--shadow);text-align:center;transition:transform .12s ease,border-color .12s ease}
.choice-btn:hover{border-color:var(--accent);transform:translateY(-1px)}
.choice-btn .ic{font-size:28px;margin-bottom:8px}
.choice-btn .lbl{font-weight:700;font-size:15px}
.choice-btn .sub{color:var(--text-3);font-size:12.5px;margin-top:4px}
.db-banner{margin-top:18px;font-size:12px;color:var(--amber);background:var(--amber-soft);border-radius:8px;padding:8px 12px}

/* ---------- Top bar ---------- */
.topbar{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
.topbar .brand{display:flex;align-items:center;gap:8px;font-weight:700}
.topbar .brand .ic{width:28px;height:28px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-size:15px;overflow:hidden}
.topbar .brand .ic img{width:100%;height:100%;object-fit:cover;display:block}
.topbar .spacer{flex:1}
.topbar .who{color:var(--text-2);font-size:12.5px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab-btn{border:1px solid transparent;background:transparent;padding:7px 12px;border-radius:8px;cursor:pointer;color:var(--text-2);font-weight:600;font-size:13px}
.tab-btn.active{background:var(--accent-soft);color:var(--accent)}
.tab-btn:hover:not(.active){background:var(--surface-2)}
.btn{border:1px solid var(--border-2);background:var(--surface);padding:7px 13px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--text)}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.5;cursor:not-allowed}

.main{flex:1;padding:16px;max-width:1400px;width:100%;margin:0 auto}
@media (max-width:720px){.main{padding:12px}}

/* ---------- Dashboard ---------- */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:20px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px}
.kpi .n{font-size:26px;font-weight:800;line-height:1}
.kpi .l{color:var(--text-2);font-size:12px;margin-top:6px}
.kpi.accent{border-color:var(--accent);background:var(--accent-soft)}
.kpi.accent .n{color:var(--accent)}
.section-title{font-size:14px;font-weight:700;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
.section-title .cnt{color:var(--text-3);font-weight:600;font-size:12px}

.mission-list{display:flex;flex-direction:column;gap:8px}
.m-row{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px;display:flex;gap:12px;align-items:center;cursor:pointer}
.m-row:hover{border-color:var(--border-2)}
.m-row .time{font-weight:700;min-width:48px;font-variant-numeric:tabular-nums}
.m-row .mid{flex:1;min-width:0}
.m-row .client{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-row .meta{color:var(--text-2);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
.badge.gray{background:var(--gray-soft);color:var(--gray)}
.badge.blue{background:var(--blue-soft);color:var(--blue)}
.badge.amber{background:var(--amber-soft);color:var(--amber)}
.badge.green{background:var(--green-soft);color:var(--green)}
.badge.danger{background:var(--danger-soft);color:var(--danger)}
.badge.purple{background:var(--purple-soft);color:var(--purple)}
.badge.teal{background:var(--teal-soft);color:var(--teal)}
.badge.magenta{background:var(--magenta-soft);color:var(--magenta)}
.badge.rust{background:var(--rust-soft);color:var(--rust)}
.badge.olive{background:var(--olive-soft);color:var(--olive)}
.empty{color:var(--text-3);font-size:13px;padding:18px;text-align:center;border:1px dashed var(--border-2);border-radius:10px}
.alert-banner{background:var(--danger-soft);border:1px solid var(--danger);color:var(--danger);border-radius:10px;padding:10px 12px;font-size:12.5px;margin-bottom:10px;display:flex;gap:8px;align-items:flex-start}
.alert-banner b{display:block;color:var(--text);font-weight:700;margin-bottom:2px}
.horod-list{display:flex;flex-direction:column;gap:2px;margin:4px 0 14px;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.horod-row{display:flex;justify-content:space-between;padding:7px 12px;font-size:12.5px;background:var(--surface-2)}
.horod-row:nth-child(odd){background:var(--surface)}
.horod-row .lbl{color:var(--text-2)}
.horod-row .ts{font-weight:700;font-variant-numeric:tabular-nums}
.horod-row.pending .ts{color:var(--text-3);font-weight:400}
.horod-row.horod-edit-row{align-items:center;gap:8px}
.horod-input{padding:4px 8px;border:1px solid var(--border-2);border-radius:6px;background:var(--surface);color:var(--text);font-size:12px;font-variant-numeric:tabular-nums;max-width:190px}

/* ---------- Planning ---------- */
.view-toggle{display:inline-flex;gap:4px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:4px;margin-bottom:14px}
.view-toggle button{border:none;background:transparent;padding:7px 14px;border-radius:7px;font-size:13px;font-weight:600;color:var(--text-2);cursor:pointer}
.view-toggle button.active{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.map-board{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.map-pulse{animation:mapPulse 2s ease-out infinite;transform-origin:center}
@keyframes mapPulse{0%{transform:scale(1);opacity:.55}70%{transform:scale(2.4);opacity:0}100%{opacity:0}}
.map-popup{position:absolute;background:var(--surface);border:1px solid var(--border-2);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:14px;width:230px;font-size:13px;z-index:5}
.map-popup h4{margin:0 0 6px;font-size:13.5px}
.map-popup .row{margin:3px 0;color:var(--text-2)}
.map-popup select{width:100%;margin-top:8px;padding:6px 8px;border-radius:7px;border:1px solid var(--border-2);background:var(--surface);color:var(--text);font-size:12.5px}
.map-popup-close{position:absolute;top:8px;right:10px;cursor:pointer;color:var(--text-2);font-size:13px;background:none;border:none}
.week-nav{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.week-nav .lbl{font-weight:700;font-size:15px}
.planning-grid{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)}
.pg-table{border-collapse:collapse;width:100%;min-width:920px}
.pg-table th{position:sticky;top:53px;background:var(--surface);text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);font-size:12px;color:var(--text-2);z-index:5}
.pg-table th.driver-col,.pg-table td.driver-col{position:sticky;left:0;background:var(--surface);z-index:6;min-width:130px;border-right:1px solid var(--border)}
.pg-table td{vertical-align:top;padding:6px;border-bottom:1px solid var(--border);border-right:1px solid var(--surface-3);min-width:150px}
.pg-table .today-col{background:var(--accent-soft)}
.day-head{display:flex;flex-direction:column}
.day-head .dow{font-weight:700;color:var(--text)}
.day-head .dnum{font-size:11px;color:var(--text-3)}
.driver-name{font-weight:700}
.driver-name .status-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px}
.mcard{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:6px 8px;margin-bottom:5px;cursor:pointer;font-size:12px}
.mcard:hover{border-color:var(--accent)}
.mcard .t{font-weight:700}
.mcard .c{color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mcard.st--1{border-left:3px solid var(--gray)}
.mcard.st-0{border-left:3px solid var(--blue)}
.mcard.st-1,.mcard.st-2,.mcard.st-3{border-left:3px solid var(--amber)}
.mcard.st-4{border-left:3px solid var(--green);opacity:.7}
.mcard.st-refusee{border-left:3px solid var(--danger)}
/* Teinte de fond par catégorie de véhicule (ajouté 09/09/2026) — indépendante de la barre de
   gauche ci-dessus, qui reste dédiée au statut de la mission. */
.mcard.type-grue-7m{background:var(--purple-soft)}
.mcard.type-grue-12m{background:var(--magenta-soft)}
.mcard.type-porte-engins{background:var(--teal-soft)}
.mcard.type-plateau-12m{background:var(--rust-soft)}
.mcard.type-plateau-7m{background:var(--olive-soft)}
.add-cell-btn{width:100%;background:transparent;border:1px dashed var(--border-2);border-radius:8px;padding:4px;color:var(--text-3);cursor:pointer;font-size:16px;line-height:1}
.add-cell-btn:hover{color:var(--accent);border-color:var(--accent)}
.unassigned-strip{margin-top:14px}

/* ---------- Lists (vehicules/chauffeurs) ---------- */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.item-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px}
.item-card h4{font-size:14.5px;margin-bottom:2px}
.item-card .sub{color:var(--text-2);font-size:12.5px;margin-bottom:8px}
.item-card .row{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.toggle{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:12.5px;color:var(--text-2)}
.switch{width:34px;height:19px;border-radius:999px;background:var(--surface-3);position:relative;transition:background .15s}
.switch.on{background:var(--green)}
.switch .knob{position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff;transition:left .15s}
.switch.on .knob{left:17px}

/* ---------- Chauffeur view ---------- */
.driver-picker{max-width:420px;margin:40px auto;text-align:center}
.driver-picker h2{margin-bottom:4px}
.driver-picker p{color:var(--text-2);margin-bottom:18px}
select.big{width:100%;padding:12px;border-radius:10px;border:1px solid var(--border-2);background:var(--surface);margin-bottom:12px}
.dm-list{display:flex;flex-direction:column;gap:12px;max-width:640px;margin:0 auto}
.dm-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
.dm-card .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px}
.dm-card .client{font-size:16px;font-weight:800}
.dm-card .addr{color:var(--text-2);font-size:13px;margin-top:2px}
.dm-card .addr b{color:var(--text)}
.dm-steps{display:flex;flex-wrap:wrap;gap:4px;margin:10px 0}
.step-pill{font-size:10.5px;padding:3px 7px;border-radius:999px;background:var(--surface-3);color:var(--text-3)}
.step-pill.done{background:var(--green-soft);color:var(--green)}
.step-pill.next{background:var(--blue-soft);color:var(--blue);font-weight:700}
.dm-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.dm-extra{margin-top:8px;font-size:12.5px;color:var(--text-2)}
.dm-extra div{margin-top:3px}
.cmr-gate{display:flex;flex-direction:column;gap:8px;width:100%}
.cmr-gate .hint{margin:0}
.cmr-gate label.btn{text-align:center;cursor:pointer}
.bc-file-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg-2,rgba(127,127,127,.08))}
.bc-file-info{flex:1;min-width:160px;font-size:13.5px}
.bc-file-info .sub{color:var(--text-2)}

/* ---------- Modal ---------- */
.modal-backdrop{position:fixed;inset:0;background:rgba(10,12,15,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:100}
.modal{background:var(--surface);border-radius:16px;max-width:640px;width:100%;max-height:88vh;overflow:auto;box-shadow:var(--shadow)}
.modal-hd{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);z-index:2}
.modal-hd h3{font-size:16px}
.modal-bd{padding:16px 18px}
.modal-ft{padding:14px 18px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;position:sticky;bottom:0;background:var(--surface)}
.close-x{background:transparent;border:none;font-size:18px;cursor:pointer;color:var(--text-2);padding:4px 8px;border-radius:6px}
.close-x:hover{background:var(--surface-2)}
.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--text-2);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:9px 10px;border:1px solid var(--border-2);border-radius:8px;background:var(--surface);color:var(--text)}
.field textarea{resize:vertical;min-height:60px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:480px){.field-row{grid-template-columns:1fr}}
.addr-supp-row{display:flex;gap:6px;margin-top:6px}
.addr-supp-row input{flex:1;padding:9px 10px;border:1px solid var(--border-2);border-radius:8px;background:var(--surface);color:var(--text)}
.addr-supp-row button{flex:0 0 auto}
.client-ac-list{display:none;position:absolute;left:0;right:0;top:100%;margin-top:2px;background:var(--surface);border:1px solid var(--border-2);border-radius:8px;box-shadow:var(--shadow);max-height:220px;overflow:auto;z-index:60}
.client-ac-item{padding:7px 10px;cursor:pointer;font-size:12.5px;border-bottom:1px solid var(--border)}
.client-ac-item:last-child{border-bottom:none}
.client-ac-item:hover{background:var(--surface-2)}
.client-ac-item .nm{font-weight:600}
.client-ac-item .sub2{color:var(--text-3);font-size:11px}
.hint{font-size:11.5px;color:var(--text-3);margin-top:3px}
.err{color:var(--danger);font-size:12.5px;margin-top:8px}
.devis-line-row{display:grid;grid-template-columns:1fr 60px 76px 90px 90px 30px;gap:6px;margin-bottom:6px;align-items:center}
.devis-line-row input{padding:7px 8px;border:1px solid var(--border-2);border-radius:8px;background:var(--surface);color:var(--text);width:100%;font-size:12.5px}
.devis-line-row input.dl-montant{background:var(--bg-2,rgba(127,127,127,.08));color:var(--text-2);font-weight:700}
@media (max-width:480px){.devis-line-row{grid-template-columns:1fr 1fr;row-gap:4px}.devis-line-row .dl-libelle{grid-column:1 / -1}}
.facture-line-row{display:grid;grid-template-columns:1fr 1fr 55px 80px 85px 28px;gap:6px;margin-bottom:6px;align-items:center}
.facture-line-row input{padding:7px 8px;border:1px solid var(--border-2);border-radius:8px;background:var(--surface);color:var(--text);width:100%;font-size:12.5px}
.facture-line-row input.fl-montant{background:var(--bg-2,rgba(127,127,127,.08));color:var(--text-2);font-weight:700}
@media (max-width:480px){.facture-line-row{grid-template-columns:1fr 1fr;row-gap:4px}.facture-line-row .fl-designation{grid-column:1 / -1}}
.facture-review-list{display:flex;flex-direction:column;gap:4px;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.facture-review-row{display:flex;align-items:center;gap:10px;padding:8px 10px;font-size:12.5px;background:var(--surface-2)}
.facture-review-row:nth-child(odd){background:var(--surface)}
.facture-review-row .fr-date{min-width:70px;color:var(--text-2);font-variant-numeric:tabular-nums}
.facture-review-row .fr-ref{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.facture-review-row .fr-montant{font-weight:700;min-width:80px;text-align:right}
.devis-kv-row{display:grid;grid-template-columns:170px 1fr 30px;gap:6px;margin-bottom:6px;align-items:center}
.devis-kv-row input{padding:7px 8px;border:1px solid var(--border-2);border-radius:8px;background:var(--surface);color:var(--text);width:100%;font-size:12.5px}
@media (max-width:480px){.devis-kv-row{grid-template-columns:1fr 30px}.devis-kv-row .dk-label{grid-column:1 / -1}}
.devis-presetbar{display:flex;gap:8px;margin-bottom:8px}
.devis-presetbar select{flex:1;padding:8px 9px;border:1px solid var(--border-2);border-radius:8px;background:var(--surface);color:var(--text);font-size:12.5px}
.devis-total-box{margin:8px 0 16px;padding:10px 12px;border:1px solid var(--border-2);border-radius:10px;background:var(--bg-2,rgba(127,127,127,.06))}
.devis-total-box .dt-row{display:flex;justify-content:space-between;font-size:13px;padding:2px 0;color:var(--text-2)}
.devis-total-box .dt-row.dt-ttc{font-weight:800;font-size:16px;color:var(--text);border-top:1px solid var(--border-2);margin-top:4px;padding-top:6px}

.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:12.5px;z-index:200;box-shadow:var(--shadow)}

/* ================= Devis — aperçu imprimable ================= */
.print-overlay{position:fixed;inset:0;background:#f2f2f2;z-index:500;overflow:auto;padding:22px;display:block}
.print-actions{display:flex;gap:10px;justify-content:flex-end;max-width:800px;margin:0 auto 16px}
.devis-doc{max-width:800px;margin:0 auto;background:#fff;color:#111;font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:1.5;padding:28px;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.devis-doc strong{color:#111}
.devis-doc table{width:100%;border-collapse:collapse;margin:10px 0}
.devis-doc th,.devis-doc td{border:1px solid #999;padding:6px 8px;text-align:left;vertical-align:top;font-size:12.5px}
.devis-doc .hd-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.devis-doc .box{border:1px solid #999;padding:10px}
.devis-doc .right{text-align:right}
.devis-doc .total-tbl{max-width:340px;margin-left:auto}
.devis-doc .total-row td{font-weight:700}
.devis-doc .cg-list{margin:8px 0;padding-left:18px}
.devis-doc .sign-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:24px}
.devis-doc .sign-box{border:1px solid #999;padding:30px 10px 10px;min-height:90px}
.devis-doc .footer{margin-top:20px;font-size:11px;color:#555;text-align:center;border-top:1px solid #ccc;padding-top:8px}
@media print{
  body *{visibility:hidden}
  .print-overlay, .print-overlay *{visibility:visible}
  .print-overlay{position:absolute;top:0;left:0;width:100%;padding:0;background:#fff}
  .print-actions{display:none}
  .devis-doc{box-shadow:none}
}
</style>

<!-- Firebase (v8 compat SDK — même API doc()/collection()/onSnapshot() que la base Artifact -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script>
// === À REMPLIR : config Firebase (Console Firebase > Paramètres du projet > Vos applications > app Web) ===
// Ces valeurs ne sont PAS secrètes (config client Firebase standard) — la vraie sécurité vient des

function normVilleKey(s){
  return String(s||"").toUpperCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[-']/g," ").replace(/\s+/g," ").trim();
}
// Repère "CODE POSTAL VILLE" dans une adresse libre (format standard des adresses françaises) pour
// en extraire le nom de ville, sans dépendre d'un champ dédié séparé sur la mission.
function extractVilleFromAdresse(adresse){
  if(!adresse) return "";
  var m = /\b\d{5}\s+([A-ZÀ-Üa-zà-ü' \-]{2,})/.exec(adresse);
  if(!m) return "";
  return m[1].replace(/,.*$/,"").replace(/\bFRANCE\b/i,"").trim();
}
// Retourne la clé TOWN_COORDS reconnue (pas seulement les coordonnées) — nécessaire pour afficher
// le bon nom de ville sur la carte même quand la correspondance passe par le repli "contient".
function resolveTownKey(villeBrute){
  var key = normVilleKey(villeBrute);
  if(!key) return null;
  if(TOWN_COORDS[key]) return key;
  // Repli : certaines adresses comportent un quartier/complément (ex. "DUNKERQUE CENTRE") — on
  // cherche une entrée connue contenue dans la clé, ou l'inverse.
  var found = Object.keys(TOWN_COORDS).find(function(k){ return key.indexOf(k)!==-1 || k.indexOf(key)!==-1; });
  return found || null;
}
function geocodeVille(villeBrute){
  var key = resolveTownKey(villeBrute);
  return key? TOWN_COORDS[key] : null;
}
function missionVilleChargement(m){ return extractVilleFromAdresse(m.adresseChargement); }
function missionGeocode(m){
  var ville = missionVilleChargement(m);
  return ville? geocodeVille(ville) : null;
}
function fmtRelTime(iso){
  if(!iso) return "";
  var diffMs = Date.now() - new Date(iso).getTime();
  var min = Math.round(diffMs/60000);
  if(min<1) return "à l'instant";
  if(min<60) return "il y a "+min+" min";
  var h = Math.round(min/60);
  if(h<24) return "il y a "+h+"h";
  return "il y a "+Math.round(h/24)+"j";
}
// Projection équirectangulaire (avec correction cos(latitude)) ajustée à l'emprise des points
// fournis — conserve les distances/directions relatives, sans déformation. Retourne une fonction
// project(lat,lon) -> {x,y} dans le repère SVG [0,vw]x[0,vh].
function buildMapProjection(points, vw, vh, pad){
  var latMin=Math.min.apply(null, points.map(function(p){return p.lat})),
      latMax=Math.max.apply(null, points.map(function(p){return p.lat})),
      lonMin=Math.min.apply(null, points.map(function(p){return p.lon})),
      lonMax=Math.max.apply(null, points.map(function(p){return p.lon}));
  if(latMax-latMin<0.02){ latMin-=0.05; latMax+=0.05; }
  if(lonMax-lonMin<0.02){ lonMin-=0.05; lonMax+=0.05; }
  var latMid=(latMin+latMax)/2;
  var cosLat=Math.cos(latMid*Math.PI/180);
  var effW=(lonMax-lonMin)*cosLat, effH=(latMax-latMin);
  var usableW=vw-pad*2, usableH=vh-pad*2;
  var scale=Math.min(usableW/effW, usableH/effH);
  var offX=pad+(usableW-effW*scale)/2, offY=pad+(usableH-effH*scale)/2;
  return function(lat,lon){
    return { x: offX+(lon-lonMin)*cosLat*scale, y: offY+(latMax-lat)*scale };
  };
}
// Courbe lissée passant par les points de côte projetés, refermée pour former un polygone "terre"
// (même technique que dans la maquette validée par Colart : segments quadratiques via les points
// milieux). `bounds` sert à refermer proprement le polygone hors-cadre.
function coastPathD(pts, vw, vh){
  var d = "M "+pts[0].x.toFixed(1)+","+pts[0].y.toFixed(1)+" ";
  for(var i=0;i<pts.length-1;i++){
    var p0=pts[i], p1=pts[i+1];
    var mx=(p0.x+p1.x)/2, my=(p0.y+p1.y)/2;
    d += "Q "+p0.x.toFixed(1)+","+p0.y.toFixed(1)+" "+mx.toFixed(1)+","+my.toFixed(1)+" ";
  }
  var last=pts[pts.length-1];
  d += "L "+last.x.toFixed(1)+","+last.y.toFixed(1)+" L "+(vw+40)+","+(vh+40)+" L "+(-40)+","+(vh+40)+" Z";
  return d;
}
// Décale les pastilles qui partagent la même ville pour éviter qu'elles se superposent exactement.
function pinOffset(i){
  var angle = i*47*(Math.PI/180);
  var radius = 16 + Math.floor(i/6)*16;
  return { dx: Math.cos(angle)*radius, dy: Math.sin(angle)*radius };
}

/* ================= utils ================= */
function uid(){ return Math.random().toString(36).slice(2)+Date.now().toString(36); }
function pad2(n){ return (n<10?"0":"")+n; }
function toISODate(d){ return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
function todayISO(){ return toISODate(new Date()); }
function startOfWeek(d){
  var x = new Date(d); var day = x.getDay(); var diff = (day===0? -6 : 1-day);
  x.setDate(x.getDate()+diff); x.setHours(0,0,0,0); return x;
}
function addDays(d,n){ var x=new Date(d); x.setDate(x.getDate()+n); return x; }
function fmtDayLabel(d){ return DOW[(d.getDay()+6)%7]; }
function fmtDateShort(d){ return pad2(d.getDate())+"/"+pad2(d.getMonth()+1); }
function fmtDateFull(d){ return d.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"}); }
function escapeHtml(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function el(html){ var t=document.createElement("template"); t.innerHTML=html.trim(); return t.content.firstElementChild; }
function toast(msg){
  var t = document.createElement("div"); t.className="toast"; t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(function(){ t.remove(); }, 2600);
}
function statutIndex(m){ return (typeof m.statutIndex==="number") ? m.statutIndex : -1; }
function statutBadge(m){
  if(m.statutIndex==="refusee" || m.statutIndex===-2) return {cls:"danger", label:"Refusée"};
  var si = statutIndex(m);
  if(si<0) return {cls:"gray", label:"En attente"};
  if(si===0) return {cls:"blue", label:"Acceptée"};
  if(si>=1 && si<STEP_LAST) return {cls:"amber", label:STEPS[si].label};
  if(si===STEP_LAST) return {cls:"green", label:"Terminée"};
  return {cls:"gray", label:"—"};
}
function computeCountdown(m){
  // Mirrors the "temps restant" column from Colart's dépannage dispatch tool:
  // shows time until scheduled start, or how late a mission is running.
  if(!m.dateMission || !m.heureDebut) return null;
  var si = statutIndex(m);
  if(m.statutIndex==="refusee" || si>=STEP_LAST) return null;
  var scheduled = new Date(m.dateMission+"T"+m.heureDebut+":00");
  if(isNaN(scheduled.getTime())) return null;
  var diffMin = Math.round((scheduled.getTime()-Date.now())/60000);
  if(si>=1){
    // already en route / on site — countdown against schedule is no longer meaningful
    return null;
  }
  if(diffMin < 0){
    return {cls:"danger", label:"Retard "+(-diffMin)+" min"};
  }
  if(diffMin <= 30){
    return {cls:"amber", label:"Dans "+diffMin+" min"};
  }
  if(diffMin <= 1440){
    var h = Math.floor(diffMin/60), mm = diffMin%60;
    return {cls:"blue", label:"Dans "+h+"h"+pad2(mm)};
  }
  return null;
}
function weekRangeLabel(ws){
  var we = addDays(ws,6);
  return fmtDateShort(ws)+" – "+fmtDateShort(we)+" "+we.getFullYear();
}
function isInWeek(dateStr, ws){
  if(!dateStr) return false;
  var d = new Date(dateStr+"T00:00:00");
  var we = addDays(ws,7);
  return d>=ws && d<we;
}
function chauffeurName(id){
  var c = state.chauffeurs.find(function(x){return x.id===id;});
  return c? c.nom : "—";
}
function vehiculeLabel(id){
  var v = state.vehicules.find(function(x){return x.id===id;});
  return v? (v.immatriculation+" · "+v.type) : "—";
}
function missionVehiculeSummary(m){
  // Une remorque roule toujours attelée à un tracteur/porteur — on affiche les deux quand présents.
  var parts = [];
  if(m.vehiculeId) parts.push(vehiculeLabel(m.vehiculeId));
  if(m.remorqueId) parts.push("+ remorque "+vehiculeLabel(m.remorqueId));
  return parts.length? parts.join(" ") : "—";
}
/* ================= db bootstrap (Firebase) ================= */
// Remplace le bootstrap Artifact Claude (claude.use("db")) par Firebase. L'API Firestore v8 compat
// (doc()/collection()/onSnapshot()/where()/orderBy()/limit()/get()/set()/update()/delete()/add(),
// snap.docs, snap.exists en propriété...) correspond exactement à ce que le reste de ce fichier
// utilise déjà — aucune autre modification n'a donc été nécessaire ailleurs dans le code.
// Connexion anonyme Firebase Auth : garde l'écran d'accueil actuel (code PIN gestionnaire / choix du
// nom chauffeur) inchangé, tout en permettant des règles Firestore qui exigent request.auth != null
// (bloque les robots/inconnus qui tomberaient sur l'URL sans passer par l'appli).
function initDb(){
  if(!firebaseConfig || firebaseConfig.apiKey==="REMPLACER_API_KEY"){
    state.dbReady = false; renderRoot(); return;
  }
  try{
    firebase.initializeApp(firebaseConfig);
  } catch(e){ state.dbReady=false; renderRoot(); return; }
  firebase.auth().signInAnonymously().then(function(){
    state.db = firebase.firestore();
    state.dbReady = true;
    subscribeAll();
    renderRoot();
  }).catch(function(){ state.dbReady=false; renderRoot(); });
}

function subscribeAll(){
  var db = state.db;
  db.collection("chauffeurs").onSnapshot(function(snap){
    state.chauffeurs = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); })
      .sort(function(a,b){ return (a.nom||"").localeCompare(b.nom||""); });
    render();
  }, function(){});
  db.collection("vehicules").onSnapshot(function(snap){
    state.vehicules = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); })
      .sort(function(a,b){ return (a.immatriculation||"").localeCompare(b.immatriculation||""); });
    render();
  }, function(){});
  db.collection("missions").onSnapshot(function(snap){
    state.missions = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
    render();
  }, function(){});
  db.doc("config/app").onSnapshot(function(snap){
    if(snap.exists){ state.config = Object.assign({gestionnairePin:DEFAULT_PIN}, snap.data()); }
    render();
  }, function(){});
  db.collection("devis").onSnapshot(function(snap){
    state.devis = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
    render();
  }, function(){});
  db.collection("factures").onSnapshot(function(snap){
    state.factures = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
    render();
  }, function(){});
  db.collection("soustraitance").onSnapshot(function(snap){
    state.soustraitance = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
    render();
  }, function(){});
  db.collection("clients").onSnapshot(function(snap){
    state.clients = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); })
      .sort(function(a,b){ return (a.nom||"").localeCompare(b.nom||""); });
    render();
  }, function(){});
}

function devisFor(missionId){ return state.devis.find(function(d){ return d.id===missionId; }); }
function devisTotal(d){
  // Total HT ne porte que sur les lignes chiffrées (qté + prix unitaire renseignés) — les lignes
  // "au réel" (heures supplémentaires, etc.) restent hors base, comme sur les devis papier.
  if(!d || !d.lignes) return 0;
  return d.lignes.reduce(function(sum, l){
    if(l.quantite==null || l.quantite==="" || l.prixUnitaire==null || l.prixUnitaire==="") return sum;
    return sum + (parseFloat(l.quantite)||0) * (parseFloat(l.prixUnitaire)||0);
  }, 0);
}
function devisTVA(d){ return devisTotal(d)*0.20; }
function devisTTC(d){ return devisTotal(d)*1.20; }
function devisLigneMontant(l){
  if(l.quantite==null || l.quantite==="" || l.prixUnitaire==null || l.prixUnitaire==="") return "au réel";
  return fmtEUR((parseFloat(l.quantite)||0)*(parseFloat(l.prixUnitaire)||0));
}
function fmtEUR(n){
  return (Math.round((n||0)*100)/100).toLocaleString("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:2})+" €";
}
function fmtDateFR(iso){
  if(!iso) return "";
  var p = String(iso).split("-");
  if(p.length!==3) return iso;
  return p[2]+"/"+p[1]+"/"+p[0];
}
function devisStatutInfo(key){

function moisLabel(moisStr){
  // moisStr format "YYYY-MM"
  if(!moisStr) return "";
  var p = moisStr.split("-");
  if(p.length!==2) return moisStr;
  var idx = parseInt(p[1],10)-1;
  return (MOIS_LABELS[idx]||p[1])+" "+p[0];
}
function currentMoisStr(){ var d=new Date(); return d.getFullYear()+"-"+pad2(d.getMonth()+1); }
function missionMoisStr(m){
  if(!m.dateMission) return currentMoisStr();
  return m.dateMission.slice(0,7);
}
// Une mission est prête à facturer une fois le chauffeur arrivé en "Fin de mission" ET un devis
// enregistré (c'est le devis qui porte le prix définitif — modifiable à tout moment avant la
// facture). Elle est déjà facturée si son devis porte un factureId.
function missionFactureEtat(m){
  var d = devisFor(m.id);
  if(statutIndex(m) !== STEP_LAST) return "non_terminee";
  if(!d) return "sans_devis";
  if(d.factureId) return "facturee";
  return "a_facturer";
}
// Filet de sécurité demandé par Colart (09/09/2026) : une mission terminée doit être "contrôlée"
// (vérifiée) avant de partir en facturation, mais rien ne devait empêcher d'en oublier une —
// notamment celles SANS devis, qui étaient jusqu'ici invisibles dans l'onglet Facturation
// (missionFactureEtat==="sans_devis" n'apparaissait dans aucune liste). Toute mission terminée,
// pas encore facturée et pas encore marquée "contrôlée" reste ici tant qu'on ne l'a pas traitée,
// qu'elle ait un devis ou non. Une fois incluse dans une facture, elle est automatiquement
// marquée contrôlée (voir openFactureModal) et sort donc de cette liste (déjà exclue via
// missionFactureEtat==="facturee").
function missionAControler(m){
  return statutIndex(m)===STEP_LAST && missionFactureEtat(m)!=="facturee" && !m.controlee;
}
function missionsAControler(){
  return state.missions.filter(missionAControler).sort(byDateHeure);
}
// filtreMois: "01".."12" ou "" (tous) ; filtreAnnee: "2026" etc. ou "" (toutes) — indépendants,
// combinables (un mois seul sur toutes les années, une année seule tous mois, ou les deux).
function missionMatchFiltre(m, filtreMois, filtreAnnee){
  var ms = missionMoisStr(m); // "YYYY-MM"
  var annee = ms.slice(0,4), mois = ms.slice(5,7);
  if(filtreAnnee && annee!==filtreAnnee) return false;
  if(filtreMois && mois!==filtreMois) return false;
  return true;
}
function facturesGroupeesParClient(filtreMois, filtreAnnee){
  var groups = {};
  state.missions.forEach(function(m){
    if(missionFactureEtat(m)!=="a_facturer") return;
    if(!missionMatchFiltre(m, filtreMois, filtreAnnee)) return;
    var client = m.client || "Client non renseigné";
    if(!groups[client]) groups[client] = [];
    groups[client].push(m);
  });
  return groups;
}
// Années présentes dans les missions/factures, pour peupler le sélecteur d'année (+ année en
// cours toujours incluse, même sans données).
function anneesDisponibles(){
  var set = {};
  set[String(new Date().getFullYear())] = true;
  state.missions.forEach(function(m){ if(m.dateMission) set[m.dateMission.slice(0,4)]=true; });
  state.factures.forEach(function(f){ if(f.mois) set[f.mois.slice(0,4)]=true; });
  return Object.keys(set).sort();
}
function factureLigneMontant(l){
  var q = (l.quantite==null||l.quantite==="")? 1 : parseFloat(l.quantite);
  var p = (l.prixUnitaire==null||l.prixUnitaire==="")? 0 : parseFloat(l.prixUnitaire);
  return fmtEUR(q*p);
}
function factureTotal(f){
  if(!f || !f.lignes) return 0;
  return f.lignes.reduce(function(sum, l){
    var q = (l.quantite==null||l.quantite==="")? 1 : (parseFloat(l.quantite)||0);
    var p = (l.prixUnitaire==null||l.prixUnitaire==="")? 0 : (parseFloat(l.prixUnitaire)||0);
    return sum + q*p;
  }, 0);
}
function factureTVA(f){ return factureTotal(f)*0.20; }
function factureTTC(f){ return factureTotal(f)*1.20; }
/* ================= Pièces jointes (fichier encodé dans le document db) =================
   Pas de capacité de stockage de fichiers dispo pour ce compte : le fichier est encodé en
   base64 et enregistré directement dans le document devis (limite de la base : 256 Ko par
   document, tous champs compris) — donc on vise un budget prudent d'environ 170 Ko pour le
   fichier encodé, et on compresse les photos automatiquement pour tenir dans ce budget. */
var MAX_ATTACHMENT_DATAURL_BYTES = 170*1024;
function fmtFileSize(bytes){
  if(!bytes && bytes!==0) return "";
  if(bytes < 1024) return bytes+" o";
  return (bytes/1024).toFixed(0)+" Ko";
}
function dataUrlByteLength(dataUrl){
  var i = dataUrl.indexOf(",");
  var b64 = i>=0? dataUrl.slice(i+1) : dataUrl;
  return Math.ceil(b64.length*3/4);
}
function fileToDataUrl(file){
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onload = function(){ resolve(reader.result); };
    reader.onerror = function(){ reject(reader.error || new Error("read_failed")); };
    reader.readAsDataURL(file);
  });
}
function compressImageFile(file, maxBytes){
  return new Promise(function(resolve, reject){
    var objUrl = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function(){
      URL.revokeObjectURL(objUrl);
      var w = img.naturalWidth||1, h = img.naturalHeight||1;
      var maxDim = 1600;
      function render(scale, quality){
        var cw = Math.max(1, Math.round(w*scale)), ch = Math.max(1, Math.round(h*scale));
        var canvas = document.createElement("canvas");
        canvas.width = cw; canvas.height = ch;
        var ctx = canvas.getContext("2d");
        ctx.fillStyle = "#fff"; ctx.fillRect(0,0,cw,ch);
        ctx.drawImage(img, 0, 0, cw, ch);
        return canvas.toDataURL("image/jpeg", quality);
      }
      var scale = Math.min(1, maxDim/Math.max(w,h));
      var quality = 0.75;
      var dataUrl = render(scale, quality);
      var tries = 0;
      while(dataUrlByteLength(dataUrl) > maxBytes && tries < 8){
        if(quality > 0.35){ quality -= 0.12; }
        else { scale *= 0.75; }
        dataUrl = render(scale, quality);
        tries++;
      }
      resolve({dataUrl: dataUrl, tooLarge: dataUrlByteLength(dataUrl) > maxBytes});
    };
    img.onerror = function(){ URL.revokeObjectURL(objUrl); reject(new Error("image_load_failed")); };
    img.src = objUrl;
  });
}
function dataUrlToBlob(dataUrl){
  var parts = dataUrl.split(",");
  var mimeMatch = /data:([^;]+)/.exec(parts[0]);
  var mime = mimeMatch? mimeMatch[1] : "application/octet-stream";
  var bin = atob(parts[1]||"");
  var arr = new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], {type: mime});
}
function openFileAttachment(fichier){
  if(!fichier || !fichier.dataUrl) return;
  try{
    var blob = dataUrlToBlob(fichier.dataUrl);
    var url = URL.createObjectURL(blob);
    window.open(url, "_blank");
    setTimeout(function(){ URL.revokeObjectURL(url); }, 60000);
  } catch(e){
    toast("Impossible d'ouvrir ce fichier");
  }
}
/* Gère la zone d'upload/aperçu d'une pièce jointe. onChange(fichierOuNull) est appelé à
   chaque changement d'état (fichier choisi, remplacé ou retiré). Renvoie {getValue, setBusy}. */
function wireAttachmentZone(zoneEl, initialFichier, accept, onChange){
  var current = initialFichier || null;
  var busy = false;
  var fileInput = el('<input type="file" accept="'+accept+'" style="display:none"/>');
  zoneEl.appendChild(fileInput);
  function render(){
    Array.from(zoneEl.children).forEach(function(c){ if(c!==fileInput) c.remove(); });
    if(busy){
      zoneEl.appendChild(el('<div class="hint">Traitement du fichier…</div>'));
      return;
    }
    if(current){
      var row = el('<div class="bc-file-row"></div>');
      row.appendChild(el('<div class="bc-file-info">📎 '+escapeHtml(current.name||"Fichier")+' <span class="sub">('+fmtFileSize(current.size||0)+')</span></div>'));
      var viewBtn = el('<button type="button" class="btn sm">Consulter</button>');
      viewBtn.addEventListener("click", function(){ openFileAttachment(current); });
      var repBtn = el('<button type="button" class="btn sm">Remplacer</button>');
      repBtn.addEventListener("click", function(){ fileInput.click(); });
      var rmBtn = el('<button type="button" class="btn sm danger">Retirer</button>');
      rmBtn.addEventListener("click", function(){ current = null; onChange(null); render(); });
      row.appendChild(viewBtn); row.appendChild(repBtn); row.appendChild(rmBtn);
      zoneEl.appendChild(row);
    } else {
      var label = el('<label class="btn sm">📎 Joindre le fichier</label>');
      label.addEventListener("click", function(){ fileInput.click(); });
      zoneEl.appendChild(label);
      zoneEl.appendChild(el('<div class="hint">PDF ou photo. Les photos sont compressées automatiquement ; un PDF trop volumineux (au-delà d\'environ 120 Ko) est automatiquement converti en image (1re page) pour rester joint.</div>'));
    }
  }
  fileInput.addEventListener("change", function(){
    var file = fileInput.files && fileInput.files[0];
    fileInput.value = "";
    if(!file) return;
    busy = true; render();
    var isImage = /^image\//.test(file.type);
    var isPdf = file.type==="application/pdf";
    var work;
    if(isImage){
      work = compressImageFile(file, MAX_ATTACHMENT_DATAURL_BYTES).then(function(res){
        if(res.tooLarge) throw {code:"too_large"};
        return {dataUrl: res.dataUrl, name: file.name, type: file.type||"image/jpeg"};
      });
    } else if(isPdf && file.size*1.37 > MAX_ATTACHMENT_DATAURL_BYTES){
      // PDF trop volumineux pour être joint tel quel : converti en image (1re page) plutôt que
      // rejeté, pour ne jamais laisser la pièce jointe vide (ajouté 10/09/2026, demande de Colart).
      work = pdfPageToCompressedDataUrl(file, 1, MAX_ATTACHMENT_DATAURL_BYTES).then(function(res){
        if(res.tooLarge) throw {code:"too_large"};
        var baseName = (file.name||"document").replace(/\.pdf$/i,"");
        return {dataUrl: res.dataUrl, name: baseName+" (page 1).jpg", type: "image/jpeg", converted: true};
      });
    } else if(file.size*1.37 > MAX_ATTACHMENT_DATAURL_BYTES){
      work = Promise.reject({code:"too_large"});
    } else {
      work = fileToDataUrl(file).then(function(du){ return {dataUrl: du, name: file.name, type: file.type||"application/octet-stream"}; });
    }
    work.then(function(res){
      current = {name: res.name, type: res.type, size: dataUrlByteLength(res.dataUrl), dataUrl: res.dataUrl};
      onChange(current);
      busy = false; render();
      if(res.converted){
        toast("PDF trop volumineux — converti en image (1re page) et joint");
      }
    }).catch(function(err){
      busy = false; render();
      if(err && err.code==="too_large"){
        toast("Fichier trop volumineux même après compression — réduisez sa taille et réessayez");
      } else {
        toast("Impossible de lire ce fichier");
      }
    });
  });
  render();
  return { getValue: function(){ return current; } };
}

  if(!slug) slug = "CLI";
  return "DC-"+d.getFullYear()+"-"+pad2(d.getMonth()+1)+pad2(d.getDate())+"-"+slug;

// Position du chauffeur pour la "Carte" du Planning — ajouté 10/09/2026 (demande de Colart : suivi
// GPS en continu). Démarré une seule fois par session (garde via geoWatchId), tant que l'espace
// chauffeur reste ouvert et au premier plan — limite propre au navigateur mobile, pas un choix de
// l'appli : dès que le téléphone se verrouille ou change d'appli, plus aucune mise à jour n'arrive
// tant que le chauffeur n'a pas rouvert l'appli. Écriture limitée à une fois par minute pour ne pas
// spammer la base.
var geoWatchId = null;
var geoErrorShown = false;
function startDriverGeoWatch(){
  if(geoWatchId!=null) return;
  if(!navigator.geolocation){ return; }
  var lastSent = 0;
  geoWatchId = navigator.geolocation.watchPosition(function(pos){
    var now = Date.now();
    if(now-lastSent < 60000) return;
    lastSent = now;
    if(!state.db || !state.driverId) return;
    dbWrite(state.db.doc("chauffeurs/"+state.driverId).update({
      position: {lat: pos.coords.latitude, lon: pos.coords.longitude, updatedAt: new Date().toISOString()}
    }));
  }, function(){
    if(!geoErrorShown){ geoErrorShown=true; toast("Position non partagée (accès refusé ou indisponible) — vos missions restent affichées normalement"); }
  }, {enableHighAccuracy:false, maximumAge:60000, timeout:20000});
}

// le faire disparaître silencieusement du sélecteur.
function chauffeurOptionsFor(m){
  var list = state.chauffeurs.filter(function(c){ return c.actif; }).slice();
  if(m.chauffeurId && !list.some(function(c){ return c.id===m.chauffeurId; })){
    var cur = state.chauffeurs.find(function(c){ return c.id===m.chauffeurId; });
    if(cur) list.push(cur);
  }
  return list;
}

    );

  });
  return wrap;
}

    node.addEventListener("click", function(){
      openMissionModal(null, node.getAttribute("data-date"), node.getAttribute("data-driver"));
    });
  });

  // Unassigned missions this week
  var unassigned = state.missions.filter(function(m){ return !m.chauffeurId && isInWeek(m.dateMission, ws); });
  if(unassigned.length){
    var us = el('<div class="unassigned-strip"><div class="section-title">Missions non affectées cette semaine <span class="cnt">('+unassigned.length+')</span></div></div>');

  }

  return wrap;
}

// Vue "Carte du jour" du Planning — ajoutée 10/09/2026 (demande de Colart, maquette validée avant
// intégration). Carte schématique (pas de fond de carte réel, bloqué au niveau réseau — voir
// Décisions d'architecture dans overview.md) construite à partir des vraies coordonnées des villes
// connues (TOWN_COORDS). Affiche : la position des chauffeurs actifs (verte si mise à jour depuis
// moins de 5 min, grise sinon avec l'heure de dernière position), et les missions du jour pas
// encore affectées, positionnées sur leur ville de chargement (extraite de l'adresse) quand elle
// est reconnue — sinon la mission reste listée sous la carte plutôt que d'être mal placée.
function renderPlanningCarte(){
  var wrap = document.createElement("div");
  var dateIso = state.planningMapDate || todayISO();
  var d = new Date(dateIso+"T00:00:00");
  var todayIso = todayISO();

  var dayNav = el(
    '<div class="week-nav">'+
      '<button class="btn sm" id="mapPrevDay">←</button>'+
      '<div class="lbl">'+escapeHtml(fmtDayLabel(d))+' '+escapeHtml(fmtDateShort(d))+(dateIso===todayIso?' <span class="badge blue">Aujourd\'hui</span>':'')+'</div>'+
      '<button class="btn sm" id="mapNextDay">→</button>'+
      '<button class="btn sm" id="mapToday">Aujourd\'hui</button>'+
    '</div>'
  );
  dayNav.querySelector("#mapPrevDay").addEventListener("click", function(){ state.planningMapDate=toISODate(addDays(d,-1)); render(); });
  dayNav.querySelector("#mapNextDay").addEventListener("click", function(){ state.planningMapDate=toISODate(addDays(d,1)); render(); });
  dayNav.querySelector("#mapToday").addEventListener("click", function(){ state.planningMapDate=todayIso; render(); });
  wrap.appendChild(dayNav);

  wrap.appendChild(el('<div class="hint" style="margin-bottom:10px">'+
    TYPE_MISSION_OPTIONS.map(function(t){ return '<span class="badge '+t.badgeCls+'" style="margin:0 4px 4px 0">'+t.icon+' '+escapeHtml(t.label)+'</span>'; }).join(" ")+
    ' &nbsp; 🟢 chauffeur en ligne · ⚪ dernière position connue &nbsp; · &nbsp; Carte schématique (positions approximatives par ville, pas un fond de carte réel)'+
  '</div>'));

  var activeDrivers = state.chauffeurs.filter(function(c){ return c.actif; });
  var driversWithPos = activeDrivers.filter(function(c){ return c.position && typeof c.position.lat==="number"; });
  var driversNoPos = activeDrivers.filter(function(c){ return !(c.position && typeof c.position.lat==="number"); });

  var dayMissions = state.missions.filter(function(m){ return m.dateMission===dateIso && !m.chauffeurId && m.statutIndex!=="refusee"; });
  var placeable = [], unplaceable = [];
  dayMissions.forEach(function(m){
    var key = resolveTownKey(missionVilleChargement(m));
    if(key) placeable.push({m:m, geo:TOWN_COORDS[key], ville:key}); else unplaceable.push(m);
  });

  var VW=900, VH=460, PAD=56;
  // Emprise fixe : villes-repères + côte + chauffeurs positionnés, pour que le cadrage ne "saute"
  // pas d'un jour à l'autre selon les missions du moment.
  var extentPts = ANCHOR_TOWNS.map(function(k){ return TOWN_COORDS[k]; }).concat(COAST);
  driversWithPos.forEach(function(c){ extentPts.push(c.position); });
  placeable.forEach(function(p){ extentPts.push(p.geo); });
  var project = buildMapProjection(extentPts, VW, VH, PAD);

  var svg = ['<svg id="planningMapSvg" viewBox="0 0 '+VW+' '+VH+'" xmlns="http://www.w3.org/2000/svg" style="display:block;width:100%;height:auto">'];
  svg.push('<rect x="0" y="0" width="'+VW+'" height="'+VH+'" fill="var(--surface-2)"></rect>');
  var cp = COAST.map(function(p){ return project(p.lat,p.lon); });
  svg.push('<path d="'+coastPathD(cp,VW,VH)+'" fill="var(--surface)" stroke="var(--border-2)" stroke-width="2"></path>');

  // Villes affichées : repères fixes + toute ville concernée par une mission du jour à placer.
  var labelSet = {};
  ANCHOR_TOWNS.forEach(function(k){ labelSet[k]=true; });
  placeable.forEach(function(p){ labelSet[p.ville]=true; });
  Object.keys(labelSet).forEach(function(key){
    var coords = TOWN_COORDS[key];
    if(!coords) return;
    var p = project(coords.lat, coords.lon);
    svg.push('<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="2.4" fill="var(--text-3)"></circle>');
    var label = key.toLowerCase().replace(/(^|\s)\S/g, function(c){ return c.toUpperCase(); });
    svg.push('<text x="'+(p.x+6).toFixed(1)+'" y="'+(p.y+4).toFixed(1)+'" font-size="11" fill="var(--text-3)">'+escapeHtml(label)+'</text>');
  });

  // Chauffeurs
  driversWithPos.forEach(function(c){
    var p = project(c.position.lat, c.position.lon);
    var recent = (Date.now()-new Date(c.position.updatedAt).getTime()) < 5*60000;
    var color = recent? "var(--green)" : "var(--text-3)";
    var cx=p.x+13, cy=p.y-20;
    svg.push(
      (recent? '<circle cx="'+cx+'" cy="'+cy+'" r="9" fill="none" stroke="'+color+'" stroke-width="2" opacity="0.55" class="map-pulse"></circle>' : '')+
      '<circle cx="'+cx+'" cy="'+cy+'" r="7" fill="'+color+'" stroke="var(--surface)" stroke-width="2"></circle>'+
      '<text x="'+(cx+10)+'" y="'+(cy+3)+'" font-size="11" font-weight="700" fill="var(--text)">'+escapeHtml(c.nom)+'</text>'+
      '<text x="'+(cx+10)+'" y="'+(cy+14)+'" font-size="9.5" fill="var(--text-3)">'+escapeHtml(fmtRelTime(c.position.updatedAt))+'</text>'
    );
  });

  // Missions à placer, groupées par ville pour répartir les pastilles qui se chevauchent.
  var byVille = {};
  placeable.forEach(function(p){ (byVille[p.ville]=byVille[p.ville]||[]).push(p); });
  var missionPins = [];
  Object.keys(byVille).forEach(function(ville){
    byVille[ville].forEach(function(p, i){
      var base = project(p.geo.lat, p.geo.lon);
      var off = pinOffset(i);
      var cx = base.x-18+off.dx*0.4, cy = base.y+18+off.dy*0.4;
      var tInfo = typeMissionInfo(p.m.typeMission);
      var color = tInfo? "var(--"+tInfo.badgeCls+")" : "var(--text-3)";
      svg.push('<g class="map-mission-pin" data-mid="'+p.m.id+'" data-cx="'+cx.toFixed(1)+'" data-cy="'+cy.toFixed(1)+'" style="cursor:pointer">'+
        '<rect x="'+(cx-9)+'" y="'+(cy-9)+'" width="18" height="18" rx="5" fill="'+color+'" stroke="var(--surface)" stroke-width="1.6"></rect>'+
        '<text x="'+cx+'" y="'+(cy+4.5)+'" text-anchor="middle" font-size="11" fill="#fff">📦</text>'+
      '</g>');
    });
  });

  svg.push('</svg>');

  var mapWrap = el('<div class="map-board"></div>');
  mapWrap.innerHTML = svg.join("");
  wrap.appendChild(mapWrap);

  mapWrap.querySelectorAll(".map-mission-pin").forEach(function(pinEl){
    pinEl.addEventListener("click", function(){
      var m = state.missions.find(function(x){ return x.id===pinEl.getAttribute("data-mid"); });
      if(m) openMapPopup(mapWrap, pinEl, m);
    });
  });

  if(driversNoPos.length){
    wrap.appendChild(el('<div class="hint" style="margin-top:8px">Sans position connue : '+escapeHtml(driversNoPos.map(function(c){return c.nom;}).join(", "))+'</div>'));
  }

  if(unplaceable.length){
    wrap.appendChild(el('<div class="section-title">Missions non localisées sur la carte <span class="cnt">('+unplaceable.length+')</span></div>'));
    wrap.appendChild(el('<div class="hint" style="margin-bottom:8px">Ville non reconnue dans l\'adresse de chargement — affectez directement ci-dessous.</div>'));
    wrap.appendChild(missionListEl(unplaceable));
  }

  return wrap;
}

function openMapPopup(mapWrap, pinEl, m){
  closeMapPopup(mapWrap);
  var pinBox = pinEl.getBoundingClientRect();
  var wrapBox = mapWrap.getBoundingClientRect();
  var tInfo = typeMissionInfo(m.typeMission);
  var popup = el(
    '<div class="map-popup">'+
      '<button type="button" class="map-popup-close">✕</button>'+
      '<h4>'+escapeHtml(m.client||"Client non renseigné")+'</h4>'+
      '<div class="row">'+escapeHtml(m.dateMission||"")+(m.heureDebut? " à "+escapeHtml(m.heureDebut):"")+'</div>'+
      (m.marchandises? '<div class="row">📦 '+escapeHtml(m.marchandises)+'</div>' : '')+
      (tInfo? '<div class="row"><span class="badge '+tInfo.badgeCls+'">'+tInfo.icon+' '+escapeHtml(tInfo.label)+'</span></div>' : '')+
      '<select class="map-popup-assign"><option value="">— Affecter un chauffeur —</option>'+
        chauffeurOptionsFor(m).map(function(c){ return '<option value="'+c.id+'">'+escapeHtml(c.nom)+'</option>'; }).join("")+
      '</select>'+
      '<button type="button" class="btn sm" style="width:100%;margin-top:8px" data-open>Ouvrir la fiche complète</button>'+
    '</div>'
  );
  popup.style.left = Math.max(8, Math.min(pinBox.left-wrapBox.left+16, wrapBox.width-246))+"px";
  popup.style.top = Math.max(8, pinBox.top-wrapBox.top-10)+"px";
  popup.querySelector(".map-popup-close").addEventListener("click", function(){ popup.remove(); });
  popup.querySelector("[data-open]").addEventListener("click", function(){ openMissionModal(m); });
  popup.querySelector(".map-popup-assign").addEventListener("change", function(e){
    if(!state.db){ toast("Base de données indisponible"); return; }
    dbWrite(state.db.doc("missions/"+m.id).update({chauffeurId: e.target.value, updatedAt: new Date().toISOString()}), "Chauffeur affecté");
    popup.remove();
  });
  mapWrap.appendChild(popup);
}
function closeMapPopup(mapWrap){
  var existing = mapWrap.querySelector(".map-popup");
  if(existing) existing.remove();
}

/* ================= Mission modal (gestionnaire) ================= */
function fmtTs(iso){
  if(!iso) return null;
  var d = new Date(iso);
  if(isNaN(d.getTime())) return null;
  return pad2(d.getDate())+"/"+pad2(d.getMonth()+1)+" à "+pad2(d.getHours())+":"+pad2(d.getMinutes());
}
// Pour l'input <input type="datetime-local"> : format local "AAAA-MM-JJTHH:MM", sans fuseau —
// new Date(cette_valeur) est ensuite réinterprété par le navigateur en heure locale, donc
// toDatetimeLocalValue/depuis-l'input sont l'aller-retour exact l'un de l'autre.
function toDatetimeLocalValue(iso){
  if(!iso) return "";
  var d = new Date(iso);
  if(isNaN(d.getTime())) return "";
  return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate())+"T"+pad2(d.getHours())+":"+pad2(d.getMinutes());
}
function horodateursHtml(m){
  var st = m.stepTimes||{};
  var rows = '<div class="horod-row"><span class="lbl">Mission créée</span><span class="ts">'+(fmtTs(m.createdAt)||"—")+'</span></div>';
  rows += STEPS.map(function(s){
    return '<div class="horod-row horod-edit-row">'+
      '<span class="lbl">'+s.label+'</span>'+
      '<input type="datetime-local" class="horod-input" data-step-key="'+s.key+'" value="'+toDatetimeLocalValue(st[s.key])+'"/>'+
    '</div>';
  }).join("");
  if(m.statutIndex==="refusee"){
    rows += '<div class="horod-row"><span class="lbl">Refusée par le chauffeur</span><span class="ts">'+(fmtTs(m.updatedAt)||"—")+'</span></div>';
  }
  if(statutIndex(m)>=STEP_LAST-1 && m.statutIndex!=="refusee"){
    var cmrTs = fmtTs(m.cmrPhotoConfirmedAt);
    rows += '<div class="horod-row'+(cmrTs?"":" pending")+'"><span class="lbl">📷 Photo CMR confirmée par le chauffeur</span><span class="ts">'+(cmrTs||"en attente")+'</span></div>';
  }
  return '<div class="section-title" style="margin-top:0">Suivi de la mission</div><div class="hint" style="margin:-4px 0 8px">Les horaires ci-dessous sont modifiables en cas d\'erreur de saisie.</div><div class="horod-list">'+rows+'</div>';
}
// Plusieurs transports pour une même commande — ajouté 10/09/2026 (demande de Colart, exemple
// Calser : transport aller Petite-Synthe→Steenbecque + transport retour Steenbecque→Dunkerque, une
// seule commande client, deux transports bien distincts avec adresses/dates/chauffeur différents).
// `commandeGroupId` relie entre elles les missions d'une même commande, sans rien changer pour les
// missions à un seul transport (champ absent = non concerné, comportement identique à avant).
function siblingMissions(m){
  if(!m || !m.commandeGroupId) return [];
  return state.missions.filter(function(x){ return x.commandeGroupId===m.commandeGroupId && x.id!==m.id; });
}
function siblingSeedFromMission(m){
  return {
    client: m.client, typeMission: m.typeMission, contacts: m.contacts,
    marchandises: m.marchandises, instructions: m.instructions, documents: m.documents,
    commandeClientFichier: m.commandeClientFichier||null, commandeGroupId: m.commandeGroupId
  };
}
function siblingSeedFromData(data){
  return {
    client: data.client, typeMission: data.typeMission, contacts: data.contacts,
    marchandises: data.marchandises, instructions: data.instructions, documents: data.documents,
    commandeClientFichier: data.commandeClientFichier||null, commandeGroupId: data.commandeGroupId
  };
}
function commandeGroupHtml(m){
  var siblings = siblingMissions(m).sort(byDateHeure);
  if(!siblings.length){
    return '<div class="item-card" style="margin-bottom:14px"><div class="row" style="margin-top:0;align-items:center">'+
      '<div><h4 style="margin-bottom:2px">Transports liés</h4><div class="sub">Un seul transport pour cette commande</div></div>'+
      '<button type="button" class="btn sm" id="btnAddSiblingTransport">+ Ajouter un autre transport (même commande)</button>'+
    '</div></div>';
  }
  var rows = siblings.map(function(s){
    return '<div class="sub" style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 0">'+
      '<span>'+escapeHtml(s.dateMission||"—")+(s.heureDebut?" "+escapeHtml(s.heureDebut):"")+" · "+escapeHtml(s.adresseChargement||"—")+" → "+escapeHtml(s.adresseLivraison||"—")+'</span>'+
      '<button type="button" class="btn sm" data-open-sibling="'+s.id+'">Voir</button>'+
    '</div>';
  }).join("");
  return '<div class="item-card" style="margin-bottom:14px"><div class="row" style="margin-top:0;align-items:center">'+
    '<div><h4 style="margin-bottom:2px">Transports liés à cette commande ('+(siblings.length+1)+')</h4></div>'+
    '<button type="button" class="btn sm" id="btnAddSiblingTransport">+ Ajouter un autre transport</button>'+
  '</div>'+rows+'</div>';
}
// Plusieurs points de chargement/livraison pour une même mission — ajouté 10/09/2026 (demande de
// Colart : un seul transport peut avoir un chargement et plusieurs livraisons, ou l'inverse).
// `adresseChargement`/`adresseLivraison` restent les champs principaux (1er point, utilisés partout
// ailleurs dans l'appli : carte du Planning, devis, fiche chauffeur) ; `chargementsSupp`/
// `livraisonsSupp` sont des tableaux optionnels listant les points supplémentaires — absents par
// défaut, donc aucune mission existante n'est affectée.
function wireAddrSuppList(container, addBtn, initial){
  function addRow(val){
    var row = el(
      '<div class="addr-supp-row">'+
        '<input class="addr-supp-input" value="'+escapeHtml(val||"")+'" placeholder="Adresse supplémentaire"/>'+
        '<button type="button" class="btn sm danger">✕</button>'+
      '</div>'
    );
    row.querySelector("button").addEventListener("click", function(){ row.remove(); });
    container.appendChild(row);
  }
  (initial||[]).forEach(function(val){ addRow(val); });
  addBtn.addEventListener("click", function(){ addRow(""); });
  return {
    getValues: function(){
      return Array.prototype.slice.call(container.querySelectorAll(".addr-supp-input"))
        .map(function(inp){ return inp.value.trim(); })
        .filter(function(s){ return s; });
    }
  };
}
function openMissionModal(m, presetDate, presetDriver, extracted, siblingSeed){
  var isEdit = !!m;
  var v = m || (extracted? {
    client: extracted.client||"",
    adresseChargement: extracted.adresseChargement||"",
    chargementsSupp: (Array.isArray(extracted.chargementsSupp)? extracted.chargementsSupp.filter(Boolean) : []),
    adresseLivraison: extracted.adresseLivraison||"",
    livraisonsSupp: (Array.isArray(extracted.livraisonsSupp)? extracted.livraisonsSupp.filter(Boolean) : []),
    dateMission: extracted.dateMission||"",
    heureDebut: extracted.heureDebut||"",
    contacts: extracted.contacts||"",
    marchandises: extracted.marchandises||"",
    instructions: extracted.numeroCommande? ("Commande d'achat client n°"+extracted.numeroCommande+(extracted.dateCommande? " du "+fmtDateFR(extracted.dateCommande):"")+".") : "",
    documents: extracted.numeroCommande? ("Commande d'achat client n°"+extracted.numeroCommande+" — voir Devis & bon de commande de cette mission.") : "",
    commandeClientFichier: extracted.__bcFichier || null
  } : (siblingSeed? {
    client: siblingSeed.client||"",
    typeMission: siblingSeed.typeMission||"",
    contacts: siblingSeed.contacts||"",
    marchandises: siblingSeed.marchandises||"",
    instructions: siblingSeed.instructions||"",
    documents: siblingSeed.documents||"",
    commandeClientFichier: siblingSeed.commandeClientFichier||null,
    commandeGroupId: siblingSeed.commandeGroupId
  } : {}));
  var activeDrivers = state.chauffeurs.filter(function(c){ return c.actif; });
  var existingDevis = isEdit? devisFor(m.id) : null;
  var isTerminee = isEdit && statutIndex(v)===STEP_LAST;
  var body =
    (isEdit? horodateursHtml(v) : '')+
    (isEdit? devisSummaryHtml(existingDevis) : '')+
    (isEdit? commandeGroupHtml(m) : '')+
    (isTerminee? (
      '<div class="field" style="padding:10px 12px;border:1px solid var(--border-2);border-radius:10px;background:'+(v.controlee?"var(--green-soft)":"var(--amber-soft)")+'">'+
        '<label style="display:flex;align-items:center;gap:8px;cursor:pointer;margin-bottom:0">'+
          '<input type="checkbox" id="f_controlee" '+(v.controlee?"checked":"")+' style="width:auto"/>'+
          '<span style="font-weight:700;color:'+(v.controlee?"var(--green)":"var(--amber)")+'">Mission contrôlée (vérifiée avant facturation)</span>'+
        '</label>'+
        (v.controlee && v.controleeAt? '<div class="hint" style="margin-top:4px">Contrôlée le '+escapeHtml(fmtTs(v.controleeAt)||"")+'</div>' : '<div class="hint" style="margin-top:4px">Tant que non cochée, cette mission reste dans « Missions terminées à contrôler » (Tableau de bord et Facturation) pour ne pas être oubliée avant la facturation.</div>')+
      '</div>'
    ) : '')+
    (extracted? '<div class="hint" style="margin-bottom:10px">Mission pré-remplie automatiquement à partir de la commande importée — vérifiez toutes les informations avant d\'enregistrer. Le bon de commande et les lignes de tarification seront enregistrés automatiquement dans l\'onglet Devis de cette mission.</div>' : '')+
    (siblingSeed? '<div class="hint" style="margin-bottom:10px">Nouveau transport pour la même commande — client, marchandise et pièce jointe repris automatiquement ; complétez les adresses, la date et l\'affectation propres à ce transport.</div>' : '')+
    '<div class="field"><label>Client</label><input id="f_client" value="'+escapeHtml(v.client||"")+'" placeholder="Nom du client"/></div>'+
    '<div class="field"><label>Type de mission</label><select id="f_typeMission"><option value="">— Non précisé —</option>'+
      TYPE_MISSION_OPTIONS.map(function(t){ return '<option value="'+t.key+'" '+(v.typeMission===t.key?"selected":"")+'>'+t.icon+' '+escapeHtml(t.label)+'</option>'; }).join("")+
    '</select><div class="hint">Visible directement dans le Tableau de bord et le Planning, même avant d\'affecter un véhicule précis.</div></div>'+
    '<div class="field"><label>Pièce jointe — commande du client</label><div id="missionFileZone"></div><div class="hint">Joignez ici le bon de commande / la commande d\'achat reçue du client (PDF ou photo), consultable ensuite depuis cette mission.</div></div>'+
    '<div class="field-row">'+
      '<div class="field"><label>Adresse de chargement</label><input id="f_adrC" value="'+escapeHtml(v.adresseChargement||"")+'"/>'+
        '<div id="adrCSuppList"></div>'+
        '<button type="button" class="btn sm" id="btnAddAdrC" style="margin-top:6px">+ Point de chargement</button>'+
      '</div>'+
      '<div class="field"><label>Adresse de livraison</label><input id="f_adrL" value="'+escapeHtml(v.adresseLivraison||"")+'"/>'+
        '<div id="adrLSuppList"></div>'+
        '<button type="button" class="btn sm" id="btnAddAdrL" style="margin-top:6px">+ Point de livraison</button>'+
      '</div>'+
    '</div>'+
    '<div class="field-row">'+
      '<div class="field"><label>Date</label><input type="date" id="f_date" value="'+escapeHtml(v.dateMission||presetDate||todayISO())+'"/></div>'+
      '<div class="field"><label>Heure prévue</label><input type="time" id="f_heure" value="'+escapeHtml(v.heureDebut||"")+'"/></div>'+
    '</div>'+
    '<div class="field-row">'+
      '<div class="field"><label>Chauffeur</label><select id="f_chauffeur"><option value="">— Non affecté —</option>'+
        activeDrivers.map(function(c){ return '<option value="'+c.id+'" '+((v.chauffeurId||presetDriver)===c.id?"selected":"")+'>'+escapeHtml(c.nom)+'</option>'; }).join("")+
      '</select></div>'+
      '<div class="field"><label>Véhicule (tracteur / porteur)</label><select id="f_vehicule"><option value="">— Non affecté —</option>'+
        state.vehicules.map(function(veh){ return '<option value="'+veh.id+'" '+(v.vehiculeId===veh.id?"selected":"")+'>'+escapeHtml(veh.immatriculation)+" — "+escapeHtml(veh.type)+'</option>'; }).join("")+
      '</select></div>'+
    '</div>'+
    '<div class="field"><label>Remorque attelée (si applicable)</label><select id="f_remorque"><option value="">— Aucune —</option>'+
      state.vehicules.filter(function(veh){ return TRAILER_TYPES.indexOf(veh.type)!==-1; }).map(function(veh){ return '<option value="'+veh.id+'" '+(v.remorqueId===veh.id?"selected":"")+'>'+escapeHtml(veh.immatriculation)+" — "+escapeHtml(veh.type)+(veh.libelle? " ("+escapeHtml(veh.libelle)+")":"")+'</option>'; }).join("")+
    '</select><div class="hint">Une remorque roule toujours attelée à un tracteur/porteur — sélectionnez les deux si besoin.</div></div>'+
    '<div class="field"><label>Contacts (nom / téléphone)</label><input id="f_contacts" value="'+escapeHtml(v.contacts||"")+'" placeholder="Contact chargement, contact livraison…"/></div>'+
    '<div class="field"><label>Marchandises / engins à transporter</label><textarea id="f_marchandises">'+escapeHtml(v.marchandises||"")+'</textarea></div>'+
    '<div class="field"><label>Instructions particulières</label><textarea id="f_instructions">'+escapeHtml(v.instructions||"")+'</textarea></div>'+
    '<div class="field"><label>Documents nécessaires</label><input id="f_documents" value="'+escapeHtml(v.documents||"")+'" placeholder="CMR, bon de commande…"/></div>';

  openModal(isEdit? "Mission — "+(v.client||"") : "Nouvelle mission", body, function(modal, close){
    var missionAttachment = wireAttachmentZone(modal.querySelector("#missionFileZone"), v.commandeClientFichier||null, "application/pdf,image/png,image/jpeg,image/webp,image/gif", function(){});
    var adrCSupp = wireAddrSuppList(modal.querySelector("#adrCSuppList"), modal.querySelector("#btnAddAdrC"), v.chargementsSupp||[]);
    var adrLSupp = wireAddrSuppList(modal.querySelector("#adrLSuppList"), modal.querySelector("#btnAddAdrL"), v.livraisonsSupp||[]);
    wireClientAutocomplete(modal.querySelector("#f_client"), function(c){
      var adrEl = modal.querySelector("#f_adrC");
      if(adrEl && !adrEl.value) adrEl.value = clientAdresseComplete(c);
    });
    var buttons = [];
    if(isEdit){
      var devisBtn = modal.querySelector("#btnOpenDevis");
      if(devisBtn) devisBtn.addEventListener("click", function(){ openDevisModal(m); });
      var bcBtn = modal.querySelector("#btnConsultBc");
      if(bcBtn && existingDevis) bcBtn.addEventListener("click", function(){ openFileAttachment(existingDevis.bonCommandeFichier); });
      // Plusieurs transports pour la même commande (ajouté 10/09/2026) : voir siblingMissions/
      // commandeGroupHtml ci-dessus. "Voir" bascule directement sur un transport lié ; "+ Ajouter"
      // ouvre un nouveau formulaire pré-rempli (client/marchandise/pièce jointe repris, adresses et
      // date à compléter) — attribue un commandeGroupId à cette mission si elle n'en avait pas encore.
      var addSiblingBtn = modal.querySelector("#btnAddSiblingTransport");
      if(addSiblingBtn) addSiblingBtn.addEventListener("click", function(){
        function openNext(groupId){
          close();
          openMissionModal(null, null, null, null, siblingSeedFromMission(Object.assign({}, m, {commandeGroupId: groupId})));
        }
        if(m.commandeGroupId){ openNext(m.commandeGroupId); }
        else {
          var gid = uid();
          if(state.db) dbWrite(state.db.doc("missions/"+m.id).update({commandeGroupId: gid}));
          openNext(gid);
        }
      });
      modal.querySelectorAll("[data-open-sibling]").forEach(function(btn){
        btn.addEventListener("click", function(){
          var sib = state.missions.find(function(x){ return x.id===btn.getAttribute("data-open-sibling"); });
          if(sib){ close(); openMissionModal(sib); }
        });
      });
      var del = el('<button class="btn danger">Supprimer</button>');
      del.addEventListener("click", function(){
        if(!state.db) return;
        confirmAction("Supprimer cette mission ?", function(){
          dbWrite(state.db.doc("missions/"+m.id).delete(), "Mission supprimée");
          close();
        });
      });
      buttons.push(del);
    }
    function doSave(addAnother){
      var client = modal.querySelector("#f_client").value.trim();
      if(!client){ toast("Le nom du client est requis"); return; }
      var chauffeurId = modal.querySelector("#f_chauffeur").value;
      var vehiculeId = modal.querySelector("#f_vehicule").value;
      var remorqueId = modal.querySelector("#f_remorque").value;
      var data = {
        client: client,
        typeMission: modal.querySelector("#f_typeMission").value,
        adresseChargement: modal.querySelector("#f_adrC").value.trim(),
        chargementsSupp: adrCSupp.getValues(),
        adresseLivraison: modal.querySelector("#f_adrL").value.trim(),
        livraisonsSupp: adrLSupp.getValues(),
        dateMission: modal.querySelector("#f_date").value,
        heureDebut: modal.querySelector("#f_heure").value,
        chauffeurId: chauffeurId,
        vehiculeId: vehiculeId,
        remorqueId: remorqueId,
        contacts: modal.querySelector("#f_contacts").value.trim(),
        marchandises: modal.querySelector("#f_marchandises").value.trim(),
        instructions: modal.querySelector("#f_instructions").value.trim(),
        documents: modal.querySelector("#f_documents").value.trim(),
        commandeClientFichier: missionAttachment.getValue(),
        updatedAt: new Date().toISOString()
      };
      // Plusieurs transports / même commande : sur une NOUVELLE mission, on attribue (ou on reprend)
      // un commandeGroupId dès qu'"Enregistrer + ajouter un transport" est utilisé, pour que ce
      // transport et le suivant soient bien reliés entre eux.
      var groupId = v.commandeGroupId || null;
      if(!isEdit && addAnother && !groupId) groupId = uid();
      if(!isEdit && groupId) data.commandeGroupId = groupId;
      if(isEdit){
        // Horaires de suivi modifiables (demande de Colart, 09/09/2026) : chaque étape a son propre
        // input datetime-local dans horodateursHtml. state.db.update() fusionne les objets imbriqués
        // (il ne remplace pas stepTimes en bloc) — une clé omise garderait donc son ancienne valeur ;
        // pour qu'un champ vidé redevienne bien "en attente", on écrit explicitement `null`.
        var newStepTimes = {};
        modal.querySelectorAll(".horod-input").forEach(function(inp){
          var key = inp.getAttribute("data-step-key");
          var val = inp.value;
          newStepTimes[key] = val? new Date(val).toISOString() : null;
        });
        data.stepTimes = newStepTimes;
      }
      if(isTerminee){
        var controleeChecked = modal.querySelector("#f_controlee").checked;
        data.controlee = controleeChecked;
        data.controleeAt = controleeChecked? (v.controleeAt || new Date().toISOString()) : null;
      }
      if(JSON.stringify(data).length > 250*1024){ toast("Pièce jointe trop volumineuse pour être enregistrée — réduisez sa taille et réessayez"); return; }
      if(!state.db){ toast("Base de données indisponible"); return; }
      if(isEdit){
        dbWrite(state.db.doc("missions/"+m.id).update(data), "Mission mise à jour");
      } else {
        data.statutIndex = -1;
        data.stepTimes = {};
        data.createdAt = new Date().toISOString();
        if(extracted){
          var missionForDetails = Object.assign({}, data);
          var devisData = {
            missionId: null,
            statut: "accepte",
            numero: nextDevisNumero(client),
            dateEmission: todayISO(),
            validiteJours: 30,
            clientNom: client,
            clientAdresse: extracted.clientAdresse||"",
            clientContact: "",
            clientTel: extracted.clientTel||"",
            clientEmail: "",
            objet: "Transport pour "+client,
            details: defaultDevisDetails(missionForDetails),
            lignes: (Array.isArray(extracted.lignes)? extracted.lignes : []).map(function(l){
              return {
                designation: (l&&l.designation)||"",
                quantite: (l&&l.quantite!=null && l.quantite!=="")? l.quantite : null,
                unite: (l&&l.unite)||"",
                prixUnitaire: (l&&l.prixUnitaireHT!=null && l.prixUnitaireHT!=="")? l.prixUnitaireHT : null
              };
            }),
            noteForfait: "",
            conditionsGenerales: defaultConditionsGenerales(),
            numeroBonCommande: extracted.numeroCommande||"",
            dateBonCommande: extracted.dateCommande||"",
            montantBonCommande: (extracted.montantTTC!=null && extracted.montantTTC!=="")? extracted.montantTTC : "",
            notesBonCommande: "Commande d'achat client importée et analysée automatiquement"+(extracted.numeroCommande? (" (n°"+extracted.numeroCommande+")") : "")+" — vérifiez les lignes et montants avant envoi au client.",
            bonCommandeFichier: extracted.__bcFichier || null,
            createdAt: new Date().toISOString(),
            updatedAt: new Date().toISOString()
          };
          dbWrite(
            state.db.collection("missions").add(data).then(function(ref){
              devisData.missionId = ref.id;
              return state.db.doc("devis/"+ref.id).set(devisData);
            }),
            "Mission créée + bon de commande enregistré (à vérifier dans Devis)"
          );
        } else {
          dbWrite(state.db.collection("missions").add(data), "Mission créée");
        }
      }
      close();
      if(!isEdit && addAnother){
        openMissionModal(null, null, null, null, siblingSeedFromData(data));
      }
    }
    var save = el('<button class="btn primary">Enregistrer</button>');
    save.addEventListener("click", function(){ doSave(false); });
    buttons.push(save);
    if(!isEdit){
      var saveAndAdd = el('<button class="btn">Enregistrer + ajouter un transport</button>');
      saveAndAdd.addEventListener("click", function(){ doSave(true); });
      buttons.push(saveAndAdd);
    }
    return buttons;
  });
}

/* ================= Devis & bon de commande ================= */

      '<button type="button" class="btn sm" id="btnOpenDevis">Créer un devis</button>'+
    '</div></div>';

}
